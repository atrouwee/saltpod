<!doctype html><html><head><meta charset="utf-8">
<title>saltpod</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* One file, no build step, nothing fetched from anywhere.

   One workspace, never a set of tabs: collections on the left, the library in
   the middle, buy and vinyl on the right, and a track moves between them by
   being dragged. The three are always there because the whole job is moving a
   record from "I heard it" to "it is on the iPod", and that is a gesture, not
   a navigation.

   The tokens are PlayPi's (the house style for anything that plays music
   here): a dark ground, soft-white ink, a seam the lists slide under, and one
   orange that appears exactly once -- on the row that is playing. Words are
   set in the face; the machine's own labels (positions, tags, keys) in the
   mono. The selection blue is the iPod's own. */
:root {
  --ground: #141d29;
  --ink:    #fffffc;
  --seam:   #070c13;
  --orange: #f75c03;
  --dim:    rgba(255,255,252,.55);
  --faint:  rgba(255,255,252,.22);
  --panel:  rgba(255,255,252,.05);
  --raised: rgba(255,255,252,.09);
  --mono:   "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --face:   "Helvetica Neue", Helvetica, Arial, sans-serif;
  /* the selection blue, read off a photograph of the device: bright at the top,
     deeper below. It marks where you ARE; the orange marks what you HEAR, and
     the two never mean the same thing. Drop targets borrow the blue, because a
     drop is also a "here", never a "hear". */
  --sel-hi: #6aa9f4;
  --sel-lo: #1450b8;
  --hbtn:  32px; /* the header's controls: search's height, Sync's height, the gear's side */
  --lw: 250px;   /* the two left panes are one width: they do the same job */
  --sw: 250px;   /* the source pane: Apple Music or the drive, one at a time */
  --rw: 320px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.4 var(--face);
       height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); }
a:hover { text-decoration-color: var(--ink); }
button, input, select { font: inherit; color: var(--ink); }
button { background: transparent; border: 1px solid var(--faint); border-radius: 0; padding: 7px 12px;
         font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
button:hover { border-color: var(--ink); }
button:disabled { opacity: .4; cursor: default; }
button.go { background: var(--ink); color: var(--ground); border-color: var(--ink); }
input[type=text], input[type=search], select { background: transparent; border: 1px solid var(--faint);
         padding: 6px 9px; font-family: var(--mono); font-size: 12px; }
input::placeholder { color: var(--dim); }
input:focus, select:focus { outline: none; border-color: var(--ink); }

/* header: one line. The brand, search in the centre, and on the right the
   counts -- quiet, at lower opacity -- then Sync and the gear. The pane
   controls live on the panes now, so nothing below this line but the seam. */
header { background: var(--ground); padding: 12px 24px 0; display: flex; flex-direction: column; gap: 8px; }
/* the seam is the header's last line, with nothing under it: the pane lines
   below start exactly where it ends */
header:after { content: ""; display: block; height: 2px; background: var(--seam); margin: 4px -24px 0; }
.brandline { display: grid; grid-template-columns: 1fr minmax(220px, 400px) 1fr; align-items: center; gap: 16px; }
/* One number drives both, because aspect-ratio loses to a button's intrinsic
   width and the gear came out 13px wide against Sync's 31. */
.hright { display: flex; align-items: center; justify-content: flex-end; gap: 14px; min-width: 0; }
.hright button { height: var(--hbtn); }
h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
#q { width: 100%; height: var(--hbtn); padding: 0 12px; box-sizing: border-box; }
/* The counts give way before the buttons do, and clip at their END: the first
   number (tracks) matters most, the last (undecided) least. */
.counts { font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; color: var(--dim); opacity: .6;
          display: flex; gap: 10px; flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
.counts span { flex: none; }
.counts s { text-decoration: none; color: var(--ink); }
.pill { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--dim); cursor: pointer; user-select: none; padding: 3px 0; border-bottom: 1px solid transparent; }
.pill:hover { color: var(--ink); }
.pill.on { color: var(--ink); border-bottom-color: var(--ink); }
#gear { padding: 0; width: var(--hbtn); flex: none; display: inline-flex; align-items: center;
        justify-content: center; font-size: 19px; line-height: 1; position: relative; }
#gear.busy:after { content: ""; position: absolute; top: -3px; right: -3px; width: 7px; height: 7px;
                   border-radius: 99px; background: var(--orange); }
/* Sync carries a count while state and the device disagree: tracks marked to
   come off, and tracks in a collection with a file waiting to go on. A change
   made in the page is not made on the iPod until this reads plain "Sync". */
/* The header's three controls take their looks from the list: search is the
   grey box of a selected collection, Sync is the blue of a selected track, and
   the gear is bare. Pending shows as the count in the label -- no orange on
   blue, for the same reason a selected playing row turns its clock white. */
#q { background: var(--raised); border: 0; border-radius: 10px; }
#q:focus { background: rgba(255,255,252,.13); outline: none; }
#dosync { background: linear-gradient(var(--sel-hi), var(--sel-lo)); border: 0; border-radius: 10px; color: #fff;
          box-shadow: inset 0 1px 0 rgba(255,255,255,.16); }
#dosync:hover { filter: brightness(1.08); }
#dosync.pending { color: #fff; }
#gear { border: 0; background: transparent; border-radius: 10px; }
#gear:hover { background: var(--panel); }

/* ---------- the three panes ---------- */
/* No boxes. The surface fills the space; the only dividers on it are the two
   hairlines either side of the list. Everything else is separated by air. */
#work { display: grid; gap: 0; padding: 0; position: relative; overflow: hidden;
        grid-template-columns: var(--lw) var(--sw) minmax(0, 1fr) var(--rw); min-height: 0; }
aside, section.mid { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
/* Pinned to their tracks on purpose: when a side pane is display:none the
   middle would otherwise auto-place into the 0px track it left behind. */
aside.left  { grid-column: 1; border-right: 1px solid var(--faint); }
aside.srcpane   { grid-column: 2; border-right: 1px solid var(--faint); }
section.mid { grid-column: 3; }
aside.right { grid-column: 4; border-left: 1px solid var(--faint); }
body.nl { --lw: 24px; }  body.ns { --sw: 24px; }  body.nr { --rw: 24px; }
body.nl aside.left .pbody, body.nl aside.left .act, body.nl aside.left .pstat,
body.ns aside.srcpane .pbody,  body.ns aside.srcpane .act,  body.ns aside.srcpane .pstat,
body.nr aside.right .pbody, body.nr aside.right .pstat { display: none; }
/* A folded pane names every list behind it -- one pill would not say what
   else is there. The same reason BUY VINYL both survive on the right. */
body.nl aside.left .plabel, body.ns aside.srcpane .plabel, body.nr aside.right .plabel {
  writing-mode: vertical-rl; flex: 1 1 auto; flex-wrap: nowrap; justify-content: flex-start; align-items: center;
  gap: 12px; padding: 14px 0; cursor: pointer; }
body.nl aside.left .plabel .name { flex: 0 0 auto; min-width: 0; }
body.ns #stabs { flex: 0 0 auto; }
body.nr #rtabs .pill { border-bottom-color: transparent; }
/* each pane opens with one quiet mono line: what it is, and what can be done to it */
.plabel { display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; flex: none;
          height: 46px; padding: 0 14px; overflow: hidden;
          font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em;
          text-transform: uppercase; color: var(--dim); }
.plabel .name { color: var(--ink); flex: 1 1 auto; min-width: 6ch; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
/* In the centre the name does NOT grow: it sits with its count beside it,
   and the space that is left pushes the marks to the far right. */
section.mid .plabel .name { flex: 0 1 auto; }
section.mid .plabel .pstat { flex: 0 1 auto; margin-right: auto; min-width: 0;
                             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plabel .sp { display: none; }
/* A SIDE pane's title is one line and the same height in all three, so their
   bodies start level. The centre keeps wrapping -- it carries the list name,
   its action, the filter toggle and a stat line, and forcing that onto one
   line pushed it straight into the pane beside it. */
/* Anything a pane wants to say beyond its name goes BELOW the strip, so the
   strip itself is the same 46px in all four columns. */
.substat { flex: none; padding: 0 14px 8px; font-family: var(--mono); font-size: 9.5px;
           letter-spacing: .06em; color: var(--dim); }
.substat s { text-decoration: none; color: var(--ink); }
.plabel .act { cursor: pointer; white-space: nowrap; }
.plabel .act:hover { color: var(--ink); }
.pstat { letter-spacing: .06em; }
.pstat s { text-decoration: none; color: var(--ink); }
.pbody { overflow: auto; padding: 4px 14px 24px; flex: 1 1 auto; min-height: 0; }
/* the filters: a section of the list, folded away until wanted. The toggle
   always names the active filter, so a folded section never hides one. */
/* the centre lost width to the two left panes, so the pills need the gap
   back before they wrap an orphan onto a second row */
.filters { display: none; gap: 9px; flex-wrap: wrap; align-items: center; padding: 2px 14px 10px; }
section.mid.fx .filters { display: flex; }

/* The fold is the < or > left of a pane's title: it points the way the pane
   goes. A folded pane is not gone -- it leaves a rail a few pixels wide with
   the title turned on its side and the chevron now pointing the way back. */
/* A box, not a glyph on a baseline: the chevron and the title are different
   sizes, so only giving the chevron its own centred box lines them up. */
.fold { font-family: var(--mono); font-size: 12px; color: var(--dim); flex: none;
        cursor: pointer; user-select: none; writing-mode: horizontal-tb;
        display: inline-flex; align-items: center; justify-content: center;
        width: 14px; height: 14px; line-height: 1; }
.fold:hover { color: var(--ink); }
#rtabs { display: flex; gap: 14px; flex: 0 0 auto; min-width: 0; }
#stabs { display: flex; gap: 10px; flex: 0 1 auto; min-width: 0; overflow: hidden; }
#stabs .pill { white-space: nowrap; }
/* The right pane's title mirrors the left ones: text, then the chevron at the
   outer edge, everything pushed to the right. The stat takes its own line. */
aside.right .plabel { justify-content: flex-end; }
aside.right .substat { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                       padding: 8px 14px 12px; border-top: 1px solid var(--faint); }
body.nr aside.right .plabel .fold { order: -1; }   /* the rail reads chevron-first, like the others */

/* ---------- rows ---------- */
/* Rows float on the ground -- separated by space, not rules -- and the selected
   one takes the device's blue. */
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 14px; align-items: center;
       padding: 9px 10px; cursor: pointer; border-radius: 10px; margin-bottom: 3px; user-select: none; }
.row:hover { background: var(--panel); }
.row.sel { background: linear-gradient(var(--sel-hi), var(--sel-lo));
       box-shadow: inset 0 1px 0 rgba(255,255,255,.16); }
.row.sel .s { color: rgba(255,255,255,.82); }
.row.sel .ch, .row.sel .pos, .row.sel .grab { color: #fff; }
.row.sel .tag { color: #fff; border-color: rgba(255,255,255,.55); }
.art { width: 44px; height: 44px; border-radius: 7px; background: var(--seam);
       object-fit: cover; flex: none; -webkit-user-drag: none; }
.t { min-width: 0; }
.t .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700;
        letter-spacing: -.005em; font-size: 14px; }
.t .s { color: var(--dim); font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.ch { color: var(--dim); font-size: 13px; padding-left: 2px; }
/* Where a track LIVES, as against what you have decided about it. Facts get
   plain mono with no border; decisions keep the bordered pills.

   The places are PEERS -- Apple Music, the T7, the iPod, a record -- and no
   attempt is made to say which came first. A track can sit in all four and
   the order it arrived in is unknowable. What is owned shows in full ink and
   what is only rented stays dim, so the gap this tool exists to close can be
   read by scanning one column. */
.src { display: flex; gap: 7px; align-items: center; flex: none;
       font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--dim); }
.src b { font-weight: 400; color: var(--ink); }
.src .gone { text-decoration: line-through; }
/* the iPod sits in the strip as a fixed slot like the others: always drawn,
   lit when the track is actually on the device */
/* Two fixed slots at the end of every row, so neither ever moves: the
   bitrate, then the iPod. The iPod is the highest-priority fact in the row --
   is this ON the thing -- so it sits closest to the chevron, and it is drawn
   rather than spelled. Both slots are always present and only change state;
   a tag appearing or vanishing to their left cannot shift them. */
/* The bitrate took the pill that used to say "owned". A number is the better
   claim: it proves you hold the file AND says what it is, where the word only
   ever repeated what the ink already said. Nothing is shown for a track you
   do not own -- until it is bought there is no format to report.
   The SLOT keeps its width when empty, because collapsing it would start the
   iPod mark sliding again, which is what moving the mark here fixed. */
.br { width: 58px; display: flex; justify-content: flex-end; flex: none; }   /* .tags gap is 6px */
.br b { font-family: var(--mono); font-size: 9px; font-weight: 400; letter-spacing: .06em;
        font-variant-numeric: tabular-nums; color: var(--ink);
        padding: 2px 7px; border-radius: 99px; border: 1px solid var(--faint); }
.row.sel .br b { color: #fff; border-color: rgba(255,255,255,.55); }
/* DRAWN ONLY WHEN IT IS TRUE. A faint iPod still looks like an iPod: on a
   dim row the title sits at 45% while this sat at full strength, so the
   placeholder was brighter than the track name and read as "this is on the
   device". The slot keeps its width so nothing shifts; the mark itself is
   either there or it is not. */
.pod { display: inline-flex; align-items: center; justify-content: center;
       width: 8px; flex: none; color: var(--ink); }
.row.sel .br { color: rgba(255,255,255,.7); }
.row.sel .pod { color: #fff; }
.row.sel .src, .row.sel .src b { color: #fff; }
.tags { display: flex; gap: 6px; align-items: center; flex: none; }
.tag { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
       padding: 2px 7px; border-radius: 99px; border: 1px solid var(--faint);
       color: var(--dim); white-space: nowrap; }
.tag.buy, .tag.ok { color: var(--ink); border-color: var(--ink); }
.tag.maybe { color: var(--ink); border-style: dashed; }
.tag.skip { opacity: .5; }
.tag.vinyl { color: var(--ink); background: var(--panel); }
/* FULL INK MEANS YOU COULD PUT IT ON THE IPOD TODAY -- a file exists, either
   already on the device or on a drive sync can read. Dim means you cannot:
   not bought, or bought and not yet indexed. That is the gap this tool exists
   to close, so it is the thing the eye should catch first while scanning.
   (It used to mean "not on the iPod yet", which dimmed tracks you already
   owned and were simply waiting to sync -- a fact about the copy, not about
   whether you have the music.)
   Struck through is the other direction: on its way off the device. */
.row.unowned .t, .row.unowned .art { opacity: .45; }
.row.skip .t .n { text-decoration: line-through; }
.col.pend .cnt { color: var(--orange); }
.row.dragging { opacity: .35; }
.row.over { box-shadow: inset 0 2px 0 var(--sel-hi); }
.pos { color: var(--dim); font-family: var(--mono); font-size: 11px; width: 24px; text-align: right; }
/* Three dots on every row. Everything a drag can do, a click can do: the menu
   lists it, and "Add to playlist" opens a picker the way a phone does. */
.more { font-family: var(--mono); font-size: 14px; line-height: 1; color: var(--dim); padding: 2px 6px;
        cursor: pointer; flex: none; opacity: 0; border-radius: 6px; }
.row:hover .more, .row.sel .more, .col:hover .more, .col.on .more { opacity: 1; }
.more:hover { color: var(--ink); background: var(--raised); }
.row.sel .more { color: #fff; }
#menu { position: fixed; z-index: 40; display: none; min-width: 230px; max-width: 320px;
        background: var(--ground); border: 1px solid var(--faint); border-radius: 10px; overflow: hidden;
        box-shadow: 0 14px 28px rgba(0,0,0,.45); }
#menu.on { display: block; }
#menu .mh { padding: 8px 12px; display: flex; align-items: center; gap: 10px; min-height: 34px;
            font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
            color: var(--dim); border-bottom: 1px solid var(--faint); background: var(--panel);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#menu .mh .back { cursor: pointer; color: var(--dim); font-size: 13px; }
#menu .mh .back:hover { color: var(--ink); }
#menu .mb { padding: 6px; max-height: 52vh; overflow: auto; }
#menu .drow { padding: 7px 10px; }
#menu .drow .dk { margin-left: auto; font: 9.5px var(--mono); color: var(--dim); letter-spacing: .08em; }
#menu .drow:hover .dk, #menu .drow:hover .dc { color: rgba(255,255,255,.85); }
#menu .sep { height: 1px; background: var(--faint); margin: 5px 4px; }
#menu input { width: 100%; background: transparent; border: 1px solid var(--faint); border-radius: 8px;
              color: var(--ink); padding: 7px 10px; font: 12px var(--mono); margin: 2px 0; }
#menu input:focus { outline: none; border-color: var(--ink); }
.grab { cursor: grab; color: var(--dim); padding: 0 4px; }
.month { font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase;
         color: var(--dim); margin: 22px 0 6px; padding: 0 10px; }
.month:first-child { margin-top: 4px; }
.month.vg { cursor: pointer; user-select: none; margin: 16px 0 6px; padding: 0 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.month.vg:hover { color: var(--ink); }
code { font-family: var(--mono); font-size: 11px; color: var(--ink); }

/* Playing is said twice and never with a bar: the equaliser takes the chevron's
   slot -- a playing row is not going anywhere -- and the duration stops being a
   fact about the file and becomes a position inside it. Both in the orange. */
.eq { display: none; align-items: flex-end; gap: 2px; height: 13px; width: 15px; }
.eq i { width: 3px; border-radius: 1px; background: var(--orange); transform-origin: bottom;
        animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(1) { height: 40%; animation-delay: -.2s; }
.eq i:nth-child(2) { height: 95%; animation-delay: -.5s; }
.eq i:nth-child(3) { height: 62%; animation-delay: -.8s; }
@keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .eq i { animation: none; } }
.row.playing .ch { display: none; }
.row.playing .eq { display: inline-flex; }
.dur { font-variant-numeric: tabular-nums; }
.row.playing .dur { color: var(--orange); }
.row.sel .eq i { background: #fff; }
.row.sel.playing .dur { color: #fff; }

/* ---------- left pane: collections ---------- */
.col { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
       cursor: pointer; font-size: 13.5px; margin-bottom: 2px; }
.col:hover { background: var(--panel); }
.col.on { background: var(--raised); font-weight: 700; }
.col .cnt { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--dim); white-space: nowrap; flex: none; }
.col.pending .cnt { font-style: italic; }
.col.dim > span:first-child { color: var(--dim); }
/* the two ways to read a pane, as marks rather than words: a stack of lines
   for lists, a square of four for albums */
.modes { display: inline-flex; gap: 2px; flex: none; margin-left: auto; }
.modes span { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 16px;
              border-radius: 5px; color: var(--faint); cursor: pointer; }
.modes span:hover { color: var(--dim); }
.modes span.on { color: var(--ink); background: var(--panel); }
/* a filter that is ON but folded away still has to declare itself */
.modes span.act { color: var(--orange); position: relative; }
.modes span.act:after { content: ""; position: absolute; top: 1px; right: 1px; width: 4px; height: 4px;
                        border-radius: 99px; background: var(--orange); }
.albart { width: 28px; height: 28px; border-radius: 4px; background: var(--seam); flex: none; object-fit: cover; }
.col.alb { align-items: center; }
.col .cnt .act { cursor: pointer; }
.col .cnt .act:hover { color: var(--ink); }
.col.drop, aside.right.drop .pbody { outline: 2px dashed var(--sel-hi); outline-offset: -3px; border-radius: 10px; }
.col.drop { background: rgba(106,169,244,.12); }
/* the pane itself, lit while a whole playlist or folder is over it */
aside.left.drop { background: rgba(106,169,244,.07); box-shadow: inset 0 0 0 2px var(--sel-hi); }
/* Two panes on the left can each remember a pick; only one is what the centre
   shows. One slot, one meaning: `on` is the list on screen (raised, bold);
   `was` is remembered here and not on screen (bold, hairline, no fill). The
   pane label dims to say the same thing from further away. */
.col.was { font-weight: 700; box-shadow: inset 0 0 0 1px var(--faint); }
.plabel.off .name { color: var(--dim); }
.col.dragging { opacity: .35; }
/* + new is a drop target for a whole playlist */
.act.drop { color: var(--sel-hi); outline: 1px dashed var(--sel-hi); outline-offset: 3px; border-radius: 4px; }

/* ---------- right pane: buy / vinyl ---------- */
.card { background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.card { position: relative; }
.card b { font-size: 13px; }
.card .more { position: absolute; top: 8px; right: 8px; }
.card:hover .more { opacity: 1; }
.card .sub { color: var(--dim); font-size: 10.5px; margin-top: 3px; font-family: var(--mono); }
.card .acts { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
/* A fixed slot on every buy card saying how far the lookup got. It is always
   there and only ever changes state -- the same rule as the row's AM T7 POD LP
   and the machine's status strip. */
.look { display: flex; align-items: center; gap: 6px; margin-top: 6px;
        font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
        text-transform: uppercase; color: var(--dim); }
.look:before { content: ""; width: 5px; height: 5px; border-radius: 99px; background: var(--faint); flex: none; }

<script>
const MONTH = s => s.replace(/^(\d{4})-/,'$1 ').replace(/\b\w/g,c=>c.toUpperCase());

// turns 479.6s into 7:60 instead of 8:00, which showed up on a buy card.
const mmss = s => { if(!s) return ''; const n=Math.round(s);
  return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`; };

const owned=t=>{const k=vkey(t); return k?OWN.get(k):undefined;}, wanted=t=>{const k=vkey(t); return k?WANT.get(k):undefined;};
let VG={add:true,want:true,own:false};     // which vinyl groups are open
// Apple Music: its playlists, and whether the left pane's section is open.
// A collection is where a track is GOING and is the only thing edited; an
// Apple Music playlist is where it CAME from and is only ever looked at.
let AMP=[], AMREAD=null, AMLIB=0;
// Two panes on the left, both always there: the iPod -- collections, the only
// thing edited, and what sync writes -- and Apple Music beside it, the library
// to take from. Everything in Apple Music is browsable, but a track earns a
// record in state only when a decision is made about it. `active` says which
// pane's pick the centre is showing: whichever playlist was clicked last.
// Each left pane can be read two ways: as LISTS (playlists, collections,
// folders) or as ALBUMS. An album is not a thing this tool creates -- the
// Classic builds its Albums menu out of the tracks' own tags -- so album
// view is a lens over the same tracks, never a second kind of container.
let MODE={ipod:'list', src:'list'};
try{ MODE={...MODE, ...JSON.parse(localStorage['saltpod.mode']||'{}')}; }catch(e){}
function setMode(pane,m){ MODE[pane]=m; try{ localStorage['saltpod.mode']=JSON.stringify(MODE); }catch(e){}
  if(pane==='ipod'){colPick=null;devPick=null;albPick=null;} else {amPick=null;t7Pick=null;albPick=null;}
  activate(pane==='ipod'?'ipod':(stab==='t7'?'t7':'am')); sel=0; draw(); }
let albPick=null;            // the album being shown, in either pane
let PODALBUMS=[], SRCALBUMS=[];
let stab='am';               // which source the shared pane is showing
try{ stab=localStorage['saltpod.stab']||'am'; }catch(e){}
let active='ipod';
try{ active=localStorage['saltpod.active']||'ipod'; }catch(e){}
function activate(which){ captureScroll(); active=which; try{ localStorage['saltpod.active']=which; }catch(e){} }
function setSrc(which){ captureScroll(); stab=which; try{ localStorage['saltpod.stab']=which; }catch(e){} }

/* ---------------- where you were ----------------
   Every redraw replaces the innerHTML of a pane, which puts its scroll back
   to the top. That is fine for a list of 14 and maddening for one of 4,048:
   decide on a track two thirds down Bought Tracks and the redraw throws you
   back to the As. So each scrollable body remembers its offset, keyed by
   WHAT IS IN IT rather than by the element -- the drive pane scrolled to

   and switching between them should return you to each.  */
const SCROLL={};

function recallSel(){ return SELMEM[listKey()]||0; }

  if(el.id==='srcbody') return 'src:'+stab;

// scroll events at all -- not even for a programmatic scrollTop -- so a
// listener-based memory is simply absent whenever the window is behind

// grid track, so folding one never moves another.

const MID=$('#mid');
try{ if(localStorage['saltpod.filters']==='1')MID.classList.add('fx'); }catch(e){}

/* ---------------- loading, counting, filtering ---------------- */
async function load(){
  const [r,d,a,dv,lo]=await Promise.all([
    fetch('/api/tracks').then(r=>r.json()),
    fetch('/api/discogs').then(r=>r.json()).catch(()=>null),
    fetch('/api/playlists').then(r=>r.json()).catch(()=>null),
    fetch('/api/device').then(r=>r.json()).catch(()=>null),
    fetch('/api/local').then(r=>r.json()).catch(()=>null)]);

  if(lo){T7=lo; if(t7Pick&&!T7.folders.some(f=>f.name===t7Pick))t7Pick=null;
  }

        if(amPick&&amPick!=='__all__'&&!AMP.some(p=>p.slug===amPick))amPick=null;}

function counts(){
  const c={seen:0,shortlisted:0,maybe:0,skipped:0,vinyl:0,bought:0};
  ALL.forEach(t=>{c[t.tier]++; if(t.vinyl)c.vinyl++; if(t.bought)c.bought++;});
  // "to buy" is what you still have to go and get: shortlisted, not marked
  // bought, and no file for it anywhere on your drives.
  const todo=ALL.filter(t=>t.tier==='shortlisted'&&!t.bought&&!t.local);
  const eur=todo.reduce((a,t)=>a+(t.price||0),0);
  // what the next sync would do, as far as the page can know without the device
  const offs=ALL.filter(t=>t.device&&t.tier==='skipped').length;
  const ons=ALL.filter(t=>!t.device&&t.local&&t.collections.length).length;
  const pend=offs+ons, sb=$('#dosync');
  sb.textContent = pend ? `Sync · ${pend}` : 'Sync';
  sb.classList.toggle('pending',pend>0);
  sb.title = pend ? `${offs} to take off the iPod, ${ons} to put on — nothing has changed on the device yet` : 'write the collections to the iPod';
  $('#counts').innerHTML=`<span><s>${ALL.length}</s> tracks</span>
    <span><s>${todo.length}</s> to buy</span>
    <span><s>&euro;${eur.toFixed(2)}</s> final</span>
    <span><s>${c.seen}</s> undecided</span>`;
}
function pass(t){
  if(q){const h=(t.artist+' '+t.title+' '+(t.album||'')).toLowerCase(); if(!h.includes(q))return false;}
  if(filter==='undecided')return t.tier==='seen';
  if(filter==='vinyl')return t.vinyl;
  if(filter==='on vinyl')return !!owned(t);
  if(filter==='on T7')return t.t7;
  // in Apple Music and nowhere you own: the work still to do
  if(filter==='rented only')return t.am&&!t.t7&&!owned(t);
  if(filter==='on iPod')return t.device;
  if(filter==='remove')return t.device&&t.tier==='skipped';
  if(filter==='all')return true;
  return t.tier===filter;
}
const filtered=()=>!!q||filter!=='all';
// what a click would actually play, named rather than left to be guessed
function heard(t){
  if(t.play_from==='t7')   return '<span style="color:var(--ink)">plays from the T7</span>';
  if(t.play_from==='ipod') return '<span style="color:var(--ink)">plays from the iPod</span>';
  if(t.preview)            return 'a 30s preview';
  return '<span class="warn">nothing to play</span>';
}
// every place that holds it, in a fixed order -- never a claim about which came first
// a Classic, at 11px: body, screen, click wheel
const IPOD_SVG='<svg viewBox="0 0 12 19" width="8" height="13" aria-hidden="true">'
  +'<rect x=".6" y=".6" width="10.8" height="17.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.1"/>'
  +'<rect x="2.5" y="2.7" width="7" height="5.2" rx=".7" fill="currentColor" opacity=".55"/>'
  +'<circle cx="6" cy="13.4" r="3" fill="none" stroke="currentColor" stroke-width="1.1"/>'
  +'<circle cx="6" cy="13.4" r=".85" fill="currentColor"/></svg>';
function srcStrip(t){
  const g=[];
  if(t.am)      g.push(t.am_status ? `<span class="gone" title="in Apple Music, ${esc(t.am_status)}">AM</span>`
                                   : (t.am_owned?'<b title="owned in Apple Music">AM</b>':'<span title="in Apple Music, rented">AM</span>'));
  if(t.t7)      g.push(`<b title="stored on the T7${t.lossless?', lossless':''}">T7</b>`);
  // the iPod is NOT in this strip -- it sits at the end of the row, beside
  // the chevron, where it never moves. See rowHTML.
  if(owned(t))  g.push('<b title="you own the record">LP</b>');
  else if(wanted(t)) g.push('<span title="on the Discogs wantlist">lp</span>');
  return g.join('');
}
function tagsFor(t){
  const g=[];
  if(t.tier==='shortlisted')g.push('<span class="tag buy">buy</span>');
  if(t.tier==='maybe')g.push('<span class="tag maybe">maybe</span>');
  if(t.tier==='skipped')g.push('<span class="tag skip">skip</span>');

  if(t.vinyl)g.push('<span class="tag vinyl">vinyl</span>');
  if(!colPick)t.collections.forEach(c=>g.push(`<span class="tag">${esc(c)}</span>`));
  if(t.bc_verdict==='confirmed')g.push('<span class="tag">FLAC</span>');
  return g.join('');
}
// A row for something seen only in Apple Music. It renders like any other so
// the eye does not have to switch modes; the moment you decide on it, `adopt`
// gives it a record and it becomes one.
const AM_OWNED=['purchased','matched','uploaded'];
function libRow(r){
  const hit=BYKEY.get(r.key); if(hit)return hit;
  return {key:r.key, artist:r.artist, title:r.title, album:r.album, seconds:r.secs,
          tier:'', vinyl:false, bought:false, collections:[], playlists:[],
          device:false, t7:false, am:true, am_owned:AM_OWNED.includes(r.cloud),
          am_status:(r.cloud==='subscription'||AM_OWNED.includes(r.cloud))?null:r.cloud,
          play_from:null, audio:false, preview:null, art:null, lean:true};
}
function rowHTML(t,i,pos,ro){
  const dur=mmss(t.seconds||t.dev_seconds);
  const have = t.device || t.local;      // on the iPod, or a file sync can reach
  return `<div class="row ${t.tier==='skipped'?'skip':''} ${have?'':'unowned'}" draggable="true" data-i="${i}" data-k="${esc(t.key)}"
      ${pos!=null?'style="grid-template-columns:24px 44px minmax(0,1fr) auto auto"':''}>
    ${pos!=null?`<span class="pos">${pos}</span>`:''}
    ${t.art?`<img class="art" src="${t.art}" loading="lazy" draggable="false">`:'<div class="art"></div>'}
    <div class="t"><div class="n">${esc(t.artist)} — ${esc(t.title)}</div>
      <div class="s">${[esc(t.album||t.dev_album||''), dur?'<span class="dur" data-full="'+dur+'">'+dur+'</span>':'', t.price?'€'+t.price.toFixed(2):'',
        heard(t)].filter(Boolean).join(' · ')}</div></div>
    <div class="src">${srcStrip(t)}</div>
    <div class="tags">${tagsFor(t)}<span class="br">${t.quality?`<b>${esc(t.quality)}</b>`:''}</span><span class="pod">${t.device?IPOD_SVG:''}</span><span class="ch">&rsaquo;</span><span class="eq"><i></i><i></i><i></i></span>${pos!=null&&!ro?'<span class="grab">⋮⋮</span>':''}<span class="more" title="more">&#8943;</span></div></div>`;
}

  closeMenu(); counts(); drawCols(); drawMid(); drawRight(); drawFoot(); paintPlaying();

    <span><kbd>b</kbd> buy</span><span><kbd>v</kbd> vinyl</span>
    <span><kbd>x</kbd> ${inCol?'take out':'skip'}</span>

    <span id="saved" style="margin-left:auto"></span>`;

/* ONE LIST VIEW, whatever is feeding it.
   The centre used to be three renderers -- iPod, Apple Music, drive -- and
   they had drifted: filters existed on one and were silently dropped on the
   other two, so `filter` stayed set to "on iPod" and simply stopped applying
   when you switched source, then resumed when you switched back. The list
   meant different things in different panes without saying so.
   Now one renderer. `currentList()` answers the only question that really
   differs -- which rows, and what is this called -- and everything after it
   is identical: same filters, same search, same cap, same numbering rule. */
function currentList(){
  if(albPick){
    const pane = active==='ipod' ? 'ipod' : 'src';
    const a=(pane==='ipod'?PODALBUMS:SRCALBUMS).find(x=>x.key===albPick);
    if(a) return {rows:a.tracks, lib:pane==='ipod'?'on the iPod':(stab==='t7'?'library':'apple music'),
      ordered:true, readonly:pane!=='ipod', foreign:pane!=='ipod', picked:true,
      title:a.album||'—', note:esc(a.artist||''), album:a,
      blank:'Empty album.'};
  }
  if(active==='am'){
    const pl=amPick&&amPick!=='__all__'&&AMP.find(p=>p.slug===amPick);
    const src=amPick==='__all__'?LIB:(PEEK&&PEEK.name===(pl||{}).name?PEEK.tracks:[]);
    return {rows:src.map(libRow), lib:pl?'apple music':'', ordered:!!pl, readonly:true, foreign:true,
      title: pl?pl.name:(amPick==='__all__'?'All in Apple Music':'Apple Music'),
      note: pl?`created ${(pl.created||'?').slice(0,10)}`:'',
      loading: peeking, picked: !!amPick,
      pour: pl?()=>pourPlaylist(pl.name,null):null,
      blank:`Pick a playlist on the left, or All of Apple Music. Nothing here is
        edited — this is the library to take from.`};
  }
  if(active==='t7'){
    const f=t7Pick&&t7Pick!=='__all__'&&T7.folders.find(x=>x.name===t7Pick);
    const src=(T7TRACKS&&T7TRACKS.name===t7Pick)?T7TRACKS.tracks:[];
    return {rows:src.map(t7Row), lib:f?esc(T7.root||'Library'):'', ordered:!!f, readonly:true, foreign:true,
      title: t7Pick==='__all__'?'All in Library':(t7Pick||'Library'),
      note: f&&f.lossless?`${f.lossless} lossless`:'',
      loading: t7Loading, picked: !!t7Pick, pour: f?()=>pourFolder(f.name,null):null,
      blank:`Pick a folder on the left. This is the music you already own,
        indexed ${esc(T7.built||'never')}, grouped the way the drive groups it.`};
  }
  const dp=devPick&&DEV.playlists.find(p=>p.name===devPick);
  if(dp) return {rows:dp.keys.map(k=>BYKEY.get(k)).filter(Boolean), lib:'on the iPod',
    ordered:true, readonly:true, title:dp.name, picked:true,
    note: dp.smart?'a smart playlist, never written':'not a collection yet',
    takeover: dp.smart?null:dp, blank:'Empty on the device.'};
  if(colPick) return {rows:(ORDER[colPick]||[]).map(k=>ALL.find(t=>t.key===k)).filter(Boolean),
    lib:'collection', ordered:true, readonly:false, title:colPick, picked:true, note:'',
    blank:'Empty. Drag tracks in from the library, or press <kbd>c</kbd> on a track.'};
  // The left pane is the iPod and nothing else, so its "All tracks" is the
  // device's own Songs menu: everything actually on it, ordered the way the
  // Classic orders it. This used to be the whole curation state -- a leftover
  // from when the pane was a library switcher -- which put 565 rented tracks
  // that are not on the device under a heading that says they are.
  const on=ALL.filter(t=>t.device).sort((a,b)=>
    (a.artist||'').localeCompare(b.artist||'')||(a.title||'').localeCompare(b.title||''));
  return {rows:on, lib:'', ordered:false, readonly:true, title:'All on iPod',
    picked:true, note:'', blank:'Nothing on the device yet.'};
}

function drawMid(){
  // the filters belong to the LIST, not to one source: always drawn, always applied
  // `on iPod` says nothing inside the iPod pane, and `rented only` cannot be
  // true of anything on the device. Offering a filter that can only ever
  // return everything or nothing is a dead control.
  const inPod = active==='ipod';
  const fs = FILTERS.filter(f=>!(inPod&&(f==='on iPod'||f==='rented only')));
  if(!fs.includes(filter))filter='all';
  $('#ctl').innerHTML=fs.map(f=>`<span class="pill ${f===filter?'on':''}" data-f="${f}">${f}</span>`).join('');
  $('#ctl').querySelectorAll('.pill').forEach(p=>p.onclick=()=>{captureScroll();filter=p.dataset.f;sel=recallSel();draw();});
  paintFilterToggle();

  const L=currentList();
  const all=L.rows, shown=all.filter(pass);
  view=shown.slice(0,CAP);

  $('#midh').innerHTML=esc(L.title)+(L.lib?` <span style="color:var(--dim)">· ${L.lib}</span>`:'');

  const acts=$('#midacts'); acts.innerHTML='';
  if(L.takeover) acts.innerHTML=`<span class="act" id="takeover" title="a collection of the same name and order; from then on it is yours to edit and sync">make it a collection</span>`;
  else if(L.pour) acts.innerHTML=`<span class="act" id="pourit" title="a collection of the same name and order">make it a collection</span>`;
  const tk=$('#takeover'); if(tk)tk.onclick=()=>takeOver(L.takeover);
  const po=$('#pourit');   if(po)po.onclick=()=>L.pour();

  const mins=Math.round(all.reduce((a,t)=>a+(t.seconds||t.dev_seconds||0),0)/60);
  const known=all.filter(t=>!t.lean).length;
  $('#midstat').innerHTML = !L.picked ? ''
    : L.loading ? 'reading…'
    : [ filtered()? `<s>${shown.length}</s> of ${all.length}` : `<s>${all.length}</s> tracks`,
        (!filtered()&&mins&&L.picked)?`${mins} min`:'',
        (L.foreign&&known)?`${known} in curation`:'',
        L.note,
        (!L.readonly&&filtered())?'clear the filter to re-sequence':'',
        (shown.length>CAP)?`${CAP} shown`:'' ].filter(Boolean).join(' · ');

  let h='';
  if(!L.picked)        h=`<p class="note">${L.blank}</p>`;
  else if(L.loading)   h=`<p class="note">Reading…</p>`;
  else if(!view.length)h=`<p class="note">${all.length?'Nothing in here matches.':L.blank}</p>`;
  else {
    // A picked list is a sequence, so it is numbered in its own order --
    // whether it came from the iPod, Apple Music or the drive. Only our own
    // collections can be re-sequenced; the rest are numbered but not grabbable.
    h=view.map((t,i)=>rowHTML(t,i,L.ordered?all.indexOf(t)+1:null,L.readonly)).join('');
  }
  if(shown.length>CAP)h+=`<p class="note">${shown.length-CAP} more — search to narrow.</p>`;

  $('#list').innerHTML=h;
  wireRows();
  if(view.length&&sel>=view.length)sel=view.length-1;   // never clamp an empty (loading) list
  mark();
}
// An iTunes-made or hand-made playlist becomes a collection of the same name
// and order. Sync then treats it as an update, and from then on it is ours.
async function takeOver(dp){
  if(COLS.includes(dp.name)){toast('already a collection');return;}
  if(!dp.keys.length){toast('nothing in it to take');return;}
  const r=await post('/api/decide',{keys:dp.keys,collection:dp.name,mode:'add'});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  await post('/api/decide',{reorder:{collection:dp.name,keys:dp.keys}});
  devPick=null; colPick=dp.name; sel=0; await load(); toast(`${dp.name} is a collection now`);
}
function wireRows(){
  const canSeq=active==='ipod'&&!!colPick&&!filtered();
  [...$('#list').querySelectorAll('.row')].forEach(r=>{
    r.onclick=()=>{sel=+r.dataset.i;mark();};
    const mo=r.querySelector('.more');
    if(mo)mo.onclick=e=>{e.stopPropagation(); sel=+r.dataset.i; mark(); openMenu(mo,'track',view[sel]);};
    r.ondblclick=()=>{sel=+r.dataset.i;mark();play();};
    r.ondragstart=e=>{
      e.dataTransfer.setData('text/plain',r.dataset.k);
      e.dataTransfer.effectAllowed='copyMove';
      r.classList.add('dragging');
      sel=+r.dataset.i; mark();
    };
    r.ondragend=()=>{r.classList.remove('dragging');
      document.querySelectorAll('.over,.drop').forEach(x=>x.classList.remove('over','drop'));};
    if(canSeq){
      r.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';r.classList.add('over');};
      r.ondragleave=()=>r.classList.remove('over');
      r.ondrop=async e=>{
        e.preventDefault(); e.stopPropagation(); r.classList.remove('over');
        const key=e.dataTransfer.getData('text/plain'); if(!key)return;
        const keys=(ORDER[colPick]||[]).slice();
        const from=keys.indexOf(key), to=+r.dataset.i;
        if(from<0){ await decide({collection:colPick,mode:'add'},[key]); return; }   // came from outside
        if(from===to)return;
        keys.splice(from,1); keys.splice(to,0,key);
        await saveOrder(colPick,keys,to);
      };
    }
  });
}
function mark(){
  if(view.length)SELMEM[listKey()]=sel;   // never record the empty loading state

  document.querySelectorAll('#list .row').forEach(r=>r.classList.remove('sel'));
  const r=document.querySelector(`#list .row[data-i="${sel}"]`);
  // Scrolling the selected row into view is right when YOU moved the
  // selection, and wrong during a redraw -- there it fights the restore and
  // wins, dragging you back to the selected row instead of where you were.
  if(r){r.classList.add('sel'); if(!redrawing())r.scrollIntoView({block:'nearest'});}
}
async function saveOrder(col,keys,to){
  ORDER[col]=keys; sel=to;
  const r=await post('/api/decide',{reorder:{collection:col,keys}});
  if(!r.ok)toast('NOT SAVED'); else saved();
  draw();
}
// J / K move the selected row one place in the FULL order, so they are only
// offered when the full order is what is on screen.
function nudge(dir){
  if(!colPick||filtered())return;
  const keys=(ORDER[colPick]||[]).slice(), t=view[sel]; if(!t)return;
  const from=keys.indexOf(t.key), to=from+dir;
  if(from<0||to<0||to>=keys.length)return;
  keys.splice(from,1); keys.splice(to,0,t.key);
  saveOrder(colPick,keys,to);
}

/* ---------------- left: collections, each a drop target ---------------- */
function drawCols(){
  $('#left').querySelector('.plabel').classList.toggle('off',active!=='ipod');
  $('#newcol').textContent='+ new';
  paintModes('ipod',$('#lmodes'));
  drawSrc();
  if(MODE.ipod==='album'){
    // Albums on the iPod are what the device itself would show: derived from
    // the tags of the tracks actually on it.
    PODALBUMS=albumsOf(ALL.filter(t=>t.device));
    $('#newcol').style.display='none';
    $('#colbody').innerHTML=albumRows(PODALBUMS,'ipod');
    wireAlbums($('#colbody'),'ipod');
    return;
  }
  $('#newcol').style.display='';
  const n={}; ALL.forEach(t=>t.collections.forEach(c=>n[c]=(n[c]||0)+1));
  const names=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
  let h=`<div class="col ${colPick===null&&!devPick&&active==='ipod'?'on':''}" data-all="1">All on iPod<span class="cnt">${ALL.filter(t=>t.device).length}</span></div>`;
  h+=names.map(c=>{
      // what sync would still have to do: tracks in it that are not on the device,
      // plus the playlist itself if it has never been written
      const off=(ORDER[c]||[]).filter(k=>!(BYKEY.get(k)||{}).device);
      const ready=off.filter(k=>(BYKEY.get(k)||{}).local).length, waiting=off.length-ready;
      const never=!SYNCED.includes(c)&&!PENDING.has(c);
      const mark=PENDING.has(c)?'new':(off.length?`+${off.length}`:(never?'unsynced':(n[c]||0)));
      return `<div class="col ${c===colPick?(active==='ipod'?'on':'was'):''} ${(off.length||never||PENDING.has(c))?'pend':''}" data-c="${esc(c)}"
        title="${esc(c)} — ${n[c]||0} tracks${off.length?`, ${ready} ready to sync, ${waiting} not owned yet`:', all on the iPod'}">
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c)}</span>
      <span class="cnt">${mark}</span><span class="more" title="more">&#8943;</span></div>`;}).join('');
  if(!names.length)h+=`<p class="note">None yet. Press <b style="color:var(--ink)">+ new</b>, then drag tracks onto it.</p>`;

  // then everything else the iPod carries -- iTunes-made, hand-made, smart
  const others=DEV.playlists.filter(p=>!p.ours);
  if(others.length){
    const allSmart=others.every(p=>p.smart);
    h+=`<div class="month" title="${allSmart?'the firmware\'s own lists: shown, never written':''}${DEV.mounted?'':' — read from '+esc(DEV.source||'the last backup')}">${allSmart?'smart · read-only':'on the iPod'}${DEV.mounted?'':' · last seen'}</div>`;
    h+=others.map(p=>`<div class="col dim ${p.name===devPick?(active==='ipod'?'on':'was'):''}" data-dev="${esc(p.name)}"
        title="${esc(p.name)} — ${p.n} tracks${p.smart?', a smart playlist: shown, never written':', made by iTunes or by hand; not a collection yet'}">
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
      <span class="cnt">${p.smart?'smart':p.n}</span></div>`).join('');
  }
  $('#colbody').innerHTML=h;
  const body=$('#colbody');
  body.querySelectorAll('[data-dev]').forEach(el=>el.onclick=()=>{activate('ipod');devPick=el.dataset.dev;colPick=null;albPick=null;sel=recallSel();draw();});
  body.querySelector('[data-all]').onclick=()=>{activate('ipod');colPick=null;devPick=null;albPick=null;sel=recallSel();draw();};
  body.querySelectorAll('[data-c]').forEach(el=>{
    const name=el.dataset.c;
    el.onclick=()=>{activate('ipod');colPick=name;devPick=null;albPick=null;sel=recallSel();draw();};
    const mo=el.querySelector('.more');
    if(mo)mo.onclick=e=>{e.stopPropagation(); openMenu(mo,'col',name);};
    el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';el.classList.add('drop');};
    el.ondragleave=()=>el.classList.remove('drop');
    el.ondrop=async e=>{
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
      const key=e.dataTransfer.getData('text/plain'); if(!key)return;
      if(key.startsWith('alb:')){ const a=SRCALBUMS.find(x=>x.key===key.slice(4));
        if(a)await decide({collection:name,mode:'add'},a.tracks.map(t=>t.key)); return; }
      if(key.startsWith('pl:')){ await pourPlaylist(key.slice(3),name); return; }   // a whole playlist
      if(key.startsWith('t7:')){ await pourFolder(key.slice(3),name); return; }     // a whole folder
      const t=ALL.find(x=>x.key===key);
      if(t&&t.collections.includes(name)){toast('already in '+name);return;}
      await decide({collection:name,mode:'add'},[key]);
      toast('added to '+name);
    };
  });
  $('#newcol').onclick=enterNew;
  // THE WHOLE PANE TAKES A DROP. Aiming at "+ new" to make a collection is
  // a bullseye you should not have to hit: dropping a playlist or a folder
  // anywhere on the iPod means "this belongs on the iPod", and a collection
  // of that name is what that sentence produces. Rows and "+ new" stop
  // propagation, so a precise drop still wins; this only catches the misses.
  const pane=$('#left');
  pane.ondragover=e=>{
    if(!DRAGKIND)return;                       // a bare track needs a target
    e.preventDefault(); e.dataTransfer.dropEffect='copy'; pane.classList.add('drop');
  };
  pane.ondragleave=e=>{ if(!pane.contains(e.relatedTarget))pane.classList.remove('drop'); };
  pane.ondrop=async e=>{
    e.preventDefault(); pane.classList.remove('drop');
    const key=e.dataTransfer.getData('text/plain'); if(!key)return;
    if(key.startsWith('alb:')){ const a=SRCALBUMS.find(x=>x.key===key.slice(4)); if(a)await albumToIpod(a); return; }
    if(key.startsWith('pl:')) return pourPlaylist(key.slice(3),null);
    if(key.startsWith('t7:')) return pourFolder(key.slice(3),null);
  };
  const nc=$('#newcol');

/* A new collection is made in the pane it will live in: a field at the top of

function enterNew(){

/* Where music comes from. Two libraries, one pane, the way Buy and Vinyl

function drawSrc(){

/* ---------------- albums, derived ----------------
   Grouped on album artist where there is one and the track artist otherwise,
   so a compilation does not shatter into one album per performer. The key is
   normalised because the same record reaches us from three places -- the
   device, the drive index and Apple Music -- spelled three ways. */
// THE ALBUM NAME ALONE. Keying on artist+album looked safer and shattered
// every compilation: only 904 of 4,048 files carry an album_artist tag, so
// the GTA San Andreas radio stations came out as one album per performer --
// 389 "albums" from 466 tracks, nearly all of them holding one. The device
// groups by album too, and shows Various Artists when the performers differ,
// which is what this now does.
function albumKey(t){
  return (t.album||'').toLowerCase().replace(/\s+/g,' ').trim();
}
const ICON_LIST='<svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true">'
 +'<g fill="currentColor"><rect y="0" width="12" height="1.6" rx=".6"/><rect y="4.2" width="12" height="1.6" rx=".6"/>'
 +'<rect y="8.4" width="12" height="1.6" rx=".6"/></g></svg>';
const ICON_FILTER='<svg width="12" height="11" viewBox="0 0 12 11" aria-hidden="true">'
 +'<path d="M.8 1h10.4L7.2 5.6v4L4.8 10.6V5.6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const ICON_ALBUM='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">'
 +'<g fill="currentColor"><rect width="5" height="5" rx="1"/><rect x="7" width="5" height="5" rx="1"/>'
 +'<rect y="7" width="5" height="5" rx="1"/><rect x="7" y="7" width="5" height="5" rx="1"/></g></svg>';
function paintModes(pane,el){
  if(!el)return;
  const m=MODE[pane];
  el.innerHTML=`<span class="${m==='list'?'on':''}" data-m="list" title="playlists">${ICON_LIST}</span>`
              +`<span class="${m==='album'?'on':''}" data-m="album" title="albums">${ICON_ALBUM}</span>`;
  el.querySelectorAll('[data-m]').forEach(x=>x.onclick=e=>{e.stopPropagation();
    if(MODE[pane]!==x.dataset.m)setMode(pane,x.dataset.m);});
}
function albumsOf(rows){
  const by=new Map();
  rows.forEach(t=>{
    const k=albumKey(t); if(!k)return;
    let a=by.get(k);
    if(!a)by.set(k,a={key:k, album:t.album, artist:null, who:new Set(), tracks:[], art:null, onPod:0});
    a.tracks.push(t); a.who.add(t.album_artist||t.artist||'');
    if(!a.art&&t.art)a.art=t.art; if(t.device)a.onPod++;
  });
  by.forEach(a=>{ a.artist = a.who.size===1 ? [...a.who][0] : 'Various Artists'; });
  return [...by.values()].sort((x,y)=>
    (x.artist||'').localeCompare(y.artist||'')||(x.album||'').localeCompare(y.album||''));
}
function albumRows(list,pane){
  if(!list.length)return `<p class="note">No albums here — these tracks carry no album tag.</p>`;
  return list.map(a=>`<div class="col ${albPick===a.key?'on':''}" data-alb="${esc(a.key)}" draggable="${pane!=='ipod'}"
      title="${esc(a.artist||'')} — ${esc(a.album||'')} · ${a.tracks.length} tracks${a.onPod?', '+a.onPod+' on the iPod':''}">
    ${a.art?`<img class="albart" src="${a.art}" loading="lazy" draggable="false">`:'<span class="albart"></span>'}
    <span style="min-width:0;overflow:hidden">
      <span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.album||'—')}</span>
      <span style="display:block;font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.artist||'')}</span>
    </span>
    <span class="cnt">${a.tracks.length}</span><span class="more" title="more">&#8943;</span></div>`).join('');
}

function wireAlbums(root,pane){

async function t7Peek(name){

// A file on the drive is owned by definition: T7 lit, and never "to buy".
function t7Row(r){

          tier:'', vinyl:false, bought:false, collections:[], playlists:[],
          device:false, t7:true, local:true, am:false, am_owned:false, am_status:null,
          lossless:r.lossless, origin_ext:r.ext,
          play_from:'t7', audio:false, preview:null, art:null, lean:true};

// Album view needs every track of that source, not one playlist's worth.
let SRCTRACKS=null, srcAllFor=null;
async function ensureSrcAll(){
  if(stab==='am'){ await ensureLib(); drawCols(); return; }
  if(srcAllFor==='t7'&&SRCTRACKS)return;

async function ensureLib(){
  if(libLoaded)return;
  const r=await fetch('/api/library').then(r=>r.json()).catch(()=>null);

}
async function peek(name){
  if(!name)return;
  peeking=true; drawMid();
  const r=await fetch('/api/peek?name='+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  peeking=false;
  if(!r||r.error){PEEK=null;toast(r&&r.error?'could not read it':'could not read it');return;}
  PEEK=r;
}

/* ---------------- right: buy and vinyl, the whole pane a drop target ---------------- */
function drawRight(){
  document.querySelectorAll('#rtabs .pill').forEach(t=>t.classList.toggle('on',t.dataset.r===rtab));

    // index finding the file is what bought means.

      if(t.vinyl){toast('already on the vinyl list');return;}
      await decide({vinyl:true},[key]); toast('on the vinyl list');
    }
  });
})();

/* ---------------- saving ---------------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1400);}
function saved(){const s=$('#saved'); if(s)s.textContent='saved '+new Date().toLocaleTimeString();}
async function post(url,body){
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)}).then(r=>r.json()).catch(()=>({ok:false}));
}
async function decide(patch,keys,advance){
  const ks = keys || (view[sel]?[view[sel].key]:[]);
  if(!ks.length)return;
  // anything decided on that has no record yet gets one, named from the row
  const newborn=ks.filter(k=>!BYKEY.has(k))
    .map(k=>{const t=view.find(x=>x.key===k); return t?{key:k,artist:t.artist,title:t.title}:null;})
    .filter(Boolean);
  const r=await post('/api/decide',{keys:ks,...(newborn.length?{adopt:newborn}:{}),...patch});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  saved();
  // On an unfiltered list the row stays put, so step on; on a filtered list the
  // row leaves and `sel` already points at the next one. Getting this wrong means
  // every decision needs a following keypress, which ruins the rhythm.
  if(advance&&!filtered())sel=Math.min(sel+1,Math.max(0,view.length-1));
  await load();
}

/* ---------------- playing ---------------- */
function srcFor(t){
  // A real file beats a 30s preview every time. Tracks already on the device
  // have no iTunes match at all, so this is the only way to hear them.
  if(t.audio) return {url:'/api/audio?key='+encodeURIComponent(t.key), full:true};
  if(t.preview) return {url:t.preview, full:false};
  return null;
}
let playRow=null;
// A full pass is cheap but not free on a list this long, so it runs only when
// something actually changes; the clock itself touches one element.
function paintPlaying(){
  document.querySelectorAll('.row.playing').forEach(r=>{
    r.classList.remove('playing');
    const d=r.querySelector('.dur'); if(d&&d.dataset.full)d.textContent=d.dataset.full;
  });
  playRow=null;
  const k=au.dataset.key; if(!k||au.paused)return;
  playRow=[...document.querySelectorAll('#list .row')].find(r=>r.dataset.k===k)||null;
  if(playRow){playRow.classList.add('playing');tickProgress();}
}
function tickProgress(){
  if(!playRow)return;
  const d=playRow.querySelector('.dur'); if(!d)return;
  const full=d.dataset.full;
  d.textContent = full ? `${mmss(au.currentTime)} / ${full}` : mmss(au.currentTime);
}
au.ontimeupdate=tickProgress; au.onplay=paintPlaying; au.onpause=paintPlaying; au.onended=paintPlaying;
function play(){
  const t=view[sel]; if(!t)return;
  const s=srcFor(t);
  if(!s){toast('nothing to play for this one');return;}
  if(au.dataset.key===t.key&&!au.paused){au.pause();return;}
  au.dataset.key=t.key; au.src=s.url;
  au.play().catch(()=>toast(s.full?'could not play the file':'preview failed'));
  if(s.full)toast('playing the full track');
}

// A job keeps being polled whether or not the overlay is open; the overlay, when
// it is open, just shows the latest. Closing the panel used to stop the poll,
// which meant a finished job never reloaded the page.
let lastJob=null;
function paintJob(r){
  const box=$('#jobbox'); if(!box||!r)return;
  box.style.display='';
  const jn=$('#jobname'); if(jn)jn.textContent=r.name||job||'';
  $('#jobstate').textContent=` — ${r.state}${r.seconds?` · ${r.seconds}s`:''}`;
  $('#joblog').textContent=(r.log||[]).join('\n');
  $('#joblog').scrollTop=1e6;
}
async function startJob(body){

  if(r.job){job=r.job;$('#gear').classList.add('busy');pollJob();}else{await load();toast('done');}
}
async function pollJob(){
  if(!job)return;
  const r=await fetch('/api/job?id='+job).then(r=>r.json()).catch(()=>null);
  if(!r){setTimeout(pollJob,2000);return;}
  lastJob=r; paintJob(r);
  if(r.state==='running'){setTimeout(pollJob,1200);return;}
  job=null; $('#gear').classList.remove('busy');
  await load(); toast(r.state==='done'?'finished':'job failed — see the log');
}

/* ---------------- sync, watched from the panel ----------------
   The panel does not close on confirm; it becomes the progress surface, one
   line per phase, the current one lit and the finished ones ticked. Phases
   come from '## ' lines the sync prints, so the page reads them rather than
   guessing from prose. When the last completes the iPod has been ejected, and
   the panel says so -- that is the moment the strip flips to "ejected". */
const SYNC_PHASES=[['backup','backing up the database'],['copy','copying and converting'],
  ['remove','taking tracks off'],['playlists','writing playlists'],['write','writing the database'],
  ['verify','verifying on the device'],['eject','ejecting']];
function paintSyncProgress(r){
  const log=r.log||[]; let cur=null; const counts={}, seen=new Set();
  for(const ln of log){ const m=ln.match(/^## (\w+)(?: (\S+))?/); if(m){cur=m[1]; seen.add(m[1]); if(m[2])counts[m[1]]=m[2];} }
  const done=r.state==='done', err=r.state==='error';
  $('#dlgt').textContent = done ? 'Synced' : err ? 'Sync stopped' : 'Syncing';
  $('#dlgp').innerHTML = done
    ? `Done at ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false})}. The iPod has been ejected — safe to unplug.`
    : err ? '<span style="color:var(--orange)">Stopped before finishing. The log is below; the pre-write backup is intact.</span>'
    : 'Working — leave the iPod plugged in.';
  const idx=SYNC_PHASES.findIndex(p=>p[0]===cur);
  $('#dlglist').innerHTML = SYNC_PHASES.map((p,i)=>{
    const skipped = p[0]==='remove' && !seen.has('remove') && (done||idx>i);
    const st = skipped ? 'skip' : (done||i<idx) ? 'done' : (i===idx ? (err?'err':'now') : 'todo');
    const mark = st==='done'?'&#10003;':st==='now'?'&hellip;':st==='err'?'!':st==='skip'?'&ndash;':'';
    return `<div class="drow ${st}"><span class="dn">${p[1]}${counts[p[0]]?' · '+esc(counts[p[0]]):''}</span><span class="dc">${mark}</span></div>`;
  }).join('') + `<pre style="max-height:120px;margin-top:10px">${esc(log.filter(l=>!l.startsWith('## ')).slice(-6).join('\n'))}</pre>`;
  $('#dlgbtn').innerHTML = (done||err) ? '<button class="go" id="dlgok">Close</button>' : '';
  const ok=$('#dlgok'); if(ok)ok.onclick=()=>{closeDlg();};
}
async function runSyncInPanel(){
  $('#dlgt').textContent='Syncing'; $('#dlgbtn').innerHTML='';
  $('#dlgp').textContent='Starting…'; $('#dlglist').innerHTML='';
  const r=await post('/api/action',{action:'sync'});
  if(!r.ok||!r.job){$('#dlgp').textContent=r.error||'could not start the sync';return;}
  job=r.job; $('#gear').classList.add('busy');
  const id=r.job;
  const tick=async()=>{
    const j=await fetch('/api/job?id='+id).then(x=>x.json()).catch(()=>null);
    if(!j){setTimeout(tick,1500);return;}
    lastJob=j; paintSyncProgress(j);
    if(j.state==='running'){setTimeout(tick,900);return;}
    job=null; $('#gear').classList.remove('busy'); await load(); pollHealth();
  };
  tick();
}

/* ---------------- the three-dot menu ----------------
   One menu, two kinds. A track's lists what a keystroke or a drag would do,
   and "Add to playlist" swaps the menu for a picker of the collections, ticks
   for the ones it is in, a field to make a new one. A collection's carries
   rename, add-all-shortlisted and delete -- the confirms stay as panels. */
const menu=$('#menu');
let MENU=null;
function menuRow(label,key,tick,cls){
  return `<div class="drow ${cls||''}"><span class="dn">${label}</span>${tick?'<span class="dc">&#10003;</span>':''}${key?`<span class="dk">${key}</span>`:''}</div>`;

function openMenu(anchor,kind,payload){

  let x=a.right-m.width, y=a.bottom+4;
  if(x<8)x=8; if(x+m.width>window.innerWidth-8)x=window.innerWidth-8-m.width;
  if(y+m.height>window.innerHeight-8)y=a.top-4-m.height;
  if(y<8)y=8;
  menu.style.left=x+'px'; menu.style.top=y+'px';
}
function closeMenu(){ menu.classList.remove('on'); MENU=null; }
function paintMenu(){
  if(!MENU)return;
  const h=$('#menuh'), b=$('#menub');
  if(MENU.kind==='col'){
    const c=MENU.payload;
    const nShort=ALL.filter(t=>t.tier==='shortlisted'&&!t.collections.includes(c)).length;
    h.innerHTML=esc(c);
    b.innerHTML=menuRow('Rename…','',false,'m-rename')+menuRow(`Add all shortlisted${nShort?' · '+nShort:''}`,'',false,'m-addshort')
      +'<div class="sep"></div>'+menuRow('Delete…','',false,'m-delete');
    b.querySelector('.m-rename').onclick=()=>{closeMenu();colPick=c;openDlg('__rename__');};
    b.querySelector('.m-delete').onclick=()=>{closeMenu();colPick=c;openDlg('__delete__');};
    b.querySelector('.m-addshort').onclick=async()=>{closeMenu();
      const ks=ALL.filter(t=>t.tier==='shortlisted'&&!t.collections.includes(c)).map(t=>t.key);
      if(!ks.length)return toast('nothing new to add');
      await decide({collection:c,mode:'add'},ks); toast(`added ${ks.length} to ${c}`);};
    return;
  }
  // AN ALBUM. It is not a container this tool owns: the Classic builds its
  // Albums menu from the tracks' tags, so putting one on the device means
  // moving its tracks and nothing else -- no playlist is made, or the record
  // would show up twice in two different menus.
  if(MENU.kind==='album'){
    const a=MENU.payload; if(!a){closeMenu();return;}
    const onPod=a.onPod, n=a.tracks.length;
    h.innerHTML=esc(a.album||'—')+' · '+n;
    b.innerHTML = (onPod<n ? menuRow('Put the album on the iPod',`${n-onPod} track${n-onPod>1?'s':''}`,false,'m-albadd') : '')
      + (onPod ? menuRow('Delete the album from the iPod',`${onPod} track${onPod>1?'s':''}`,false,'m-albdel') : '')
      + '<div class="sep"></div>' + menuRow('Add all to playlist &rsaquo;','',false,'m-albpl');

    const dl=b.querySelector('.m-albdel'); if(dl)dl.onclick=()=>{closeMenu();albumOffIpod(a);};
    b.querySelector('.m-albpl').onclick=()=>{MENU.kind='albpick';paintMenu();};
    return;
  }
  if(MENU.kind==='albpick'){
    const a=MENU.payload; if(!a){closeMenu();return;}
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add all to playlist`;

      :'<p class="note">No collections yet.</p>';

      await decide({collection:c,mode:'add'},a.tracks.map(t=>t.key));

    return;
  }
  // a folder on the drive
  if(MENU.kind==='t7f'){
    const f=MENU.payload; if(!f){closeMenu();return;}
    h.innerHTML=esc(f.name)+' · '+f.n;

  if(MENU.kind==='t7pick'){
    const f=MENU.payload; if(!f){closeMenu();return;}

    h.querySelector('.back').onclick=()=>{MENU.kind='t7f';paintMenu();};

    b.innerHTML=cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}"><span class="dn">${esc(c)}</span></div>`).join('')
      :'<p class="note">No collections yet.</p>';
    b.querySelectorAll('[data-pc]').forEach(x=>x.onclick=()=>{const c=x.dataset.pc;closeMenu();pourFolder(f.name,c);});
    return;

  // an Apple Music playlist: everything the drag does, by clicking
  if(MENU.kind==='ampl'){

      +menuRow('Add all to playlist &rsaquo;','',false,'m-pour')
      +'<div class="sep"></div>'
      +(p.imported?`<div class="drow done"><span class="dn">Imported for curation</span></div>`
                  :menuRow('Import for curation','known, not on the iPod',false,'m-imp'));
    b.querySelector('.m-make').onclick=()=>{closeMenu();pourPlaylist(p.name,null);};
    b.querySelector('.m-pour').onclick=()=>{MENU.kind='amplpick';paintMenu();};
    const mi=b.querySelector('.m-imp'); if(mi)mi.onclick=()=>{closeMenu();startJob({action:'export',names:[p.name]});};
    return;
  }
  if(MENU.kind==='amplpick'){
    const p=MENU.payload; if(!p){closeMenu();return;}
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add all to playlist`;
    h.querySelector('.back').onclick=()=>{MENU.kind='ampl';paintMenu();};
    const cols=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
    b.innerHTML=cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}"><span class="dn">${esc(c)}</span></div>`).join('')
      :'<p class="note">No collections yet.</p>';

    h.querySelector('.back').onclick=()=>{MENU.kind='track';paintMenu();};

  // Inside a collection, x takes the track out of it; X takes it off the iPod
  // altogether -- out of every playlist, gone from the device on the next
