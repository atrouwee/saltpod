<!doctype html><html><head><meta charset="utf-8">
<title>saltpod</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* One file, no build step, nothing fetched from anywhere.

   One workspace, never a set of tabs: collections on the left, the library in
   the middle, buy and vinyl on the right, and a track moves between them by
   being dragged. The three are always there because the whole job is moving a
   record from "I heard it" to "it is on the iPod", and that is a gesture, not
   a navigation.

   The tokens are PlayPi's (the house style for anything that plays music
   here): a dark ground, soft-white ink, a seam the lists slide under, and one
   orange that appears exactly once -- on the row that is playing. Words are
   set in the face; the machine's own labels (positions, tags, keys) in the
   mono. The selection blue is the iPod's own. */
:root {
  --ground: #141d29;
  --ink:    #fffffc;
  --seam:   #070c13;
  --orange: #f75c03;
  --dim:    rgba(255,255,252,.55);
  --faint:  rgba(255,255,252,.22);
  --panel:  rgba(255,255,252,.05);
  --raised: rgba(255,255,252,.09);
  --mono:   "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --face:   "Helvetica Neue", Helvetica, Arial, sans-serif;
  /* the selection blue, read off a photograph of the device: bright at the top,
     deeper below. It marks where you ARE; the orange marks what you HEAR, and
     the two never mean the same thing. Drop targets borrow the blue, because a
     drop is also a "here", never a "hear". */
  --sel-hi: #6aa9f4;
  --sel-lo: #1450b8;
  --hbtn:  32px; /* the header's controls: search's height, Sync's height, the gear's side */
  --lw: 250px;   /* the two left panes are one width: they do the same job */
  --sw: 250px;   /* the source pane: Apple Music or the drive, one at a time */
  --rw:   320px;

  /* ON THE SELECTION. The blue is the only ground in the product that needs
     its own foreground pair, and it was written out 21 times. */
  --on-sel:     #fff;
  --on-sel-dim: var(--on-sel-dim);
  --on-sel-line:var(--on-sel-line);
  --on-sel-hi:  var(--on-sel-hi);

  /* RADIUS LADDER. Not one radius: a small box wants a small corner, and
     the ratio is roughly a sixth of the box. Four steps, each with a size
     band, instead of the nine values that grew here one at a time. */
  --r-xs:   4px;   /* <=28px: thumbnails, mode marks */
  --r-sm:   8px;   /* nested rows, menu rows, wells */
  --r-md:  10px;   /* rows, cards, containers, the primary button */
  --r-pill: 99px;  /* pills, bars, dots -- anything whose height is its radius */

  /* TRACKING. Five jobs, not ten values. Uppercase mono needs air and the
     amount depends on what the label is FOR; lowercase mono and display
     face need almost none. */
  --ls-label: .18em;  /* uppercase section and pane labels */
  --ls-ctrl:  .1em;   /* uppercase tags, buttons, tabs, shortcuts */
  --ls-stat:  .06em;  /* uppercase stat lines */
  --ls-mono:  .02em;  /* lowercase mono */
  --ls-face:  .01em;  /* the wordmark */

  /* TYPE. Each size names the job it does. 13 and 13.5 stay apart: one is
     prose, one is a list row, and they sit in different containers. */
  --fs-tag:   9px;
  --fs-label: 9.5px;
  --fs-meta: 10.5px;  /* counts, subtitles, logs */
  --fs-ctrl:  11px;   /* buttons, keys */
  --fs-field: 12px;   /* inputs */
  --fs-text:  13px;   /* prose */
  --fs-row: 13.5px;   /* list rows */
  --fs-name:  14px;   /* a track name */
  --fs-base:  15px;   /* the page's own base */
  --fs-mark:  18px;   /* the wordmark */
  --fs-glyph: 19px;   /* the gear */
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 var(--fs-base)/1.4 var(--face);
       height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); }
a:hover { text-decoration-color: var(--ink); }
button, input, select { font: inherit; color: var(--ink); }
button { background: transparent; border: 1px solid var(--faint); border-radius: 0; padding: 7px 12px;
         font-family: var(--mono); font-size: var(--fs-ctrl); letter-spacing: var(--ls-ctrl); text-transform: uppercase; cursor: pointer; }
button:hover { border-color: var(--ink); }
button:disabled { opacity: .4; cursor: default; }
button.go { background: var(--ink); color: var(--ground); border-color: var(--ink); }
input[type=text], input[type=search], select { background: transparent; border: 1px solid var(--faint);
         padding: 6px 9px; font-family: var(--mono); font-size: var(--fs-field); }
input::placeholder { color: var(--dim); }
input:focus, select:focus { outline: none; border-color: var(--ink); }

/* header: one line. The brand, search in the centre, and on the right the
   counts -- quiet, at lower opacity -- then Sync and the gear. The pane
   controls live on the panes now, so nothing below this line but the seam. */
header { background: var(--ground); padding: 12px 24px 0; display: flex; flex-direction: column; gap: 8px; }
/* the seam is the header's last line, with nothing under it: the pane lines
   below start exactly where it ends */
header:after { content: ""; display: block; height: 2px; background: var(--seam); margin: 4px -24px 0; }
.brandline { display: grid; grid-template-columns: 1fr minmax(180px, 400px) 1fr; align-items: center; gap: 16px; }
/* A GRID ITEM KEEPS min-width:auto, so its min-content becomes a floor the
   whole grid -- and therefore the document -- cannot go under. The body is a
   grid and the footer is one of its items, so the keyboard hints, which are
   nowrap by design, were holding the entire page at 975px and making it
   scroll sideways on anything narrower. Both places need the same release. */
body > * { min-width: 0; }
.brandline > * { min-width: 0; }
/* One number drives both, because aspect-ratio loses to a button's intrinsic
   width and the gear came out 13px wide against Sync's 31. */
.hright { display: flex; align-items: center; justify-content: flex-end; gap: 14px; min-width: 0; }
.hright button { height: var(--hbtn); }
h1 { margin: 0; font-size: var(--fs-mark); font-weight: 700; letter-spacing: var(--ls-face); text-transform: uppercase; }
#q { width: 100%; height: var(--hbtn); padding: 0 12px; box-sizing: border-box; }
/* The counts give way before the buttons do, and clip at their END: the first
   number (tracks) matters most, the last (the total) least. */
.counts { font-family: var(--mono); font-size: var(--fs-meta); letter-spacing: var(--ls-stat); color: var(--dim); opacity: .6;
          display: flex; gap: 10px; flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
.counts span { flex: none; }
.counts s { text-decoration: none; color: var(--ink); }
.pill { font-family: var(--mono); font-size: var(--fs-meta); letter-spacing: var(--ls-ctrl); text-transform: uppercase;
        color: var(--dim); cursor: pointer; user-select: none; padding: 4px 0; border-bottom: 1px solid transparent; }
.pill:hover { color: var(--ink); }
.pill.on { color: var(--ink); border-bottom-color: var(--ink); }
#gear { padding: 0; width: var(--hbtn); flex: none; display: inline-flex; align-items: center;
        justify-content: center; font-size: var(--fs-glyph); line-height: 1; position: relative; }
#gear.busy:after { content: ""; position: absolute; top: -3px; right: -3px; width: 7px; height: 7px;
                   border-radius: var(--r-pill); background: var(--orange); }
/* Sync carries a count while state and the device disagree: tracks marked to
   come off, and tracks in a collection with a file waiting to go on. A change
   made in the page is not made on the iPod until this reads plain "Sync". */
/* The header's three controls take their looks from the list: search is the
   grey box of a selected collection, Sync is the blue of a selected track, and
   the gear is bare. Pending shows as the count in the label -- no orange on
   blue, for the same reason a selected playing row turns its clock white. */
#q { background: var(--raised); border: 0; border-radius: var(--r-md); }
#q:focus { background: rgba(255,255,252,.13); outline: none; }
#dosync { background: linear-gradient(var(--sel-hi), var(--sel-lo)); border: 0; border-radius: var(--r-md); color: var(--on-sel);
          box-shadow: inset 0 1px 0 var(--on-sel-hi); }
#dosync:hover { filter: brightness(1.08); }
#dosync.pending { color: var(--on-sel); }
#gear { border: 0; background: transparent; border-radius: var(--r-md); }
#gear:hover { background: var(--panel); }

/* ---------- the three panes ---------- */
/* No boxes. The surface fills the space; the only dividers on it are the two
   hairlines either side of the list. Everything else is separated by air. */
#work { display: grid; gap: 0; padding: 0; position: relative; overflow: hidden;
        grid-template-columns: var(--lw) var(--sw) minmax(0, 1fr) var(--rw); min-height: 0; }
aside, section.mid { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
/* Pinned to their tracks on purpose: when a side pane is display:none the
   middle would otherwise auto-place into the 0px track it left behind. */
aside.left  { grid-column: 1; border-right: 1px solid var(--faint); }
aside.srcpane   { grid-column: 2; border-right: 1px solid var(--faint); }
section.mid { grid-column: 3; container-type: inline-size; }
/* a narrow centre drops the source strip before it crushes the title */
@container (max-width: 420px) { .row .src { display: none; } }
@container (max-width: 330px) { .row .tags .tag { display: none; } }
aside.right { grid-column: 4; border-left: 1px solid var(--faint); }
body.nl { --lw: 24px; }  body.ns { --sw: 24px; }  body.nr { --rw: 24px; }
/* A folded pane is a 24px rail carrying its name and nothing else. The
   marks and the plus belong to a pane you can see: left in, they overlapped
   the turned title and offered to switch a view that is not on screen. */
body.nl aside.left .pbody, body.nl aside.left .act, body.nl aside.left .pstat, body.nl aside.left .modes,
body.ns aside.srcpane .pbody,  body.ns aside.srcpane .act,  body.ns aside.srcpane .pstat, body.ns aside.srcpane .modes,
body.nr aside.right .pbody, body.nr aside.right .pstat { display: none; }
/* A folded pane names every list behind it -- one pill would not say what
   else is there. The same reason BUY VINYL both survive on the right. */
body.nl aside.left .plabel, body.ns aside.srcpane .plabel, body.nr aside.right .plabel {
  writing-mode: vertical-rl; flex: 1 1 auto; flex-wrap: nowrap; justify-content: flex-start; align-items: center;
  gap: 12px; padding: 14px 0; cursor: pointer;
  /* the strip is a fixed 46px when the pane is open; a rail runs the height */
  height: auto; overflow: visible; }
body.nl aside.left .plabel .name { flex: 0 0 auto; min-width: 0; }
body.ns #stabs { flex: 0 0 auto; }
body.nr #rtabs .pill { border-bottom-color: transparent; }
/* each pane opens with one quiet mono line: what it is, and what can be done to it */
/* THE TITLE STRIP, once. The dialog and the menu each grew their own
   near-copy of this -- same family, size, tracking, transform and colour,
   differing only in height and in whether they draw their own seam. That is
   a ladder like the radius one: the strip gets shorter as the surface gets
   lighter (pane 46 > dialog 40 > menu 34), and a floating surface has to
   draw the edge its container does not. Two custom properties and one
   modifier, instead of three rules that have to be kept in step by hand. */
.plabel { display: flex; align-items: center; gap: var(--strip-gap, 12px); flex-wrap: nowrap;
          flex: none; min-height: var(--strip-h, 46px); height: var(--strip-h, 46px);
          padding: 0 var(--strip-x, 14px); overflow: hidden;
          font-family: var(--mono); font-size: var(--fs-label); letter-spacing: var(--ls-label);
          text-transform: uppercase; color: var(--dim); }
/* a surface that floats draws its own edge; a pane's container already has one */
.plabel.seam { border-bottom: 1px solid var(--faint); background: var(--panel); }
.plabel .name { color: var(--ink); flex: 1 1 auto; min-width: 6ch; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
/* In the centre the name does NOT grow: it sits with its count beside it,
   and the space that is left pushes the marks to the far right. */
section.mid .plabel .name { flex: 0 1 auto; }
section.mid .plabel .pstat { flex: 0 1 auto; margin-right: auto; min-width: 0;
                             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plabel .sp { display: none; }
/* A SIDE pane's title is one line and the same height in all three, so their
   bodies start level. The centre keeps wrapping -- it carries the list name,
   its action, the filter toggle and a stat line, and forcing that onto one
   line pushed it straight into the pane beside it. */
/* Anything a pane wants to say beyond its name goes BELOW the strip, so the
   strip itself is the same 46px in all four columns. */
.substat { flex: none; padding: 0 14px 8px; font-family: var(--mono); font-size: var(--fs-label);
           letter-spacing: var(--ls-stat); color: var(--dim); }
.substat s { text-decoration: none; color: var(--ink); }
.plabel .act { cursor: pointer; white-space: nowrap; }
.plabel .act:hover { color: var(--ink); }
.pstat { letter-spacing: var(--ls-stat); }
.pstat s { text-decoration: none; color: var(--ink); }
.pbody { overflow: auto; padding: 4px 14px 24px; flex: 1 1 auto; min-height: 0; }
/* the filters: a section of the list, folded away until wanted. The toggle
   always names the active filter, so a folded section never hides one. */
/* the centre lost width to the two left panes, so the pills need the gap
   back before they wrap an orphan onto a second row */
.filters { display: none; gap: 9px; flex-wrap: wrap; align-items: center; padding: 2px 14px 10px; }
section.mid.fx .filters { display: flex; }

/* The fold is the < or > left of a pane's title: it points the way the pane
   goes. A folded pane is not gone -- it leaves a rail a few pixels wide with
   the title turned on its side and the chevron now pointing the way back. */
/* A box, not a glyph on a baseline: the chevron and the title are different
   sizes, so only giving the chevron its own centred box lines them up. */
.fold { font-family: var(--mono); font-size: var(--fs-field); color: var(--dim); flex: none;
        cursor: pointer; user-select: none; writing-mode: horizontal-tb;
        display: inline-flex; align-items: center; justify-content: center;
        width: 14px; height: 14px; line-height: 1; }
.fold:hover { color: var(--ink); }
#rtabs { display: flex; gap: 14px; flex: 0 0 auto; min-width: 0; }
#stabs { display: flex; gap: 10px; flex: 0 1 auto; min-width: 0; overflow: hidden; }
#stabs .pill { white-space: nowrap; }
/* The right pane's title mirrors the left ones: text, then the chevron at the
   outer edge, everything pushed to the right. The stat takes its own line. */
aside.right .plabel { justify-content: flex-end; }
aside.right .substat { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                       padding: 8px 14px 12px; border-top: 1px solid var(--faint); }
body.nr aside.right .plabel .fold { order: -1; }   /* the rail reads chevron-first, like the others */

/* ---------- rows ---------- */
/* Rows float on the ground -- separated by space, not rules -- and the selected
   one takes the device's blue. */
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 14px; align-items: center;
       padding: 9px 10px; cursor: pointer; border-radius: var(--r-md); margin-bottom: 3px; user-select: none; }
.row:hover { background: var(--panel); }
.row.sel { background: linear-gradient(var(--sel-hi), var(--sel-lo));
       box-shadow: inset 0 1px 0 var(--on-sel-hi); }
/* A MARKED ROW IS NOT A SELECTED ROW. The cursor is one row and stays the
   full accent; a marked row is a quieter wash of the same hue, so a range
   reads as one block with the cursor still findable inside it. Same colour
   family on purpose -- a second hue would say "a different kind of thing". */
.row.marked { background: color-mix(in srgb, var(--sel-lo) 34%, transparent); }
.row.marked:hover { background: color-mix(in srgb, var(--sel-lo) 44%, transparent); }
.row.marked.sel { background: linear-gradient(var(--sel-hi), var(--sel-lo)); }
/* With a selection live, a cursor row that is NOT in it must not wear the
   same full accent as one that is -- otherwise cmd-clicking a row out of a
   range leaves it looking selected while the action will skip it. Outline
   instead of fill: still obviously the cursor, obviously not included. */
#list.hasmark .row.sel:not(.marked) { background: transparent;
       box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--sel-lo) 70%, transparent); }
#list.hasmark .row.sel:not(.marked) .s { color: var(--dim); }
#list.hasmark .row.sel:not(.marked) .ch,
#list.hasmark .row.sel:not(.marked) .grab,
#list.hasmark .row.sel:not(.marked) .pod,
#list.hasmark .row.sel:not(.marked) .src,
#list.hasmark .row.sel:not(.marked) .src b { color: inherit; }
.selcount { color: var(--ink); }
.selcount b { font-weight: 600; }
.selclear { margin-left: 7px; cursor: pointer; text-decoration: underline;
       text-underline-offset: 2px; color: var(--dim); }
.selclear:hover { color: var(--ink); }
.row.sel .s { color: var(--on-sel-dim); }
.row.sel .ch, .row.sel .grab { color: var(--on-sel); }
.row.sel .tag { color: var(--on-sel); border-color: var(--on-sel-line); }
.art { width: 44px; height: 44px; border-radius: var(--r-sm); background: var(--seam);
       object-fit: cover; flex: none; -webkit-user-drag: none; }
.t { min-width: 0; }
.t .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700;
        letter-spacing: -.005em; font-size: var(--fs-name); }
.t .s { color: var(--dim); font-family: var(--mono); font-size: var(--fs-meta); letter-spacing: var(--ls-mono);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.ch { color: var(--dim); font-size: var(--fs-text); padding-left: 2px; }
/* Where a track LIVES, as against what you have decided about it. Facts get
   plain mono with no border; decisions keep the bordered pills.

   The places are PEERS -- Apple Music, the T7, the iPod, a record -- and no
   attempt is made to say which came first. A track can sit in all four and
   the order it arrived in is unknowable. What is owned shows in full ink and
   what is only rented stays dim, so the gap this tool exists to close can be
   read by scanning one column. */
.src { display: flex; gap: 7px; align-items: center; flex: none;
       font-family: var(--mono); font-size: var(--fs-tag); letter-spacing: var(--ls-ctrl); color: var(--dim); }
.src b { font-weight: 400; color: var(--ink); }
.src .gone { text-decoration: line-through; }
/* the iPod sits in the strip as a fixed slot like the others: always drawn,
   lit when the track is actually on the device */
/* Two fixed slots at the end of every row, so neither ever moves: the
   bitrate, then the iPod. The iPod is the highest-priority fact in the row --
   is this ON the thing -- so it sits closest to the chevron, and it is drawn
   rather than spelled. Both slots are always present and only change state;
   a tag appearing or vanishing to their left cannot shift them. */
/* The bitrate took the pill that used to say "owned". A number is the better
   claim: it proves you hold the file AND says what it is, where the word only
   ever repeated what the ink already said. Nothing is shown for a track you
   do not own -- until it is bought there is no format to report.
   The SLOT keeps its width when empty, because collapsing it would start the
   iPod mark sliding again, which is what moving the mark here fixed. */
.br { width: 58px; display: flex; justify-content: flex-end; flex: none; }   /* .tags gap is 6px */
.br b { font-family: var(--mono); font-size: var(--fs-tag); font-weight: 400; letter-spacing: var(--ls-stat);
        font-variant-numeric: tabular-nums; color: var(--ink);
        padding: 2px 7px; border-radius: var(--r-pill); border: 1px solid var(--faint); }
.row.sel .br b { color: var(--on-sel); border-color: var(--on-sel-line); }
/* DRAWN ONLY WHEN IT IS TRUE. A faint iPod still looks like an iPod: on a
   dim row the title sits at 45% while this sat at full strength, so the
   placeholder was brighter than the track name and read as "this is on the
   device". The slot keeps its width so nothing shifts; the mark itself is
   either there or it is not. */
.pod { display: inline-flex; align-items: center; justify-content: center;
       width: 8px; flex: none; color: var(--ink); }
.row.sel .br { color: var(--on-sel-dim); }
.row.sel .pod { color: var(--on-sel); }
.row.sel .src, .row.sel .src b { color: var(--on-sel); }
.tags { display: flex; gap: 6px; align-items: center; flex: none; }
.tag { font-family: var(--mono); font-size: var(--fs-tag); letter-spacing: var(--ls-ctrl); text-transform: uppercase;
       padding: 2px 7px; border-radius: var(--r-pill); border: 1px solid var(--faint);
       color: var(--dim); white-space: nowrap; }
.tag.buy, .tag.ok { color: var(--ink); border-color: var(--ink); }
.tag.skip { opacity: .5; }
.tag.vinyl { color: var(--ink); background: var(--panel); }
/* FULL INK MEANS YOU COULD PUT IT ON THE IPOD TODAY -- a file exists, either
   already on the device or on a drive sync can read. Dim means you cannot:
   not bought, or bought and not yet indexed. That is the gap this tool exists
   to close, so it is the thing the eye should catch first while scanning.
   (It used to mean "not on the iPod yet", which dimmed tracks you already
   owned and were simply waiting to sync -- a fact about the copy, not about
   whether you have the music.)
   Struck through is the other direction: on its way off the device. */
.row.unowned .t, .row.unowned .art { opacity: .45; }
.row.skip .t .n { text-decoration: line-through; }
.col.pend .cnt { color: var(--orange); }
.row.dragging { opacity: .35; }
.row.over { box-shadow: inset 0 2px 0 var(--sel-hi); }
/* Three dots on every row. Everything a drag can do, a click can do: the menu
   lists it, and "Add to playlist" opens a picker the way a phone does. */
.more { font-family: var(--mono); font-size: var(--fs-name); line-height: 1; color: var(--dim); padding: 2px 6px;
        cursor: pointer; flex: none; opacity: 0; border-radius: var(--r-sm); }
.row:hover .more, .row.sel .more, .col:hover .more, .col.on .more { opacity: 1; }
.more:hover { color: var(--ink); background: var(--raised); }
.row.sel .more { color: var(--on-sel); }
#menu { position: fixed; z-index: 40; display: none; min-width: 230px; max-width: 320px;
        background: var(--ground); border: 1px solid var(--faint); border-radius: var(--r-md); overflow: hidden;
        box-shadow: 0 14px 28px rgba(0,0,0,.45); }
#menu.on { display: block; }
#menu { --strip-h: 34px; --strip-x: 12px; --strip-gap: 10px; }
#menu .plabel { white-space: nowrap; text-overflow: ellipsis; }
#menu .plabel .back { cursor: pointer; color: var(--dim); font-size: var(--fs-text); }
#menu .plabel .back:hover { color: var(--ink); }
#menu .mb { padding: 6px; max-height: 52vh; overflow: auto; }
#menu .drow { padding: 7px 10px; }
#menu .drow .dk { margin-left: auto; font: var(--fs-label) var(--mono); color: var(--dim); letter-spacing: var(--ls-ctrl); }
#menu .drow:hover .dk, #menu .drow:hover .dc { color: var(--on-sel-dim); }
#menu .sep { height: 1px; background: var(--faint); margin: 6px 4px; }
#menu input { width: 100%; background: transparent; border: 1px solid var(--faint); border-radius: var(--r-sm);
              color: var(--ink); padding: 7px 10px; font: var(--fs-field) var(--mono); margin: 2px 0; }
#menu input:focus { outline: none; border-color: var(--ink); }
.grab { cursor: grab; color: var(--dim); padding: 0 4px; }
.month { font-family: var(--mono); font-size: var(--fs-label); letter-spacing: var(--ls-label); text-transform: uppercase;
         color: var(--dim); margin: 24px 0 6px; padding: 0 10px; }
.month:first-child { margin-top: 4px; }
.month.vg { cursor: pointer; user-select: none; margin: 16px 0 6px; padding: 0 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.month.vg:hover { color: var(--ink); }
code { font-family: var(--mono); font-size: var(--fs-ctrl); color: var(--ink); }

/* Playing is said twice and never with a bar: the equaliser takes the chevron's
   slot -- a playing row is not going anywhere -- and the duration stops being a
   fact about the file and becomes a position inside it. Both in the orange. */
.eq { display: none; align-items: flex-end; gap: 2px; height: 13px; width: 15px; }
.eq i { width: 3px; border-radius: var(--r-pill); background: var(--orange); transform-origin: bottom;
        animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(1) { height: 40%; animation-delay: -.2s; }
.eq i:nth-child(2) { height: 95%; animation-delay: -.5s; }
.eq i:nth-child(3) { height: 62%; animation-delay: -.8s; }
@keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .eq i { animation: none; } }
.row.playing .ch { display: none; }
.row.playing .eq { display: inline-flex; }
.dur { font-variant-numeric: tabular-nums; }
.row.playing .dur { color: var(--orange); }
.row.sel .eq i { background: var(--on-sel); }
.row.sel.playing .dur { color: var(--on-sel); }

/* ---------- left pane: collections ---------- */
.col { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-md);
       cursor: pointer; font-size: var(--fs-row); margin-bottom: 2px; }
.col:hover { background: var(--panel); }
.col.on { background: var(--raised); font-weight: 700; }
.col .cnt { margin-left: auto; font-family: var(--mono); font-size: var(--fs-meta); color: var(--dim); white-space: nowrap; flex: none; }
.col.pending .cnt { font-style: italic; }
.col.dim > span:first-child { color: var(--dim); }
/* the two ways to read a pane, as marks rather than words: a stack of lines
   for lists, a square of four for albums */
.modes { display: inline-flex; gap: 2px; flex: none; margin-left: auto; }
.modes span { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 16px;
              border-radius: var(--r-xs); color: var(--faint); cursor: pointer; }
.modes span:hover { color: var(--dim); }
.modes span.on { color: var(--ink); background: var(--panel); }
/* the plus reads as an action, not a third view, so it keeps a gap and no
   pressed state */
.modes .plus { color: var(--dim); margin-right: 6px; width: 20px; }
.modes .plus:hover { color: var(--ink); background: var(--panel); }
/* a filter that is ON but folded away still has to declare itself */
.modes span.act { color: var(--orange); position: relative; }
.modes span.act:after { content: ""; position: absolute; top: 1px; right: 1px; width: 4px; height: 4px;
                        border-radius: var(--r-pill); background: var(--orange); }
.albart { width: 28px; height: 28px; border-radius: var(--r-xs); background: var(--seam); flex: none; object-fit: cover; }
.col.alb { align-items: center; }
.col .cnt .act { cursor: pointer; }
.col .cnt .act:hover { color: var(--ink); }
.col.drop, aside.right.drop .pbody { outline: 2px dashed var(--sel-hi); outline-offset: -3px; border-radius: var(--r-md); }
.col.drop { background: rgba(106,169,244,.12); }
/* the pane itself, lit while a whole playlist or folder is over it */
aside.left.drop { background: rgba(106,169,244,.07); box-shadow: inset 0 0 0 2px var(--sel-hi); }
/* Two panes on the left can each remember a pick; only one is what the centre
   shows. One slot, one meaning: `on` is the list on screen (raised, bold);
   `was` is remembered here and not on screen (bold, hairline, no fill). The
   pane label dims to say the same thing from further away. */
.col.was { font-weight: 700; box-shadow: inset 0 0 0 1px var(--faint); }
.plabel.off .name { color: var(--dim); }
.col.dragging { opacity: .35; }
/* + new is a drop target for a whole playlist */
.act.drop { color: var(--sel-hi); outline: 1px dashed var(--sel-hi); outline-offset: 3px; border-radius: var(--r-xs); }

/* ---------- right pane: buy / vinyl ---------- */
.card { background: var(--panel); border-radius: var(--r-md); padding: 10px 12px; margin-bottom: 6px; }
/* the dots ride the card's title line, the same slot the buy cards use */
.card > b { display: inline-block; max-width: calc(100% - 26px); }
.card > .more { float: right; margin-top: -2px; }
.card { position: relative; }
.card b { font-size: var(--fs-text); }
.card .more { position: absolute; top: 8px; right: 8px; }
.card:hover .more { opacity: 1; }
.card .sub { color: var(--dim); font-size: var(--fs-meta); margin-top: 3px; font-family: var(--mono); }
.card .acts { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: var(--fs-text); }
/* A fixed slot on every buy card saying how far the lookup got. It is always
   there and only ever changes state -- the same rule as the row's AM T7 POD LP
   and the machine's status strip. */
.look { display: flex; align-items: center; gap: 6px; margin-top: 6px;
        font-family: var(--mono); font-size: var(--fs-label); letter-spacing: var(--ls-ctrl);
        text-transform: uppercase; color: var(--dim); }
.look:before { content: ""; width: 5px; height: 5px; border-radius: var(--r-pill); background: var(--faint); flex: none; }
.look.on   { color: var(--orange); }
.look.on:before { background: var(--orange); animation: pulse 1.1s ease-in-out infinite; }
.look.done { color: var(--dim); } .look.done:before { background: var(--ink); }
.look.none:before { background: transparent; box-shadow: inset 0 0 0 1px var(--faint); }
.look .go { color: var(--ink); cursor: pointer; text-decoration: underline;
            text-decoration-color: var(--faint); }
.look .go:hover { text-decoration-color: var(--ink); }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .look.on:before { animation: none; } }
.card .acts button { padding: 4px 9px; font-size: var(--fs-label); margin-left: auto; }
p.note { color: var(--dim); font-size: var(--fs-text); margin: 8px 8px 12px; line-height: 1.5; }
p.note s { text-decoration: none; color: var(--ink); }

/* ---------- settings overlay, where Data lives now ---------- */
/* The data panel is the sync panel at a larger size: the same hairline edge,
   the same title strip with its one action at the top right, the same section
   labels. Two panels, one shape. */
/* A sheet belongs to a pane, so it appears AS that pane: same column, same
   width, sliding over only it. The rest of the page stays lit and usable --
   nothing is centred and nothing is dimmed. New collection comes from the
   left, where collections live; Data comes from the right. */
.sheet { position: absolute; top: 0; bottom: 0; z-index: 8; background: var(--ground);
         display: flex; flex-direction: column; min-width: 0; overflow: hidden;
         transition: transform .18s ease; will-change: transform; }
/* Never narrower than a pane's worth: --lw goes to 24px when the pane folds,
   and a 24px sheet parks only 25px off-canvas, so its text spilled out the
   side and read as clutter down the rail. */
#lsheet { left: 0; width: max(var(--lw), 240px); border-right: 1px solid var(--faint);
          box-shadow: 14px 0 28px rgba(0,0,0,.35); transform: translateX(-105%); }
/* Data is a fixed sheet, not a pane: it covers the right half of the screen,
   header and footer included, and leaves the left half lit. Never narrower
   than 480px, so a small window gets more than half. */
#rsheet { position: fixed; top: 0; bottom: 0; right: 0; left: auto; width: max(50%, 480px); z-index: 30;
          border-left: 1px solid var(--faint); box-shadow: -14px 0 28px rgba(0,0,0,.35); transform: translateX(102%); }
#rsheet .pbody { max-width: 760px; }
/* id + class, because the off-canvas transform above is on an id and would
   otherwise outrank a class alone */
#lsheet.on, #rsheet.on { transform: none; }
.sheet .pbody { padding: 6px 14px 24px; }
#rsheet .pbody { padding: 14px 16px 24px; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
.box { padding: 0; margin: 0 0 24px; }
.box:last-child { margin-bottom: 0; }
.brow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
pre { background: var(--panel); border-radius: var(--r-sm); padding: 12px; font: var(--fs-ctrl)/1.5 var(--mono);
      overflow: auto; max-height: 280px; margin: 10px 0 0; color: var(--ink); }

/* the status line at the foot, like the room page's */
footer { position: relative; background: var(--ground);
         padding: 10px 24px calc(10px + env(safe-area-inset-bottom, 0px));
         font-family: var(--mono); font-size: var(--fs-ctrl); letter-spacing: var(--ls-stat); color: var(--dim);
         display: flex; gap: 16px; align-items: center; }
/* Essentials only, one line, never wraps: everything else a key does, the
   menu also does, and the footer is not a manual. */
#keys { display: flex; gap: 16px; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; align-items: center; flex: 1 1 auto; min-width: 0; }
/* What the machine can reach: one slot per dependency, always present, always
   in this order, changing state rather than appearing. Lit is reachable,
   hollow is not here, orange is here and misbehaving. "Ejected" is hollow on
   purpose: after a good sync the iPod is gone, and that is not a fault. */
.st { display: flex; align-items: center; gap: 14px; flex: none;
      font-size: var(--fs-label); letter-spacing: var(--ls-ctrl); text-transform: uppercase; }
.st i { font-style: normal; color: var(--dim); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.st i:before { content: ""; width: 5px; height: 5px; border-radius: var(--r-pill); background: var(--faint); flex: none; }
.st i.ok { color: var(--ink); } .st i.ok:before { background: var(--ink); }
.st i.warn { color: var(--orange); } .st i.warn:before { background: var(--orange); }
.st i.off:before { background: transparent; box-shadow: inset 0 0 0 1px var(--faint); }
/* iTunes' capacity bar, miniaturised. The most-copied convention in this
   category, and the one you want while DECIDING rather than while syncing.
   Free space only: what a sync would add needs plan(), which reads the whole
   database and is far too expensive to poll. */
.st i.cap { margin-left: -8px; width: 46px; height: 5px; border-radius: var(--r-pill); background: var(--faint);
            overflow: hidden; padding: 0; display: inline-block; flex: none; }
.st i.cap:before { display: none; }
.st i.cap b { display: block; height: 100%; background: var(--dim); }
.st i.capn:before { display: none; }
/* the undo hint sits with the keyboard shortcuts, since that is where its
   own shortcut is printed */
.undoc { font-family: var(--mono); font-size: var(--fs-label); letter-spacing: var(--ls-stat); color: var(--dim);
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28ch; }
.st .w { color: var(--dim); text-transform: none; letter-spacing: var(--ls-mono); }
/* the inline new-collection field, in the pane it belongs to */
.ninl { padding: 4px 8px 8px; }
#newin { width: 100%; background: transparent; border: 1px solid var(--faint); border-radius: var(--r-sm);
         color: var(--ink); padding: 8px 12px; font: var(--fs-field) var(--mono); }
#newin:focus { outline: none; border-color: var(--ink); }
.col[data-seed]:hover { background: linear-gradient(var(--sel-hi), var(--sel-lo)); }
.col[data-seed]:hover > span, .col[data-seed]:hover .cnt { color: var(--on-sel); }
footer:before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--faint); }
kbd { font: var(--fs-ctrl) var(--mono); color: var(--ink); border: 1px solid var(--faint); padding: 0 6px; margin-right: 2px; }
/* Built like a screen on the device rather than a window: a hairline edge, a
   title strip, and a list underneath whose rows take the same selection blue
   the library uses. Nothing here is heavier than the panes behind it. */
#dlg { position: fixed; inset: 0; background: rgba(7,12,19,.72); display: none;
       align-items: center; justify-content: center; z-index: 30; }
#dlg.on { display: flex; }
#dlgbox { background: var(--ground); border: 1px solid var(--faint); border-radius: var(--r-md);
          width: min(420px, 92vw); max-height: 78vh; display: flex; flex-direction: column;
          overflow: hidden; }
/* The panel's own header carries its title on the left and the one thing it
   does on the right -- the same place the page header keeps Sync. */
#dlgbox { --strip-h: 40px; --strip-x: 16px; }
#dlgt { flex: 1 1 auto; }
#dlgbtn:empty { display: none; }
#dlgbody { padding: 14px 16px 16px; overflow: auto; }
#dlgp { margin: 0 0 12px; color: var(--dim); font-size: var(--fs-text); line-height: 1.5; }
#dlgin { width: 100%; background: transparent; border: 1px solid var(--faint);
         border-radius: var(--r-sm); color: var(--ink); padding: 9px 12px; font: inherit; }
#dlgin:focus { outline: none; border-color: var(--ink); }

.dsec { font-family: var(--mono); font-size: var(--fs-tag); letter-spacing: var(--ls-label); text-transform: uppercase;
        color: var(--dim); margin: 16px 0 6px; }
/* the list, in the device's idiom: a row, a count, and the blue on the one under the cursor */
.drow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-sm);
        cursor: pointer; font-size: var(--fs-row); }
.drow:hover { background: linear-gradient(var(--sel-hi), var(--sel-lo)); }
.drow:hover .dc { color: var(--on-sel-dim); }
.drow .dn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .dc { margin-left: auto; font-family: var(--mono); font-size: var(--fs-meta); color: var(--dim); }
.drow.tick .dn:after { content: " ✓"; color: var(--dim); }
.drow.done .dn, .drow.done .dc { color: var(--dim); }
.drow.now .dn { color: var(--ink); } .drow.now .dc { color: var(--orange); }
.drow.todo .dn, .drow.skip .dn { color: var(--faint); }
.drow.err .dn, .drow.err .dc { color: var(--orange); }
/* A FACT IN A LIST OF CHOICES. It keeps the slot -- nothing shifts when a
   record arrives -- but it is not a button: no hover, no pointer, dimmed.
   Law 4 inside the menu: a fact about the world is plain, a decision is a
   control. */
.drow.inert { cursor: default; opacity: .5; }
.drow.inert:hover { background: none; }
.drow.inert:hover .dn, .drow.inert:hover .dc { color: var(--dim); }
.drow.done:hover, .drow.now:hover, .drow.todo:hover, .drow.skip:hover, .drow.err:hover { background: transparent; cursor: default; }
#dlglist { max-height: 34vh; overflow: auto; margin-top: 2px; }
#toast { position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--ground);
         padding: 8px 14px; font: var(--fs-ctrl) var(--mono); letter-spacing: var(--ls-ctrl); text-transform: uppercase;
         opacity: 0; transition: opacity .18s; pointer-events: none; z-index: 40; }
#toast.on { opacity: 1; }
.warn { color: var(--dim); }

/* ---------------- the track panel ----------------
   Shares #sp's geometry: same width, same slide, same scrim. Two panels
   that behave differently when they open would be two ideas. */
#tp { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 94vw); z-index: 29;
      background: var(--ground); border-left: 1px solid var(--faint);
      display: flex; flex-direction: column; min-width: 0;
      transform: translateX(100%); transition: transform .22s cubic-bezier(.32,.72,0,1);
      box-shadow: -18px 0 46px rgba(7,12,19,.5); }
#tp.on { transform: none; }
@media (prefers-reduced-motion: reduce) { #tp { transition: none; } }
#tp .substat { border-top: 1px solid var(--faint); display: flex; align-items: center;
      gap: 12px; padding: 9px 14px; }
#tp .substat .sp { flex: 1 1 auto; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
#tp .substat button { flex: none; font: inherit; font-size: var(--fs-ctrl);
      letter-spacing: var(--ls-ctrl); text-transform: uppercase; height: var(--hbtn);
      padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--faint);
      background: transparent; color: var(--ink); cursor: pointer; }
#tp .substat button.go { background: linear-gradient(var(--sel-hi), var(--sel-lo));
      border: 0; color: var(--on-sel); box-shadow: inset 0 1px 0 var(--on-sel-hi); }
#tp .substat button[disabled] { opacity: .4; cursor: default; background: none;
      border: 1px solid var(--faint); color: var(--dim); box-shadow: none; }

/* the identity block: a small cover beside the two lines it belongs to */
.tpid { display: flex; gap: 12px; align-items: flex-start; margin: 10px 4px 4px; }
.tpart { flex: none; width: 76px; height: 76px; border-radius: var(--r-sm);
      background: var(--seam); border: 1px solid var(--faint); overflow: hidden;
      position: relative; cursor: pointer; }
.tpart img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tpart .ph { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-family: var(--mono); font-size: var(--fs-tag);
      letter-spacing: var(--ls-ctrl); text-transform: uppercase; color: var(--faint);
      text-align: center; padding: 0 6px; }
.tpart:hover .ph { color: var(--ink); }
.tpart.drop { outline: 2px dashed var(--sel-hi); outline-offset: -3px; }

/* a field: the label on the left the way Get Info does, the value editable */
.fld { display: flex; align-items: baseline; gap: 12px; padding: 6px 10px;
      border-radius: var(--r-sm); }
.fld:hover { background: var(--panel); }
.fld .k { flex: none; width: 88px; text-align: right; font-family: var(--mono);
      font-size: var(--fs-tag); letter-spacing: var(--ls-label);
      text-transform: uppercase; color: var(--dim); }
.fld .v { flex: 1 1 auto; min-width: 0; font-size: var(--fs-row); color: var(--ink);
      border: 0; border-bottom: 1px solid transparent; background: none;
      padding: 2px 0; font-family: inherit; outline: none; }
.fld .v::placeholder { color: var(--faint); }
.fld:hover .v { border-bottom-color: var(--faint); }
.fld .v:focus { border-bottom-color: var(--sel-hi); }
/* EDITED IS A STATE OF THE FIELD, not a badge that appears beside it --
   the row must not change width as you type. */
.fld.dirty .v { border-bottom-color: var(--sel-hi); }
.fld.dirty .k { color: var(--sel-hi); }
.fld.ro .v { color: var(--dim); }

/* the filename's guess, offered only when a field is empty and the name
   has something to give */
.tpguess { background: var(--seam); border-radius: var(--r-sm); padding: 10px 12px;
      margin: 8px 4px 2px; }
.tpguess .src { font-family: var(--mono); font-size: var(--fs-tag);
      letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--dim); }
.tpguess .pair { margin-top: 7px; font-size: var(--fs-row); }
.tpguess .pair em { font-style: normal; font-family: var(--mono);
      font-size: var(--fs-tag); letter-spacing: var(--ls-label);
      text-transform: uppercase; color: var(--dim); display: inline-block; width: 46px; }
.tpguess .act2 { margin-top: 9px; display: inline-block; font-family: var(--mono);
      font-size: var(--fs-ctrl); letter-spacing: var(--ls-ctrl); text-transform: uppercase;
      padding: 5px 11px; border-radius: var(--r-sm); cursor: pointer;
      background: linear-gradient(var(--sel-hi), var(--sel-lo)); color: var(--on-sel); }

/* ---------------- the sync panel ----------------
   Built out of the parts the rest of the page is built out of: it IS an
   aside.right that happens to be fixed. Same 46px .plabel, same .pbody,
   same .month section labels, same .col rows carrying a .cnt on the right,
   same .substat line at the foot. The only new things are the slide and the
   excluded state, because nothing existing does either.

   The scrim is not decoration: the plan is a diff against the device taken a
   moment ago, and letting you change a decision behind it would make the
   list on screen a lie. */
#spscrim { position: fixed; inset: 0; background: rgba(7,12,19,.55); z-index: 28;
       opacity: 0; pointer-events: none; transition: opacity .18s ease; }
#spscrim.on { opacity: 1; pointer-events: auto; }
#sp { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 94vw); z-index: 29;
      background: var(--ground); border-left: 1px solid var(--faint);
      display: flex; flex-direction: column; min-width: 0;
      transform: translateX(100%); transition: transform .22s cubic-bezier(.32,.72,0,1);
      box-shadow: -18px 0 46px rgba(7,12,19,.5); }
#sp.on { transform: none; }
@media (prefers-reduced-motion: reduce) { #sp, #spscrim { transition: none; } }

#sp .substat { border-top: 1px solid var(--faint); display: flex; align-items: center;
      gap: 12px; padding: 9px 14px; }
#sp .substat .sp { flex: 1 1 auto; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
#sp .substat button { flex: none; font: inherit; font-size: var(--fs-ctrl); letter-spacing: var(--ls-ctrl);
      text-transform: uppercase; height: var(--hbtn); padding: 0 14px; border-radius: var(--r-md);
      border: 1px solid var(--faint); background: transparent; color: var(--ink);
      cursor: pointer; }
/* the confirm is the header's Sync button, which is what it is */
#sp .substat button.go { background: linear-gradient(var(--sel-hi), var(--sel-lo));
      border: 0; color: var(--on-sel); box-shadow: inset 0 1px 0 var(--on-sel-hi); }
#sp .substat button[disabled] { opacity: .4; cursor: default; background: none;
      border: 1px solid var(--faint); color: var(--dim); box-shadow: none; }
/* the all/none control sits where a count sits, because it replaces one */
.month .all { float: right; cursor: pointer; letter-spacing: var(--ls-stat); }
.month .all:hover { color: var(--ink); }
/* THE COMMIT BOUNDARY. Everything above it is undone by doing nothing:
   copied files the database does not mention are orphans the next sync
   tidies. Below it the device is changed. */
.month.edge { display: flex; align-items: center; gap: 10px; color: var(--faint); }
.month.edge:before, .month.edge:after { content: ""; flex: 1 1 auto; height: 1px;
      background: var(--faint); }
/* An excluded row keeps its place and says it is out -- nothing shifts. */
.col.out .nm { color: var(--faint); text-decoration: line-through; }
.col.out .cnt { color: var(--faint); }
/* the infrastructure rows: this happens, it was never yours to pick */
.col.fixed { cursor: default; }
.col.fixed:hover { background: none; }
.col.fixed .nm { color: var(--dim); }
.col .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A RESERVED MENU SLOT. The column of dots has to exist on every row in a
   list, or the count beside it steps sideways between a row that has a menu

<script>

const $=s=>document.querySelector(s), au=$('#au');

/* MULTI-SELECT. `sel` stays what it was -- the cursor, an index into `view`,
   which everything from scroll memory to nudge to play depends on. The

   indices are invalidated by every redraw, filter and sort, and a stale index
   silently acts on the wrong track. A key is the same track forever.

const MARK=new Set(); let MARKLIST=null;

/* THE ONE FUNCTION EVERY ACTION ASKS. A selection when there is one, the row
   under the cursor when there is not, so single-track use is untouched. */
function targets(){ return MARK.size ? markedKeys() : (view[sel]?[view[sel].key]:[]); }
function clearMark(){ if(!MARK.size)return false; MARK.clear(); MARKLIST=null; return true; }
function syncMarkList(){ const k=listKey(); if(MARKLIST!==k){MARK.clear(); MARKLIST=k;} }
function setMark(keys){ MARK.clear(); MARKLIST=listKey(); keys.forEach(k=>MARK.add(k)); }
/* A range is taken in the order the list is CURRENTLY shown, which is the
   order the eye drew it -- not the order the underlying array happens to be
   in. Anchor included, both ends inclusive. */
/* Every drop target reads the payload through this. A single drag is a
   one-element array, so the multi-track case is not a second code path. */
function dropKeys(e){
  const raw=e.dataTransfer.getData('text/plain');
  return raw?raw.split('\n').filter(Boolean):[];
}
function markRange(a,b){
  MARKLIST=listKey();
  const [lo,hi]=a<b?[a,b]:[b,a];

}
let colPick=null;          // null = the whole library; a name = that collection, in its order
let rtab='buy';
// A collection made with "+ new" does not exist on the server until its first
// track lands. Until then it lives here, so it does not vanish on the next load.
let PENDING=new Set();
let newMode=false, newQ='';           // the new-collection sheet, open or not
// What the iPod actually carries, ours or not. devPick shows one of the others
// in the middle, read-only, with one way in: make it a collection.
let DEV={mounted:false,source:null,playlists:[]}, devPick=null;
let HEALTH=null;
// The Discogs exports, and two maps from a match key to a release. A track
// meets a release on artist + album; see discogs.py for what the key strips.
let DISCOGS={wantlist:[],collection:[],files:{},dir:'data/discogs'}, OWN=new Map(), WANT=new Map();
const norm=s=>(s||'').toLowerCase().replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/^(the|a)\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();

let VG={add:true,want:true,own:false};     // which vinyl groups are open

let UNDOC={can_undo:0,can_redo:0,next:null};
async function refreshUndo(){
  try{ UNDOC=await fetch('/api/undo').then(r=>r.json()); }catch(e){}

}

  const el=$('#undoc'); if(!el)return;

/* ---------------- where you were ----------------
   Every redraw replaces the innerHTML of a pane, which puts its scroll back
   to the top. That is fine for a list of 14 and maddening for one of 4,048:
   decide on a track two thirds down Bought Tracks and the redraw throws you
   back to the As. So each scrollable body remembers its offset, keyed by

// instead, because a deadline expires on its own.)
let drawUntil=0;

  PANES.forEach(id=>{

// between redraws -- a scroll with no redraw after it would otherwise only be
// captured at the next one. It is a top-up, never the source of truth.
PANES.forEach(id=>{
  const el=$(id);

let LIB=[], libLoaded=false, amPick=null, PEEK=null, peeking=false;

// make a collection out of, so it still needs an actual target.
let DRAGKIND=null;

(function(){
  let l=null,a=null,r=null;

/* ---------------- loading, counting, filtering ---------------- */
async function load(){
  const [r,d,a,dv,lo]=await Promise.all([
    fetch('/api/tracks').then(r=>r.json()),
    fetch('/api/discogs').then(r=>r.json()).catch(()=>null),
    fetch('/api/playlists').then(r=>r.json()).catch(()=>null),
    fetch('/api/device').then(r=>r.json()).catch(()=>null),
    fetch('/api/local').then(r=>r.json()).catch(()=>null)]);

  if(lo){T7=lo; if(t7Pick&&!T7.folders.some(f=>f.name===t7Pick))t7Pick=null;
  }
  if(d){DISCOGS=d; OWN=new Map((d.collection||[]).map(x=>[x.key,x])); WANT=new Map((d.wantlist||[]).map(x=>[x.key,x]));}

  BYKEY=new Map(ALL.map(t=>[t.key,t]));

  if(colPick&&!COLS.includes(colPick)&&!PENDING.has(colPick))colPick=null;   // renamed or deleted under us

function counts(){
  const c={undecided:0,sync:0,remove:0,vinyl:0,bought:0};   // `undecided` is the null, never shown
  ALL.forEach(t=>{c[t.tier]++; if(t.vinyl)c.vinyl++; if(t.bought)c.bought++;});
  // "to buy" is what you still have to go and get: marked sync, not held
  // bought, and no file for it anywhere on your drives.
  const todo=ALL.filter(t=>t.tier==='sync'&&!t.bought&&!t.local);
  const eur=todo.reduce((a,t)=>a+(t.price||0),0);
  // what the next sync would do, as far as the page can know without the device
  const offs=ALL.filter(t=>t.device&&t.tier==='remove').length;
  const ons=ALL.filter(t=>!t.device&&t.local&&t.collections.length).length;
  const pend=offs+ons, sb=$('#dosync');
  sb.textContent = pend ? `Sync · ${pend}` : 'Sync';
  sb.classList.toggle('pending',pend>0);
  sb.title = pend ? `${offs} to take off the iPod, ${ons} to put on — nothing has changed on the device yet` : 'write the collections to the iPod';
  $('#counts').innerHTML=`<span><s>${ALL.length}</s> tracks</span>
    <span><s>${todo.length}</s> to buy</span>
    <span><s>&euro;${eur.toFixed(2)}</s> final</span>`;
}
function pass(t){
  if(q){const h=(t.artist+' '+t.title+' '+(t.album||'')).toLowerCase(); if(!h.includes(q))return false;}
  // the three pending decisions, in the words the menu uses for them
  if(filter==='to buy')   return t.tier==='sync' && !t.local && !t.device;
  if(filter==='to sync')  return t.tier==='sync' &&  t.local && !t.device;
  if(filter==='to remove')return t.tier==='remove';
  if(filter==='vinyl')return t.vinyl;
  if(filter==='on vinyl')return !!owned(t);
  if(filter==='on T7')return t.t7;

  if(filter==='rented only')return t.am&&!t.t7&&!owned(t);

const filtered=()=>!!q||filter!=='all';
// what a click would actually play, named rather than left to be guessed
function heard(t){
  if(t.play_from==='t7')   return '<span style="color:var(--ink)">plays from the T7</span>';
  if(t.play_from==='ipod') return '<span style="color:var(--ink)">plays from the iPod</span>';
  if(t.preview)            return 'a 30s preview';
  return '<span class="warn">nothing to play</span>';
}
// every place that holds it, in a fixed order -- never a claim about which came first
// a Classic, at 11px: body, screen, click wheel
const IPOD_SVG='<svg viewBox="0 0 12 19" width="8" height="13" aria-hidden="true">'
  +'<rect x=".6" y=".6" width="10.8" height="17.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.1"/>'
  +'<rect x="2.5" y="2.7" width="7" height="5.2" rx=".7" fill="currentColor" opacity=".55"/>'
  +'<circle cx="6" cy="13.4" r="3" fill="none" stroke="currentColor" stroke-width="1.1"/>'
  +'<circle cx="6" cy="13.4" r=".85" fill="currentColor"/></svg>';
function srcStrip(t){
  const g=[];
  if(t.am)      g.push(t.am_status ? `<span class="gone" title="in Apple Music, ${esc(t.am_status)}">AM</span>`
                                   : (t.am_owned?'<b title="owned in Apple Music">AM</b>':'<span title="in Apple Music, rented">AM</span>'));
  if(t.t7)      g.push(`<b title="stored on the T7${t.lossless?', lossless':''}">T7</b>`);
  // the iPod is NOT in this strip -- it sits at the end of the row, beside
  // the chevron, where it never moves. See rowHTML.
  if(owned(t))  g.push('<b title="you own the record">LP</b>');
  else if(wanted(t)) g.push('<span title="on the Discogs wantlist">lp</span>');
  return g.join('');
}
function tagsFor(t){
  const g=[];
  if(t.tier==='sync'&&!t.local&&!t.device)g.push('<span class="tag buy">buy</span>');
  if(t.tier==='remove')g.push('<span class="tag skip">remove</span>');

  if(t.vinyl)g.push('<span class="tag vinyl">vinyl</span>');
  if(!colPick)t.collections.forEach(c=>g.push(`<span class="tag">${esc(c)}</span>`));
  if(t.bc_verdict==='confirmed')g.push('<span class="tag">FLAC</span>');
  return g.join('');
}
// A row for something seen only in Apple Music. It renders like any other so
// the eye does not have to switch modes; the moment you decide on it, `adopt`
// gives it a record and it becomes one.
const AM_OWNED=['purchased','matched','uploaded'];
function libRow(r){
  const hit=BYKEY.get(r.key); if(hit)return hit;
  return {key:r.key, artist:r.artist, title:r.title, album:r.album, seconds:r.secs,
          tier:'', vinyl:false, bought:false, collections:[], playlists:[],
          device:false, t7:false, am:true, am_owned:AM_OWNED.includes(r.cloud),
          am_status:(r.cloud==='subscription'||AM_OWNED.includes(r.cloud))?null:r.cloud,
          play_from:null, audio:false, preview:null, art:null, lean:true};
}
function rowHTML(t,i,seq){
  const dur=mmss(t.seconds||t.dev_seconds);
  const have = t.device || t.local;      // on the iPod, or a file sync can reach
  return `<div class="row ${t.tier==='remove'?'skip':''} ${have?'':'unowned'} ${MARK.has(t.key)?'marked':''}" draggable="true" data-i="${i}" data-k="${esc(t.key)}">
    ${t.art?`<img class="art" src="${t.art}" loading="lazy" draggable="false">`:'<div class="art"></div>'}
    <div class="t"><div class="n">${esc(t.artist)} — ${esc(t.title)}</div>
      <div class="s">${[esc(t.album||t.dev_album||''), dur?'<span class="dur" data-full="'+dur+'">'+dur+'</span>':'', t.price?'€'+t.price.toFixed(2):'',
        heard(t)].filter(Boolean).join(' · ')}</div></div>
    <div class="src">${srcStrip(t)}</div>
    <div class="tags">${tagsFor(t)}<span class="br">${t.quality?`<b>${esc(t.quality)}</b>`:''}</span><span class="pod">${t.device?IPOD_SVG:''}</span><span class="ch">&rsaquo;</span><span class="eq"><i></i><i></i><i></i></span>${seq?'<span class="grab">⋮⋮</span>':''}<span class="more" title="more">&#8943;</span></div></div>`;
}

/* ---------------- drawing ---------------- */
function draw(){
  drawUntil=performance.now()+150;
  closeMenu(); counts(); drawCols(); drawMid(); drawRight(); drawFoot(); paintPlaying();
  restoreScroll(); noteKeys();
  // any scroll events innerHTML caused land after this tick; setTimeout fires
  // in a background tab, requestAnimationFrame does not
  setTimeout(()=>{ restoreScroll(); noteKeys(); },0);
}

function drawFoot(){
  const inCol=active==='ipod'&&!!colPick, canSeq=inCol&&!filtered();
  // With a selection live, the strip stops advertising single-track keys and

  if(MARK.size){
    $('#keys').innerHTML=`<span class="selcount"><b>${MARK.size}</b> selected</span>
      <span><kbd>s</kbd> sync all</span><span><kbd>x</kbd> ${inCol?'take all out':'remove all'}</span>
      <span><kbd>c</kbd> add all to playlist</span><span><kbd>esc</kbd> clear</span>
      <span id="undoc" class="undoc"></span><span id="saved" style="margin-left:auto"></span>`;
    return;
  }
  $('#keys').innerHTML=`<span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>space</kbd> play</span>
    <span><kbd>s</kbd> sync</span><span><kbd>v</kbd> vinyl</span>
    <span><kbd>x</kbd> ${inCol?'take out':'remove'}</span>
    <span><kbd>c</kbd> collection</span><span><kbd>i</kbd> info</span>
    <span><kbd>.</kbd> menu</span><span><kbd>/</kbd> search</span>
    <span id="undoc" class="undoc"></span><span id="saved" style="margin-left:auto"></span>`;
