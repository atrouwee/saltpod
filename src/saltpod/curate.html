// LAW 3 IN WORDS, NOT JUST A DOT. The busy marker is a CSS pseudo-element,
// so to anyone who cannot see its colour the gear looked identical whether
// a job was running or not. The same fact now goes into the button's own
// name and aria-busy, from every place that sets the dot; nothing visible
// changes.
function gearBusy(on){
  const g=$('#gear'); if(!g)return;
  g.classList.toggle('busy',on);
  g.setAttribute('aria-busy',on?'true':'false');
  const label=on?'settings and data jobs — a job is running':'settings and data jobs';
  g.setAttribute('aria-label',label); g.title=label;
}
async function startJob(body){
  const r=await post('/api/action',body);
  if(!r.ok)return toast(r.error||'failed');
  if(r.job){job=r.job;gearBusy(true);pollJob();}else{await load();toast('done');}
}
async function pollJob(){
  if(!job)return;
  const r=await fetch('/api/job?id='+job).then(r=>r.json()).catch(()=>null);
  if(!r){setTimeout(pollJob,2000);return;}
  lastJob=r; paintJob(r);
  if(r.state==='running'){setTimeout(pollJob,1200);return;}
  job=null; gearBusy(false);
  await load(); toast(r.state==='done'?'finished':'job failed — see the log');
}

/* ---------------- THE TRACK PANEL ----------------

   The form, with the cover small and beside the identity rather than above
   it. Leading with a large square was the first draft; it was argued out on
   the grounds that a tended library has covers and a deficiency should not
   shape the UI -- and then argued back in, smaller, because the form is
   what you are here to fill in.

   Everything it edits goes to the FILE. There is no second store, so there
   is no second thing to save. What the device holds catches up on the next
   sync, and the sync panel shows that as an ordinary row.
*/
const TP = { key:null, path:null, data:null, edits:{}, busy:false };

function tpDirty(){ return Object.keys(TP.edits).length > 0; }

async function openTrack(t){
  // A KEY IS artist|title, SO AN UNTAGGED FILE CANNOT HAVE ONE -- it has
  // neither, and no state record either. The path is the only identity the
  // files this panel exists to fix actually have, so it is preferred
  // wherever the row carries it.
  TP.key = (t && t.key) || null;
  TP.path = (t && t.path) || null;
  TP.data = null; TP.edits = {};
  $('#tp').classList.add('on'); $('#spscrim').classList.add('on');
  $('#tpt').textContent = t ? (t.artist ? t.artist+' — '+t.title : (t.title||'Track')) : 'Track';
  $('#tpbody').innerHTML = '<p class="note">Reading the file…</p>';
  $('#tpbtn').innerHTML = ''; $('#tpnote').textContent = '';
  const q = TP.path ? 'path='+encodeURIComponent(TP.path)
                    : 'key='+encodeURIComponent(TP.key||'');
  const d = await fetch('/api/track?'+q).then(r=>r.json()).catch(()=>null);
  if(!d || !d.ok){
    $('#tpbody').innerHTML = '<div class="month">'+esc((d&&d.error)||'could not read it')+'</div>';
    tpFoot(); return;
  }
  TP.data = d; TP.path = d.path;
  // Name the panel from what was actually read, not from the row that
  // opened it: a file with no state record arrives with no artist or
  // title, and "Track" tells you nothing about which one you are looking at.
  const nm = (d.fields.artist && d.fields.title) ? d.fields.artist+' — '+d.fields.title
           : (d.artist && d.title) ? d.artist+' — '+d.title
           : (d.file && d.file.name) || 'Track';
  $('#tpt').textContent = nm;
  paintTrack();
}
function closeTrack(force){
  if(TP.busy) return;
  // NEVER A NATIVE confirm(). It blocks the renderer -- every timer, every
  // fetch, every event -- until someone clicks it, and a page driven from
  // anywhere but the mouse simply stops. It took the whole tab out once.
  // The product has its own centre prompt and this is what it is for.
  if(!force && tpDirty()){ askDropEdits(); return; }
  $('#tp').classList.remove('on');
  if(!$('#sp').classList.contains('on')) $('#spscrim').classList.remove('on');
  TP.edits = {};
}
function askDropEdits(){
  const n = Object.keys(TP.edits).length;
  dlgMode = '__dropedits__';
  $('#dlgt').textContent = 'Unsaved changes';
  $('#dlgp').innerHTML = esc(n===1?'One field has':n+' fields have')
    + ' been changed and not written to the file yet.';
  dlgin.style.display='none'; $('#dlgex').innerHTML=''; $('#dlgsec').hidden=true;
  $('#dlglist').innerHTML='';
  $('#dlgbtn').innerHTML='<button class="go gl-action" id="dlgok" data-move="discard-edits">Discard</button>';
  $('#dlgok').onclick=()=>{ closeDlg(); closeTrack(true); };
  dlg.classList.add('on');
}

const TP_FIELDS = [['title','Title'],['artist','Artist'],['album','Album'],
                   ['album_artist','Album artist'],['genre','Genre'],
                   ['year','Year'],['track','Track']];

function tpValue(f){
  return f in TP.edits ? TP.edits[f] : ((TP.data.fields||{})[f] || '');
}

function paintTrack(){
  const d = TP.data, f = d.file || {};
  const ro = !f.writable;
  let h = '<div class="tpid">'
    + '<div class="tpart" id="tpart" data-move="drop-a-cover" title="'+(ro?'':'drop an image, or click to choose one')+'">'
    + (d.art ? '<img src="'+d.art+'" alt="">' : '')
    + '<span class="ph">'+(d.art?'':'no cover')+'</span></div>'
    + '<div style="flex:1 1 auto;min-width:0">'
    + '<div class="fld'+('title' in TP.edits?' dirty':'')+'" style="padding-left:0">'
    + '<input class="v" data-f="title" placeholder="Title" value="'+esc(tpValue('title'))+'"'+(ro?' readonly':' data-move="edit"')+'></div>'
    + '<div class="fld'+('artist' in TP.edits?' dirty':'')+'" style="padding-left:0">'
    + '<input class="v" data-f="artist" placeholder="Artist" value="'+esc(tpValue('artist'))+'"'+(ro?' readonly':' data-move="edit"')+'></div>'
    + '</div></div>';

  // the filename's guess, only when it has something to add
  const g = d.guess;
  if(g && !ro && (!tpValue('artist') || !tpValue('title'))){
    h += '<div class="tpguess"><div class="src">the name on disk suggests</div>'
      + '<div class="pair"><em>artist</em>'+esc(g.artist)+'</div>'
      + '<div class="pair"><em>title</em>'+esc(g.title)+'</div>'
      + '<span class="act2" id="tpuse" data-move="use-this">Use this</span></div>';
  }

  h += '<div class="month">release</div>';
  for(const [k,label] of TP_FIELDS.slice(2)){
    h += '<div class="fld'+(k in TP.edits?' dirty':'')+(ro?' ro':'')+'"><span class="k">'+label+'</span>'
      + '<input class="v" data-f="'+k+'" value="'+esc(tpValue(k))+'"'+(ro?' readonly':' data-move="edit"')+'></div>';
  }

  h += '<div class="month">file</div>'
    + tpRow('Name', f.name || '—', true)
    + tpRow('Format', [f.codec, (f.ext||'').slice(1) !== f.codec ? (f.ext||'').slice(1) : '',
                       f.seconds && mmss(f.seconds)].filter(Boolean).join(' · ') || '—', true)
    + tpRow('Folder', f.folder || '—', true);
  if(d.device && d.device.on)
    h += tpRow('On the iPod', 'yes — the next sync brings it into line', true);
  if(ro)
    h += '<p class="note">'+esc(f.why||'not writable')+'</p>';

  $('#tpbody').innerHTML = h;
  wireTrack(ro);
  tpFoot();
}

function tpRow(label, value, ro){
  return '<div class="fld ro"><span class="k">'+esc(label)+'</span>'
    + '<span class="v" style="font-family:var(--mono);font-size:var(--fs-meta)">'
    + esc(value)+'</span></div>';
}

function wireTrack(ro){
  $('#tpbody').querySelectorAll('input.v').forEach(el=>{
    el.oninput = () => {
      const f = el.dataset.f, was = (TP.data.fields||{})[f] || '';
      if(el.value === was) delete TP.edits[f]; else TP.edits[f] = el.value;
      el.closest('.fld').classList.toggle('dirty', f in TP.edits);
      tpFoot();
    };
    // a field commits with the panel, never on blur: this writes a file
    el.onkeydown = e => {
      e.stopPropagation();
      if(e.key === 'Escape'){ closeTrack(); }
      if(e.key === 'Enter' && tpDirty() && !ro){ saveTrack(); }
    };
  });
  const u = $('#tpuse');
  if(u) u.onclick = () => {
    const g = TP.data.guess;
    if(!tpValue('artist')) TP.edits.artist = g.artist;
    if(!tpValue('title'))  TP.edits.title  = g.title;
    paintTrack();
  };
  const a = $('#tpart');
  if(a && !ro) wireArt(a);
}

function tpFoot(){
  const n = Object.keys(TP.edits).length;
  const ro = !(TP.data && TP.data.file && TP.data.file.writable);
  $('#tpnote').textContent = TP.busy ? 'writing the file…'
    : n ? (n===1 ? '1 field changed' : n+' fields changed')
    : (ro ? '' : 'nothing changed');
  // SAVE APPEARS WHEN THERE IS SOMETHING TO SAVE. Finder commits on blur;
  // that is wrong here, because the commit writes a file on your drive.
  $('#tpbtn').innerHTML = n && !ro
    ? '<button class="go gl-action" id="tpsave" data-move="save"'+(TP.busy?' disabled':'')+'>Save</button>'
    : '<button id="tpclose" data-move="close-locked">Close</button>';
  const sv = $('#tpsave'); if(sv) sv.onclick = saveTrack;
  const cl = $('#tpclose'); if(cl) cl.onclick = closeTrack;
}

async function saveTrack(){
  if(TP.busy || !tpDirty()) return;
  TP.busy = true; tpFoot();
  // only what you actually changed -- the server patches those fields and
  // leaves the rest of the tag exactly as the file has it
  const fields = {};
  for(const k of Object.keys(TP.edits)) fields[k] = TP.edits[k];
  const body = TP.path ? {path:TP.path, fields} : {key:TP.key, fields};
  const r = await post('/api/tags', body);
  TP.busy = false;
  if(!r.ok){ toast(r.error || 'not saved'); tpFoot(); return; }
  TP.edits = {};
  toast('written to the file');
  const q = TP.path ? 'path='+encodeURIComponent(TP.path)
                    : 'key='+encodeURIComponent(TP.key||'');
  TP.data = await fetch('/api/track?'+q).then(x=>x.json());
  paintTrack();
  await load(); refreshUndo();
}

/* Replacing the cover. It lands in saltpod's cache immediately, which is
   what the page reads; embedding it in the file needs the APIC half of the
   ID3 writer, and showing it on the DEVICE needs ArtworkDB -- both surveyed,
   neither built. The control says so rather than implying more. */
function wireArt(el){
  const pick = () => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*';
    i.onchange = () => i.files[0] && sendArt(i.files[0]);
    i.click();
  };
  el.onclick = pick;
  el.ondragover = e => { e.preventDefault(); el.classList.add('drop'); };
  el.ondragleave = () => el.classList.remove('drop');
  el.ondrop = e => {
    e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) sendArt(f);
  };
}
async function sendArt(file){
  if(!/^image\//.test(file.type)) return toast('that is not an image');
  const buf = await file.arrayBuffer();
  const r = await fetch('/api/art?key='+encodeURIComponent(TP.key||'')
                        +'&path='+encodeURIComponent(TP.path||''),
                        {method:'POST', body:buf}).then(x=>x.json()).catch(()=>null);
  if(!r || !r.ok) return toast((r&&r.error) || 'could not save the cover');
  toast('cover saved — ' + (r.note || 'saltpod only'));
  TP.data.art = r.art + '&t=' + Date.now();
  paintTrack();
  await load();
}

/* ---------------- THE SYNC PANEL ----------------

   The gap this closes: the tool has always been stage-then-commit -- decide
   freely, nothing touches the device until you say so -- but the confirm was
   all-or-nothing. You could see the seven removals and you could not drop
   one. That is the affordance the architecture already implied and did not
   have.

   Two ideas carry the whole thing:

   1. ONE LIST, TWICE. The rows you approve are the rows that report
      themselves. No swap to a spinner, no second screen -- the tick box
      becomes the status mark in the same 16px slot, so nothing moves at the
      moment your attention is on what is moving.

   2. EXECUTION ORDER, NOT IMPORTANCE. The list is in the order the sync
      actually runs, so progress goes top to bottom and never jumps. The
      counts that matter lead in the summary instead.

   Exclusions travel as identities -- track keys, playlist names -- never as
   indices: sync re-plans against the live device and the row at position 4
   may not be the same row by then.
*/
const SP = { plan:null, off:new Set(), state:'review', rows:[], log:[] };

const gb = b => b==null ? '?' : b>=1e9 ? (b/1e9).toFixed(1)+' GB' : Math.round(b/1e6)+' MB';

async function openSync(){
  SP.state='loading'; SP.off.clear(); SP.plan=null; SP.rows=[]; SP.log=[];
  $('#sp').classList.add('on'); $('#spscrim').classList.add('on');
  $('#spt').textContent='Review sync';
  $('#spbody').innerHTML='<p class="note">Reading the device…</p>';
  $('#spbtn').innerHTML=''; $('#spnote').textContent='';
  const p=await fetch('/api/plan').then(r=>r.json()).catch(()=>null);
  if(!p||!p.ok){
    SP.state='blocked';
    $('#spbody').innerHTML='<div class="month">'
      + esc((p&&(p.reason||p.error))||'could not read the iPod') + '</div>'
      + '<p class="note">Plug the iPod in and put it in Disk Mode: hold '
      + '<kbd>Select</kbd>+<kbd>Menu</kbd> to reset, then immediately '
      + '<kbd>Select</kbd>+<kbd>Play</kbd> until the screen says Disk Mode.</p>';
    paintSyncFoot(true); return;
  }
  SP.plan=p; SP.state='review'; buildSyncRows(); paintSync();
}
function closeSync(){
  if(SP.state==='running')return;            // never while the device is being written
  $('#sp').classList.remove('on'); $('#spscrim').classList.remove('on');
  SP.state='review';
}

/* The rows, in the order sync performs them. Infrastructure rows are in the
   list from the start: a dated backup is a promise the tool makes, and it
   should not first appear at the moment it is being kept. */
function buildSyncRows(){
  const p=SP.plan, R=[];
  R.push({sec:'first', n:0, ids:[]});
  R.push({id:'backup', infra:true, name:'back up the database'});
  // A ROW'S SECOND LINE is album · duration · what happens. The plan carries
  // the key and what happens; the album, the duration and the cover are
  // looked up on the track the page already holds (BYKEY), never worked out.
  // The plan says only whether a file is converted (`convert`), not from
  // what, so the line reads "→ ALAC" or "as is" rather than "FLAC → ALAC".
  const known=k=>BYKEY.get(k)||{};
  const line=(k,what)=>{ const t=known(k);
    return [t.album, t.seconds?mmss(t.seconds):'', what].filter(Boolean).join(' \u00b7 '); };
  if(p.adds.length){
    R.push({sec:'copy across', n:p.adds.length, ids:p.adds.map(a=>'a:'+a.key)});
    p.adds.forEach(a=>R.push({id:'a:'+a.key, key:a.key, name:a.artist+' \u2014 '+a.title,
      art:known(a.key).art||null,
      meta:line(a.key,(a.convert?'\u2192 ALAC':'as is')+' \u00b7 '+gb(a.bytes)), bytes:a.bytes||0}));
  }
  if(p.removes.length){
    R.push({sec:'take off the iPod', n:p.removes.length, ids:p.removes.map(r=>'r:'+r.key)});
    p.removes.forEach(r=>R.push({id:'r:'+r.key, key:r.key, name:r.artist+' \u2014 '+r.title,
      art:known(r.key).art||null, minus:true, meta:line(r.key,'marked to remove')}));
  }
  if((p.retags||[]).length){
    R.push({sec:'bring the metadata into line', n:p.retags.length,
            ids:p.retags.map(x=>'m:'+x.key)});
    p.retags.forEach(x=>R.push({id:'m:'+x.key, key:x.key,
      name:(x.artist?x.artist+' \u2014 ':'')+x.title, art:known(x.key).art||null, tilde:true,
      meta:line(x.key,(x.winner==='device' ? 'file \u2190 iPod' : 'iPod \u2190 file')
           + ' \u00b7 ' + Object.keys(x.fields).join(', '))}));
  }
  const pls=[...p.delete.map(c=>({c:c,what:'delete'})), ...p.new.map(c=>({c:c,what:'create'})),
             ...p.update.map(c=>({c:c,what:'update'}))];
  if(pls.length){
    R.push({sec:'playlists', n:pls.length, ids:pls.map(x=>'p:'+x.c)});
    pls.forEach(x=>{
      R.push({id:'p:'+x.c, name:x.c, art:null, minus:x.what==='delete', tilde:x.what==='update',
        meta:x.what==='delete'?'delete':x.what+' \u00b7 '+(((p.sizes||{})[x.c])||0)});
      // WHAT WILL BE IN IT. A count says a playlist is being written; it
      // does not say what it will contain, which is the thing you are
      // approving. These are children of the row above and are ticked with
      // it -- a track is in a playlist or it is not, and taking one out is
      // editing the collection, not editing this sync.
      ((p.members||{})[x.c]||[]).forEach(t=>R.push({
        child:'p:'+x.c, name:t.artist ? t.artist+' \u2014 '+t.title : t.title,
        conflict: t.off,
        meta: t.off ? 'also marked to come off \u00b7 left out'
            : t.on  ? 'on the iPod' : 'copied across'}));
    });
  }
  // SMART PLAYLISTS, refreshed from their rules after the playlists. The
  // rows, the summary line and the Sound Check line are the server's
  // (apply.smart_rows / smart_line / soundcheck_line), drawn as sent.
  const sm=p.smart||[];
  if(sm.length){
    R.push({sec:'smart playlists', n:sm.length, ids:sm.map(x=>'s:'+x.name)});
    sm.forEach(x=>R.push({id:'s:'+x.name, name:x.name, art:null, tilde:true,
      meta:'refresh \u00b7 '+x.now+' \u2192 '+x.would}));
  }
  if(p.smart_line||p.soundcheck_line){
    if(!sm.length) R.push({sec:'smart playlists', n:0, ids:[]});
    [p.smart_line,p.soundcheck_line].filter(Boolean).forEach(t=>R.push({info:t}));
  }
  R.push({edge:'committed from here'});
  R.push({id:'write',  infra:true, name:'write the database'});
  R.push({id:'verify', infra:true, name:'verify on the device'});
  R.push({id:'eject',  infra:true, name:'eject'});
  SP.rows=R;
}

const spIncluded = () => SP.rows.filter(r=>r.id&&!r.infra&&!r.child&&!SP.off.has(r.id));
function spCounts(){
  const inc=spIncluded();
  return {adds:inc.filter(r=>r.id[0]==='a').length,
          rems:inc.filter(r=>r.id[0]==='r').length,
          pls: inc.filter(r=>r.id[0]==='p').length,
          tags:inc.filter(r=>r.id[0]==='m').length,
          smart:inc.filter(r=>r.id[0]==='s').length,
          bytes:inc.reduce((a,r)=>a+(r.bytes||0),0)};
}

function paintSync(){
  const p=SP.plan; if(!p)return;
  const c=spCounts(), run=SP.state!=='review';
  const free=p.free_bytes, fits=free==null||c.bytes<=free;

  // THE SUMMARY LEADS WITH WHAT IS IRREVERSIBLE. Removals delete files from
  // the device; additions are undone by removing them again.
  const bits=[];
  if(c.rems) bits.push('<b>'+c.rems+'</b> off the iPod');
  if(c.adds) bits.push('<b>'+c.adds+'</b> copied across');
  if(c.pls)  bits.push('<b>'+c.pls+'</b> playlist'+(c.pls>1?'s':''));
  if(c.tags) bits.push('<b>'+c.tags+'</b> retagged');
  if(c.smart) bits.push('<b>'+c.smart+'</b> smart list'+(c.smart>1?'s':'')+' refreshed');
  const same=(p.unchanged||[]).length;
  let sum = bits.length ? bits.join(' \u00b7 ') : 'Nothing selected';
  if(!run){
    if(bits.length) sum += '. A dated backup is taken first, and tracks the collections '
      + 'do not mention are left alone.';
    if(same) sum += ' '+same+' playlist'+(same>1?'s':'')+' already match'
      +(same>1?'':'es')+' the device.';
    if(SP.off.size) sum += ' '+SP.off.size+' unticked.';
  }
  let h='<div class="fact">'+sum+'</div>';
  // THE "AFTER" GAUGE sits where it belongs in the order: after the changes,
  // before the commit boundary. Free space as a thin bar, the numbers from
  // /api/plan (free_bytes) and the ticked rows' sizes, as before.
  let gauge='';
  if(c.adds&&free!=null){
    const pct=Math.max(0,Math.min(100, 100*Math.min(c.bytes,free)/free));
    gauge='<div class="month">after</div>'
      +'<div class="gauge"><i class="'+(fits?'':'over')+'" style="width:'+(fits?pct:100)+'%"></i></div>'
      +'<div class="gstat"><b>'+gb(c.bytes)+'</b> of <b>'+gb(free)+'</b> free'
      +(fits?'':' \u2014 will not fit')+'</div>';
  }

  // The section toggle carries its ROW INDEX, not its ids: a key may hold any
  // character, so no separator is safe to pack a list into an attribute with.
  h += SP.rows.map((r,ri)=>{
    if(r.edge) return gauge+'<div class="month edge">'+esc(r.edge)+'</div>';
    if(r.info) return '<div class="fact">'+esc(r.info)+'</div>';
    if(r.sec){
      // The count follows the ticks. A header still reading 7 over five
      // ticked rows is the sort of small lie that makes you re-count.
      if(!r.ids.length) return '<div class="month">'+esc(r.sec)+'</div>';
      const kept=r.ids.filter(i=>!SP.off.has(i)).length;
      const allOn=kept===r.n;
      return '<div class="month">'+esc(r.sec)+' \u00b7 '+(allOn?r.n:kept+' of '+r.n)
        + (run?'':'<span class="all" data-sec="'+ri+'">'+(allOn?'none':'all')+'</span>')
        + '</div>';
    }
    // The state lives in the .cnt slot -- the slot that already holds a
    // count on every other row in the product. One slot, one meaning.
    if(r.child){
      const gone = SP.off.has(r.child) || r.conflict;
      return '<div class="col kid'+(gone?' out':'')+'">'
        + '<span class="nm">'+esc(r.name)+'</span>'
        + '<span class="cnt">'+esc(r.meta||'')+'</span>'
        + '<span class="more hold"></span></div>';
    }
    // THE INFRASTRUCTURE ROWS ARE STEPS: a dot per step, hollow until it is
    // done, and the step's state (doing, done, error, never reached) is the
    // same `state` the log parser writes on the row.
    if(r.infra) return '<div class="step'+(r.state?' '+r.state:'')+'" data-id="'+esc(r.id)+'">'
      + '<span class="dot"></span>'+esc(r.name)+'</div>';
    // A PLAN ROW: the mark, the art, the name over album \u00b7 duration \u00b7 what
    // happens. The mark is + or - (or ~ for a retag or an update) and, during
    // a run, the state in the same slot: \u2026 doing, \u2713 done, ! error, \u00b7 never
    // reached -- nothing moves at the moment your attention is on what is
    // moving. Only the rows you can actually click are checkboxes: every row
    // during a run is inert, so it claims no role rather than one that lies.
    const out=SP.off.has(r.id);
    const mark={doing:'\u2026', done:'\u2713', error:'!', todo:'\u00b7'}[r.state]
      || (r.minus ? '\u2013' : r.tilde ? '~' : '+');
    const label=String(r.name||'').replace(/<[^>]*>/g,'').trim();
    const role=run ? '' : ' role="checkbox" aria-checked="'+(!out)+'"'+(label?' aria-label="'+esc(label)+'"':'');
    const art=r.art ? '<img class="art" src="'+r.art+'" alt="" loading="lazy" draggable="false">' : '<span class="art"></span>';
    return '<div class="row'+(out?' out':'')+(run?' inert':'')+(r.state?' '+r.state:'')+'"'+role
      + ' data-id="'+esc(r.id)+'">'
      + '<span class="mark'+(r.minus?' minus':'')+'" aria-hidden="true">'+mark+'</span>'+art
      + '<span class="t"><span class="n">'+esc(r.name)+'</span>'
      + '<span class="s">'+(r.err?esc(r.err):esc(r.meta||''))+'</span></span></div>';
  }).join('');
  if(SP.log.length) h+='<div id="splog" class="log">'+esc(SP.log.slice(-8).join('\n'))+'</div>';
  $('#spbody').innerHTML=h;

  if(!run){
    $('#spbody').querySelectorAll('.row[data-id]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.id; SP.off.has(id)?SP.off.delete(id):SP.off.add(id); paintSync();});
    $('#spbody').querySelectorAll('[data-sec]').forEach(el=>el.onclick=e=>{
      e.stopPropagation();
      const ids=(SP.rows[+el.dataset.sec]||{}).ids||[], allOn=ids.every(i=>!SP.off.has(i));
      ids.forEach(i=>allOn?SP.off.add(i):SP.off.delete(i)); paintSync();});
  }
  paintSyncFoot(fits);
}

function paintSyncFoot(fits){
  const note=$('#spnote'), btn=$('#spbtn');
  const close=()=>{btn.innerHTML='<button id="spdone" data-move="blocked-close synced-close stopped-close">Close</button>';
    const d=$('#spdone'); if(d)d.onclick=closeSync;};
  if(SP.state==='blocked'){ note.textContent=''; close(); return; }
  const c=spCounts(), n=c.adds+c.rems+c.pls+(c.tags||0)+(c.smart||0);
  if(SP.state==='review'){
    // The button names the consequence rather than the verb. "Sync" tells you
    // nothing about the seven files it is about to delete.
    // The summary above already names every consequence and the rows list
    // them one by one. A button that repeats "Remove 7" is a third telling,
    // and the one place where the words should just be the commitment.
    // CANCEL AND CLOSE ARE DIFFERENT ACTS and the panel must not let them
    // blur. Clicking the scrim, pressing esc or the esc affordance all just
    // put the panel away and change nothing. Cancel throws the staged
    // changes away, so it is a named button that asks first -- and it sits
    // apart from Confirm rather than beside it.
    btn.innerHTML=(n?'<button id="spdrop" data-move="cancel">Cancel</button>':'')
      + '<button class="go gl-action" id="spgo" data-move="confirm"'+((!n||!fits)?' disabled':'')+'>'
      + (n ? 'Confirm' : 'Nothing to do') + '</button>';
    note.textContent = !fits ? 'not enough room'
      : n ? 'nothing has changed on the device yet' : '';
    const g=$('#spgo'); if(g)g.onclick=runSync;
    const dr=$('#spdrop'); if(dr)dr.onclick=askDiscard;
    return;
  }
  if(SP.state==='running'){ btn.innerHTML=''; note.textContent='leave the iPod plugged in'; return; }
  close();
}

/* Throwing the staged changes away. A centre prompt, because it is the one
   action in the panel that is not about the device at all -- it rewrites
   your decisions -- and because the panel's own foot is where Confirm
   lives. Two destructive-adjacent buttons in one strip is how people press
   the wrong one. */
function askDiscard(){
  const c = spCounts();
  const bits = [c.rems && (c.rems+' marked to come off'),
                c.adds && (c.adds+' marked to go on'),
                c.pls  && (c.pls +' playlist'+(c.pls>1?'s':''))].filter(Boolean);
  dlgMode = '__discard__';
  $('#dlgt').textContent = 'Discard the staged changes';
  $('#dlgp').innerHTML = 'This puts your decisions back so the next sync has '
    + 'nothing to do — ' + esc(bits.join(', ')) + '. Nothing on the iPod changes.'
    + '<br><br>Edits already written into your files are not touched.'
    + '<br><br><b style="color:var(--ink)">\u2318Z brings it back</b> as one step.';
  dlgin.style.display='none'; $('#dlgex').innerHTML=''; $('#dlgsec').hidden=true;
  $('#dlglist').innerHTML='';
  $('#dlgbtn').innerHTML='<button class="go gl-action" id="dlgok" data-move="discard">Discard</button>';
  $('#dlgok').onclick=doDiscard;
  dlg.classList.add('on');
}
async function doDiscard(){
  closeDlg();
  const r = await post('/api/discard', {});
  if(!r.ok) return toast(r.error || 'could not discard');
  toast((r.tracks||0)+' tracks, '+(r.playlists||0)+' playlists put back \u00b7 \u2318Z undoes it');
  await load(); refreshUndo();
  openSync();                      // re-plan in place; it should now be empty
}

/* Running. The server prints `@@ <id> <state>` beside its own prose; the page
   matches those ids to the rows it drew, so progress is reported BY the
   changes rather than about them. */
async function runSync(){
  SP.state='running'; SP.log=[];
  $('#spt').textContent='Syncing';
  paintSync();
  const ex={tracks:[],playlists:[],smart:[]};
  SP.off.forEach(id=>{ const v=id.slice(2);
    if(id[0]==='p')ex.playlists.push(v); else if(id[0]==='s')ex.smart.push(v); else ex.tracks.push(v); });
  const r=await post('/api/action',{action:'sync',exclude:ex});
  if(!r.ok||!r.job){ SP.state='error'; SP.log=[r.error||'could not start the sync'];
    $('#spt').textContent='Sync stopped'; paintSync(); return; }
  job=r.job; gearBusy(true);
  const id=r.job;
  const tick=async()=>{
    const j=await fetch('/api/job?id='+id).then(x=>x.json()).catch(()=>null);
    if(!j){setTimeout(tick,1500);return;}
    lastJob=j; readSyncLog(j);
    if(j.state==='running'){paintSync();setTimeout(tick,800);return;}
    job=null; gearBusy(false);
    SP.state = j.state==='done' ? 'done' : 'error';
    $('#spt').textContent = j.state==='done' ? 'Synced' : 'Sync stopped';
    // Anything still waiting when the run ends never happened. Say so rather
    // than leaving a row that looks like it is still going.
    SP.rows.forEach(r2=>{ if(r2.id&&!r2.state&&!SP.off.has(r2.id))
      r2.state = j.state==='done' ? 'done' : 'todo'; });
    paintSync();
    // `say` is the server's last word on the run -- after a failed check,
    // "the iPod is as it was" -- shown as sent, never composed here.
    $('#spnote').textContent = j.say || (j.state==='done'
      ? 'the iPod has been ejected — safe to unplug'
      : 'stopped before finishing — the pre-write backup is intact');
    if(j.say) toast(j.say);
    await load(); pollHealth();
  };
  tick();
}
function readSyncLog(j){
  // Each row's state is the job's (`steps`, complete -- debt D10); the page
  // no longer parses `@@` lines out of a 60-line window.
  const byId={}; SP.rows.forEach(r=>{ if(r.id)byId[r.id]=r; });
  for(const s of (j.steps||[])){
    const r=byId[s.id]; if(!r||s.state==='waiting')continue;
    r.state=s.state; if(s.error)r.err=s.error;
  }
  SP.log=(j.log||[]).filter(ln=>ln.trim()&&!ln.startsWith('## ')&&!ln.startsWith('@@ '));
}

/* ---------------- the three-dot menu ----------------
   One menu, two kinds. A track's lists what a keystroke or a drag would do,
   and "Add to playlist" swaps the menu for a picker of the collections, ticks
   for the ones it is in, a field to make a new one. A collection's carries
   rename, add-all-wanted and delete -- the confirms stay as panels. */
const menu=$('#menu');
let MENU=null;
// the flows' move each menu row makes (saltFlow reads data-move; nothing here acts on it)
const MOVE_OF={'m-info':'get-info get-info-untagged get-info-locked','m-vinyl':'want-vinyl','m-want':'flip buy dont-buy','m-imp':'import'};
function menuRow(label,key,tick,cls){
  const mv=MOVE_OF[cls];
  return `<div class="drow ${cls||''}"${mv?` data-move="${mv}"`:''}><span class="dn">${label}</span>${tick?'<span class="dc">&#10003;</span>':''}${key?`<span class="dk">${key}</span>`:''}</div>`;
}
// law 8's words, keyed by the server's decision verb: [not yet, already]
const DECISION_WORDS={remove:['Remove from iPod',"Don't remove"],
                      sync:['Sync to iPod',"Don't sync"], buy:['Buy',"Don't buy"]};
function openMenu(anchor,kind,payload){
  MENU={kind,payload,anchor};
  anchor.setAttribute('aria-expanded','true');
  // the filter popover is the one kind whose rows are radios, so it alone is
  // a menu by role; the track and collection menus' rows carry no role
  menu.classList.toggle('fpop',kind==='filter');
  menu.classList.toggle('kpop',kind==='keys');
  if(kind==='filter'){menu.setAttribute('role','menu');menu.setAttribute('aria-label','Show');}
  else{menu.removeAttribute('role');menu.removeAttribute('aria-label');}
  paintMenu();
  menu.classList.add('on');
  const a=anchor.getBoundingClientRect(), m=menu.getBoundingClientRect();
  let x=a.right-m.width, y=a.bottom+4;
  if(x<8)x=8; if(x+m.width>window.innerWidth-8)x=window.innerWidth-8-m.width;
  if(y+m.height>window.innerHeight-8)y=a.top-4-m.height;
  if(y<8)y=8;
  menu.style.left=x+'px'; menu.style.top=y+'px';
}
function closeMenu(){
  menu.classList.remove('on');
  // the anchor may already be gone -- draw() replaces the row it belonged
  // to before this runs -- and setAttribute on a detached node is a no-op
  if(MENU&&MENU.anchor)MENU.anchor.setAttribute('aria-expanded','false');
  MENU=null;
}
function paintMenu(){
  if(!MENU)return;
  const h=$('#menuh'), b=$('#menub');
  // THE FILTER POPOVER. One radio row per filter the list offers (FSHOWN,
  // decided in drawMid), the check in a fixed slot, and at the right the
  // count the SERVER sent: TOTALS for the lists it counts, the list's own
  // row count for All, nothing for the rest. No count is computed here --
  // the layer rule -- and no count is computed anywhere in the page.
  if(MENU.kind==='filter'){
    const cap=f=>f.charAt(0).toUpperCase()+f.slice(1);
    const count=f=>{ const v=f==='all'?MIDROWS:TOTALS[FILTER_TOTAL[f]]; return v==null?'':`<span class="dk">${v}</span>`; };
    h.innerHTML='Show';
    b.innerHTML=FSHOWN.map(f=>`<div class="drow frow" role="menuitemradio" tabindex="-1" aria-checked="${f===filter?'true':'false'}" data-f="${esc(f)}"><span class="fchk" aria-hidden="true">&#10003;</span><span class="dn">${esc(cap(f))}</span>${count(f)}</div>`).join('');
    b.querySelectorAll('[data-f]').forEach(r=>r.onclick=()=>{ const f=r.dataset.f; closeMenu(); captureScroll(); clearMark(); filter=f; sel=recallSel(); draw(); });
    return;
  }
  // EVERY KEY, by context: the footer's own table (KEYS) read out in full,
  // a section label per context and a cap-and-verb row per key. Nothing
  // here is clickable; Escape, or the footer's "?", closes it.
  if(MENU.kind==='keys'){
    h.innerHTML='Keys';
    b.innerHTML=KEY_GROUPS.map(([k,label])=>`<div class="month">${esc(label)}</div>`
      +KEYS[k].map(x=>`<div class="drow krow"><span class="kc">${kbdHTML(x[0])}</span><span class="dn">${esc(x[1])}</span></div>`).join('')).join('');
    return;
  }
  if(MENU.kind==='col'){
    const c=MENU.payload;
    const nShort=ALL.filter(t=>t.tier==='sync'&&!t.collections.includes(c)).length;
    h.innerHTML=esc(c);
    b.innerHTML=menuRow('Rename…','',false,'m-rename')+menuRow(`Add everything marked sync${nShort?' · '+nShort:''}`,'',false,'m-addshort')
      +'<div class="sep"></div>'+menuRow('Delete…','',false,'m-delete');
    b.querySelector('.m-rename').onclick=()=>{closeMenu();colPick=c;openDlg('__rename__');};
    b.querySelector('.m-delete').onclick=()=>{closeMenu();colPick=c;openDlg('__delete__');};
    b.querySelector('.m-addshort').onclick=async()=>{closeMenu();
      const ks=ALL.filter(t=>t.tier==='sync'&&!t.collections.includes(c)).map(t=>t.key);
      if(!ks.length)return toast('nothing new to add');
      await decide({collection:c,mode:'add'},ks); toast(`added ${ks.length} to ${c}`);};
    return;
  }
  // A VINYL RELEASE on the buy-a-record list. Flagging is per track, the
  // list groups by release, so unwanting works the way the list reads.
  if(MENU.kind==='vrel'){
    const f=MENU.payload; if(!f){closeMenu();return;}
    const n=f.tracks.length;
    h.innerHTML=esc(f.name);
    b.innerHTML=menuRow('Unwant vinyl',`${n} track${n>1?'s':''}`,false,'m-vdrop');
    b.querySelector('.m-vdrop').onclick=async()=>{closeMenu();
      await decide({vinyl:false}, f.tracks.map(t=>t.key));
      toast(`${esc(f.name)} off the vinyl list`);};
    return;
  }

  // AN ALBUM. It is not a container this tool owns: the Classic builds its
  // Albums menu from the tracks' tags, so putting one on the device means
  // moving its tracks and nothing else -- no playlist is made, or the record
  // would show up twice in two different menus.
  if(MENU.kind==='album'){
    const a=MENU.payload; if(!a){closeMenu();return;}
    const onPod=a.onPod, n=a.tracks.length;
    h.innerHTML=esc(a.album||'—')+' · '+n;
    b.innerHTML = (onPod<n ? menuRow('Put the album on the iPod',`${n-onPod} track${n-onPod>1?'s':''}`,false,'m-albadd') : '')
      + (onPod ? menuRow('Delete the album from the iPod',`${onPod} track${onPod>1?'s':''}`,false,'m-albdel') : '')
      + '<div class="sep"></div>' + menuRow('Add all to playlist &rsaquo;','',false,'m-albpl');
    const ad=b.querySelector('.m-albadd'); if(ad)ad.onclick=()=>{closeMenu();albumToIpod(a);};
    const dl=b.querySelector('.m-albdel'); if(dl)dl.onclick=()=>{closeMenu();albumOffIpod(a);};
    b.querySelector('.m-albpl').onclick=()=>{MENU.kind='albpick';paintMenu();};
    return;
  }
  if(MENU.kind==='albpick'){
    const a=MENU.payload; if(!a){closeMenu();return;}
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add all to playlist`;
    h.querySelector('.back').onclick=()=>{MENU.kind='album';paintMenu();};
    const cols=[...new Set([...COLS,...PENDING])].sort((x,y)=>x.localeCompare(y));
    b.innerHTML=cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}"><span class="dn">${esc(c)}</span></div>`).join('')
      :'<p class="note">No collections yet.</p>';
    b.querySelectorAll('[data-pc]').forEach(x=>x.onclick=async()=>{const c=x.dataset.pc;closeMenu();
      await decide({collection:c,mode:'add'},a.tracks.map(t=>t.key));
      toast(`${a.tracks.length} into ${c}`);});
    return;
  }
  // a folder on the drive
  if(MENU.kind==='t7f'){
    const f=MENU.payload; if(!f){closeMenu();return;}
    h.innerHTML=esc(f.name)+' · '+f.n;
    b.innerHTML=menuRow('Make a collection','same order',false,'m-make')
      +menuRow('Add all to playlist &rsaquo;','',false,'m-pour');
    b.querySelector('.m-make').onclick=()=>{closeMenu();pourFolder(f.name,null);};
    b.querySelector('.m-pour').onclick=()=>{MENU.kind='t7pick';paintMenu();};
    return;
  }
  if(MENU.kind==='t7pick'){
    const f=MENU.payload; if(!f){closeMenu();return;}
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add all to playlist`;
    h.querySelector('.back').onclick=()=>{MENU.kind='t7f';paintMenu();};
    const cols=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
    b.innerHTML=cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}"><span class="dn">${esc(c)}</span></div>`).join('')
      :'<p class="note">No collections yet.</p>';
    b.querySelectorAll('[data-pc]').forEach(x=>x.onclick=()=>{const c=x.dataset.pc;closeMenu();pourFolder(f.name,c);});
    return;
  }
  // an Apple Music playlist: everything the drag does, by clicking
  if(MENU.kind==='ampl'){
    const p=MENU.payload; if(!p){closeMenu();return;}
    h.innerHTML=esc(p.name)+' · '+p.tracks;
    b.innerHTML=menuRow('Make a collection','same order',false,'m-make')
      +menuRow('Add all to playlist &rsaquo;','',false,'m-pour')
      +'<div class="sep"></div>'
      +(p.imported?`<div class="drow done"><span class="dn">Imported for curation</span></div>`
                  :menuRow('Import for curation','known, not on the iPod',false,'m-imp'));
    b.querySelector('.m-make').onclick=()=>{closeMenu();pourPlaylist(p.name,null);};
    b.querySelector('.m-pour').onclick=()=>{MENU.kind='amplpick';paintMenu();};
    const mi=b.querySelector('.m-imp'); if(mi)mi.onclick=()=>{closeMenu();startJob({action:'export',names:[p.name]});};
    return;
  }
  if(MENU.kind==='amplpick'){
    const p=MENU.payload; if(!p){closeMenu();return;}
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add all to playlist`;
    h.querySelector('.back').onclick=()=>{MENU.kind='ampl';paintMenu();};
    const cols=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
    b.innerHTML=cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}"><span class="dn">${esc(c)}</span></div>`).join('')
      :'<p class="note">No collections yet.</p>';
    b.querySelectorAll('[data-pc]').forEach(x=>x.onclick=()=>{const c=x.dataset.pc;closeMenu();pourPlaylist(p.name,c);});
    return;
  }
  const t=MENU.payload; if(!t){closeMenu();return;}
  if(MENU.kind==='pick'){
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add to playlist`;
    h.querySelector('.back').onclick=()=>{MENU.kind='track';paintMenu();};
    const cols=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
    b.innerHTML=(cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}" data-move="add-from-the-menu"><span class="dn">${esc(c)}</span>${t.collections.includes(c)?'<span class="dc">&#10003;</span>':''}</div>`).join(''):'')
      +'<div class="sep"></div>'+`<input id="menunew" class="gl-field" placeholder="new playlist…">`;
    b.querySelectorAll('[data-pc]').forEach(x=>x.onclick=async()=>{
      const c=x.dataset.pc, sel2=(MARK.size>1&&MARK.has(t.key))?markedKeys():[t.key];
      if(sel2.length>1){ const fresh=sel2.filter(k=>!((BYKEY.get(k)||{}).collections||[]).includes(c));
        closeMenu();
        if(!fresh.length)return toast(`all ${sel2.length} already in ${c}`);
        await decide({collection:c,mode:'add'},fresh);
        return toast(`${fresh.length} added to ${c}`); }
      const had=t.collections.includes(c);
      await decide({collection:c},[t.key]); toast(had?`out of ${c}`:`added to ${c}`);
      const nt=BYKEY.get(t.key); if(nt&&MENU){MENU.payload=nt;paintMenu();} else closeMenu();   // draw() may have closed it
    });
    const inp=b.querySelector('#menunew');
    inp.onkeydown=async e=>{e.stopPropagation();
      if(e.key==='Escape'){closeMenu();return;}
      if(e.key==='Enter'){const v=inp.value.trim(); if(!v)return;
        if(!COLS.includes(v))PENDING.add(v);
        const sel2=(MARK.size>1&&MARK.has(t.key))?markedKeys():[t.key];
        closeMenu(); await decide({collection:v,mode:'add'},sel2);
        toast(`${sel2.length>1?sel2.length+' added':'added'} to ${v}`);}};
    setTimeout(()=>inp.focus({preventScroll:true}),0);
    return;
  }
  // a track -- or the whole selection, when the dots were clicked inside one
  const many = MARK.size>1 && MARK.has(t.key), N = many?MARK.size:1;
  h.innerHTML = many ? `<b>${N}</b> tracks selected` : esc(t.artist+' — '+t.title);
  const inCol=active==='ipod'&&!!colPick;
  // Inside a collection, x takes the track out of it; X takes it off the iPod
  // altogether -- out of every playlist, gone from the device on the next
  // sync. That is what "delete from library" means when the library is the
  // iPod. For a track not on the device, the same choice is Never sync this.
  //
  // EVERY OPTION HERE UNDOES ITSELF. `undecided` is the null answer and it
  // has to exist in the model -- 1,004 of 1,211 tracks are unjudged, not
  // rejected, and two states would have to call them one or the other. But
  // it was never something to CHOOSE. It is where you land when you press
  // the same button again, the way a strike-through comes off and a folded
  // pane unfolds with the control that folded it. So there is no third row:
  // each option flips its own label. "Want vinyl" becomes "Unwant vinyl".
  //
  // The flipped label is the whole state indicator, so these carry no tick
  // -- "Unwant vinyl" already tells you it is wanted, and a tick beside it
  // would be saying the same thing twice in the opposite direction.
  //
  // Three pairs, one grammar: Buy / Don't buy, Sync to iPod / Don't sync,
  // Want vinyl / Unwant vinyl. Remove keeps its own pair because "don't
  // sync" and "remove" are not the same outcome: sync leaves a track it was
  // never told about exactly where it is, so taking something OFF the
  // device needs its own word.
  // WHICH decision row, whether it is already made, and the tier a click
  // sets are the SERVER's answer (curate.decision_of, debt D2): the row's
  // own `decision` for one track, /api/decision for a selection, asked once
  // per menu and painted when it lands. Nothing here combines rows.
  let dec = many ? MENU.dec : t.decision;
  if(many && MENU.dec===undefined){
    MENU.dec=null; const was=MENU;
    fetch('/api/decision?'+markedKeys().map(k=>'key='+encodeURIComponent(k)).join('&'))
      .then(r=>r.json()).then(d=>{ if(MENU===was){ MENU.dec=(d&&d.ok)?d:null; if(d&&d.ok)paintMenu(); } })
      .catch(()=>{});
  }
  const vinylOn = many ? markedKeys().every(k=>(BYKEY.get(k)||{}).vinyl) : !!t.vinyl;
  // OWNING THE RECORD ENDS THE QUESTION. There is nothing to want and
  // nothing to unwant, so the row stops being a control and becomes what it
  // now is -- a fact. It keeps its slot so the menu does not resize under
  // the cursor, and it dims so you can see at a glance it will not respond.
  const lpOwned = many ? markedKeys().every(k=>{const r=BYKEY.get(k); return r&&owned(r);})
                       : !!owned(t);

  // ONE DECISION ROW, and which one depends on where the track actually is.
  // You cannot sync a track that is already on the device and you cannot
  // remove one that was never there -- offering both is offering a no-op,
  // and "Don't sync" on a track nobody has synced is a control for undoing
  // something that has not happened.
  //
  //   on the iPod        Remove from iPod  /  Don't remove     verb remove
  //   owned, not on it   Sync to iPod      /  Don't sync       verb sync
  //   not owned          Buy               /  Don't buy        verb buy
  //
  // Verb / don't-verb, and the undo drops the object because the row it is
  // undoing already said it: "Sync to iPod" becomes "Don't sync". The words
  // are this table's; which row and which way round is `dec`.
  const remove = !!dec && dec.verb==='remove';

  const yesLabel = dec ? DECISION_WORDS[dec.verb][dec.on?1:0] : '\u2026';

  // The digital half of the same idea: once a file exists on your own drive
  // there is nothing to buy, and the row that would have said Buy says what
  // is true instead.
  const digitalOnly = !!dec && dec.digital_only;
  b.innerHTML=menuRow(yesLabel,yesKey,false,yesCls)
    +(digitalOnly?menuRow('Owned digitally','',false,'inert'):'')
    +'<div class="sep"></div>'
    +menuRow(many?'Add all to playlist &rsaquo;':'Add to playlist &rsaquo;','c',false,'m-add')
    +(inCol?menuRow((many?`Take all ${N} out of `:'Take out of ')+esc(colPick),'',false,'m-out'):'')
    // the four moves, only where the full order is on screen and for the
    // one row under the cursor: what J and K do, plus the two ends
    +(!many&&canNudge()?'<div class="sep"></div>'
        +menuRow('Move up','K',false,'m-up')+menuRow('Move down','J',false,'m-down')
        +menuRow('Move to top','',false,'m-top')+menuRow('Move to bottom','',false,'m-bottom'):'')
    +'<div class="sep"></div>'
    +(lpOwned ? menuRow('Owned on vinyl','',false,'inert')
              : menuRow(vinylOn?'Unwant vinyl':'Want vinyl','v',false,'m-vinyl'))
    +(many?'':menuRow('Play','space',false,'m-play'))
    +(many?'':menuRow('Get info','i',false,'m-info'));
  const on=(cls,fn)=>{const x=b.querySelector('.'+cls); if(x)x.onclick=fn;};
  on('m-add',()=>{MENU.kind='pick';paintMenu();});
  const KS = many ? markedKeys() : [t.key];

  on('m-up',moveTo(-1)); on('m-down',moveTo(+1)); on('m-top',moveTo('top')); on('m-bottom',moveTo('bottom'));
  on('m-play',()=>{closeMenu();play();});
  on('m-info',()=>{closeMenu();openTrack(t);});

// Off the iPod: skipped, which sync
// reads as "take this track off the device". Nothing happens on the device
// until the next sync, and the row says so by being struck through.
// Taking a track off the device no longer strips it from the playlists it
// belongs to. It used to have to: plan() would see it in a collection, not
// on the device, and add it straight back. `remove` is authoritative in
// plan() now, so the membership survives -- and setting it back to sync puts
// the track exactly where it was, which it never could before.
async function deleteFromIpod(t,keys){
  // A one-off decision about what is on the device right now. Nothing here
  // marks a track as never-sync -- that standing rule does not exist.
  const all = keys && keys.length ? keys : [t.key];
  const ks = all.filter(k=>(BYKEY.get(k)||{}).device);
  if(!ks.length){toast('not on the iPod');return;}
  await decide({tier:'remove'},ks);
  if(ks.length>1){
    const held=ks.filter(k=>((BYKEY.get(k)||{}).collections||[]).length).length;
    toast(`${ks.length} off the iPod on the next sync`
          + (held?` \u00b7 ${held} still in playlists`:'')
          + (all.length>ks.length?` \u00b7 ${all.length-ks.length} were not on it`:''));
    return;
  }
  const inCols=((BYKEY.get(ks[0])||{}).collections||[]).length;
  toast('off the iPod on the next sync'
        + (inCols?` \u00b7 still in ${inCols} playlist${inCols>1?'s':''}`:''));
}

// Make a collection out of an Apple Music playlist, in its order. Tracks with
// no record yet get one; tracks you do not own yet come along anyway and sync
// leaves them until there is a file.
// A whole Apple Music playlist onto the iPod. Not a copy -- a declaration:
// every track gets a record if it has none and joins the collection in the
// playlist's own order, AFTER whatever is already there (new members append,
// never re-sort). Sync then writes what has a file and names the rest. With
// most of the library rented, most of a fresh playlist lands in Buy -- which
// is the point. `into` null makes a collection of the playlist's own name.
async function pourPlaylist(name, into){
  const target=into||name;
  toast('reading '+name+'…');
  const r = (PEEK&&PEEK.name===name) ? PEEK
    : await fetch('/api/peek?name='+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  if(!r||r.error||!r.tracks||!r.tracks.length){toast('could not read '+name);return;}
  const have=new Set(ORDER[target]||[]), seen=new Set(), rows=[];
  for(const t of r.tracks){ if(t.key&&!seen.has(t.key)&&!have.has(t.key)){seen.add(t.key);rows.push(t);} }
  if(!rows.length){toast(`everything in ${name} is already in ${target}`);return;}
  const keys=rows.map(t=>t.key);
  if(!COLS.includes(target))PENDING.add(target);
  const res=await post('/api/decide',{keys, adopt:rows.map(t=>({key:t.key,artist:t.artist,title:t.title})),
                                      collection:target, mode:'add'});
  if(!res.ok){toast('NOT SAVED — check the terminal');return;}
  await post('/api/decide',{reorder:{collection:target, keys:[...(ORDER[target]||[]), ...keys]}});
  closeDlg(); leaveNew(); activate('ipod'); colPick=target; devPick=null; sel=0;
  await load();
  saved();
  const waiting=keys.filter(k=>!(BYKEY.get(k)||{}).local).length;
  toast(`${keys.length} into ${target}${into?'':' — new'}${waiting?` · ${waiting} not owned yet`:''}`);
}
// AN ALBUM ONTO THE IPOD. The tracks are marked `sync` and nothing else
// happens: sync copies a synced track that belongs to no collection, and the
// device assembles the album itself out of the tags. Making a playlist named
// after it would put the same record in two menus.
async function albumToIpod(a){
  const ks=a.tracks.filter(t=>!t.device).map(t=>t.key);
  if(!ks.length){toast('all of it is already on the iPod');return;}
  const newborn=a.tracks.filter(t=>!BYKEY.has(t.key)&&ks.includes(t.key))
    .map(t=>({key:t.key,artist:t.artist,title:t.title}));
  const r=await post('/api/decide',{keys:ks,...(newborn.length?{adopt:newborn}:{}),tier:'sync'});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  await load(); saved();
  const waiting=ks.filter(k=>!(BYKEY.get(k)||{}).local).length;
  toast(`${ks.length} track${ks.length>1?'s':''} queued for the iPod${waiting?` · ${waiting} not owned yet`:''}`);
}
// AND OFF IT. `remove` is what sync reads as "take this off the device", the
// same verdict a single track gets; an album is just all of them at once.
async function albumOffIpod(a){
  const ks=a.tracks.filter(t=>t.device).map(t=>t.key);
  if(!ks.length){toast('none of it is on the iPod');return;}
  const r=await post('/api/decide',{keys:ks,tier:'remove'});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  await load(); saved();
  toast(`${ks.length} track${ks.length>1?'s':''} off the iPod on the next sync`);
}

function paintHealth(){
  const el=$('#hstrip'), h=HEALTH; if(!el)return;
  if(!h){el.innerHTML='';return;}
  // the one-line summary is the server's (health.headline, debt D12)
  el.title = h.headline ? h.headline.text : '';
  const dot=(cls,label,word)=>`<i class="${cls}" title="${esc(label)}${word?' — '+esc(word):''}">${esc(label)}${word?` <span class="w">${esc(word)}</span>`:''}</i>`;
  const g=[];
  const ip={ready:['ok','iPod',''],waking:['warn','iPod','waking'],
            ejected:['off','iPod','ejected'+(h.ejected_at?' '+h.ejected_at:'')],absent:['off','iPod','']}[h.ipod]||['off','iPod',''];
  g.push(dot(...ip));
  // The gauge is a fact ABOUT THE IPOD, so it sits with it rather than
  // drifting between devices. One slot, one subject.
  if(h.free!=null&&h.size!=null){
    const used=1-h.free/h.size, gb=b=>(b/1e9).toFixed(0);
    g.push(`<i class="cap" title="${gb(h.free)} GB free of ${gb(h.size)} GB"><b style="width:${Math.max(2,Math.round(used*100))}%"></b></i>`);
    g.push(`<i class="capn">${gb(h.free)} GB free</i>`);
  }
  const mu={ok:['ok','Music',''],closed:['off','Music','closed'],wedged:['warn','Music','not answering']}[h.music]||['off','Music',''];
  g.push(dot(...mu));
  // STATUS BELONGS TO THE VOLUME, NOT THE SOURCE. Several sources can sit
  // on one drive -- two folders on the same disk are two sources and one
  // thing that gets unplugged -- and the first version showed that drive
  // twice. The server deduplicates and says which can go away at all; the
  // boot volume gets no slot, because a light that is always on says
  // nothing. This strip is for what is OUTSIDE the application.
  (h.volumes||[]).filter(v=>v.removable).forEach(v=>{
    const d=dot(v.online?'ok':'off',v.name,v.online?'':'offline');
    g.push(v.sources>1 ? d.replace('title="',`title="${v.sources} sources — `) : d);
  });
  if(h.tools&&!(h.tools.ffmpeg&&h.tools.ffprobe))g.push(dot('warn','ffmpeg','missing'));
  if(h.config)g.push(dot('warn','config','missing'));
  el.innerHTML=g.join('');
}
// PRE-SYNC ON RECONNECT. The page's idea of what the iPod holds is fetched
// once, at load. Plug the device back in after a sync done elsewhere -- or
// after our own sync ejected it -- and every count on screen is describing a
// device that has since changed. So the moment health flips TO ready from
// anything else, re-read the device and recompute, before you are offered a
// Sync button whose number you would otherwise have to distrust.
let lastPod=null, presyncing=false;
async function preSync(){
  if(presyncing)return; presyncing=true;
  try{
    toast('asking the iPod what it holds…');
    await load();                       // /api/device is a live read
    const p=await fetch('/api/plan').then(r=>r.json()).catch(()=>null);
    if(p&&p.ok){
      const n=(p.adds||[]).length+(p.removes||[]).length
             +(p.new||[]).length+(p.update||[]).length+(p.delete||[]).length;
      toast(n?`iPod read — ${n} change${n>1?'s':''} pending`:'iPod read — nothing to sync');
    }
  }catch(e){ toast('could not read the iPod'); }
  finally{ presyncing=false; }
}
async function pollHealth(){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),3000);
    HEALTH=await fetch('/api/health',{signal:c.signal}).then(r=>r.json());
    clearTimeout(t);
  }catch(e){ HEALTH={ipod:'absent',music:'closed',sources:[],tools:{ffmpeg:true,ffprobe:true}}; }
  paintHealth();
  podChanged(HEALTH.ipod);
}
// THE BLOCKED PANEL WAITS FOR THE IPOD, it does not ask you to Close and Sync
// again. When the poll sees the device arrive and Review sync is up showing
// "plug it in", the panel re-plans itself in place; otherwise the page does
// the ordinary pre-sync read.
function podChanged(pod){
  const arrived = pod==='ready' && lastPod!==null && lastPod!=='ready';
  lastPod=pod;
  if(!arrived) return;
  if(SP.state==='blocked' && $('#sp').classList.contains('on')){ load(); openSync(); return; }
  preSync();
}

// LIVE UPDATES from the server, over SSE. The page no longer has to guess that
// something moved underneath it -- the thing that moved says so.
//
//   data   -> re-fetch and redraw in place. Deliberately NOT a refresh: a
//             refresh during curation loses your scroll, your open sheet and
//             your selected collection, which is worse than a stale count.
//   reload -> curate.html itself changed, so nothing but a real reload will do.
//
// EventSource reconnects on its own, so a server restart heals without a
// keystroke; `retry: 2000` on the stream sets how fast.
let ES=null;
let BOOT=null;
function liveConnect(){
  try{ ES=new EventSource('/api/events'); }catch(e){ return; }
  ES.onmessage=async ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    // a new server (it restarts itself when its code changes) means new answers: take the page that goes with them
    if(m.type==='hello'){ if(BOOT&&m.boot!==BOOT){ toast('saltpod updated — reloading'); setTimeout(()=>location.reload(),150); } BOOT=m.boot; return; }
    if(m.type==='reload'){ toast('page changed — reloading'); setTimeout(()=>location.reload(),150); return; }
    // `rev` (D11): an event this page's data already includes -- its own
    // decision, answered before the event arrived -- is not news
    if(m.type==='data'){ if(m.rev&&m.rev<=REVSEEN)return;
      await load(); toast(m.why?`updated — ${m.why}`:'updated'); return; }
    if(m.type==='job'&&m.state&&m.state!=='running') toast(`${m.name} — ${m.state}`);
  };
  ES.onerror=()=>{};                     // EventSource retries by itself
}
liveConnect();
load().then(refreshUndo);   // the server keeps its undo stack across reloads; the footer should say so
</script></body></html>
