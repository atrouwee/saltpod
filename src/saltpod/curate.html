<!doctype html><html><head><meta charset="utf-8">
<title>saltpod</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* One file, no build step, nothing fetched from anywhere.

   One workspace, never a set of tabs: collections on the left, the library in
   the middle, buy and vinyl on the right, and a track moves between them by
   being dragged. The three are always there because the whole job is moving a
   record from "I heard it" to "it is on the iPod", and that is a gesture, not
   a navigation.

   The tokens are PlayPi's (the house style for anything that plays music
   here): a dark ground, soft-white ink, a seam the lists slide under, and one
   orange that appears exactly once -- on the row that is playing. Words are
   set in the face; the machine's own labels (positions, tags, keys) in the
   mono. The selection blue is the iPod's own. */
:root {
  --ground: #141d29;
  --ink:    #fffffc;
  --seam:   #070c13;
  --orange: #f75c03;
  --dim:    rgba(255,255,252,.55);
  --faint:  rgba(255,255,252,.22);
  --panel:  rgba(255,255,252,.05);
  --raised: rgba(255,255,252,.09);
  /* The system face and mono (DESIGN-GLASS.md 3.1 item 1): SF Pro and SF
     Mono on Apple hardware, the platform's own elsewhere. Plex Mono was
     named here for years and never loaded, so the mono was already SF Mono. */
  --mono:   ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --face:   -apple-system, system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
  /* the selection blue, read off a photograph of the device: bright at the top,
     deeper below. It marks where you ARE; the orange marks what you HEAR, and
     the two never mean the same thing. Drop targets borrow the blue, because a
     drop is also a "here", never a "hear". */
  --sel-hi: #6aa9f4;
  --sel-lo: #1450b8;
  --hbtn:  32px; /* the header's controls: search's height, Sync's height, the gear's side */
  --mh-h:  58px; /* the header bar; the 32px controls sit centred with 13px above and below */
  --strip-h: 46px;   /* a pane's title strip; the list scrolls under it (the menu and the dialog shorten it locally) */
  --pill-clear: 56px; /* the room a scroller leaves under its floating count pill */
  --thumb: 24px;      /* an album thumbnail in a dense side-pane row */
  --mark-w: 18px;     /* the + / - column before a plan row's art in the sync panel */
  --bar-clear: 90px;  /* the room a panel's scroller leaves under its floating action bar */
  --log-wash: color-mix(in srgb, var(--seam) 35%, transparent);  /* the dark wash under a mono log */
  --fpop-w: 220px;   /* the filter popover under the funnel */
  --ic-bar: 16px;    /* an icon in a bar control: the search field's magnifier */
  --lw: 250px;   /* the two left panes are one width: they do the same job */
  --sw: 250px;   /* the source pane: Apple Music or the drive, one at a time */
  --rw:   320px;

  /* ON THE SELECTION. The blue is the only ground in the product that needs
     its own foreground pair, and it was written out 21 times. */
  --on-sel:     var(--ink);
  --on-sel-dim: rgba(255,255,252,.75);
  --on-sel-line:rgba(255,255,252,.45);
  --on-sel-hi:  rgba(255,255,252,.16);

  /* SHADOWS, WASHES AND SCRIMS. Written once here, used by name below. */
  --lift:         rgba(255,255,252,.13);  /* a focused field */
  --shadow-float: 0 14px 28px rgba(0,0,0,.45);   /* menus */
  --shadow-panel-l: 14px 0 28px rgba(0,0,0,.35); /* a sheet from the left */
  --shadow-panel-r: -14px 0 28px rgba(0,0,0,.35);/* a sheet from the right */
  --shadow-sheet: -18px 0 46px rgba(7,12,19,.5); /* the slide-in panels */
  --scrim-deep:   rgba(7,12,19,.72);  /* behind a dialog */
  --scrim:        rgba(7,12,19,.55);  /* behind a panel */
  --drop-fill:    color-mix(in srgb, var(--sel-hi) 12%, transparent);
  --drop-wash:    color-mix(in srgb, var(--sel-hi) 7%, transparent);
  --sel-top:      #2f6fd0;
  --hover-glass: color-mix(in srgb, var(--ink) 10%, transparent); /* a hovered row on glass: the material, not the retired blue */
  --ls-tight:     -.005em;  /* a track name */

  /* RADIUS LADDER. Not one radius: a small box wants a small corner, and
     the ratio is roughly a sixth of the box. Four steps, each with a size
     band, instead of the nine values that grew here one at a time. */
  --r-xs:   4px;   /* <=28px: thumbnails, mode marks */
  --r-sm:   8px;   /* nested rows, menu rows, wells */
  --r-md:  10px;   /* rows, cards, containers, the primary button */
  --r-pill: 99px;  /* pills, bars, dots -- anything whose height is its radius */

  /* TRACKING. Five jobs, not ten values. Uppercase mono needs air and the
     amount depends on what the label is FOR; lowercase mono and display
     face need almost none. */
  --ls-label: .18em;  /* uppercase section and pane labels */
  --ls-ctrl:  .1em;   /* uppercase tags, buttons, tabs, shortcuts */
  --ls-stat:  .06em;  /* uppercase stat lines */
  --ls-mono:  .02em;  /* lowercase mono */
  --ls-face:  .01em;  /* the wordmark */

  /* TYPE. Each size names the job it does. 13 and 13.5 stay apart: one is
     prose, one is a list row, and they sit in different containers. */
  --fs-tag:   9px;
  --fs-label: 9.5px;
  --fs-meta: 10.5px;  /* counts, subtitles, logs */
  --fs-ctrl:  11px;   /* buttons, keys */
  --fs-field: 12px;   /* inputs */
  --fs-text:  13px;   /* prose */
  --fs-row: 13.5px;   /* list rows */
  --fs-name:  14px;   /* a track name */
  --fs-base:  15px;   /* the page's own base */
  --fs-mark:  18px;   /* the wordmark */
  --fs-glyph: 19px;   /* the gear */
}
/* THE GLASS IDENTITY. saltglass (vendored at the end of this sheet) takes
   five inputs and derives everything else; the page hands it its own
   palette and writes no rgba to do so. html:root rather than :root, because
   the vendored tokens.css declares the same five names on :root further
   down with the system's defaults, and of two :root rules the later wins;
   the type selector outranks it without moving either block. The values
   are the system's own today, so nothing changes on screen -- the mapping
   is what keeps them the page's when --ground does. */
html:root { --gl-ground: var(--ground); --gl-ink: var(--ink); --gl-shadow: var(--seam);
            --gl-accent: var(--sel-top); --gl-live: var(--orange); }
/* Secondary text on glass reads at the system's glass weight: the three
   hosts re-declare --gl-dim, and the page's own --dim follows it there. */
.gl-glass, .gl-glass-bar, .gl-sel { --dim: var(--gl-dim); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 var(--fs-base)/1.4 var(--face);
       height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); }
a:hover { text-decoration-color: var(--ink); }
button, input, select { font: inherit; color: var(--ink); }
/* CONTROLS ARE CAPSULES, everywhere, and they are the system's three
   controls (saltglass .gl-action / .gl-btn / .gl-field, vendored at the end
   of this sheet). A generic button is the SECONDARY capsule: the open row's
   wash with its hairline rim, --hbtn tall, no stroke and no hover stroke --
   the declarations are .gl-btn's, written on the element so a button built
   in a script string without the class still wears them. The ONE action
   (Sync, Confirm, Save, Delete) carries .gl-action in its markup: the
   accent at .55 over a light blur, a white label; the blue gradient that
   was iTunes' button on a flat ground is gone from the page. A field is
   the icy wash (.gl-field): an ink wash with a top highlight, no stroke,
   the focus ring the system draws. */
button { background: var(--gl-btn-fill); border: 0; box-shadow: inset 0 0 0 1px var(--gl-btn-rim);
         border-radius: var(--r-pill); height: var(--hbtn); padding: 0 14px;
         font-family: var(--mono); font-size: var(--fs-ctrl); letter-spacing: var(--ls-ctrl); text-transform: uppercase; cursor: pointer; }
button:disabled { background: var(--gl-btn-off); box-shadow: none; color: var(--dim); cursor: default; }
/* the one action, disabled, is the disabled capsule: the fainter wash, no
   rim, a dim label -- the accent is for something that can be pressed */
button.go, #dosync { background: transparent; box-shadow: none; font-weight: 600; }   /* the material is .gl-action's own */
button.go[disabled] { background: transparent; color: var(--dim); }
button.go[disabled]::before { background: var(--gl-btn-off); -webkit-backdrop-filter: none; backdrop-filter: none; }
button.go[disabled]::after { box-shadow: none; }
input:not([type]), input[type=text], input[type=search], select { background: var(--gl-field-fill); border: 0;
         box-shadow: inset 0 1px 0 var(--gl-field-spec);
         border-radius: var(--r-sm); padding: 6px 9px; font-family: var(--mono); font-size: var(--fs-field); }
input::placeholder { color: var(--dim); }
input:focus, select:focus { outline: none; }

/* header: one line. The brand, search in the centre, and on the right the
   counts -- quiet, at lower opacity -- then Sync and the gear. The pane
   controls live on the panes now, so nothing below this line but the edge.
   The bar is glass (.gl-glass-bar .gl-bar-top in the markup): the ground's
   picture shows through it, and the system draws its open edge -- the rim
   and the etched line -- where the 2px seam strip used to be. The three
   content blocks sit above the ground, which is fixed at z-index 0.
   The bar is --mh-h tall with no vertical padding: the brandline grid is
   centred in it, so the --hbtn controls sit with equal air above and below
   (the old 12/4 padding was the seam strip's, and left them riding high). */
header { height: var(--mh-h); padding: 0 24px; display: grid; align-items: center; position: relative; z-index: 1; }
.brandline { display: grid; grid-template-columns: 1fr minmax(180px, 400px) 1fr; align-items: center; gap: 16px; min-width: 0; }
/* A GRID ITEM KEEPS min-width:auto, so its min-content becomes a floor the
   whole grid -- and therefore the document -- cannot go under. The body is a
   grid and the footer is one of its items, so the keyboard hints, which are
   nowrap by design, were holding the entire page at 975px and making it
   scroll sideways on anything narrower. Both places need the same release. */
body > * { min-width: 0; }
.brandline > * { min-width: 0; }
/* One number drives both, because aspect-ratio loses to a button's intrinsic
   width and the gear came out 13px wide against Sync's 31. */
.hright { display: flex; align-items: center; justify-content: flex-end; gap: 14px; min-width: 0; }
.hright button { height: var(--hbtn); }
h1 { margin: 0; font-size: var(--fs-mark); font-weight: 700; letter-spacing: var(--ls-face); text-transform: uppercase; }
/* THE SEARCH FIELD is the mock's .mq: the panel wash, a 1px rim at the
   glass rim's high-contrast alpha, the magnifier at the left and the / key
   cap at the right, mono at the field size. The input stays the capsule
   itself -- so the focus ring hugs it and pagetest's #q is unchanged -- and
   the glyph and the cap sit over it, inert to the pointer. */
.q { position: relative; min-width: 0; }
.q .qi { position: absolute; left: 12px; top: 50%; width: var(--ic-bar); height: var(--ic-bar);
         margin-top: calc(var(--ic-bar) / -2); fill: currentColor; color: var(--dim); pointer-events: none; }
.q kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); margin: 0; color: var(--dim); pointer-events: none; }
#q { width: 100%; height: var(--hbtn); padding: 0 40px 0 36px; box-sizing: border-box;
     font-family: var(--mono); font-size: var(--fs-field); letter-spacing: var(--ls-mono); color: var(--ink); }
/* The counts give way before the buttons do, and clip at their END: the first
   number (tracks) matters most, the last (the total) least. */
.counts { font-family: var(--mono); font-size: var(--fs-meta); letter-spacing: var(--ls-stat); color: var(--dim); opacity: .6;
          display: flex; gap: 10px; flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
.counts span { flex: none; }
.counts s { text-decoration: none; color: var(--ink); }
.pill { font-family: var(--mono); font-size: var(--fs-meta); letter-spacing: var(--ls-ctrl); text-transform: uppercase;
        color: var(--dim); cursor: pointer; user-select: none; padding: 4px 0; border-bottom: 1px solid transparent; }
.pill:hover { color: var(--ink); }
.pill.on { color: var(--ink); border-bottom-color: var(--ink); }
/* the gear is the mock's: a --hbtn circle with a 1px --faint ring, the glyph
   centred; the busy dot sits inside the ring at its top right */
#gear { padding: 0; width: var(--hbtn); flex: none; display: inline-flex; align-items: center;
        justify-content: center; font-size: var(--fs-glyph); line-height: 1; position: relative; }
#gear.busy:after { content: ""; position: absolute; top: 2px; right: 2px; width: 7px; height: 7px;
                   border-radius: var(--r-pill); background: var(--orange); }
/* Sync carries a count while state and the device disagree: tracks marked to
   come off, and tracks in a collection with a file waiting to go on. A change
   made in the page is not made on the iPod until this reads plain "Sync". */
/* The header's three controls are capsules in a bar, the way a bar's
   controls are: search is a rimmed field on the panel wash, Sync is the one
   blue on the page -- the one primary action, now that the selection no
   longer wears it -- and the gear is a ringed circle. Pending shows as the
   count in the label, not in orange: orange means what you hear. */
/* the search field is the system's field (.gl-field in the markup) at the
   pill radius: an icy wash with the top highlight, no stroke (the rim at .5
   read as a thick line); the system draws the focus ring */
#q { border-radius: var(--r-pill); }
/* Sync is the one action (.gl-action in the markup): accent-tinted glass.
   The id rule keeps only the geometry; the material, the rim and the label
   colour are the system's. No hover filter: a filter on the button would
   break the backdrop its own glass samples. */
#dosync { height: var(--hbtn); padding: 0 14px; letter-spacing: var(--ls-ctrl); border-radius: var(--r-pill); font-weight: 600; }
/* the gear keeps its ring: a --hbtn circle with a 1px --faint stroke, not a wash */
#gear { border: 1px solid var(--faint); background: transparent; box-shadow: none; border-radius: var(--r-pill); }
#gear:hover { background: var(--panel); }

/* ---------- the three panes ---------- */
/* No boxes, and no lines. The panes are open to the ground and nothing is
   drawn between them: a surface ends by its own fill (.gl-ends in the
   markup). The title strip is tinted glass the list scrolls under; the
   count at the foot is a pill the list scrolls under; the rows are
   separated by air. The only edges on the page are the header's and the
   footer's own, which the bars draw themselves. */
#work { display: grid; gap: 0; padding: 0; position: relative; z-index: 1; overflow: hidden;
        grid-template-columns: var(--lw) var(--sw) minmax(0, 1fr) var(--rw); min-height: 0; }
aside, section.mid { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
/* Pinned to their tracks on purpose: when a side pane is display:none the
   middle would otherwise auto-place into the 0px track it left behind. */
aside.left  { grid-column: 1; }
aside.srcpane   { grid-column: 2; }
section.mid { grid-column: 3; container-type: inline-size; }
/* a narrow centre drops the source strip before it crushes the title */
@container (max-width: 420px) { .row .src { display: none; } }
@container (max-width: 330px) { .row .tags .tag { display: none; } }
aside.right { grid-column: 4; }
body.nl { --lw: 24px; }  body.ns { --sw: 24px; }  body.nr { --rw: 24px; }
/* A folded pane is a 24px rail carrying its name and nothing else. The
   marks and the plus belong to a pane you can see: left in, they overlapped
   the turned title and offered to switch a view that is not on screen. */
body.nl aside.left .pbody, body.nl aside.left .act, body.nl aside.left .pstat, body.nl aside.left .modes,
body.ns aside.srcpane .pbody,  body.ns aside.srcpane .act,  body.ns aside.srcpane .pstat, body.ns aside.srcpane .modes,
body.nr aside.right .pbody, body.nr aside.right .pstat { display: none; }
/* A folded pane names every list behind it -- one pill would not say what
   else is there. The same reason BUY VINYL both survive on the right. */
body.nl aside.left .plabel, body.ns aside.srcpane .plabel, body.nr aside.right .plabel {
  writing-mode: vertical-rl; flex: 1 1 auto; flex-wrap: nowrap; justify-content: flex-start; align-items: center;
  gap: 12px; padding: 14px 0; cursor: pointer;
  /* the strip is a fixed 46px when the pane is open; a rail runs the height */
  height: auto; overflow: visible; }
body.nl aside.left .plabel .name { flex: 0 0 auto; min-width: 0; }
body.ns #stabs { flex: 0 0 auto; }
body.nr #rtabs .pill { border-bottom-color: transparent; }
/* each pane opens with one quiet mono line: what it is, and what can be done to it */
/* THE TITLE STRIP, once. The dialog and the menu each grew their own
   near-copy of this -- same family, size, tracking, transform and colour,
   differing only in height and in whether they draw their own seam. That is
   a ladder like the radius one: the strip gets shorter as the surface gets
   lighter (pane 46 > dialog 40 > menu 34), and a floating surface has to
   draw the edge its container does not. Two custom properties and one
   modifier, instead of three rules that have to be kept in step by hand. */
/* No seam under a strip: it ends by its fill (.gl-strip in the markup, the
   system's tinted glass). Only the menu's and the dialog's strips still
   draw an edge, because a floating surface has to draw its own. */
.plabel { display: flex; align-items: center; gap: var(--strip-gap, 12px); flex-wrap: nowrap;
          flex: none; min-height: var(--strip-h, 46px); height: var(--strip-h, 46px);
          padding: 0 var(--strip-x, 14px); overflow: hidden;
          font-family: var(--mono); font-size: var(--fs-label); letter-spacing: var(--ls-label);
          text-transform: uppercase; color: var(--dim); }
/* a surface that floats (the menu, the dialog) draws its own edge: the
   system's inner seam (.gl-seam-h-in beside this class in the markup); this
   rule keeps only that strip's wash. A pane's strip is .gl-strip instead. */
.plabel.seam { background: var(--panel); }
.plabel .name { color: var(--ink); flex: 1 1 auto; min-width: 6ch; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
/* In the centre the name does NOT grow: it sits with its count beside it,
   and the space that is left pushes the marks to the far right. */
section.mid .plabel .name { flex: 0 1 auto; }
section.mid .plabel .pstat { flex: 0 1 auto; margin-right: auto; min-width: 0;
                             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plabel .sp { display: none; }
/* A SIDE pane's title is one line and the same height in all three, so their
   bodies start level. The centre keeps wrapping -- it carries the list name,
   its action, the filter toggle and a stat line, and forcing that onto one
   line pushed it straight into the pane beside it. */
/* Anything a pane wants to say beyond its name goes BELOW the strip, so the
   strip itself is the same 46px in all four columns. */
.substat { flex: none; padding: 0 14px 8px; font-family: var(--mono); font-size: var(--fs-label);
           letter-spacing: var(--ls-stat); color: var(--dim); }
.substat s { text-decoration: none; color: var(--ink); }
.plabel .act { cursor: pointer; white-space: nowrap; }
.plabel .act:hover { color: var(--ink); }
.pstat { letter-spacing: var(--ls-stat); }
.pstat s { text-decoration: none; color: var(--ink); }
.pbody { overflow: auto; padding: 4px 14px 24px; flex: 1 1 auto; min-height: 0; }
/* THE STRIP SITS OVER THE LIST. In the four open panes the title strip is
   lifted out of the column and laid over the top of the scroller, which is
   padded by the strip's height so nothing starts hidden; the rows then pass
   under the tinted glass as they scroll, which is what the strip is for. A
   folded pane is a 24px rail with the strip turned on its side and no
   scroller under it (body.nl / .ns / .nr above), so the rail keeps its flow
   layout: these rules are scoped to the unfolded state. The panels' strips
   (#sp, #tp, #rsheet, #lsheet) are the same material in flow, because their
   bodies already start below them. scroll-padding keeps a row brought into
   view by the keyboard from landing under the strip. */
aside.left, aside.srcpane, section.mid, aside.right { position: relative; }
body:not(.nl) aside.left .plabel, body:not(.ns) aside.srcpane .plabel, section.mid .plabel, body:not(.nr) aside.right .plabel {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
body:not(.nl) aside.left .pbody, body:not(.ns) aside.srcpane .pbody, section.mid .pbody, body:not(.nr) aside.right .pbody {
  padding-top: var(--strip-h); scroll-padding-top: var(--strip-h); }
/* THE FILTER IS A POPOVER, not a row. The funnel at the right end of the
   centre strip opens the row menu (#menu, kind 'filter' -- the same glass,
   the same title strip, saying "Show") with one radio row per filter; a row
   of pills under the strip took a line of the list for a control that is
   used once in a while. When a filter other than All is on, its name sits
   beside the funnel in the strip's own label style, so a narrowed list
   always says so where the list is titled. */
.modes .fname { width: auto; padding: 0 4px; color: var(--ink); cursor: pointer; }
.modes span[aria-expanded="true"] { color: var(--ink); background: var(--panel); }

/* The fold is the < or > left of a pane's title: it points the way the pane
   goes. A folded pane is not gone -- it leaves a rail a few pixels wide with
   the title turned on its side and the chevron now pointing the way back. */
/* A box, not a glyph on a baseline: the chevron and the title are different
   sizes, so only giving the chevron its own centred box lines them up. */
.fold { font-family: var(--mono); font-size: var(--fs-field); color: var(--dim); flex: none;
        cursor: pointer; user-select: none; writing-mode: horizontal-tb;
        display: inline-flex; align-items: center; justify-content: center;
        width: 14px; height: 14px; line-height: 1; }
.fold:hover { color: var(--ink); }
#rtabs { display: flex; gap: 14px; flex: 0 0 auto; min-width: 0; }
#stabs { display: flex; gap: 10px; flex: 0 1 auto; min-width: 0; overflow: hidden; }
#stabs .pill { white-space: nowrap; }
/* The right pane's title mirrors the left ones: text, then the chevron at the
   outer edge, everything pushed to the right. The stat takes its own line. */
aside.right .plabel { justify-content: flex-end; }
aside.right .substat { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* THE COUNT IS A PILL. The two bottom blocks ("N of M readable right now",
   "N to buy · € · N ready · N synced") were full-width bars cutting the
   pane; they float now (.gl-pill in the markup: the strip's material, the
   capsule, a rim and a top highlight, the pill shadow), inset from the
   pane's sides and bottom by the system's --gl-pill-inset, the list
   scrolling under them with --pill-clear of room at its end. Text in ink;
   the <s> emphasis stays in the markup for the day the pill is dimmer. The
   source pane's pill is empty when every file can be read, and an empty
   pill is not drawn. #sp's and #tp's substats carry buttons: they are
   action bars and stay bars. */
aside.srcpane .substat, aside.right .substat {
  position: absolute; left: var(--gl-pill-inset); right: var(--gl-pill-inset); bottom: var(--gl-pill-inset);
  z-index: 2; padding: 7px 14px; color: var(--ink); }
aside.srcpane .substat:empty { display: none; }
body:not(.ns) aside.srcpane .pbody, body:not(.nr) aside.right .pbody {
  padding-bottom: var(--pill-clear); scroll-padding-bottom: var(--pill-clear); }
body.nr aside.right .plabel .fold { order: -1; }   /* the rail reads chevron-first, like the others */

/* ---------- rows ---------- */
/* Rows float on the ground -- separated by space, not rules -- and the selected
   one is the one row that is glass: clear glass, no blue. mark() gives it
   .gl-sel beside .sel, and the system's rule paints the material -- an ink
   wash over a blur, a rim, a top highlight -- on the row's own ::before, so
   the row's background stays transparent here. Blue no longer says "where
   you are"; the material does. Blue is the one action (Sync) and the drop
   targets, and nothing else. */
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 14px; align-items: center;
       padding: 9px 10px; cursor: pointer; border-radius: var(--r-md); margin-bottom: 3px;
       user-select: none; -webkit-user-select: none; }
.row:hover { background: var(--panel); }
.row.sel, .row.sel:hover { background: transparent; }
/* A MARKED ROW IS NOT A SELECTED ROW. The cursor is one row and wears the
   glass; a marked row is a quieter ink wash, so a range reads as one block
   with the cursor still findable inside it. Same material on purpose -- a
   second hue would say "a different kind of thing". */
.row.marked { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.row.marked:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
.row.marked.sel { background: transparent; }
/* With a selection live, a cursor row that is NOT in it must not wear the
   same glass as one that is -- otherwise cmd-clicking a row out of a range
   leaves it looking selected while the action will skip it. mark() withholds
   .gl-sel from it, and the rim alone remains: still obviously the cursor,
   obviously not included. */
#list.hasmark .row.sel:not(.marked) { background: transparent;
       box-shadow: inset 0 0 0 1.5px var(--gl-sel-rim); }
#list.hasmark .row.sel:not(.marked) .s { color: var(--dim); }
#list.hasmark .row.sel:not(.marked) .ch,
#list.hasmark .row.sel:not(.marked) .grab,
#list.hasmark .row.sel:not(.marked) .pod,
#list.hasmark .row.sel:not(.marked) .src,
#list.hasmark .row.sel:not(.marked) .src b { color: inherit; }
.selcount { color: var(--ink); }
.selcount b { font-weight: 600; }
.selclear { margin-left: 7px; cursor: pointer; text-decoration: underline;
       text-underline-offset: 2px; color: var(--dim); }
.selclear:hover { color: var(--ink); }
.row.sel .s { color: var(--on-sel-dim); }
.row.sel .ch, .row.sel .grab { color: var(--on-sel); }
.row.sel .tag { color: var(--on-sel); border-color: var(--on-sel-line); }
.art { width: 44px; height: 44px; border-radius: var(--r-sm); background: var(--seam);
       object-fit: cover; flex: none; -webkit-user-drag: none; }
.t { min-width: 0; }
.t .n { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700;
        letter-spacing: var(--ls-tight); font-size: var(--fs-name); }
.t .s { display: block; color: var(--dim); font-family: var(--mono); font-size: var(--fs-meta); letter-spacing: var(--ls-mono);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.ch { color: var(--dim); font-size: var(--fs-text); padding-left: 2px; }
/* Where a track LIVES, as against what you have decided about it. Facts get
   plain mono with no border; decisions keep the bordered pills.

   The places are PEERS -- Apple Music, the T7, the iPod, a record -- and no
   attempt is made to say which came first. A track can sit in all four and
   the order it arrived in is unknowable. What is owned shows in full ink and
   what is only rented stays dim, so the gap this tool exists to close can be
   read by scanning one column. */
.src { display: flex; gap: 7px; align-items: center; flex: none;
       font-family: var(--mono); font-size: var(--fs-tag); letter-spacing: var(--ls-ctrl); color: var(--dim); }
.src b { font-weight: 400; color: var(--ink); }
.src .gone { text-decoration: line-through; }
/* A DRIVE THAT IS OUT IS NOT A TRACK THAT IS GONE. The first version struck
   the badge through, borrowing Apple Music's mark for "listed but cannot be
   had" -- but that reads as removed or unavailable for good, and an unplugged
   drive is neither. It is the same kind of fact the health strip carries, so
   it borrows the strip's vocabulary instead: the name stays legible and takes
   a dot in the attention colour. */
.src .away { color: var(--orange); }
.src .away:before { content: ""; display: inline-block; width: 5px; height: 5px;
                    border-radius: var(--r-pill); background: var(--orange);
                    margin-right: 3px; vertical-align: middle; }
/* the iPod sits in the strip as a fixed slot like the others: always drawn,
   lit when the track is actually on the device */
/* Two fixed slots at the end of every row, so neither ever moves: the
   bitrate, then the iPod. The iPod is the highest-priority fact in the row --
   is this ON the thing -- so it sits closest to the chevron, and it is drawn
   rather than spelled. Both slots are always present and only change state;
   a tag appearing or vanishing to their left cannot shift them. */
/* The bitrate took the pill that used to say "owned". A number is the better
   claim: it proves you hold the file AND says what it is, where the word only
   ever repeated what the ink already said. Nothing is shown for a track you
   do not own -- until it is bought there is no format to report.
   The SLOT keeps its width when empty, because collapsing it would start the
   iPod mark sliding again, which is what moving the mark here fixed. */
.br { width: 58px; display: flex; justify-content: flex-end; flex: none; }   /* .tags gap is 6px */
.br b { font-family: var(--mono); font-size: var(--fs-tag); font-weight: 400; letter-spacing: var(--ls-stat);
        font-variant-numeric: tabular-nums; color: var(--ink);
        padding: 2px 7px; border-radius: var(--r-pill); border: 1px solid var(--faint); }
.row.sel .br b { color: var(--on-sel); border-color: var(--on-sel-line); }
/* DRAWN ONLY WHEN IT IS TRUE. A faint iPod still looks like an iPod: on a
   dim row the title sits at 45% while this sat at full strength, so the
   placeholder was brighter than the track name and read as "this is on the
   device". The slot keeps its width so nothing shifts; the mark itself is
   either there or it is not. */
.pod { display: inline-flex; align-items: center; justify-content: center;
       width: 8px; flex: none; color: var(--ink); }
.row.sel .br { color: var(--on-sel-dim); }
.row.sel .pod { color: var(--on-sel); }
.row.sel .src, .row.sel .src b { color: var(--on-sel); }
.tags { display: flex; gap: 6px; align-items: center; flex: none; }
.tag { font-family: var(--mono); font-size: var(--fs-tag); letter-spacing: var(--ls-ctrl); text-transform: uppercase;
       padding: 2px 7px; border-radius: var(--r-pill); border: 1px solid var(--faint);
       color: var(--dim); white-space: nowrap; }
.tag.buy, .tag.ok { color: var(--ink); border-color: var(--ink); }
.tag.skip { opacity: .5; }
.tag.vinyl { color: var(--ink); background: var(--panel); }
/* FULL INK MEANS YOU COULD PUT IT ON THE IPOD TODAY -- a file exists, either
   already on the device or on a drive sync can read. Dim means you cannot:
   not bought, or bought and not yet indexed. That is the gap this tool exists
   to close, so it is the thing the eye should catch first while scanning.
   (It used to mean "not on the iPod yet", which dimmed tracks you already
   owned and were simply waiting to sync -- a fact about the copy, not about
   whether you have the music.)
   Struck through is the other direction: on its way off the device. */
.row.unowned .t, .row.unowned .art { opacity: .45; }
/* THREE STATES, NOT TWO. "You do not own this" and "you own this and the
   drive is unplugged" are different problems -- one is fixed with a credit
   card, the other with a cable -- so they must not wear the same ink. The
   offline drop is deliberately shallower than unowned: the track is real and
   yours, it just cannot be written this minute. */
.row.offline .t, .row.offline .art { opacity: .7; }
.row.skip .t .n { text-decoration: line-through; }
.col.pend .cnt { color: var(--orange); }
/* the open collection's pending mark: the count in ink with the orange
   moved to a dot beside it (orange text on --raised fails contrast) */
.col.on.pend .cnt { color: var(--ink); }
.pdot { display: inline-block; width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--orange);
        vertical-align: middle; margin-right: 6px; }
.row.dragging { opacity: .35; }
.row.over { box-shadow: inset 0 2px 0 var(--sel-hi); }
/* Three dots on every row. Everything a drag can do, a click can do: the menu
   lists it, and "Add to playlist" opens a picker the way a phone does. */
.more { font-family: var(--mono); font-size: var(--fs-name); line-height: 1; color: var(--dim); padding: 2px 6px;
        cursor: pointer; flex: none; opacity: 0; border-radius: var(--r-sm); }
.row:hover .more, .row.sel .more, .col:hover .more, .col.on .more { opacity: 1; }
.more:hover { color: var(--ink); background: var(--raised); }
.row.sel .more { color: var(--on-sel); }
/* The menu floats, so it is glass (.gl-glass in the markup): the system
   gives it its fill, rim, highlight and shadow; the page gives the radius. */
#menu { position: fixed; z-index: 40; display: none; min-width: 230px; max-width: 320px;
        border-radius: var(--gl-r-lg); overflow: hidden; }
#menu.on { display: block; }
#menu { --strip-h: 34px; --strip-x: 12px; --strip-gap: 10px; }
#menu .plabel { white-space: nowrap; text-overflow: ellipsis; }
#menu .plabel .back { cursor: pointer; color: var(--dim); font-size: var(--fs-text); }
#menu .plabel .back:hover { color: var(--ink); }
#menu .mb { padding: 6px; max-height: 52vh; overflow: auto; }
#menu .drow { padding: 7px 10px; }
#menu .drow .dk { margin-left: auto; font: var(--fs-label) var(--mono); color: var(--dim); letter-spacing: var(--ls-ctrl); }
#menu .drow:hover .dk, #menu .drow:hover .dc { color: var(--on-sel-dim); }
#menu .sep { height: 1px; background: var(--faint); margin: 6px 4px; }
/* the filter popover: --fpop-w wide, anchored under the funnel at the
   strip's right edge by openMenu's own placement. Each row is a radio: the
   check sits in a fixed slot so the names align whether or not it shows,
   and the count the server sent sits at the right in the key cap's slot
   (nothing where the server sent none). Arrow keys move a focus highlight
   the way a pointer hover does. */
#menu.fpop { width: var(--fpop-w); min-width: 0; }
#menu .frow { cursor: pointer; }
#menu .frow .fchk { flex: none; width: var(--ic-bar); color: var(--ink); visibility: hidden; }
#menu .frow[aria-checked="true"] .fchk { visibility: visible; }
#menu .drow.focus { background: var(--hover-glass); }
#menu .drow.focus .dk, #menu .drow.focus .dc { color: var(--on-sel-dim); }
#menu input { width: 100%; color: var(--ink); padding: 7px 10px; font: var(--fs-field) var(--mono); margin: 2px 0; }
.grab { cursor: grab; color: var(--dim); padding: 0 4px; }
.month { font-family: var(--mono); font-size: var(--fs-label); letter-spacing: var(--ls-label); text-transform: uppercase;
         color: var(--dim); margin: 24px 0 6px; padding: 0 10px; }
.month:first-child { margin-top: 4px; }
.month.vg { cursor: pointer; user-select: none; margin: 16px 0 6px; padding: 0 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.month.vg:hover { color: var(--ink); }
code { font-family: var(--mono); font-size: var(--fs-ctrl); color: var(--ink); }

/* Playing is said twice and never with a bar: the equaliser takes the chevron's
   slot -- a playing row is not going anywhere -- and the duration stops being a
   fact about the file and becomes a position inside it. Both in the orange. */
.eq { display: none; align-items: flex-end; gap: 2px; height: 13px; width: 15px; }
.eq i { width: 3px; border-radius: var(--r-pill); background: var(--orange); transform-origin: bottom;
        animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(1) { height: 40%; animation-delay: -.2s; }
.eq i:nth-child(2) { height: 95%; animation-delay: -.5s; }
.eq i:nth-child(3) { height: 62%; animation-delay: -.8s; }
@keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .eq i { animation: none; } }
/* PREPARING IS THE SAME SLOT SAYING A DIFFERENT THING. One slot, one
   meaning -- this one means "what this row's audio is doing" -- and the
   SHAPE carries the state: a ring while the file is being made playable, the
   bars once it plays. A FLAC has to be converted before a browser will take
   it, 138 ms for a short track and 2.2 s for an eight-minute one, and a row
   that sits there doing nothing for two seconds reads as a bug. */
.row.playing .ch, .row.loading .ch { display: none; }
.row.playing .eq, .row.loading .eq { display: inline-flex; }
.row.loading .eq i { display: none; }
.row.loading .eq .eqsr:after { content: " — preparing"; }
.row.loading .eq:after { content: ""; width: 11px; height: 11px;
        border: 2px solid var(--orange); border-right-color: transparent;
        border-radius: var(--r-pill); animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .row.loading .eq:after { animation: none; } }
.dur { font-variant-numeric: tabular-nums; }
.row.playing .dur { color: var(--orange); }
/* Orange stays orange on the selected row. It was white there only because
   orange on blue said two things at once; on clear glass it says one. */
.row.sel .eq i { background: var(--orange); }
.row.sel.playing .dur { color: var(--orange); }

/* ---------- left pane: collections ---------- */
.col { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-md);
       cursor: pointer; font-size: var(--fs-row); margin-bottom: 2px; }
.col:not(.on):hover { background: var(--panel); }
/* the open collection is the system's open row (.gl-open beside .on in the
   markup, from colRow): an ink wash with a hairline rim at the pill radius
   -- a wash, not glass, so every open group may carry one. This rule keeps
   only the weight. */
.col.on { font-weight: 700; }
/* DENSE ROWS in the two left panes: --gl-row-dense tall, 1px apart, the
   capsule radius so the open one reads as a pill, the thumbnail at --thumb,
   the section label closer to its rows, the dots a row-height square. The
   right pane's cards and the panels' rows keep their height. */
aside.left .col, aside.srcpane .col { min-height: var(--gl-row-dense); padding: 0 0 0 12px; margin-bottom: 1px;
                                      border-radius: var(--gl-r-pill); }
aside.left .month, aside.srcpane .month { margin: 14px 0 4px; }
aside.left .col .more, aside.srcpane .col .more { width: var(--gl-row-dense); height: var(--gl-row-dense); padding: 0;
                                                  display: inline-flex; align-items: center; justify-content: center; }
aside.left .col.drop, aside.srcpane .col.drop { border-radius: var(--gl-r-pill); }
.col .cnt { margin-left: auto; font-family: var(--mono); font-size: var(--fs-meta); color: var(--dim); white-space: nowrap; flex: none; }
.col.pending .cnt { font-style: italic; }
.col.dim > span:first-child, .col.dim > .nm { color: var(--dim); }   /* the name dims whether or not a thumbnail precedes it */
/* the two ways to read a pane, as marks rather than words: a stack of lines
   for lists, a square of four for albums */
.modes { display: inline-flex; gap: 2px; flex: none; margin-left: auto; }
.modes span { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 16px;
              border-radius: var(--r-xs); color: var(--faint); cursor: pointer; }
.modes span:hover { color: var(--dim); }
.modes span.on { color: var(--ink); background: var(--panel); }
/* the plus reads as an action, not a third view, so it keeps a gap and no
   pressed state */
.modes .plus { color: var(--dim); margin-right: 6px; width: 20px; }
.modes .plus:hover { color: var(--ink); background: var(--panel); }
.albart { width: var(--thumb); height: var(--thumb); border-radius: var(--r-xs); background: var(--seam); flex: none; object-fit: cover; }
/* AN APPLE MUSIC PLAYLIST LIKE AN ALBUM: a 2x2 mosaic of the first four
   covers at the thumbnail size, the name, then tracks and the month. The
   server tiles the mosaic once per playlist and serves it like any cover
   (the payload's `art`); the page shows the one picture it is handed, and
   the empty thumbnail (--seam) until the data event brings one. */
.mosaic { width: var(--thumb); height: var(--thumb); border-radius: var(--r-xs); overflow: hidden; background: var(--seam);
          flex: none; display: block; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.col.alb { align-items: center; }
.col .cnt .act { cursor: pointer; }
.col .cnt .act:hover { color: var(--ink); }
.col.drop, aside.right.drop .pbody { outline: 2px dashed var(--sel-hi); outline-offset: -3px; border-radius: var(--r-md); }
.col.drop { background: var(--drop-fill); }
/* the pane itself, lit while a whole playlist or folder is over it */
aside.left.drop { background: var(--drop-wash); box-shadow: inset 0 0 0 2px var(--sel-hi); }
/* Two panes on the left can each remember a pick; only one is what the centre
   shows. One slot, one meaning: `on` is the list on screen (raised, bold);
   `was` is remembered here and not on screen (bold, hairline, no fill). The
   pane label dims to say the same thing from further away. */
.col.was { font-weight: 700; box-shadow: inset 0 0 0 1px var(--faint); }
.plabel.off .name { color: var(--dim); }
.col.dragging { opacity: .35; }
/* + new is a drop target for a whole playlist */
.act.drop { color: var(--sel-hi); outline: 1px dashed var(--sel-hi); outline-offset: 3px; border-radius: var(--r-xs); }

/* ---------- right pane: buy / vinyl ---------- */
.card { background: var(--panel); border-radius: var(--r-md); padding: 10px 12px; margin-bottom: 6px; }
/* the dots ride the card's title line, the same slot the buy cards use */
.card > b { display: inline-block; max-width: calc(100% - 26px); }
.card > .more { float: right; margin-top: -2px; }
.card { position: relative; }
.card b { font-size: var(--fs-text); }
.card .more { position: absolute; top: 8px; right: 8px; }
.card:hover .more { opacity: 1; }
.card .sub { color: var(--dim); font-size: var(--fs-meta); margin-top: 3px; font-family: var(--mono); }
.card .acts { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: var(--fs-text); }
/* A fixed slot on every buy card saying how far the lookup got. It is always
   there and only ever changes state -- the same rule as the row's AM T7 POD LP
   and the machine's status strip. */
.look { display: flex; align-items: center; gap: 6px; margin-top: 6px;
        font-family: var(--mono); font-size: var(--fs-label); letter-spacing: var(--ls-ctrl);
        text-transform: uppercase; color: var(--dim); }
.look:before { content: ""; width: 5px; height: 5px; border-radius: var(--r-pill); background: var(--faint); flex: none; }
.look.on   { color: var(--orange); }
.look.on:before { background: var(--orange); animation: pulse 1.1s ease-in-out infinite; }
.look.done { color: var(--dim); } .look.done:before { background: var(--ink); }
.look.none:before { background: transparent; box-shadow: inset 0 0 0 1px var(--faint); }
.look .go { color: var(--ink); cursor: pointer; text-decoration: underline;
            text-decoration-color: var(--faint); }
.look .go:hover { text-decoration-color: var(--ink); }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .look.on:before { animation: none; } }
.card .acts button { padding: 4px 9px; font-size: var(--fs-label); margin-left: auto; }
p.note { color: var(--dim); font-size: var(--fs-text); margin: 8px 8px 12px; line-height: 1.5; }
p.note s { text-decoration: none; color: var(--ink); }

/* ---------- settings overlay, where Data lives now ---------- */
/* The data panel is the sync panel at a larger size: the same hairline edge,
   the same title strip with its one action at the top right, the same section
   labels. Two panels, one shape. */
/* A sheet belongs to a pane, so it appears AS that pane: same column, same
   width, sliding over only it. The rest of the page stays lit and usable --
   nothing is centred and nothing is dimmed. New collection comes from the
   left, where collections live; Data comes from the right. */
/* THE PANELS ARE HEAVY GLASS (gl-glass gl-heavy in the markup), not opaque
   ground. A full-height sheet "goes opaque" in Apple's rule, but Apple's
   opaque is the material thickened; a flat --ground slab over the lit art
   ground read as dead (MEASURED: the Data sheet flat rgb(20,29,41) beside a
   page that was not). The system paints the fill, blur, highlight and twins;
   the page keeps the slide, its own shadow, and puts the rim on the inner
   edge only -- the edge that faces the page. */
.sheet { position: absolute; top: 0; bottom: 0; z-index: 8;
         display: flex; flex-direction: column; min-width: 0; overflow: hidden;
         transition: transform .18s ease; will-change: transform; }
/* Never narrower than a pane's worth: --lw goes to 24px when the pane folds,
   and a 24px sheet parks only 25px off-canvas, so its text spilled out the
   side and read as clutter down the rail. */
#lsheet { left: 0; width: max(var(--lw), 240px);
          box-shadow: var(--shadow-panel-l); transform: translateX(-105%); }
#lsheet::after { box-shadow: inset -1px 0 0 var(--gl-rim); }   /* it comes from the left: the rim on its right */
/* Data is a fixed sheet, not a pane: it covers the right half of the screen,
   header and footer included, and leaves the left half lit. Never narrower
   than 480px, so a small window gets more than half. */
#rsheet { position: fixed; top: 0; bottom: 0; right: 0; left: auto; width: max(50%, 480px); z-index: 30;
          box-shadow: var(--shadow-panel-r); transform: translateX(102%); }
#rsheet::after, #sp::after, #tp::after { box-shadow: inset 1px 0 0 var(--gl-rim); }   /* from the right: the rim on the left edge */
#rsheet .pbody { max-width: 760px; }
/* id + class, because the off-canvas transform above is on an id and would
   otherwise outrank a class alone */
#lsheet.on, #rsheet.on { transform: none; }
.sheet .pbody { padding: 6px 14px 24px; }
#rsheet .pbody { padding: 14px 16px 24px; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
/* DATA IS TWO COLUMNS AT ITS WIDTH (.two), one under 560px of the sheet
   itself -- a container query, since the sheet's width is not the
   window's. Its parts are the panel parts (.month, .fact, .acts, .log,
   declared with the sync panel's), no boxes. */
#rsheet { container-type: inline-size; }
#rsheet .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; align-items: start; }
@container (max-width: 560px) { #rsheet .two { grid-template-columns: 1fr; } }
/* the long way round: Music.app's playlists as rows, a filter above them */
#mq { width: 200px; }
#rsheet .mrows { max-height: 300px; overflow: auto; margin-top: 6px; }
#rsheet .mrows .col { cursor: default; padding: 4px 10px; }
#rsheet .mrows .col:hover { background: transparent; }
#rsheet .mrows .col .tag { margin-left: 10px; }
#rsheet .mrows .col button { margin-left: 10px; }

/* the status line at the foot, like the room page's -- a glass bar, like
   the header (.gl-glass-bar .gl-bar-bottom in the markup), with the system's
   rim on its open edge where the hairline used to be */
footer { position: relative; z-index: 1;
         padding: 10px 24px calc(10px + env(safe-area-inset-bottom, 0px));
         font-family: var(--mono); font-size: var(--fs-ctrl); letter-spacing: var(--ls-stat); color: var(--dim);
         display: flex; gap: 24px; align-items: center; }
/* THE KEYS THAT MATTER FOR WHAT YOU ARE LOOKING AT come first, in ink; the
   rest follow, dim; then "?" opens all of them. One line, never wraps, clips
   at its end: the footer is not a manual, and the context table (KEYS, in
   the script) is a lookup, never derived. */
#keys { display: flex; gap: 14px; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; align-items: center; flex: 0 1 auto; min-width: 0; }
#keys .kk { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
#keys .kk.p { color: var(--ink); }

   column in front, its infrastructure is a list of steps, and its foot is
   the strip material floating over the end of the list. The only new things

   source panes sat 28px apart from each other down the same column. */

       text-overflow: ellipsis; white-space: nowrap; }

       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col.on .nm .sub { color: var(--dim); }
.col.doing { background: var(--panel); }
.col.doing .cnt { color: var(--orange); }
.col.done .nm { color: var(--dim); }
.col.err .nm, .col.err .cnt { color: var(--orange); }
/* the sync log is the .log pattern, short: the last eight lines */
#splog { margin: 14px 0 0; max-height: 110px; }

@media (max-width: 1000px) { :root { --lw: 200px; --rw: 260px; } }

   .counts and #keys rules defined further down, which is why they appeared
   to do nothing. Degrade on purpose rather than by clipping -- a counts
   strip sliced to 45px is not a smaller reading of the numbers, and half
   the keyboard hints read as all of them. */
@media (max-width: 1100px) { .counts { display: none; } }
@media (max-width: 900px)  { #keys  { display: none; } }

/* ---------- accessibility pass, 1 October ----------
   Additions only -- nothing above this line changed, so nothing at rest
   moves. */

   every button, input and link -- and every one of them turned its own
   outline off on :focus, for mouse clicks that never wanted a ring. Several
   of those rules are id-scoped and would win the cascade outright over a
   plain :focus-visible selector, so the ring here carries !important: the
   one place in the sheet where losing a specificity fight would put the
   bug straight back. --sel-hi is law 2's own answer to "where you are",
   which is exactly what a focus ring marks -- no new token needed. */

      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

   carries the same opacity-only fade. Listed here so the motion census
   reads that transition as the reduced form, which it is. */
@media (prefers-reduced-motion: reduce) { .gl-ground[data-gl-drift="off"] img { transition: opacity var(--gl-fade) linear; } }

:root {
  /* identity: the five inputs a host maps to its own palette */
  --gl-ground: #141d29;   /* the flat ground; also the glass fill's hue and the scrim's */
  --gl-ink: #fffffc;      /* text; also every rim, highlight and seam catch */
  --gl-shadow: #070c13;   /* the dark of the etched seams and the floating shadow */
  --gl-accent: #2f6fd0;   /* the one primary action and drop targets; never "where you are" */
  --gl-live: #f75c03;     /* "what you hear": the playing row's time, the live dot */

  /* derived colours */
  --gl-glass-fill: color-mix(in srgb, var(--gl-ground) 60%, transparent);   /* the material's fill */
  --gl-glass-fill-heavy: color-mix(in srgb, var(--gl-ground) 88%, transparent); /* the thickened fill: a full-height panel or sheet (.gl-heavy) */
  --gl-rim: color-mix(in srgb, var(--gl-ink) 40%, transparent);             /* the 1px edge of a floating surface */
  --gl-rim-hc: color-mix(in srgb, var(--gl-ink) 50%, transparent);          /* the rim under Increase Contrast */
  --gl-spec: color-mix(in srgb, var(--gl-ink) 14%, transparent);            /* the 1px top highlight */
  --gl-sel: color-mix(in srgb, var(--gl-ink) 14%, transparent);             /* the selected row's fill */
  --gl-sel-rim: color-mix(in srgb, var(--gl-ink) 40%, transparent);         /* the selected row's rim */
  --gl-sel-solid: color-mix(in srgb, var(--gl-ink) 14%, var(--gl-ground));  /* the same row when nothing is behind it */
  --gl-dim: color-mix(in srgb, var(--gl-ink) 55%, transparent);             /* secondary text on the ground */
  --gl-dim-glass: color-mix(in srgb, var(--gl-ink) 75%, transparent);       /* secondary text on glass (glass hosts re-declare --gl-dim to this) */
  --gl-seam-dark: color-mix(in srgb, var(--gl-shadow) 55%, transparent);    /* structure seam: the dark line */
  --gl-seam-light: color-mix(in srgb, var(--gl-ink) 13%, transparent);      /* structure seam: the light catch */
  --gl-seam-dark-in: color-mix(in srgb, var(--gl-shadow) 35%, transparent); /* inner seam: the dark line */
  --gl-seam-light-in: color-mix(in srgb, var(--gl-ink) 9%, transparent);    /* inner seam: the light catch */

  /* endings: a surface that ends by its fill, not by a line */
  --gl-strip-a: .35;      /* the tint of a strip or a pill: the ground's alpha over the blur */
  --gl-strip-fill: color-mix(in srgb, var(--gl-ground) calc(var(--gl-strip-a) * 100%), transparent);      /* the strip and the pill: tinted glass, a step darker */
  --gl-strip-fill-light: color-mix(in srgb, var(--gl-ink) calc(var(--gl-strip-a) * 30%), transparent);    /* the same, a step lighter (.gl-light) */
  --gl-pill-rim: color-mix(in srgb, var(--gl-ink) 18%, transparent);        /* the pill's 1px rim */
  --gl-pill-spec: color-mix(in srgb, var(--gl-ink) 10%, transparent);       /* the pill's 1px top highlight */
  --gl-open-fill: color-mix(in srgb, var(--gl-ink) 10%, transparent);       /* the open row in a list of names: a wash, not glass */
  --gl-open-rim: color-mix(in srgb, var(--gl-ink) 18%, transparent);        /* the open row's 1px rim */

  /* controls: the three the system owns -- the one action, the secondary button, the field */
  --gl-action-a: .55;     /* the accent's alpha over the blur: the one primary action as tinted glass */
  --gl-action-fill: color-mix(in srgb, var(--gl-accent) calc(var(--gl-action-a) * 100%), transparent);  /* .gl-action's fill */
  --gl-action-rim: color-mix(in srgb, var(--gl-ink) 22%, transparent);      /* .gl-action's 1px rim */
  --gl-action-spec: color-mix(in srgb, var(--gl-ink) 18%, transparent);     /* .gl-action's 1px top highlight */
  --gl-on-accent: #fff;   /* the label on the accent: the one literal below the inputs, because no derivation of the ink is guaranteed to read on every accent. A host overrides it with its accent. */
  --gl-btn-fill: var(--gl-open-fill);   /* .gl-btn, a secondary action: the open row's wash, as a button */
  --gl-btn-rim: var(--gl-open-rim);     /* .gl-btn's 1px rim */
  --gl-btn-off: color-mix(in srgb, var(--gl-ink) 5%, transparent);          /* .gl-btn disabled: a fainter wash, no rim */
  --gl-field-fill: color-mix(in srgb, var(--gl-ink) 10.5%, transparent);    /* .gl-field, the icy input: an ink wash, no stroke */
  --gl-field-spec: color-mix(in srgb, var(--gl-ink) 14%, transparent);      /* .gl-field's 1px top highlight */

  /* the material */
  --gl-blur: 16px;        /* backdrop blur of a floating surface */
  --gl-sat: 180%;         /* backdrop saturation of a floating surface */
  --gl-sel-blur: 12px;    /* the selected row's backdrop blur: lighter, it is inside a list */
  --gl-sel-sat: 160%;
  --gl-action-blur: 12px; /* the one action's backdrop blur: lighter, like the row's, it sits inside a bar */
  --gl-action-sat: 160%;
  --gl-art-blur: 64px;    /* the ground picture's blur: a wash of colour, never a picture */
  --gl-art-sat: 1.2;

  /* motion */
  --gl-fade: 700ms;       /* the crossfade between two ground layers */
  --gl-settle: 250ms;     /* the rest before the ground follows a new selection */
  --gl-drift: 1.05;       /* the zoom-through scale of an incoming layer; 1 turns it off */
  --gl-ease: cubic-bezier(.32,.72,0,1);

  /* shape and depth */
  --gl-shadow-float: 0 14px 28px color-mix(in srgb, var(--gl-shadow) 45%, transparent);
  --gl-shadow-pill: 0 10px 24px color-mix(in srgb, var(--gl-shadow) 35%, transparent);  /* a floating pill: lower and softer than a menu */
  --gl-r-lg: 14px;        /* menus, dialogs */
  --gl-r-pill: 99px;      /* fields and buttons in a bar; pills; the open row */
  --gl-pill-inset: 10px;  /* a pill's distance from the sides and the bottom of its pane */
  --gl-row-dense: 28px;   /* the min-height of a dense row in a list of names */
  --gl-hit: 32px;         /* the height of a control (.gl-action, .gl-btn): the Mac's; a touch host raises it to 44px */

  /* the band */
  --gl-scrim-unknown: .60; /* the scrim before the host has measured a cover */
  --gl-ymax: .05;          /* documentation only: the ground's luminance ceiling. The server owns this number. */
}

/* saltglass — glass.css
   The materials. Each class is one material, and its comment says WHERE it may
   be used. There is no literal colour, radius or duration in this file: every
   value is a token from tokens.css, and check_tokens.py fails the tests if one
   creeps in. Load tokens.css first.

   The one rule that decides whether a thing may be glass: glass goes only where
   something floats or sits on the picture. A pane is not glass. A card inside a
   pane is not glass. A row is not glass, except the one selected row. */


/* .gl-ground — the ground: the content's own picture, blurred, under everything.
   WHERE: exactly once per page, as the first child of <body>, aria-hidden. The
   page's content sits above it (position: relative; z-index: 1 on the content
   containers). Two <img> layers crossfade; ground.js owns them and sets
   --gl-scrim-a on the element from the host's measurement. The images are inset
   -10% so the drift never shows an edge. */
.gl-ground {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background: var(--gl-ground);
  --gl-scrim-a: var(--gl-scrim-unknown);
}
.gl-ground img {
  position: absolute; inset: -10%; width: 120%; height: 120%; object-fit: cover;
  filter: blur(var(--gl-art-blur)) saturate(var(--gl-art-sat));
  opacity: 0; transform: scale(var(--gl-drift));
  transition: opacity var(--gl-fade) var(--gl-ease), transform var(--gl-fade) var(--gl-ease);
}
.gl-ground img.on { opacity: 1; transform: scale(1); }
.gl-ground[data-gl-drift="off"] img { transform: none; transition: opacity var(--gl-fade) linear; }
.gl-ground .scrim {
  position: absolute; inset: 0;
  background: color-mix(in srgb, var(--gl-ground) calc(var(--gl-scrim-a) * 100%), transparent);
  transition: background-color var(--gl-fade) var(--gl-ease);
}


/* .gl-glass — a floating surface: a menu, a dialog, a popover, a floating shelf.
   WHERE: something that floats over the content with the ground visible around
   it. Never a pane, never a row, never a card set into a pane. The host element
   stays transparent; the material lives on ::before (z-index -1, so Safari
   composites the backdrop filter under the content) and the rim and the top
   highlight on ::after. The host gives the radius; the pseudo-elements inherit
   it. Position is set with :where() so a host's own position (absolute, fixed)
   wins regardless of order. */
.gl-glass {
  isolation: isolate; background: transparent;
  box-shadow: var(--gl-shadow-float);
  --gl-dim: var(--gl-dim-glass);
}
:where(.gl-glass) { position: relative; z-index: 2; }
.gl-glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
  background: var(--gl-glass-fill);
  -webkit-backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat));
  backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat));
}
.gl-glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 1px var(--gl-rim), inset 0 1px 0 var(--gl-spec);
}

/* .gl-heavy — the same glass, thickened: a modifier on .gl-glass.
   WHERE: a full-height panel or sheet that slides over the page -- a review
   panel, a detail panel, a settings sheet. Apple's rule is that a sheet of that
   size goes opaque, and Apple's opaque is the material thickened, not a flat
   colour: an opaque slab over a lit room reads as dead. So the fill goes to
   --gl-glass-fill-heavy (ground at 88%); the blur, the rim, the highlight and
   the shadow are .gl-glass's own, and under every twin it becomes the ground
   exactly as .gl-glass does. The host keeps its own slide (transform only) and
   may limit the rim to the panel's inner edge on ::after. */
.gl-glass.gl-heavy::before { background: var(--gl-glass-fill-heavy); }


/* .gl-glass-bar — edge-to-edge chrome: the header bar and the footer bar.
   WHERE: a bar that spans the window and floats over scrolling content. Same
   material as .gl-glass, no radius, the same floating shadow, and a rim only on the
   open edge — the edge the content scrolls under — with the etched dark line
   just outside it. Add one modifier: .gl-bar-top for a header (open edge at the
   bottom), .gl-bar-bottom for a footer (open edge at the top). --gl-bar-edge
   names the open edge for anything that wants to read it. */
.gl-glass-bar {
  isolation: isolate; background: transparent; box-shadow: var(--gl-shadow-float);
  --gl-dim: var(--gl-dim-glass);
}
:where(.gl-glass-bar) { position: relative; z-index: 2; }
.gl-glass-bar::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--gl-glass-fill);
  -webkit-backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat));
  backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat));
}
.gl-glass-bar::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.gl-bar-top { --gl-bar-edge: bottom; }
.gl-bar-top::after { box-shadow: inset 0 -1px 0 var(--gl-rim), 0 1px 0 var(--gl-seam-dark); }
.gl-bar-bottom { --gl-bar-edge: top; }
.gl-bar-bottom::after { box-shadow: inset 0 1px 0 var(--gl-rim), 0 -1px 0 var(--gl-seam-dark); }


/* .gl-sel — selection glass: the one selected row.
   WHERE: exactly one row per list, the selected one, alongside the host's own
   selected class. Never on every row: one backdrop filter per list is the law,
   because a list of hundreds of rows cannot each carry one. Clear glass, no
   accent colour: an ink wash over a lighter blur, the rim and the top highlight
   on its own ::before. The row's radius is inherited. The live colour is
   allowed on this row (the playing time, the equaliser). */
.gl-sel {
  isolation: isolate; background: transparent;
  --gl-dim: var(--gl-dim-glass);
}
:where(.gl-sel) { position: relative; }
.gl-sel::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
  background: var(--gl-sel);
  -webkit-backdrop-filter: blur(var(--gl-sel-blur)) saturate(var(--gl-sel-sat));
  backdrop-filter: blur(var(--gl-sel-blur)) saturate(var(--gl-sel-sat));
  box-shadow: inset 0 0 0 1px var(--gl-sel-rim), inset 0 1px 0 var(--gl-spec);
}


/* .gl-seam-v, .gl-seam-h — structure seams: a dark line with the light catch
   beside it, the crease of a pressed edge. A single light line vanishes on a
   bright sleeve and a single dark one on a dark sleeve; the pair holds on both.
   WHERE: the edges of panes (vertical, on the pane's right edge) and the edges
   of the architecture (horizontal, on an element's bottom edge). Add
   .gl-seam-top to a horizontal seam that belongs on the top edge instead (a
   status strip at the foot of a pane). */
.gl-seam-v { border-right: 1px solid var(--gl-seam-dark); box-shadow: 1px 0 0 var(--gl-seam-light); }
.gl-seam-h { border-bottom: 1px solid var(--gl-seam-dark); box-shadow: 0 1px 0 var(--gl-seam-light); }
.gl-seam-h.gl-seam-top { border-bottom: 0; border-top: 1px solid var(--gl-seam-dark); box-shadow: inset 0 1px 0 var(--gl-seam-light); }

/* .gl-seam-v-in, .gl-seam-h-in — inner seams: the same pair, lighter.
   WHERE: lines inside a pane that carry no fill of their own — a filter row, a
   banner, a substat drawn as a bar — so the architecture reads before the
   content does. A strip or a pill (below) ends by its fill and takes no seam. */
.gl-seam-v-in { border-right: 1px solid var(--gl-seam-dark-in); box-shadow: 1px 0 0 var(--gl-seam-light-in); }
.gl-seam-h-in { border-bottom: 1px solid var(--gl-seam-dark-in); box-shadow: 0 1px 0 var(--gl-seam-light-in); }
.gl-seam-h-in.gl-seam-top { border-bottom: 0; border-top: 1px solid var(--gl-seam-dark-in); box-shadow: inset 0 1px 0 var(--gl-seam-light-in); }


/* ---- endings ------------------------------------------------------------
   A surface does not need a line to end. A strip just stops and the list
   disappears under it; a pill floats over the list's end. Lines (the seams
   above) are for edges that have no fill of their own. */

/* .gl-ends — the idiom, as a class a host may put on a pane to say so. No rules:
   a pane that carries .gl-strip and .gl-pill does not also draw .gl-seam-* on
   the same edge, and nothing under a strip or a pill carries an inner seam. */

/* .gl-strip — a title strip the content scrolls under: tinted glass that carries
   the picture's colour, the ground at --gl-strip-a over the blur, no border, no
   shadow. Reads as a step darker than the pane; .gl-light makes it a step lighter.
   WHERE: the title strip of a pane or a panel whose list scrolls under it, and
   the title strip of a popover or a menu. Never without a scroller under it: a
   strip over a static block is a bar that forgot its rim. The host positions it
   (absolute or sticky over the scroller, the scroller padded by the strip's
   height); the system does not own layout. Carries one backdrop filter, like a
   bar, and counts with the bars, not the rows. */
.gl-strip {
  background: var(--gl-strip-fill);
  -webkit-backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat));
  backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat));
  border: 0; box-shadow: none;
  --gl-dim: var(--gl-dim-glass);
}
.gl-strip.gl-light { background: var(--gl-strip-fill-light); }

/* .gl-pill — a floating capsule for a count or a status: the strip's material,
   the pill radius, a 1px rim and a 1px top highlight on ::after, the pill shadow,
   ink text.
   WHERE: over the end of a list, inset by --gl-pill-inset from the pane's sides
   and bottom, the list scrolling under it (the scroller padded by the pill's
   clearance). Never over a bar, never in a bar: a bar has its own edge. The host
   positions it (absolute; the :where() default yields). */
.gl-pill {
  background: var(--gl-strip-fill);
  -webkit-backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat));
  backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat));
  border: 0; border-radius: var(--gl-r-pill);
  box-shadow: var(--gl-shadow-pill);
  color: var(--gl-ink);
  --gl-dim: var(--gl-dim-glass);
}
:where(.gl-pill) { position: relative; z-index: 2; }
.gl-pill::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 1px var(--gl-pill-rim), inset 0 1px 0 var(--gl-pill-spec);
}

/* .gl-open — the open item in a list of names: a collection, a folder, a tab.
   An ink wash at 10% with a 1px rim at 18%, the pill radius. It is a wash, not
   glass: no backdrop filter, so a list may hold one on every open group where
   .gl-sel may hold only one. Never on the same element as .gl-sel: one says
   "open", the other "here".
   WHERE: the open row of a side list, alongside the host's own open class. */
.gl-open {
  background: var(--gl-open-fill);
  box-shadow: inset 0 0 0 1px var(--gl-open-rim);
  border-radius: var(--gl-r-pill);
}


/* ---- controls -----------------------------------------------------------
   The three controls the system owns: the one action, the secondary button and
   the field. Each is a material and a height; the host gives the type, the
   padding and, for the field, the radius. Nothing else here is a control: no
   toggle, no slider, no picker, no segmented control (GAPS.md gap 3). */

/* .gl-action — the one primary action: accent-tinted glass. The accent at
   --gl-action-a over a lighter blur, a 1px rim and a 1px top highlight, a capsule
   --gl-hit tall, the label in --gl-on-accent. This is the only glass that carries
   a hue, because it is the only thing on the screen that asks to be pressed.
   WHERE: one per screen -- the header's Sync and nothing else while the page is
   the screen; a panel's own Sync while the panel is. Never two on one screen,
   never on a row, never for "where you are". The material lives on ::before and
   the rim on ::after like .gl-glass; the host positions it. Counts with the bars
   under law 1 (it is one filter, inside one bar). */
.gl-action {
  isolation: isolate; background: transparent; border: 0;
  height: var(--gl-hit); border-radius: var(--gl-r-pill);
  color: var(--gl-on-accent);
}
:where(.gl-action) { position: relative; }
.gl-action::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
  background: var(--gl-action-fill);
  -webkit-backdrop-filter: blur(var(--gl-action-blur)) saturate(var(--gl-action-sat));
  backdrop-filter: blur(var(--gl-action-blur)) saturate(var(--gl-action-sat));
}
.gl-action::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 1px var(--gl-action-rim), inset 0 1px 0 var(--gl-action-spec);
}

/* .gl-btn — a secondary action: Cancel, Index the drive, Read Apple Music. The
   open row's wash as a button: ink at 10% with a 1px rim at 18%, a capsule
   --gl-hit tall, ink label. A wash, not glass: no backdrop filter, so a panel may
   hold a row of them. Disabled ([disabled] or .gl-off) it is the fainter wash
   with no rim and a dim label.
   WHERE: every action that is not the one action: beside .gl-action in a bar,
   in a panel's action row, in a dialog. */
.gl-btn {
  height: var(--gl-hit); border: 0; border-radius: var(--gl-r-pill);
  background: var(--gl-btn-fill);
  box-shadow: inset 0 0 0 1px var(--gl-btn-rim);
  color: var(--gl-ink);
}
.gl-btn[disabled], .gl-btn.gl-off { background: var(--gl-btn-off); box-shadow: none; color: var(--gl-dim); }

/* .gl-field — the icy input: a search field, a select, a text input. An ink wash
   at 10.5%, no stroke, a 1px top highlight; ink text, dim placeholder. The host
   gives the radius (the pill for a search field in a bar, a small radius for an
   input in a form) and the height. Focus adds a 1px ring at --gl-rim inside the
   wash and takes the outline, so the ring is the focus indicator.
   WHERE: every field. A field is never glass: a form of fields cannot carry a
   filter each, and a field reads by what is typed in it, not by what is behind. */
.gl-field {
  background: var(--gl-field-fill); border: 0;
  box-shadow: inset 0 1px 0 var(--gl-field-spec);
  color: var(--gl-ink);
}
.gl-field::placeholder { color: var(--gl-dim); }
.gl-field:focus-visible { outline: 0; box-shadow: inset 0 1px 0 var(--gl-field-spec), inset 0 0 0 1px var(--gl-rim); }


/* ---- the twins ----------------------------------------------------------
   Every motion and every transparency above has a twin here. The order is
   the order a browser resolves them in, and all four are always present. */

/* Reduce Motion: the crossfade stays (a cut would be worse), the drift goes. */
@media (prefers-reduced-motion: reduce) {
  .gl-ground img { transform: none; transition: opacity var(--gl-fade) linear; }
  .gl-ground img.on { transform: none; }
  .gl-ground .scrim { transition: background-color var(--gl-fade) linear; }
}

/* Reduce Transparency: no picture, an opaque scrim, the glass fill becomes the
   ground, no backdrop filter. The selected row becomes its composite colour. */
@media (prefers-reduced-transparency: reduce) {
  .gl-ground img { display: none; }
  .gl-ground .scrim { background: var(--gl-ground); }
  .gl-glass::before, .gl-glass-bar::before, .gl-sel::before { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .gl-glass::before, .gl-glass.gl-heavy::before, .gl-glass-bar::before { background: var(--gl-ground); }
  .gl-glass::after { box-shadow: inset 0 0 0 1px var(--gl-rim-hc); }
  .gl-bar-top::after { box-shadow: inset 0 -1px 0 var(--gl-rim-hc); }
  .gl-bar-bottom::after { box-shadow: inset 0 1px 0 var(--gl-rim-hc); }
  .gl-sel::before { background: var(--gl-sel-solid); box-shadow: inset 0 0 0 1px var(--gl-rim-hc); }
  .gl-strip, .gl-pill { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--gl-ground); border: 1px solid var(--gl-rim-hc); }
  .gl-pill::after { box-shadow: none; }
  .gl-action::before { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--gl-accent); }
  .gl-action { border: 1px solid var(--gl-rim-hc); }
  .gl-action::after { box-shadow: none; }
  .gl-btn, .gl-field { background: var(--gl-ground); border: 1px solid var(--gl-rim-hc); box-shadow: none; }
  .gl-btn[disabled], .gl-btn.gl-off { background: var(--gl-ground); }
  .gl-field:focus-visible { box-shadow: inset 0 0 0 1px var(--gl-rim-hc); }
}

/* Increase Contrast: the Reduce Transparency twin, and the rim becomes a real
   border at the high-contrast alpha. */
@media (prefers-contrast: more) {
  .gl-ground img { display: none; }
  .gl-ground .scrim { background: var(--gl-ground); }
  .gl-glass::before, .gl-glass-bar::before, .gl-sel::before { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .gl-glass::before, .gl-glass.gl-heavy::before, .gl-glass-bar::before { background: var(--gl-ground); }
  .gl-sel::before { background: var(--gl-sel-solid); box-shadow: inset 0 0 0 1px var(--gl-rim-hc); }
  .gl-glass { border: 1px solid var(--gl-rim-hc); }
  .gl-glass::after { box-shadow: none; }
  .gl-bar-top { border-bottom: 1px solid var(--gl-rim-hc); }
  .gl-bar-bottom { border-top: 1px solid var(--gl-rim-hc); }
  .gl-bar-top::after, .gl-bar-bottom::after { box-shadow: none; }
  .gl-seam-v, .gl-seam-v-in { border-right-color: var(--gl-rim-hc); }
  .gl-seam-h, .gl-seam-h-in { border-bottom-color: var(--gl-rim-hc); }
  .gl-seam-h.gl-seam-top, .gl-seam-h-in.gl-seam-top { border-top-color: var(--gl-rim-hc); }
  .gl-strip, .gl-pill { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--gl-ground); border: 1px solid var(--gl-rim-hc); }
  .gl-pill::after { box-shadow: none; }

/* THE GROUND follows the selection. saltglass's Ground (vendored above in
   its own script tag) owns the two picture layers under the page: it waits
   for the selection to rest, then crossfades to the new cover. The page
   tells it two things and works out neither: which picture (the row's own
   art) and the scrim alpha the SERVER measured for it (t.ground.scrim,
   null until it has) -- the page never reads a pixel. If the system is
   missing the ground is simply flat and nothing else changes. */
const GROUND = (window.Saltglass && window.Saltglass.Ground)
  ? window.Saltglass.Ground.mount($('#ground'))
  : { show(){}, clear(){} };
function followGround(){
  const t=view[sel];
  // A row with no art goes through show() too: Ground debounces it like any
  // other move and only clears once the selection has rested. Calling clear()
  // here dropped the ground at once, a dip on every art-less row under j/k.
  GROUND.show((t&&t.art) ? {src:t.art, scrim:(t.ground||{}).scrim} : {src:null});
}

/* MULTI-SELECT. `sel` stays what it was -- the cursor, an index into `view`,
   which everything from scroll memory to nudge to play depends on. The
   selection is a separate set ON TOP of it, and it holds KEYS, not indices:
   indices are invalidated by every redraw, filter and sort, and a stale index
   silently acts on the wrong track. A key is the same track forever.
   MARKLIST records which list the set belongs to, so switching pane, playlist,
   filter or search clears it -- a selection you cannot see is a selection you
   will act on by accident. */
const MARK=new Set(); let MARKLIST=null;
function markedKeys(){ return [...MARK]; }
/* THE ONE FUNCTION EVERY ACTION ASKS. A selection when there is one, the row
   under the cursor when there is not, so single-track use is untouched. */
function targets(){ return MARK.size ? markedKeys() : (view[sel]?[view[sel].key]:[]); }
function clearMark(){ if(!MARK.size)return false; MARK.clear(); MARKLIST=null; return true; }
function syncMarkList(){ const k=listKey(); if(MARKLIST!==k){MARK.clear(); MARKLIST=k;} }
function setMark(keys){ MARK.clear(); MARKLIST=listKey(); keys.forEach(k=>MARK.add(k)); }
/* A range is taken in the order the list is CURRENTLY shown, which is the
   order the eye drew it -- not the order the underlying array happens to be
   in. Anchor included, both ends inclusive. */

   one-element array, so the multi-track case is not a second code path. */
function dropKeys(e){
  const raw=e.dataTransfer.getData('text/plain');
  return raw?raw.split('\n').filter(Boolean):[];
}
function markRange(a,b){
  MARKLIST=listKey();
