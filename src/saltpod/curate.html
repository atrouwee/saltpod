/* ---------------- undo ----------------
   The stack lives on the SERVER, where the state does. A snapshot of every
   record a decision touched is taken before it is applied, so undo restores
   exactly what was there -- including collection membership and sequence,
   which no amount of re-deciding by hand could reconstruct.
   It deliberately stops at the device: a completed sync is not on the stack,
   because the only thing that could undo one is the backup it took. */
let UNDOC={can_undo:0,can_redo:0,next:null};
async function refreshUndo(){
  try{ UNDOC=await fetch('/api/undo').then(r=>r.json()); }catch(e){}
  paintUndo();
}
// The hint is a real button (law 7: what the key does, a click does), wired
// to the same undo the key reaches; drawFoot re-creates it, so it is wired
// here, where it is painted.
function paintUndo(){
  const el=$('#undoc'); if(!el)return;
  el.textContent = UNDOC.can_undo ? `\u21A9 ${UNDOC.next}` : '';
  el.title = UNDOC.can_undo ? `\u2318Z to undo: ${UNDOC.next}` : '';
  el.style.visibility = UNDOC.can_undo ? 'visible' : 'hidden';
  el.onclick = () => doUndo(false);
}
async function doUndo(redo){
  const r=await post('/api/undo',{redo:!!redo}).catch(()=>null);
  if(!r||!r.ok){ toast(redo?'nothing to redo':'nothing to undo'); await refreshUndo(); return; }
  await load(); await refreshUndo();
  toast(`${redo?'redid':'undid'} \u2014 ${r.label}`);
}

/* ---------------- where you were ----------------
   Every redraw replaces the innerHTML of a pane, which puts its scroll back
   to the top. That is fine for a list of 14 and maddening for one of 4,048:
   decide on a track two thirds down Bought Tracks and the redraw throws you
   back to the As. So each scrollable body remembers its offset, keyed by
   WHAT IS IN IT rather than by the element -- the drive pane scrolled to
   `beatles` and the same pane scrolled to Apple Music are different places,
   and switching between them should return you to each.  */
const SCROLL={};
// One identity for "which list is on screen". Both memories key off it, so a
// place you come back to is the same place you left -- the row you had
// selected as well as how far down you were.
function listKey(){
  const pick = albPick ? 'alb:'+albPick
    : active==='ipod' ? (colPick||devPick||'__all') : active==='am' ? amPick : t7Pick;
  return 'list:'+active+':'+pick+':'+filter+':'+(q||'');
}
const SELMEM={};
function recallSel(){ return SELMEM[listKey()]||0; }
function scrollKey(el){
  if(el.id==='srcbody') return 'src:'+stab;
  if(el.id==='list')     return listKey();
  if(el.id==='rbody')    return 'right:'+rtab;
  return el.id;
}
// DO NOT RECORD FROM THE SCROLL EVENT. A backgrounded tab dispatches no
// scroll events at all -- not even for a programmatic scrollTop -- so a
// listener-based memory is simply absent whenever the window is behind
// another one, which is most of the time. The offset is instead READ
// SYNCHRONOUSLY, under the key the pane is LEAVING, before anything changes.
// (An earlier attempt also cleared a `drawing` flag inside
// requestAnimationFrame, which likewise never fires in a background tab: the
// flag wedged on and disabled the whole thing. A deadline is used below
// instead, because a deadline expires on its own.)
let drawUntil=0;
const redrawing=()=>performance.now()<drawUntil;
const PANES=['#colbody','#srcbody','#list','#rbody'];
const LASTKEY={};                  // element id -> the key it is showing now
function captureScroll(){
  PANES.forEach(id=>{
    const el=$(id); if(!el)return;
    const k=LASTKEY[id];
    if(k!==undefined)SCROLL[k]=el.scrollTop;
  });
}
function noteKeys(){
  PANES.forEach(id=>{ const el=$(id); if(el)LASTKEY[id]=scrollKey(el); });
}
function restoreScroll(){
  PANES.forEach(id=>{
    const el=$(id); if(!el)return;
    const v=SCROLL[scrollKey(el)];
    if(v)el.scrollTop=v;
  });
}
// Where events DO fire (a foreground tab), this keeps the memory current
// between redraws -- a scroll with no redraw after it would otherwise only be
// captured at the next one. It is a top-up, never the source of truth.
PANES.forEach(id=>{
  const el=$(id);
  if(el)el.addEventListener('scroll',()=>{
    if(redrawing())return;             // a redraw zeroing the box is not a scroll
    SCROLL[scrollKey(el)]=el.scrollTop;
  },{passive:true});
});

/* ---------------- folding the side panes ---------------- */
// L is the iPod, A is Apple Music, R is buy/vinyl. Each is pinned to its own
// grid track, so folding one never moves another.
const FOLD={L:['nl','<','>'],S:['ns','<','>'],R:['nr','>','<']};
function setFold(which,off){
  const [cls,open,shut]=FOLD[which];
  document.body.classList.toggle(cls,off);
  $('#fold'+which).textContent = off?shut:open;
  try{ localStorage['saltpod.fold'+which]=off?'1':'0'; }catch(e){}
}
function fold(which){ setFold(which,!document.body.classList.contains(FOLD[which][0])); }
(function(){
  let l=null,a=null,r=null;
  try{ l=localStorage['saltpod.foldL']; a=localStorage['saltpod.foldS']; r=localStorage['saltpod.foldR']; }catch(e){}
  // No stored preference: fold from the outside in. Four panes fit a laptop,
  // so only a genuinely narrow window starts folded.
  // measured, not guessed: with all four panes open the centre is 280px at
  // 1100, which is not a list you can read. The source pane folds first.
  const narrow=window.innerWidth<860, tight=window.innerWidth<1240;
  setFold('L', l==null ? narrow : l==='1');
  setFold('S', a==null ? tight : a==='1');
  setFold('R', r==null ? narrow : r==='1');
})();

/* the filter: the funnel in the centre strip opens a popover; the strip names the active filter beside it */
// The funnel opens the row menu's material with one radio row per filter
// (paintMenu, kind 'filter'). A filter that is on is never hidden: its name
// sits beside the funnel, in the strip, where the list is titled. The
// toggle is a button by role, focusable, with the state in its name and the
// popup it owns declared.
function paintFilterToggle(){
  const on=filter!=='all', el=$('#flmodes'); if(!el)return;
  const open=!!(MENU&&MENU.kind==='filter');
  const flabel=on?'filter: showing '+filter:'filter: showing everything';
  el.innerHTML=(on?`<span class="fname" title="filtered: ${esc(filter)}">${esc(filter)}</span>`:'')
    +`<span class="${on?'on':''}" id="fltoggle" role="button" tabindex="0" aria-haspopup="menu"
     aria-expanded="${open?'true':'false'}" aria-label="${esc(flabel)}" title="${on?'filtered: '+filter:'filter'}">${ICON_FILTER}</span>`;
  const t=$('#fltoggle');
  // stopPropagation: the same keystroke must not reach the document handler,
  // which would see the popover it just opened and choose a row with it
  t.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); toggleFilterMenu(); } };
  t.onclick=toggleFilterMenu;
  const n=el.querySelector('.fname'); if(n)n.onclick=toggleFilterMenu;
}
function toggleFilterMenu(){
  if(MENU&&MENU.kind==='filter')closeMenu(); else openMenu($('#fltoggle'),'filter',null);
}
// The popover's keys, while it is open: arrows move a focus highlight (and
// focus) through the radio rows, Home/End jump, Enter or Space chooses,
// Escape closes and hands focus back to the funnel. `f` is not here: it
// keeps cycling the filter as it always has, and draw() closes the menu.
function menuKeys(e){
  // the keys popover is a listing: Escape closes it and nothing else is its own
  if(MENU&&MENU.kind==='keys'){ if(e.key==='Escape'){e.preventDefault();closeMenu();return true;} return false; }
  const rows=[...menu.querySelectorAll('[role="menuitemradio"]')]; if(!rows.length)return false;
  let i=rows.findIndex(r=>r.classList.contains('focus'));
  if(i<0)i=rows.findIndex(r=>r.getAttribute('aria-checked')==='true');
  const go=j=>{ rows.forEach((r,x)=>r.classList.toggle('focus',x===j)); rows[j].focus(); };
  if(e.key==='ArrowDown'){e.preventDefault();go((i+1)%rows.length);return true;}
  if(e.key==='ArrowUp'){e.preventDefault();go((i-1+rows.length)%rows.length);return true;}
  if(e.key==='Home'){e.preventDefault();go(0);return true;}
  if(e.key==='End'){e.preventDefault();go(rows.length-1);return true;}
  if(e.key==='Enter'||e.key===' '){e.preventDefault(); if(i>=0)rows[i].onclick(); return true;}
  if(e.key==='Escape'){e.preventDefault();closeMenu();const t=$('#fltoggle');if(t)t.focus();return true;}
  return false;
}

/* ---------------- loading, counting, filtering ---------------- */
async function load(){
  const [r,d,a,dv,lo]=await Promise.all([
    fetch('/api/tracks').then(r=>r.json()),
    fetch('/api/discogs').then(r=>r.json()).catch(()=>null),
    fetch('/api/playlists').then(r=>r.json()).catch(()=>null),
    fetch('/api/device').then(r=>r.json()).catch(()=>null),
    fetch('/api/local').then(r=>r.json()).catch(()=>null)]);
  if(dv){DEV=dv; if(devPick&&!DEV.playlists.some(p=>p.name===devPick))devPick=null;}
  if(lo){T7=lo; if(t7Pick&&!T7.folders.some(f=>f.name===t7Pick))t7Pick=null;
  }
  if(d){DISCOGS=d; OWN=new Map((d.collection||[]).map(x=>[x.key,x])); WANT=new Map((d.wantlist||[]).map(x=>[x.key,x]));}
  if(a){AMP=a.playlists||[]; AMREAD=a.read_at; AMLIB=a.library||0;
        if(amPick&&amPick!=='__all__'&&!AMP.some(p=>p.slug===amPick))amPick=null;}
  SYNCED=r.synced||[];
  if(r.podcasts)PODCASTS=r.podcasts;
  ALL=r.tracks; COLS=r.collections; ORDER=r.order||{}; SLUGS=r.slugs; TOTALS=r.totals||{};
  ONPOD_ORDER=r.on_ipod_order||[]; VINYL_ORDER=r.vinyl_order||[];
  if(r.rev)REVSEEN=Math.max(REVSEEN,r.rev);
  BYKEY=new Map(ALL.map(t=>[t.key,t]));
  COLS.forEach(c=>PENDING.delete(c));                    // it exists now
  if(colPick&&!COLS.includes(colPick)&&!PENDING.has(colPick))colPick=null;   // renamed or deleted under us
  draw();
}
function counts(){
  const c={undecided:0,sync:0,remove:0,vinyl:0,bought:0};   // `undecided` is the null, never shown
  ALL.forEach(t=>{c[t.tier]++; if(t.vinyl)c.vinyl++; if(t.bought)c.bought++;});
  // "to buy" is what you still have to go and get: marked sync, not held
  // bought, and no file for it anywhere on your drives.
  const todo={length:(TOTALS.to_buy||0)}, eur=TOTALS.to_buy_eur||0;
  // what the next sync would do: the server's count (curate.sync_counts),
  // looked up, never added up here -- the Swift client reads the same four
  const offs=TOTALS.sync_off||0, ons=TOTALS.sync_on||0;
  const waiting=TOTALS.sync_waiting||0;
  const pend=TOTALS.sync_pending||0, sb=$('#dosync');
  sb.textContent = pend ? `Sync · ${pend}` : 'Sync';
  sb.classList.toggle('pending',pend>0);
  sb.title = (pend ? `${offs} to take off the iPod, ${ons} to put on — nothing has changed on the device yet`
                   : 'write the collections to the iPod')
           + (waiting ? ` · ${waiting} more are owned but on a drive that is not mounted` : '');
  $('#counts').innerHTML=`<span><s>${ALL.length}</s> tracks</span>
    <span><s>${todo.length}</s> to buy</span>
    <span><s>&euro;${eur.toFixed(2)}</s> final</span>`;
}
function pass(t){
  if(q){const h=(t.artist+' '+t.title+' '+(t.album||'')).toLowerCase(); if(!h.includes(q))return false;}
  if(filter==='all')return true;
  // MEMBERSHIP, NOT A PREDICATE. Every one of these used to be a rule
  // spelled out here -- and so would have been spelled out again in Swift,
  // and once more in anything else that ever read this API. The server
  // decides what belongs in a list; this looks the answer up.
  if(filter==='vinyl')return t.vinyl;        // the flag you set, not a list
  return (t.lists||[]).includes(filter);
}
const filtered=()=>!!q||filter!=='all';
// what a click would actually play, named rather than left to be guessed
// -- `play` is the server's answer (curate.row_play); this only words it
const PLAYS_FROM={t7:'plays from the T7', ipod:'plays from the iPod'};
function heard(t){
  if(t.play==='file')    return `<span style="color:var(--ink)">${PLAYS_FROM[t.play_from]||'plays the file'}</span>`;
  if(t.play==='preview') return 'a 30s preview';
  return '<span class="warn">nothing to play</span>';

// every place that holds it, in a fixed order -- never a claim about which came first
// a Classic, at 11px: body, screen, click wheel
const IPOD_SVG='<svg viewBox="0 0 12 19" width="8" height="13" aria-hidden="true">'
  +'<rect x=".6" y=".6" width="10.8" height="17.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.1"/>'
  +'<rect x="2.5" y="2.7" width="7" height="5.2" rx=".7" fill="currentColor" opacity=".55"/>'
  +'<circle cx="6" cy="13.4" r="3" fill="none" stroke="currentColor" stroke-width="1.1"/>'
  +'<circle cx="6" cy="13.4" r=".85" fill="currentColor"/></svg>';
function srcStrip(t){
  const g=[];
  if(t.am)      g.push(t.am_status ? `<span class="gone" title="in Apple Music, ${esc(t.am_status)}">AM</span>`

  // Struck through when the volume holding it is not mounted -- the same
  // mark Apple Music uses for a track that is listed but cannot be had.
  if(t.t7)      g.push(t.reachable
                  ? `<b title="stored on the drive${t.lossless?', lossless':''}">T7</b>`
                  : `<span class="away" title="on a drive that is not mounted — plug it in to sync this">T7</span>`);
  // the iPod is NOT in this strip -- it sits at the end of the row, beside
  // the chevron, where it never moves. See rowHTML.
  if(owned(t))  g.push('<b title="you own the record">LP</b>');
  else if(wanted(t)) g.push('<span title="on the Discogs wantlist">lp</span>');

function tagsFor(t){
  const g=[];

  if(t.tier==='remove')g.push('<span class="tag skip">remove</span>');

  if(!colPick)t.collections.forEach(c=>g.push(`<span class="tag">${esc(c)}</span>`));
  if(t.bc_verdict==='confirmed')g.push('<span class="tag">FLAC</span>');
  return g.join('');
}
// A row for something seen only in Apple Music. It renders like any other so
// the eye does not have to switch modes; the moment you decide on it, `adopt`
// gives it a record and it becomes one.
// Which cloud statuses mean owned, and the row's state, are the server's
// answers (curate.am_row_answers, on /api/library and /api/peek rows).
function libRow(r){
  const hit=BYKEY.get(r.key); if(hit)return hit;
  return {key:r.key, artist:r.artist, title:r.title, album:r.album, seconds:r.secs,
          tier:'', vinyl:false, bought:false, collections:[], playlists:[],
          device:false, t7:false, am:true, am_owned:!!r.am_owned, am_status:r.am_status||null,
          state:r.state, play:r.play, decision:r.decision,
          play_from:null, audio:false, preview:null, art:null, lean:true};
}
function rowHTML(t,i,seq){
  const dur=mmss(t.seconds||t.dev_seconds);
  // LAW 3 IN WORDS, NOT JUST OPACITY. Each state is a 45% or 30% opacity
  // drop and nothing else, so a title carries the same fact for anyone who
  // cannot see the difference -- and now there are three of them, because
  // "buy it" and "plug the drive in" are not the same instruction. Which
  // one a row is in is the server's answer (`state`, curate.row_state).
  const state = t.state==='ready' ? '' : (t.state||'');
  const stateTitle = state === 'unowned'
      ? ' title="not yet available — buy it or sync the file"'
      : state === 'offline'
      ? ' title="you own this, but the drive holding it is not mounted — plug it in to sync"'
      : '';
  // role=option + aria-selected is the ARIA half of law 2's blue: the
  // listbox's selected option IS "where you are". MARK.has(t.key) is false
  // for every row while nothing is marked, which is the correct default --
  // mark() below corrects the one cursor row to true when there is no
  // multi-selection.
  return `<div id="trk-${i}" class="row ${t.tier==='remove'?'skip':''} ${state} ${MARK.has(t.key)?'marked':''}" role="option" aria-selected="${MARK.has(t.key)}"${stateTitle} draggable="true" data-move="drag-in drag-to-vinyl" data-words="the row" data-i="${i}" data-k="${esc(t.key)}">
    ${t.art?`<img class="art" src="${t.art}" loading="lazy" draggable="false">`:'<div class="art"></div>'}
    <div class="t"><div class="n">${esc(t.artist)} — ${esc(t.title)}</div>
      <div class="s">${[esc(t.album||t.dev_album||''), dur?'<span class="dur" data-full="'+dur+'">'+dur+'</span>':'', t.price?'€'+t.price.toFixed(2):'',
        heard(t)].filter(Boolean).join(' · ')}</div></div>
    <div class="src">${srcStrip(t)}</div>
    <div class="tags">${tagsFor(t)}<span class="br">${t.quality?`<b>${esc(t.quality)}</b>`:''}</span><span class="pod">${t.device?IPOD_SVG:''}</span><span class="ch">&rsaquo;</span><span class="eq"><i></i><i></i><i></i><span class="sr-only eqsr">playing</span></span>${seq?'<span class="grab">⋮⋮</span>':''}<span class="more" data-move="dots open-menu" role="button" aria-haspopup="menu" aria-expanded="false" aria-label="more actions" title="more">&#8943;</span></div></div>`;
}

/* ---------------- drawing ---------------- */
function draw(){
  drawUntil=performance.now()+150;
  closeMenu(); counts(); drawCols(); drawMid(); drawRight(); drawFoot(); paintPlaying();
  restoreScroll(); noteKeys();
  // any scroll events innerHTML caused land after this tick; setTimeout fires
  // in a background tab, requestAnimationFrame does not
  setTimeout(()=>{ restoreScroll(); noteKeys(); },0);
}

/* THE FOOTER'S KEYS: a lookup table, never derived. One row per context --
   what you are looking at -- and each entry is [key cap, verb, primary]. The
   primaries come first in ink, the rest dim. Every cap names a key the
   keydown handler at the end of this script actually handles, under the
   verb it performs there: `b` is the sync tier, which for a track you do
   not own is the buy list; `x` inside a collection takes the track out of
   it; the reorder keys are shift-J / shift-K (nudge), not a modifier
   chord, and the buy list has no drop key because the handler has none. An
   iPod view that is not a collection (All on iPod, a smart list, the
   device's lists) is the collection row without take-out and move. */
const KEYS={
  col:   [['space','play',1],['s','sync',1],['x','take out',1],['⇧J ⇧K','move',1],['c','collection',0],['i','info',0],['.','menu',0],['/','search',0]],
  ipod:  [['space','play',1],['s','sync',1],['c','collection',0],['i','info',0],['.','menu',0],['/','search',0]],
  am:    [['c','add to collection',1],['b','buy',1],['v','vinyl',1],['space','preview',1],['i','info',0],['.','menu',0],['/','search',0]],
  drive: [['c','add to collection',1],['space','play',1],['i','info',1],['v','vinyl',0],['.','menu',0],['/','search',0]],
  buy:   [['b','buy',1],['v','vinyl',1],['space','preview',0],['i','info',0],['/','search',0]]};
const KEY_GROUPS=[['col','an iPod collection'],['am','an Apple Music playlist'],['drive','an album on the drive'],['buy','the buy list']];
// The context is read off the page's own state: the right pane's focus,
// then which source is active, then whether a collection is open.
let rightFocus=false;
function footCtx(){
  if(rightFocus) return 'buy';
  if(active==='am') return 'am';
  if(active==='t7') return 'drive';
  return colPick ? 'col' : 'ipod';
}
const kbdHTML=cap=>cap.split(' ').map(c=>`<kbd>${c}</kbd>`).join('');
const keyHTML=x=>`<span class="kk ${x[2]?'p':'s'}">${kbdHTML(x[0])}${x[1]}</span>`;
const ALLKEYS_HTML='<span class="kk all" id="allkeys" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false" title="every key, by context"><kbd>?</kbd>all keys</span>';
function wireAllKeys(){
  const a=$('#allkeys'); if(!a)return;
  a.onclick=e=>{ if(e&&e.stopPropagation)e.stopPropagation(); toggleKeysMenu(a); };
  a.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();toggleKeysMenu(a);} };
}
function toggleKeysMenu(anchor){
  if(MENU&&MENU.kind==='keys'){closeMenu();return;}
  openMenu(anchor||$('#allkeys'),'keys');
}
function drawFoot(){
  const inCol=active==='ipod'&&!!colPick;
  // With a selection live, the strip stops advertising single-track keys and
  // says what the selection is and how to drop it -- the one thing you need
  // to know while a bulk action is one keystroke away.
  if(MARK.size){
    $('#keys').innerHTML=`<span class="selcount"><b>${MARK.size}</b> selected</span>
      <span class="kk p"><kbd>s</kbd>sync all</span><span class="kk p"><kbd>x</kbd>${inCol?'take all out':'remove all'}</span>
      <span class="kk p"><kbd>c</kbd>add all to playlist</span><span class="kk s"><kbd>esc</kbd>clear</span>${ALLKEYS_HTML}
      <button id="undoc" class="undoc" type="button" data-move="undo"></button><span id="saved" style="margin-left:auto"></span>`;
    wireAllKeys(); paintUndo();
    return;
  }
  $('#keys').innerHTML=(KEYS[footCtx()]||KEYS.ipod).map(keyHTML).join('')+ALLKEYS_HTML
    +`<button id="undoc" class="undoc" type="button" data-move="undo"></button><span id="saved" style="margin-left:auto"></span>`;
  wireAllKeys(); paintUndo();
}
// The right pane's focus is a context of its own (the buy list's keys).
// #rbody is focusable so a click in the pane lands there; focus leaving
// the pane hands the footer back to the list behind it.
(function(){
  const r=$('#right'); if(!r)return;
  const set=on=>{ if(on!==rightFocus){rightFocus=on; drawFoot();} };
  r.addEventListener('focusin',()=>set(true));
  r.addEventListener('focusout',e=>{ if(!e.relatedTarget||!r.contains(e.relatedTarget))set(false); });
  const l=$('#list'); if(l)l.addEventListener('focusin',()=>set(false));
})();

/* ONE LIST VIEW, whatever is feeding it.
   The centre used to be three renderers -- iPod, Apple Music, drive -- and
   they had drifted: filters existed on one and were silently dropped on the
   other two, so `filter` stayed set to "on iPod" and simply stopped applying
   when you switched source, then resumed when you switched back. The list
   meant different things in different panes without saying so.
   Now one renderer. `currentList()` answers the only question that really
   differs -- which rows, and what is this called -- and everything after it
   is identical: same filters, same search, same cap, same numbering rule. */
function currentList(){
  if(albPick){
    const pane = active==='ipod' ? 'ipod' : 'src';
    const a=(pane==='ipod'?PODALBUMS:SRCALBUMS).find(x=>x.key===albPick);
    if(a) return {rows:a.tracks, lib:pane==='ipod'?'on the iPod':(stab==='t7'?'library':'apple music'),
      ordered:true, readonly:pane!=='ipod', foreign:pane!=='ipod', picked:true,
      title:a.album||'—', note:esc(a.artist||''), album:a,
      blank:'Empty album.'};
  }
  if(active==='am'){
    const pl=amPick&&amPick!=='__all__'&&AMP.find(p=>p.slug===amPick);
    const src=amPick==='__all__'?LIB:(PEEK&&PEEK.name===(pl||{}).name?PEEK.tracks:[]);
    return {rows:src.map(libRow), lib:pl?'apple music':'', ordered:!!pl, readonly:true, foreign:true,
      title: pl?pl.name:(amPick==='__all__'?'All in Apple Music':'Apple Music'),
      note: pl?`created ${(pl.created||'?').slice(0,10)}`:'',
      loading: peeking, picked: !!amPick,
      pour: pl?()=>pourPlaylist(pl.name,null):null,
      blank:`Pick a playlist on the left, or All of Apple Music. Nothing here is
        edited — this is the library to take from.`};
  }
  if(active==='t7'){
    const f=t7Pick&&t7Pick!=='__all__'&&T7.folders.find(x=>x.name===t7Pick);
    const src=(T7TRACKS&&T7TRACKS.name===t7Pick)?T7TRACKS.tracks:[];
    return {rows:src.map(t7Row), lib:f?esc(T7.root||'Library'):'', ordered:!!f, readonly:true, foreign:true,
      title: t7Pick==='__all__'?'All in Library':(t7Pick||'Library'),
      note: f&&f.lossless?`${f.lossless} lossless`:'',
      loading: t7Loading, picked: !!t7Pick, pour: f?()=>pourFolder(f.name,null):null,
      blank:`Pick a folder on the left. This is the music you already own,
        indexed ${esc(T7.built||'never')}, grouped the way the drive groups it.`};
  }
  const dp=devPick&&DEV.playlists.find(p=>p.name===devPick);
  if(dp) return {rows:dp.keys.map(k=>BYKEY.get(k)).filter(Boolean), lib:'on the iPod',
    ordered:true, readonly:true, title:dp.name, picked:true,
    note: dp.smart?'a smart playlist, refreshed on every sync':'not a collection yet',
    takeover: dp.smart?null:dp, blank:'Empty on the device.'};
  if(colPick) return {rows:(ORDER[colPick]||[]).map(k=>ALL.find(t=>t.key===k)).filter(Boolean),
    lib:'collection', ordered:true, readonly:false, title:colPick, picked:true, note:'',
    blank:'Empty. Drag tracks in from the library, or press <kbd>c</kbd> on a track.'};
  // The left pane is the iPod and nothing else, so its "All tracks" is the
  // device's own Songs menu: everything actually on it, ordered the way the
  // Classic orders it. This used to be the whole curation state -- a leftover
  // from when the pane was a library switcher -- which put 565 rented tracks
  // that are not on the device under a heading that says they are.
  // The order is the server's (on_ipod_order, debt D6), sent as keys.
  const on=ONPOD_ORDER.map(k=>BYKEY.get(k)).filter(Boolean);
  return {rows:on, lib:'', ordered:false, readonly:true, title:'All on iPod',
    picked:true, note:'', blank:'Nothing on the device yet.'};
}

function drawMid(){
  // the filters belong to the LIST, not to one source: always drawn, always applied
  // `on iPod` says nothing inside the iPod pane, and `rented only` cannot be
  // true of anything on the device. Offering a filter that can only ever
  // return everything or nothing is a dead control.
  const inPod = active==='ipod';
  FSHOWN = FILTERS.filter(f=>!(inPod&&(f==='on iPod'||f==='rented only')));
  if(!FSHOWN.includes(filter))filter='all';
  const sc=$('#selclr'); if(sc)sc.onclick=()=>{clearMark();draw();};
  paintFilterToggle();

  const L=currentList();
  const all=L.rows, shown=all.filter(pass);
  view=shown.slice(0,CAP);
  MIDROWS=all.length;   // what All would show: the list's own rows, before this page's filter and cap

  $('#midh').innerHTML=esc(L.title)+(L.lib?` <span style="color:var(--dim)">· ${L.lib}</span>`:'');
  // the listbox's own name follows what it is showing -- the same title
  // already computed for #midh, just read once more rather than decided again
  $('#list').setAttribute('aria-label',(L.title||'Tracks')+(L.lib?' · '+L.lib:''));

  const acts=$('#midacts'); acts.innerHTML='';
  if(L.takeover) acts.innerHTML=`<span class="act" id="takeover" title="a collection of the same name and order; from then on it is yours to edit and sync">make it a collection</span>`;
  else if(L.pour) acts.innerHTML=`<span class="act" id="pourit" title="a collection of the same name and order">make it a collection</span>`;
  const tk=$('#takeover'); if(tk)tk.onclick=()=>takeOver(L.takeover);
  const po=$('#pourit');   if(po)po.onclick=()=>L.pour();

  const mins=Math.round(all.reduce((a,t)=>a+(t.seconds||t.dev_seconds||0),0)/60);
  const known=all.filter(t=>!t.lean).length;
  // A selection outranks the tally: it is the thing you are about to act on.
  $('#midstat').innerHTML = !L.picked ? ''
    : L.loading ? 'reading…'
    : MARK.size ? `<span class="selcount"><b>${MARK.size}</b> selected</span><span class="selclear" id="selclr">clear</span>`
    : [ filtered()? `<s>${shown.length}</s> of ${all.length}` : `<s>${all.length}</s> tracks`,
        (!filtered()&&mins&&L.picked)?`${mins} min`:'',
        (L.foreign&&known)?`${known} in curation`:'',
        L.note,
        (!L.readonly&&filtered())?'clear the filter to re-sequence':'',
        (shown.length>CAP)?`${CAP} shown`:'' ].filter(Boolean).join(' · ');

  let h='';
  if(!L.picked)        h=`<p class="note">${L.blank}</p>`;
  else if(L.loading)   h=`<p class="note">Reading…</p>`;
  else if(!view.length)h=`<p class="note">${all.length?'Nothing in here matches.':L.blank}</p>`;
  else {
    // A picked list is a sequence, so it is numbered in its own order --
    // whether it came from the iPod, Apple Music or the drive. Only our own
    // collections can be re-sequenced; the rest are numbered but not grabbable.
    // one layout for every list; the handle appears only where a drag would
    // actually change the order -- our own collections, unfiltered
    const seq = L.ordered && !L.readonly && !filtered();
    h=view.map((t,i)=>rowHTML(t,i,seq)).join('');
  }
  if(shown.length>CAP)h+=`<p class="note">${shown.length-CAP} more — search to narrow.</p>`;

  $('#list').innerHTML=h;
  wireRows();
  // A SELECTION BELONGS TO ONE LIST. Leaving the list drops it: marks you
  // cannot see are marks you will act on by accident, and every action in
  // this tool writes to the device eventually.
  if(MARK.size&&MARKLIST!==listKey())clearMark();
  if(view.length&&sel>=view.length)sel=view.length-1;   // never clamp an empty (loading) list
  mark();
}
// An iTunes-made or hand-made playlist becomes a collection of the same name
// and order. Sync then treats it as an update, and from then on it is ours.
async function takeOver(dp){
  if(COLS.includes(dp.name)){toast('already a collection');return;}
  if(!dp.keys.length){toast('nothing in it to take');return;}
  const r=await post('/api/decide',{keys:dp.keys,collection:dp.name,mode:'add'});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  await post('/api/decide',{reorder:{collection:dp.name,keys:dp.keys}});
  devPick=null; colPick=dp.name; sel=0; await load(); toast(`${dp.name} is a collection now`);
}
function wireRows(){
  const canSeq=active==='ipod'&&!!colPick&&!filtered();
  $('#list').classList.toggle('hasmark',MARK.size>0);
  [...$('#list').querySelectorAll('.row')].forEach(r=>{
    // The three conventions every list in every OS uses, and the reason the
    // cursor and the selection are separate: shift needs an anchor to measure
    // a range from, and that anchor is where the cursor already was.
    // THE BROWSER EXTENDS A TEXT SELECTION ON MOUSEDOWN, before any click
    // handler runs -- so shift-clicking a range highlighted every track name
    // it passed over as well as marking the rows. `user-select: none` does
    // not help: the anchor is set outside the row. The only thing that stops
    // it is refusing the default on the way down.
    r.onmousedown=e=>{ if(e.shiftKey){ e.preventDefault();
      const sel=window.getSelection && window.getSelection(); if(sel)sel.removeAllRanges(); } };
    r.onclick=e=>{
      const i=+r.dataset.i;
      if(e.shiftKey){ e.preventDefault(); markRange(sel,i); sel=i; draw(); return; }
      if(e.metaKey||e.ctrlKey){
        e.preventDefault(); syncMarkList();
        const k=r.dataset.k; MARK.has(k)?MARK.delete(k):MARK.add(k);
        sel=i; draw(); return; }
      // a plain click is a fresh start, which is what makes a selection safe
      const had=clearMark(); sel=i; had?draw():mark();
    };
    const mo=r.querySelector('.more');
    if(mo)mo.onclick=e=>{e.stopPropagation(); const i=+r.dataset.i;
      // the dots on a row OUTSIDE the selection mean that row, not the selection
      if(MARK.size&&!MARK.has(r.dataset.k)){clearMark(); sel=i; draw();} else {sel=i; mark();}
      openMenu(mo,'track',view[sel]);};
    r.ondblclick=()=>{clearMark();sel=+r.dataset.i;mark();play();};
    r.ondragstart=e=>{
      // Dragging a row inside the selection carries the whole selection; the
      // payload is newline-joined so every existing drop target keeps working
      // through dropKeys(). Dragging a row outside it means just that row.
      const many = MARK.size && MARK.has(r.dataset.k);
      e.dataTransfer.setData('text/plain', many ? markedKeys().join('\n') : r.dataset.k);
      e.dataTransfer.effectAllowed='copyMove';
      r.classList.add('dragging');
      if(!many){ clearMark(); sel=+r.dataset.i; mark(); }
    };
    r.ondragend=()=>{r.classList.remove('dragging');
      document.querySelectorAll('.over,.drop').forEach(x=>x.classList.remove('over','drop'));};
    if(canSeq){
      r.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';r.classList.add('over');};
      r.ondragleave=()=>r.classList.remove('over');
      r.ondrop=async e=>{
        e.preventDefault(); e.stopPropagation(); r.classList.remove('over');
        const dk=dropKeys(e); if(!dk.length)return;
        const keys=(ORDER[colPick]||[]).slice(), to=+r.dataset.i;
        const inside=dk.filter(k=>keys.includes(k));
        if(!inside.length){ await decide({collection:colPick,mode:'add'},dk); return; }  // came from outside
        // A BLOCK MOVES AS A BLOCK, and keeps its own internal order -- the
        // sequence you arranged inside the selection is as much the product
        // as the sequence of the list. Aim at the row you want the block to
        // land on, measured after the block is lifted out.
        const block=keys.filter(k=>inside.includes(k));
        const anchor=keys[to];
        const rest=keys.filter(k=>!inside.includes(k));
        let at=rest.indexOf(anchor);
        if(at<0)at=Math.min(to,rest.length);            // dropped onto the block itself
        else if(to>keys.indexOf(block[0]))at+=1;        // moving down: land after the anchor
        rest.splice(at,0,...block);
        if(rest.join('\u0000')===keys.join('\u0000'))return;
        await saveOrder(colPick,rest,at);
      };
    }
  });
}
function mark(){
  if(view.length)SELMEM[listKey()]=sel;   // never record the empty loading state

  // aria-selected follows MARK when there is one -- rowHTML() already wrote
  // that onto every row -- and the single cursor row otherwise. Touching it
  // here only in the no-mark case is what keeps the two from fighting.
  document.querySelectorAll('#list .row').forEach(r=>{
    r.classList.remove('sel','gl-sel');
    if(!MARK.size)r.setAttribute('aria-selected','false');
  });
  const r=document.querySelector(`#list .row[data-i="${sel}"]`);
  // Scrolling the selected row into view is right when YOU moved the
  // selection, and wrong during a redraw -- there it fights the restore and
  // wins, dragging you back to the selected row instead of where you were.
  if(r){
    r.classList.add('sel');
    // The glass is the system's: .gl-sel paints it. A cursor row outside a
    // live selection keeps only its rim (see #list.hasmark in the sheet).
    if(!MARK.size||r.classList.contains('marked'))r.classList.add('gl-sel');
    if(!MARK.size)r.setAttribute('aria-selected','true');
    $('#list').setAttribute('aria-activedescendant',r.id);
    if(!redrawing())r.scrollIntoView({block:'nearest'});
  } else {
    $('#list').removeAttribute('aria-activedescendant');
  }
  followGround();
}
async function saveOrder(col,keys,to){
  ORDER[col]=keys; sel=to;
  const r=await post('/api/decide',{reorder:{collection:col,keys}});
  if(!r.ok)toast('NOT SAVED'); else saved();
  draw();
}
// J / K move the selected row one place in the FULL order, so they are only
// offered when the full order is what is on screen. The row menu offers the
// same four moves (law 7: nothing is keyboard-only either), and 'top' /
// 'bottom' are the two ends the keys never reached.
function canNudge(){ return active==='ipod' && !!colPick && !filtered(); }
function nudge(dir){
  if(!canNudge())return;
  const keys=(ORDER[colPick]||[]).slice(), t=view[sel]; if(!t)return;
  const from=keys.indexOf(t.key);
  const to = dir==='top' ? 0 : dir==='bottom' ? keys.length-1 : from+dir;
  if(from<0||to<0||to>=keys.length||to===from)return;
  keys.splice(from,1); keys.splice(to,0,t.key);
  saveOrder(colPick,keys,to);
}

/* ---------------- left: collections, each a drop target ---------------- */
// The Podcasts collection: its effect on sync is the podcast media type, not
// a playlist, so its count and pending mark are the server's answers --
// looked up here, never worked out from the rows.
function podRow(c){
  const p=PODCASTS, on=c===colPick&&active==='ipod', pend=p.pending>0;
  return colRow({name:esc(c), cnt:(on&&pend?'<span class="pdot"></span>':'')+(pend?`+${p.pending}`:p.n), menu:true, moreMove:'podcast-dots',
    attrs:` data-c="${esc(c)}"`,
    cls:`${c===colPick?(active==='ipod'?'on':'was'):''} ${pend?'pend':''}`,
    title:`${esc(c)} — ${p.n} tracks, filed on the iPod as podcasts, not as a playlist${pend?`; the next sync changes ${p.pending}`:''}`});
}
function drawCols(){
  $('#left').querySelector('.plabel').classList.toggle('off',active!=='ipod');
  paintModes('ipod',$('#lmodes'));
  wireNewCol();
  drawSrc();
  if(MODE.ipod==='album'){
    // Albums on the iPod are what the device itself would show: derived from
    // the tags of the tracks actually on it.
    PODALBUMS=albumsOf(ALL.filter(t=>t.device));
    $('#colbody').innerHTML=albumRows(PODALBUMS,'ipod');
    wireAlbums($('#colbody'),'ipod');
    return;
  }
  const n={}; ALL.forEach(t=>t.collections.forEach(c=>n[c]=(n[c]||0)+1));
  const names=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
  let h=colRow({name:'All on iPod', cnt:TOTALS.on_ipod||0,
    cls:(colPick===null&&!devPick&&active==='ipod')?'on':'', attrs:' data-all="1" data-move="leave-collection all-on-ipod"'});
  h+=names.map(c=>{
      if(c===PODCASTS.name)return podRow(c);
      // what sync would still have to do: tracks in it that are not on the device,
      // plus the playlist itself if it has never been written
      const off=(ORDER[c]||[]).filter(k=>!(BYKEY.get(k)||{}).device);
      const ready=off.filter(k=>(BYKEY.get(k)||{}).local).length, waiting=off.length-ready;
      const never=!SYNCED.includes(c)&&!PENDING.has(c);
      const mark=PENDING.has(c)?'new':(off.length?`+${off.length}`:(never?'unsynced':(n[c]||0)));
      const pend=!!(off.length||never||PENDING.has(c)), on=c===colPick&&active==='ipod';
      // On the open row the pending mark is a dot beside an ink count, not
      // orange text: orange on the raised fill is 4.06:1 and fails (law 2's
      // own colour kept, moved from the word to a mark that needs no ratio).
      return colRow({name:esc(c), cnt:(on&&pend?'<span class="pdot"></span>':'')+mark, menu:true, attrs:` data-c="${esc(c)}" data-move="open-collection see-it" data-words="the collection"`,
        cls:`${c===colPick?(active==='ipod'?'on':'was'):''} ${pend?'pend':''}`,
        title:`${esc(c)} — ${n[c]||0} tracks${off.length?`, ${ready} ready to sync, ${waiting} not owned yet`:', all on the iPod'}`});
    }).join('');
  if(!names.length)h+=`<p class="note">None yet. Press <b style="color:var(--ink)">+ new</b>, then drag tracks onto it.</p>`;

  // then everything else the iPod carries -- iTunes-made, hand-made, smart
  const others=DEV.playlists.filter(p=>!p.ours);
  if(others.length){
    const allSmart=others.every(p=>p.smart);
    h+=`<div class="month" title="${allSmart?'smart lists: saltpod refreshes the ones it understands on every sync':''}${DEV.mounted?'':' — read from '+esc(DEV.source||'the last backup')}">${allSmart?'smart · read-only':'on the iPod'}${DEV.mounted?'':' · last seen'}</div>`;
    h+=others.map(p=>colRow({name:esc(p.name), cnt:p.smart?'smart':p.n,
      cls:`dim ${p.name===devPick?(active==='ipod'?'on':'was'):''}`, attrs:` data-dev="${esc(p.name)}"`,
      title:`${esc(p.name)} — ${p.n} tracks${p.smart?', a smart playlist: refreshed from its rules on every sync':', made by iTunes or by hand; not a collection yet'}`
    })).join('');
  }
  $('#colbody').innerHTML=h;
  const body=$('#colbody');
  body.querySelectorAll('[data-dev]').forEach(el=>el.onclick=()=>{activate('ipod');devPick=el.dataset.dev;colPick=null;albPick=null;sel=recallSel();draw();});
  body.querySelector('[data-all]').onclick=()=>{activate('ipod');colPick=null;devPick=null;albPick=null;sel=recallSel();draw();};
  body.querySelectorAll('[data-c]').forEach(el=>{
    const name=el.dataset.c;
    el.onclick=()=>{activate('ipod');colPick=name;devPick=null;albPick=null;sel=recallSel();draw();};
    const mo=el.querySelector('.more');
    if(mo)mo.onclick=e=>{e.stopPropagation(); openMenu(mo,'col',name);};
    el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';el.classList.add('drop');};
    el.ondragleave=()=>el.classList.remove('drop');
    el.ondrop=async e=>{
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
      const dk=dropKeys(e); if(!dk.length)return;
      const key=dk[0];
      if(key.startsWith('alb:')){ const a=SRCALBUMS.find(x=>x.key===key.slice(4));
        if(a)await decide({collection:name,mode:'add'},a.tracks.map(t=>t.key)); return; }
      if(key.startsWith('pl:')){ await pourPlaylist(key.slice(3),name); return; }   // a whole playlist
      if(key.startsWith('t7:')){ await pourFolder(key.slice(3),name); return; }     // a whole folder
      // Already-in is a no-op, not a refusal: dropping ten where three are
      // already there should add the seven, and say so.
      const fresh=dk.filter(k=>{const t=ALL.find(x=>x.key===k); return !(t&&t.collections.includes(name));});
      if(!fresh.length){toast(dk.length>1?`all ${dk.length} already in ${name}`:'already in '+name);return;}
      await decide({collection:name,mode:'add'},fresh);
      const skipped=dk.length-fresh.length;
      toast(`${fresh.length>1?fresh.length+' tracks':'added'} to ${name}`
            + (skipped?` \u00b7 ${skipped} already there`:''));
    };
  });
  // THE WHOLE PANE TAKES A DROP. Aiming at "+ new" to make a collection is
  // a bullseye you should not have to hit: dropping a playlist or a folder
  // anywhere on the iPod means "this belongs on the iPod", and a collection
  // of that name is what that sentence produces. Rows and "+ new" stop
  // propagation, so a precise drop still wins; this only catches the misses.
  const pane=$('#left');
  pane.ondragover=e=>{
    if(!DRAGKIND)return;                       // a bare track needs a target
    e.preventDefault(); e.dataTransfer.dropEffect='copy'; pane.classList.add('drop');
  };
  pane.ondragleave=e=>{ if(!pane.contains(e.relatedTarget))pane.classList.remove('drop'); };
  pane.ondrop=async e=>{
    e.preventDefault(); pane.classList.remove('drop');
    const key=e.dataTransfer.getData('text/plain'); if(!key)return;
    if(key.startsWith('alb:')){ const a=SRCALBUMS.find(x=>x.key===key.slice(4)); if(a)await albumToIpod(a); return; }
    if(key.startsWith('pl:')) return pourPlaylist(key.slice(3),null);
    if(key.startsWith('t7:')) return pourFolder(key.slice(3),null);
  };
  const nc=$('#newcol'); if(!nc)return;
  nc.ondragover=e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; nc.classList.add('drop'); };
  nc.ondragleave=()=>nc.classList.remove('drop');
  nc.ondrop=async e=>{ e.preventDefault(); e.stopPropagation(); nc.classList.remove('drop');
    const key=e.dataTransfer.getData('text/plain'); if(!key)return;
    if(key.startsWith('pl:')){ await pourPlaylist(key.slice(3),null); return; }
    if(key.startsWith('t7:')){ await pourFolder(key.slice(3),null); return; } };
}

/* A new collection is made in the pane it will live in: a field at the top of

/* ---------------- albums, derived ----------------
   Grouped on album artist where there is one and the track artist otherwise,
   so a compilation does not shatter into one album per performer. The key is
   normalised because the same record reaches us from three places -- the
   device, the drive index and Apple Music -- spelled three ways. */
// THE ALBUM NAME ALONE. Keying on artist+album looked safer and shattered
// every compilation: only 904 of 4,048 files carry an album_artist tag, so
// the GTA San Andreas radio stations came out as one album per performer --
// 389 "albums" from 466 tracks, nearly all of them holding one. The device
// groups by album too, and shows Various Artists when the performers differ,
// which is what this now does.
/* The grouping rule now arrives with the track as `album_key`; this is the
   fallback for rows the payload has not reached (an Apple Music row the
   library has not been read for). */
function albumKey(t){
  if(t.album_key !== undefined) return t.album_key || '';
  return (t.album||'').toLowerCase().replace(/\s+/g,' ').trim();
}
const ICON_LIST='<svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true">'
 +'<g fill="currentColor"><rect y="0" width="12" height="1.6" rx=".6"/><rect y="4.2" width="12" height="1.6" rx=".6"/>'
 +'<rect y="8.4" width="12" height="1.6" rx=".6"/></g></svg>';
const ICON_PLUS='<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">'
 +'<g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">'
 +'<line x1="6.5" y1="1.4" x2="6.5" y2="11.6"/><line x1="1.4" y1="6.5" x2="11.6" y2="6.5"/></g></svg>';
const ICON_FILTER='<svg width="12" height="11" viewBox="0 0 12 11" aria-hidden="true">'

function paintModes(pane,el){
  if(!el)return;

  // The iPod pane carries a plus, and it leads the group rather than

             style="visibility:${m==='list'?'visible':'hidden'}">${ICON_PLUS}</span>` : '';

              +`<span class="${m==='list'?'on':''}" data-m="list" title="playlists">${ICON_LIST}</span>`

function albumsOf(rows){
  const by=new Map();
  rows.forEach(t=>{
    const k=albumKey(t); if(!k)return;
    let a=by.get(k);
    if(!a)by.set(k,a={key:k, album:t.album, artist:null, who:new Set(), tracks:[], art:null, onPod:0});
    a.tracks.push(t); a.who.add(t.album_artist||t.artist||'');
    if(!a.art&&t.art)a.art=t.art; if(t.device)a.onPod++;
  });
  by.forEach(a=>{ a.artist = a.who.size===1 ? [...a.who][0] : 'Various Artists'; });
  return [...by.values()].sort((x,y)=>
    (x.artist||'').localeCompare(y.artist||'')||(x.album||'').localeCompare(y.album||''));
}
function albumRows(list,pane){
  if(!list.length)return `<p class="note">No albums here — these tracks carry no album tag.</p>`;
  return list.map(a=>colRow({name:esc(a.album||'—'), sub:esc(a.artist||''), art:a.art||'',
    cnt:a.tracks.length, menu:true, cls:albPick===a.key?'on':'',
    attrs:` data-alb="${esc(a.key)}" draggable="${pane!=='ipod'}"`,
    title:`${esc(a.artist||'')} — ${esc(a.album||'')} · ${a.tracks.length} tracks${a.onPod?', '+a.onPod+' on the iPod':''}`
  })).join('');
}

/* THE ONE LIST ROW.

   Nine places used to hand-assemble this and they disagreed about their own
   internals: four carried a menu slot and five did not, six repeated the
   same inline truncation style that `.col .nm` already does, and the album
   row nested two more inline-styled spans on top. The visible cost was a
   count column that stepped 28px sideways between a playlist and the "All"
   row above it.

   One builder, three slots, always in this order: name, count, menu. The
   menu slot is RESERVED when the row has no menu -- an empty column is what
   keeps every count and every set of dots on the same two verticals down
   the whole pane.

   Variants are class and content, never a different shape.               */
function colRow(o){
  // `mosaic` is a playlist's tiled cover from the server (one picture, or
  // null until it is made): the .mosaic slot is always drawn so the row
  // keeps its shape, empty until the data event brings the file
  const art = o.mosaic !== undefined
    ? `<span class="mosaic">${o.mosaic ? `<img src="${o.mosaic}" alt="" loading="lazy" draggable="false">` : ''}</span>`
    : o.art === undefined ? ''
    : (o.art ? `<img class="albart" src="${o.art}" loading="lazy" draggable="false">`
             : '<span class="albart"></span>');
  const name = o.sub
    ? `<span class="nm two"><i>${o.name}</i><span class="sub">${o.sub}</span></span>`
    : `<span class="nm">${o.name}</span>`;
  // ".on" is law 2's blue, "currently chosen" (Part 7) -- the same fact a
  // sighted reader gets from the raised fill. aria-selected reads the one
  // class string the caller already built; it never looks at a second one.
  const picked = /(^|\s)on(\s|$)/.test(o.cls||'');
  // ROLE COMES FROM THE CALLER, because not every list of these rows is a
  // list you choose ONE of. An `option` outside a `listbox` is invalid ARIA
  // and announces worse than no role at all, and three containers here hold
  // colRow output without being single-choice lists.
  //
  // The sync panel's rows are the interesting case: they are not a report,
  // because you can click one to leave it out of this run -- so they are
  // checkboxes, and ".out" is the unticked state. Both states read the ONE
  // class string the caller already built, never a second fact; that is the
  // same rule aria-selected follows above.
  // AN ARIA CHECKBOX TAKES ITS NAME FROM THE AUTHOR, and that is the whole
  // difference from `option`. `option` falls back to its subtree text, so a
  // row announces itself; `checkbox` has nameFrom:author and does NOT, so
  // without an explicit label a screen reader says "checkbox, not checked"
  // and never says WHICH TRACK. Introduced here this morning along with the
  // checkbox role itself, and caught by bin/pagetest.py's first run.
  const label = String(o.name||'').replace(/<[^>]*>/g,'').trim();
  const role = o.role === null ? ''
    : o.role === 'checkbox'
      ? ` role="checkbox" aria-checked="${!/(^|\s)out(\s|$)/.test(o.cls||'')}"`
        + (label ? ` aria-label="${label}"` : '')
      : ` role="${o.role||'option'}" aria-selected="${picked}"`;
  const moreAttrs = o.menu
    ? ' role="button" aria-haspopup="menu" aria-expanded="false" aria-label="more actions"'
    : ' aria-hidden="true"';   // the reserved, empty slot -- nothing to announce
  // the open row carries the system's .gl-open beside the page's .on: one
  // fact, read from the one class string, said in the system's vocabulary
  return `<div class="col ${o.cls||''}${picked?' gl-open':''}"${role}${o.attrs||''}${o.title?` title="${o.title}"`:''}>`
    + art + name
    + `<span class="cnt">${o.cnt==null?'':o.cnt}</span>`
    + `<span class="more${o.menu?'':' hold'}"${o.moreMove?` data-move="${o.moreMove}" data-words="dots"`:''}${moreAttrs} title="more">&#8943;</span></div>`;
}

/* the drive: what is already owned, filed the way the drive files it */

  // HOW MUCH OF THE LIBRARY CAN BE READ belongs here, with the library's

    el.ondragend=()=>{ DRAGKIND=null; el.classList.remove('dragging'); document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop')); };
  });
}
function wireAlbums(root,pane){

async function t7Peek(name){

// A file on the drive is owned by definition: T7 lit, and never "to buy".

// Album view needs every track of that source, not one playlist's worth.
let SRCTRACKS=null, srcAllFor=null;
async function ensureSrcAll(){
  if(stab==='am'){ await ensureLib(); drawCols(); return; }
  if(srcAllFor==='t7'&&SRCTRACKS)return;
  const r=await fetch('/api/local?folder=__all__').then(r=>r.json()).catch(()=>null);
  SRCTRACKS=(r&&r.tracks)||[]; srcAllFor='t7'; drawCols();
}
async function ensureLib(){
  if(libLoaded)return;
  const r=await fetch('/api/library').then(r=>r.json()).catch(()=>null);
  LIB=(r&&r.tracks)||[]; libLoaded=true;
}
async function peek(name){
  if(!name)return;
  peeking=true; drawMid();
  const r=await fetch('/api/peek?name='+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  peeking=false;
  if(!r||r.error){PEEK=null;toast(r&&r.error?'could not read it':'could not read it');return;}
  PEEK=r;
}

/* ---------------- saving ---------------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1400);}
// A decision's row can already be gone by the time this runs -- a filtered
// list drops it the moment it no longer matches. One fixed phrase, not a
// description of the patch: wording it per decision shape is a rule about
// what a patch means, and that reads two fields where this only needs one
// fact -- something landed. Clearing first forces a second announcement
// even when the previous one said the same thing.
function announce(m){
  const el=$('#live'); if(!el)return;
  el.textContent='';
  setTimeout(()=>{el.textContent=m;},50);
}
function saved(){const s=$('#saved'); if(s)s.textContent='saved '+new Date().toLocaleTimeString();}
async function post(url,body){
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)}).then(r=>r.json()).catch(()=>({ok:false}));
}
async function decide(patch,keys,advance){
  const ks = keys || targets();
  if(!ks.length)return;
  // anything decided on that has no record yet gets one, named from the row
  const newborn=ks.filter(k=>!BYKEY.has(k))
    .map(k=>{const t=view.find(x=>x.key===k); return t?{key:k,artist:t.artist,title:t.title}:null;})
    .filter(Boolean);
  const r=await post('/api/decide',{keys:ks,...(newborn.length?{adopt:newborn}:{}),...patch});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  // the decision's own event carries this rev; the load below covers it
  if(r.rev)REVSEEN=Math.max(REVSEEN,r.rev);
  saved();
  announce('Decision saved.');
  // On an unfiltered list the row stays put, so step on; on a filtered list the
  // row leaves and `sel` already points at the next one. Getting this wrong means
  // every decision needs a following keypress, which ruins the rhythm.
  if(advance&&!filtered())sel=Math.min(sel+1,Math.max(0,view.length-1));
  await load(); refreshUndo();
}

/* ---------------- playing ---------------- */
function srcFor(t){
  // A real file beats a 30s preview every time. Tracks already on the device
  // have no iTunes match at all, so this is the only way to hear them.
  // which one is the server's answer (`play`, curate.row_play)
  if(t.play==='file') return {url:'/api/audio?key='+encodeURIComponent(t.key), full:true};
  if(t.play==='preview') return {url:t.preview, full:false};
  return null;
}
let playRow=null;
// A full pass is cheap but not free on a list this long, so it runs only when
// something actually changes; the clock itself touches one element.
function paintPlaying(){
  document.querySelectorAll('.row.playing').forEach(r=>{
    r.classList.remove('playing');
    const d=r.querySelector('.dur'); if(d&&d.dataset.full)d.textContent=d.dataset.full;
  });
  playRow=null;
  const k=au.dataset.key; if(!k||au.paused)return;
  playRow=[...document.querySelectorAll('#list .row')].find(r=>r.dataset.k===k)||null;
  if(playRow){playRow.classList.add('playing');tickProgress();}
}
function tickProgress(){
  if(!playRow)return;
  const d=playRow.querySelector('.dur'); if(!d)return;
  const full=d.dataset.full;
  d.textContent = full ? `${mmss(au.currentTime)} / ${full}` : mmss(au.currentTime);
}
/* The row says "working" from the moment play is asked for until the audio
   element can actually play it, which is exactly the window the browser
   itself reports. No timer, no guess: the element knows. */
function markLoading(on){
  document.querySelectorAll('.row.loading').forEach(r=>r.classList.remove('loading'));
  if(!on)return;
  const k=au.dataset.key; if(!k)return;
  const r=[...document.querySelectorAll('#list .row')].find(x=>x.dataset.k===k);
  if(r)r.classList.add('loading');
}
au.onwaiting=()=>markLoading(true);
au.oncanplay=()=>markLoading(false);
au.onplaying=()=>{markLoading(false);paintPlaying();};
au.onerror=()=>markLoading(false);
au.ontimeupdate=tickProgress; au.onplay=paintPlaying; au.onpause=paintPlaying;
au.onended=()=>{markLoading(false);paintPlaying();};
function play(){
  const t=view[sel]; if(!t)return;
  const s=srcFor(t);
  if(!s){toast('nothing to play for this one');return;}
  if(au.dataset.key===t.key&&!au.paused){au.pause();return;}
  au.dataset.key=t.key; au.src=s.url;
  markLoading(true);
  au.play()
    .then(()=>markLoading(false))
    .catch(()=>{markLoading(false);toast(s.full?'could not play the file':'preview failed');});
  if(s.full)toast('playing the full track');
}
