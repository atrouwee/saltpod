  const delLabel = t.device ? 'Delete from iPod' : 'Skip';
  // Shortlisted is what puts a track in the buy list, so undeciding is how it
  // leaves. One row, named for where you are standing: "Undecided" is true but
  // nobody reads it as "get this out of my buy list", which is the thing they
  // came to the menu to do.
  const undoLabel = t.tier==='shortlisted' ? 'Take off the buy list' : 'Undecided';
  b.innerHTML=menuRow('Add to playlist &rsaquo;','c',false,'m-add')
    +(inCol?menuRow('Take out of '+esc(colPick),'x',false,'m-out'):'')
    +'<div class="sep"></div>'
    +menuRow('Buy','b',t.tier==='shortlisted','m-buy')+menuRow('Maybe','m',t.tier==='maybe','m-maybe')
    +menuRow(undoLabel,'u',t.tier==='seen','m-undo')
    +'<div class="sep"></div>'+menuRow('Vinyl','v',!!t.vinyl,'m-vinyl')+menuRow('Play','space',false,'m-play')
    +'<div class="sep"></div>'+menuRow(delLabel,inCol?'X':'x',t.tier==='skipped','m-del');
  const on=(cls,fn)=>{const x=b.querySelector('.'+cls); if(x)x.onclick=fn;};
  on('m-add',()=>{MENU.kind='pick';paintMenu();});
  on('m-out',()=>{closeMenu();decide({collection:colPick,mode:'remove'},[t.key]);});
  on('m-buy',()=>{closeMenu();decide({tier:'shortlisted'},[t.key]);});
  on('m-maybe',()=>{closeMenu();decide({tier:'maybe'},[t.key]);});
  on('m-del',()=>{closeMenu();deleteFromIpod(t);});
  on('m-undo',()=>{closeMenu();decide({tier:'seen'},[t.key]);});
  on('m-vinyl',()=>{closeMenu();decide({vinyl:!t.vinyl},[t.key]);});
  on('m-play',()=>{closeMenu();play();});
}
// Off the iPod: out of every playlist it is in, then skipped, which sync
// reads as "take this track off the device". Nothing happens on the device
// until the next sync, and the row says so by being struck through.
async function deleteFromIpod(t){
  for(const c of (t.collections||[]))
    await post('/api/decide',{keys:[t.key],collection:c,mode:'remove'});
  await decide({tier:'skipped'},[t.key]);
  toast(t.device?'off the iPod on the next sync':'skipped');
}
document.addEventListener('click',e=>{ if(MENU&&!menu.contains(e.target)&&!e.target.classList.contains('more'))closeMenu(); });
// a scroll of the page closes the menu; a scroll inside the menu is the menu working
document.addEventListener('scroll',e=>{ if(MENU&&!(e.target instanceof Node&&menu.contains(e.target)))closeMenu(); },true);

/* ---------------- the collection dialog ---------------- */
const dlg=$('#dlg'), dlgin=$('#dlgin');
let dlgMode=null;
function openDlg(mode,why,plan){
  dlgMode=mode;
  if(mode==='__sync__'){
    $('#dlgt').textContent='Sync to the iPod';
    dlgin.style.display='none'; $('#dlgex').innerHTML=''; $('#dlgsec').hidden=true;
    if(!plan){
      $('#dlgp').innerHTML=`${esc(why||'')}<br><br>Plug the iPod in and put it in Disk Mode:
        hold <kbd>Select</kbd>+<kbd>Menu</kbd> to reset, then immediately
        <kbd>Select</kbd>+<kbd>Play</kbd> until the screen says Disk Mode.`;
      $('#dlglist').innerHTML=''; $('#dlgbtn').innerHTML='';
    } else {
      const n=plan.new.length+plan.update.length+plan.delete.length+plan.adds.length+plan.removes.length;
      const gb=b=>b==null?'?':(b>=1e9?(b/1e9).toFixed(1)+' GB':Math.round(b/1e6)+' MB');
      const fits = plan.add_bytes==null||plan.free_bytes==null||plan.add_bytes<=plan.free_bytes;
      const same=(plan.unchanged||[]).length;
      $('#dlgp').innerHTML = n
        ? 'A dated backup is taken first, and tracks the collections do not mention are left alone.'
          + (same?` ${same} playlist${same>1?'s':''} already match${same>1?'':'es'} the device and will not be touched.`:'')
          + (plan.adds.length?` Adds about <b style="color:var(--ink)">${gb(plan.add_bytes)}</b> after conversion, of ${gb(plan.free_bytes)} free${fits?'':' — <span style="color:var(--orange)">that will not fit</span>'}.`:'')
        : 'Nothing to do — the iPod already matches.';
      const line=(label,items)=>items.length?`<div class="dsec">${label} · ${items.length}</div>`
        + items.slice(0,12).map(x=>`<div class="drow"><span class="dn">${esc(typeof x==='string'?x:x.artist+' — '+x.title)}</span>${x.convert?'<span class="dc">&rarr; ALAC</span>':''}</div>`).join('')
        + (items.length>12?`<div class="dc" style="padding:4px 10px">and ${items.length-12} more</div>`:''):'';
      $('#dlglist').innerHTML = line('playlists to create',plan.new)+line('playlists to update',plan.update)
        + line('playlists to delete',plan.delete)+line('tracks to copy across',plan.adds)
        + line('tracks to take off',plan.removes)
        + line('in a collection but not owned yet — left until there is a file',plan.no_source);
      $('#dlgbtn').innerHTML = (n&&fits)?'<button class="go" id="dlgok">Sync</button>':'';
      const ok=$('#dlgok'); if(ok)ok.onclick=runSyncInPanel;
    }
    dlg.classList.add('on'); return;
  }
  const t=view[sel];
  const cfg={
    null:        {h:'Collection', p:t?`Put “${t.artist} — ${t.title}” in a collection. Type a new name, or pick one; picking one it is already in takes it out.`:'Select a track first.', input:true, list:true},
    __new__:     {h:'New collection', p:'Name it, or take one whole from Apple Music. A collection may hold tracks you have not bought — sync writes the ones it finds a file for and leaves the rest.', input:true, list:false},
    __rename__:  {h:'Rename collection', p:`Rename “${colPick}”. Its order is kept.`, input:true, list:false},
    __delete__:  {h:'Delete collection', p:`Remove “${colPick}” from every track and take it off the iPod on the next sync. The tracks themselves stay.`, input:false, list:false},
  }[mode];
  $('#dlgt').textContent=cfg.h; $('#dlgp').textContent=cfg.p;
  dlgin.style.display=cfg.input?'':'none';
  dlgin.value = mode==='__rename__' ? colPick : '';
  // the collections this track is already in, as a list rather than a row of chips
  $('#dlgex').innerHTML = cfg.list && t
    ? [...new Set([...COLS,...PENDING])].sort().map(c=>`<div class="drow ${t.collections.includes(c)?'tick':''}" data-c="${esc(c)}">
        <span class="dn">${esc(c)}</span></div>`).join('')
    : '';
  $('#dlgex').querySelectorAll('[data-c]').forEach(s=>s.onclick=()=>{decide({collection:s.dataset.c});closeDlg();});
  // A collection can be seeded from an Apple Music playlist. It may name
  // tracks you have not bought; sync writes the ones it finds a file for and
  // says so about the rest, so the collection is the intent and the device
  // catches up.
  const seed = mode==='__new__';
  $('#dlgsec').hidden = !seed;
  $('#dlglist').innerHTML = !seed ? '' : (AMP.length
    ? AMP.map(p=>`<div class="drow" data-seed="${esc(p.name)}" title="created ${(p.created||'?').slice(0,10)}">
        <span class="dn">${esc(p.name)}</span><span class="dc">${p.tracks}</span></div>`).join('')
    : `<p id="dlgp">Nothing read yet — the gear has <b style="color:var(--ink)">Read Apple Music</b>.</p>`);
  $('#dlglist').querySelectorAll('[data-seed]').forEach(el=>el.onclick=()=>seedFrom(el.dataset.seed));
  $('#dlgbtn').innerHTML = mode==='__delete__' ? '<button class="go" id="dlgok">Delete</button>' : '';
  const ok=$('#dlgok'); if(ok)ok.onclick=submitDlg;
  dlg.classList.add('on'); if(cfg.input)dlgin.focus();
}
function closeDlg(){dlg.classList.remove('on');dlgin.blur();dlgMode=null;}
// Make a collection out of an Apple Music playlist, in its order. Tracks with
// no record yet get one; tracks you do not own yet come along anyway and sync
// leaves them until there is a file.
// A whole Apple Music playlist onto the iPod. Not a copy -- a declaration:
// every track gets a record if it has none and joins the collection in the
// playlist's own order, AFTER whatever is already there (new members append,
// never re-sort). Sync then writes what has a file and names the rest. With
// most of the library rented, most of a fresh playlist lands in Buy -- which
// is the point. `into` null makes a collection of the playlist's own name.
async function pourPlaylist(name, into){
  const target=into||name;
  toast('reading '+name+'…');
  const r = (PEEK&&PEEK.name===name) ? PEEK
    : await fetch('/api/peek?name='+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  if(!r||r.error||!r.tracks||!r.tracks.length){toast('could not read '+name);return;}
  const have=new Set(ORDER[target]||[]), seen=new Set(), rows=[];
  for(const t of r.tracks){ if(t.key&&!seen.has(t.key)&&!have.has(t.key)){seen.add(t.key);rows.push(t);} }
  if(!rows.length){toast(`everything in ${name} is already in ${target}`);return;}
  const keys=rows.map(t=>t.key);
  if(!COLS.includes(target))PENDING.add(target);
  const res=await post('/api/decide',{keys, adopt:rows.map(t=>({key:t.key,artist:t.artist,title:t.title})),
                                      collection:target, mode:'add'});
  if(!res.ok){toast('NOT SAVED — check the terminal');return;}
  await post('/api/decide',{reorder:{collection:target, keys:[...(ORDER[target]||[]), ...keys]}});
  closeDlg(); leaveNew(); activate('ipod'); colPick=target; devPick=null; sel=0;
  await load();
  saved();
  const waiting=keys.filter(k=>!(BYKEY.get(k)||{}).local).length;
  toast(`${keys.length} into ${target}${into?'':' — new'}${waiting?` · ${waiting} not owned yet`:''}`);
}
// AN ALBUM ONTO THE IPOD. The tracks are flagged `wanted` and nothing else
// happens: sync copies a wanted track that belongs to no collection, and the
// device assembles the album itself out of the tags. Making a playlist named
// after it would put the same record in two menus.
async function albumToIpod(a){
  const ks=a.tracks.filter(t=>!t.device).map(t=>t.key);
  if(!ks.length){toast('all of it is already on the iPod');return;}
  const newborn=a.tracks.filter(t=>!BYKEY.has(t.key)&&ks.includes(t.key))
    .map(t=>({key:t.key,artist:t.artist,title:t.title}));
  const r=await post('/api/decide',{keys:ks,...(newborn.length?{adopt:newborn}:{}),wanted:true});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  await load(); saved();
  const waiting=ks.filter(k=>!(BYKEY.get(k)||{}).local).length;
  toast(`${ks.length} track${ks.length>1?'s':''} queued for the iPod${waiting?` · ${waiting} not owned yet`:''}`);
}
// AND OFF IT. Skipped is what sync reads as "take this off the device", the
// same verdict a single track gets; an album is just all of them at once.
async function albumOffIpod(a){
  const ks=a.tracks.filter(t=>t.device).map(t=>t.key);
  if(!ks.length){toast('none of it is on the iPod');return;}
  const r=await post('/api/decide',{keys:ks,tier:'skipped',wanted:false});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  await load(); saved();
  toast(`${ks.length} track${ks.length>1?'s':''} off the iPod on the next sync`);
}

// the new-collection sheet's seed list is the same pour, by name
async function seedFrom(name){ await pourPlaylist(name, null); }

// A folder off the drive, poured the same way a playlist is -- except every
// track in it is already owned, so none of it reaches the buy list.
async function pourFolder(name, into){
  const target=into||name;
  toast('reading '+name+'…');
  const r = (T7TRACKS&&T7TRACKS.name===name) ? {tracks:T7TRACKS.tracks}
    : await fetch('/api/local?folder='+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  if(!r||!r.tracks||!r.tracks.length){toast('could not read '+name);return;}
  const have=new Set(ORDER[target]||[]), seen=new Set(), rows=[];
  for(const t of r.tracks){ if(t.key&&!seen.has(t.key)&&!have.has(t.key)){seen.add(t.key);rows.push(t);} }
  if(!rows.length){toast(`everything in ${name} is already in ${target}`);return;}
  const keys=rows.map(t=>t.key);
  if(!COLS.includes(target))PENDING.add(target);
  const res=await post('/api/decide',{keys, adopt:rows.map(t=>({key:t.key,artist:t.artist,title:t.title})),
                                      collection:target, mode:'add'});
  if(!res.ok){toast('NOT SAVED — check the terminal');return;}
  await post('/api/decide',{reorder:{collection:target, keys:[...(ORDER[target]||[]), ...keys]}});
  closeDlg(); leaveNew(); activate('ipod'); colPick=target; devPick=null; sel=0;
  await load(); saved();
  toast(`${keys.length} into ${target}${into?'':' — new'} · all owned`);
}
async function submitDlg(){
  const val=dlgin.value.trim();
  if(dlgMode==='__delete__'){
    const name=colPick;
    await post('/api/decide',{rename_collection:name,to:''});
    PENDING.delete(name); colPick=null; closeDlg(); await load(); toast('deleted '+name); return;
  }
  if(dlgMode==='__rename__'){
    if(!val||val===colPick)return closeDlg();
    await post('/api/decide',{rename_collection:colPick,to:val});
    if(PENDING.has(colPick)){PENDING.delete(colPick);PENDING.add(val);}
    colPick=val; closeDlg(); await load(); return;
  }
  if(!val)return;
  if(dlgMode==='__new__'){
    if(!COLS.includes(val))PENDING.add(val);
    colPick=val; sel=0; closeDlg(); draw(); return;
  }
  await decide({collection:val}); closeDlg();
}
dlgin.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Escape')closeDlg(); else if(e.key==='Enter')submitDlg(); };
dlg.onclick=e=>{if(e.target===dlg)closeDlg();};

/* ---------------- keys ---------------- */
const FILTERS=['all','undecided','shortlisted','maybe','rented only','on T7','on vinyl','on iPod','remove'];
const qi=$('#q');
qi.oninput=e=>{q=e.target.value.toLowerCase().trim();sel=0;drawMid();drawFoot();paintPlaying();};
qi.onkeydown=e=>{e.stopPropagation(); if(e.key==='Escape'){q='';qi.value='';qi.blur();draw();} if(e.key==='Enter')qi.blur();};
document.addEventListener('keydown',e=>{
  if(dlg.classList.contains('on'))return;
  if($('#rsheet').classList.contains('on')){ if(e.key==='Escape')closeSettings(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const k=e.key;
  if(k==='/'){e.preventDefault();qi.focus();return;}
  if(k==='['){e.preventDefault();fold('L');return;}
  if(k===']'){e.preventDefault();fold('R');return;}
  if(k==='.'){ const mo=document.querySelector('#list .row.sel .more'); if(mo){e.preventDefault(); if(MENU)closeMenu(); else openMenu(mo,'track',view[sel]);} return; }
  if(k==='Escape'){ if(MENU){closeMenu();} else if(newMode){leaveNew();} else if(q){q='';qi.value='';draw();} else if(colPick||devPick){colPick=null;devPick=null;sel=0;draw();} return; }
  if(k==='X'){ const t=view[sel]; if(t)deleteFromIpod(t); return; }
  if(k==='J'||(k==='ArrowDown'&&e.shiftKey)){e.preventDefault();nudge(+1);return;}
  if(k==='K'||(k==='ArrowUp'&&e.shiftKey)){e.preventDefault();nudge(-1);return;}
  if(k==='j'||k==='ArrowDown'){e.preventDefault();sel=Math.min(view.length-1,sel+1);mark();}
  else if(k==='k'||k==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);mark();}
  else if(k===' '){e.preventDefault();play();}
  else if(k==='b'){decide({tier:'shortlisted'},null,true);}
  else if(k==='m'){decide({tier:'maybe'},null,true);}
  else if(k==='x'){
    // inside a collection, x takes the track out of it; it is not a verdict on the track
    if(colPick){const t=view[sel]; if(t)decide({collection:colPick,mode:'remove'},[t.key]);}
    else decide({tier:'skipped'},null,true);}
  else if(k==='u'){decide({tier:'seen'});}
  else if(k==='v'){const t=view[sel];if(t)decide({vinyl:!t.vinyl});}
  else if(k==='c'){e.preventDefault();openDlg(null);}
  else if(k==='f'){filter=FILTERS[(FILTERS.indexOf(filter)+1)%FILTERS.length];sel=0;draw();}
});
/* ---------------- what the machine can reach ---------------- */
function paintHealth(){
  const el=$('#hstrip'), h=HEALTH; if(!el)return;
  if(!h){el.innerHTML='';return;}
  const dot=(cls,label,word)=>`<i class="${cls}" title="${esc(label)}${word?' — '+esc(word):''}">${esc(label)}${word?` <span class="w">${esc(word)}</span>`:''}</i>`;
  const g=[];
  const ip={ready:['ok','iPod',''],waking:['warn','iPod','waking'],
            ejected:['off','iPod','ejected'+(h.ejected_at?' '+h.ejected_at:'')],absent:['off','iPod','']}[h.ipod]||['off','iPod',''];
  g.push(dot(...ip));
  const mu={ok:['ok','Music',''],closed:['off','Music','closed'],wedged:['warn','Music','not answering']}[h.music]||['off','Music',''];
  g.push(dot(...mu));
  (h.sources||[]).forEach(s=>g.push(dot(s.online?'ok':'off',s.name,s.online?'':'offline')));
  if(h.tools&&!(h.tools.ffmpeg&&h.tools.ffprobe))g.push(dot('warn','ffmpeg','missing'));
  if(h.config)g.push(dot('warn','config','missing'));
  el.innerHTML=g.join('');
}
// PRE-SYNC ON RECONNECT. The page's idea of what the iPod holds is fetched
// once, at load. Plug the device back in after a sync done elsewhere -- or
// after our own sync ejected it -- and every count on screen is describing a
// device that has since changed. So the moment health flips TO ready from
// anything else, re-read the device and recompute, before you are offered a
// Sync button whose number you would otherwise have to distrust.
let lastPod=null, presyncing=false;
async function preSync(){
  if(presyncing)return; presyncing=true;
  try{
    toast('asking the iPod what it holds…');
    await load();                       // /api/device is a live read
    const p=await fetch('/api/plan').then(r=>r.json()).catch(()=>null);
    if(p&&p.ok){
      const n=(p.adds||[]).length+(p.removes||[]).length
             +(p.new||[]).length+(p.update||[]).length+(p.delete||[]).length;
      toast(n?`iPod read — ${n} change${n>1?'s':''} pending`:'iPod read — nothing to sync');
    }
  }catch(e){ toast('could not read the iPod'); }
  finally{ presyncing=false; }
}
async function pollHealth(){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),3000);
    HEALTH=await fetch('/api/health',{signal:c.signal}).then(r=>r.json());
    clearTimeout(t);
  }catch(e){ HEALTH={ipod:'absent',music:'closed',sources:[],tools:{ffmpeg:true,ffprobe:true}}; }
  paintHealth();
  const pod=HEALTH.ipod;
  if(pod==='ready'&&lastPod!==null&&lastPod!=='ready')preSync();
  lastPod=pod;
}
pollHealth(); setInterval(pollHealth,4000);

// LIVE UPDATES from the server, over SSE. The page no longer has to guess that
// something moved underneath it -- the thing that moved says so.
//
//   data   -> re-fetch and redraw in place. Deliberately NOT a refresh: a
//             refresh during curation loses your scroll, your open sheet and
//             your selected collection, which is worse than a stale count.
//   reload -> curate.html itself changed, so nothing but a real reload will do.
//
// EventSource reconnects on its own, so a server restart heals without a
// keystroke; `retry: 2000` on the stream sets how fast.
let ES=null;
function liveConnect(){
  try{ ES=new EventSource('/api/events'); }catch(e){ return; }
  ES.onmessage=async ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.type==='reload'){ toast('page changed — reloading'); setTimeout(()=>location.reload(),150); return; }
    if(m.type==='data'){ await load(); toast(m.why?`updated — ${m.why}`:'updated'); return; }
    if(m.type==='job'&&m.state&&m.state!=='running') toast(`${m.name} — ${m.state}`);
  };
  ES.onerror=()=>{};                     // EventSource retries by itself
}
liveConnect();
load();
