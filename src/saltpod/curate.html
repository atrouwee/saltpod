<!doctype html><html><head><meta charset="utf-8">
<title>saltpod</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* One file, no build step, nothing fetched from anywhere.

   One workspace, never a set of tabs: collections on the left, the library in
   the middle, buy and vinyl on the right, and a track moves between them by
   being dragged. The three are always there because the whole job is moving a
   record from "I heard it" to "it is on the iPod", and that is a gesture, not
   a navigation.

   The tokens are PlayPi's (the house style for anything that plays music
   here): a dark ground, soft-white ink, a seam the lists slide under, and one
   orange that appears exactly once -- on the row that is playing. Words are
   set in the face; the machine's own labels (positions, tags, keys) in the
   mono. The selection blue is the iPod's own. */
:root {
  --ground: #141d29;
  --ink:    #fffffc;
  --seam:   #070c13;
  --orange: #f75c03;
  --dim:    rgba(255,255,252,.55);
  --faint:  rgba(255,255,252,.22);
  --panel:  rgba(255,255,252,.05);
  --raised: rgba(255,255,252,.09);
  --mono:   "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --face:   "Helvetica Neue", Helvetica, Arial, sans-serif;
  /* the selection blue, read off a photograph of the device: bright at the top,
     deeper below. It marks where you ARE; the orange marks what you HEAR, and
     the two never mean the same thing. Drop targets borrow the blue, because a
     drop is also a "here", never a "hear". */
  --sel-hi: #6aa9f4;
  --sel-lo: #1450b8;
  --hbtn:  36px; /* the header's buttons: Sync's height, and the gear's side */
  --lw: 240px;   /* the side panes; a folded one is simply gone */
  --rw: 320px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.4 var(--face);
       height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); }
a:hover { text-decoration-color: var(--ink); }
button, input, select { font: inherit; color: var(--ink); }
button { background: transparent; border: 1px solid var(--faint); border-radius: 0; padding: 7px 12px;
         font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
button:hover { border-color: var(--ink); }
button:disabled { opacity: .4; cursor: default; }
button.go { background: var(--ink); color: var(--ground); border-color: var(--ink); }
input[type=text], input[type=search], select { background: transparent; border: 1px solid var(--faint);
         padding: 6px 9px; font-family: var(--mono); font-size: 12px; }
input::placeholder { color: var(--dim); }
input:focus, select:focus { outline: none; border-color: var(--ink); }

/* header: the brand line, then the deck -- the last line before the seam, laid
   out on the same three columns as the panes below it, so every control sits
   directly above the pane it governs: the left fold over the collections, the
   counts over the list, buy / vinyl and the right fold over the right pane. */
header { background: var(--ground); padding: 22px 24px 0; display: flex; flex-direction: column; gap: 14px; }
header:after { content: ""; display: block; height: 2px; background: var(--seam); margin: 0 -24px; }
.brandline { display: grid; grid-template-columns: 1fr minmax(220px, 440px) 1fr; align-items: center; gap: 16px; }
/* One number drives both, because aspect-ratio loses to a button's intrinsic
   width and the gear came out 13px wide against Sync's 31. */
.hright { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.hright button { height: var(--hbtn); }
h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
#q { width: 100%; padding: 7px 12px; }
.deck { display: grid; align-items: end; margin: 0 -24px; padding: 0 0 12px;
        grid-template-columns: max(var(--lw), 50px) minmax(0, 1fr) max(var(--rw), 50px); }
.deck .dl { padding-left: 24px; display: flex; align-items: center; gap: 14px; }
#ltabs { display: flex; gap: 14px; }
body.nl #ltabs { display: none; }
.deck .dr { padding-right: 24px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
#rtabs { display: flex; gap: 14px; }
body.nr #rtabs { display: none; }
.counts { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--dim);
          display: flex; gap: 14px; flex-wrap: wrap; padding-left: 18px; }
.counts s { text-decoration: none; color: var(--ink); }
.pill { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--dim); cursor: pointer; user-select: none; padding: 3px 0; border-bottom: 1px solid transparent; }
.pill:hover { color: var(--ink); }
.pill.on { color: var(--ink); border-bottom-color: var(--ink); }
#gear { padding: 0; width: var(--hbtn); flex: none; display: inline-flex; align-items: center;
        justify-content: center; font-size: 19px; line-height: 1; position: relative; }
#gear.busy:after { content: ""; position: absolute; top: -3px; right: -3px; width: 7px; height: 7px;
                   border-radius: 99px; background: var(--orange); }

/* ---------- the three panes ---------- */
/* No boxes. The surface fills the space; the only dividers on it are the two
   hairlines either side of the list. Everything else is separated by air. */
#work { display: grid; gap: 0; padding: 0; position: relative; overflow: hidden;
        grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); min-height: 0; }
aside, section.mid { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
/* Pinned to their tracks on purpose: when a side pane is display:none the
   middle would otherwise auto-place into the 0px track it left behind. */
aside.left  { grid-column: 1; border-right: 1px solid var(--faint); }
section.mid { grid-column: 2; }
aside.right { grid-column: 3; border-left: 1px solid var(--faint); }
body.nl { --lw: 0px; }  body.nl aside.left  { display: none; }
body.nr { --rw: 0px; }  body.nr aside.right { display: none; }
/* each pane opens with one quiet mono line: what it is, and what can be done to it */
.plabel { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; flex: none;
          padding: 16px 18px 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em;
          text-transform: uppercase; color: var(--dim); }
.plabel .name { color: var(--ink); flex: 1 1 auto; min-width: 10ch; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
.plabel .sp { display: none; }
.plabel .act { cursor: pointer; white-space: nowrap; }
.plabel .act:hover { color: var(--ink); }
.pstat { letter-spacing: .06em; }
.pstat s { text-decoration: none; color: var(--ink); }
.pbody { overflow: auto; padding: 4px 14px 24px; flex: 1 1 auto; min-height: 0; }
/* the filters: a section of the list, folded away until wanted. The toggle
   always names the active filter, so a folded section never hides one. */
.filters { display: none; gap: 12px; flex-wrap: wrap; align-items: center; padding: 2px 18px 10px; }
section.mid.fx .filters { display: flex; }

/* the boxed chevrons in the header corners that fold a side pane away */
.fold { font-family: var(--mono); font-size: 11px; line-height: 1; color: var(--dim); flex: none;
        border: 1px solid var(--faint); width: 26px; height: 22px; display: inline-flex;
        align-items: center; justify-content: center; cursor: pointer; user-select: none; }
.fold:hover { color: var(--ink); border-color: var(--ink); }

/* ---------- rows ---------- */
/* Rows float on the ground -- separated by space, not rules -- and the selected
   one takes the device's blue. */
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 14px; align-items: center;
       padding: 9px 10px; cursor: pointer; border-radius: 10px; margin-bottom: 3px; user-select: none; }
.row:hover { background: var(--panel); }
.row.sel { background: linear-gradient(var(--sel-hi), var(--sel-lo));
       box-shadow: inset 0 1px 0 rgba(255,255,255,.16); }
.row.sel .s { color: rgba(255,255,255,.82); }
.row.sel .ch, .row.sel .pos, .row.sel .grab { color: #fff; }
.row.sel .tag { color: #fff; border-color: rgba(255,255,255,.55); }
.art { width: 44px; height: 44px; border-radius: 7px; background: var(--seam);
       object-fit: cover; flex: none; -webkit-user-drag: none; }
.t { min-width: 0; }
.t .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700;
        letter-spacing: -.005em; font-size: 14px; }
.t .s { color: var(--dim); font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.ch { color: var(--dim); font-size: 13px; padding-left: 2px; }
/* Where a track LIVES, as against what you have decided about it. Facts get
   plain mono with no border; decisions keep the bordered pills.

   The places are PEERS -- Apple Music, the T7, the iPod, a record -- and no
   attempt is made to say which came first. A track can sit in all four and
   the order it arrived in is unknowable. What is owned shows in full ink and
   what is only rented stays dim, so the gap this tool exists to close can be
   read by scanning one column. */
.src { display: flex; gap: 7px; align-items: center; flex: none;
       font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--dim); }
.src b { font-weight: 400; color: var(--ink); }
.src .gone { text-decoration: line-through; }
.row.sel .src, .row.sel .src b { color: #fff; }
.tags { display: flex; gap: 6px; align-items: center; flex: none; }
.tag { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
       padding: 2px 7px; border-radius: 99px; border: 1px solid var(--faint);
       color: var(--dim); white-space: nowrap; }
.tag.buy, .tag.ok { color: var(--ink); border-color: var(--ink); }
.tag.maybe { color: var(--ink); border-style: dashed; }
.tag.skip { opacity: .5; }
.tag.vinyl { color: var(--ink); background: var(--panel); }
/* One meaning for each: dim is "not on the iPod yet", struck through is "on
   its way off it". Two directions, two signals, never the same ink. */
.row.pending .t, .row.pending .art { opacity: .45; }
.row.skip .t .n { text-decoration: line-through; }
.col.pend .cnt { color: var(--orange); }
.row.dragging { opacity: .35; }
.row.over { box-shadow: inset 0 2px 0 var(--sel-hi); }
.pos { color: var(--dim); font-family: var(--mono); font-size: 11px; width: 24px; text-align: right; }
.grab { cursor: grab; color: var(--dim); padding: 0 4px; }
.month { font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase;
         color: var(--dim); margin: 22px 0 6px; padding: 0 10px; }
.month:first-child { margin-top: 4px; }
.month.vg { cursor: pointer; user-select: none; margin: 16px 0 6px; padding: 0 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.month.vg:hover { color: var(--ink); }
code { font-family: var(--mono); font-size: 11px; color: var(--ink); }

/* Playing is said twice and never with a bar: the equaliser takes the chevron's
   slot -- a playing row is not going anywhere -- and the duration stops being a
   fact about the file and becomes a position inside it. Both in the orange. */
.eq { display: none; align-items: flex-end; gap: 2px; height: 13px; width: 15px; }
.eq i { width: 3px; border-radius: 1px; background: var(--orange); transform-origin: bottom;
        animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(1) { height: 40%; animation-delay: -.2s; }
.eq i:nth-child(2) { height: 95%; animation-delay: -.5s; }
.eq i:nth-child(3) { height: 62%; animation-delay: -.8s; }
@keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .eq i { animation: none; } }
.row.playing .ch { display: none; }
.row.playing .eq { display: inline-flex; }
.dur { font-variant-numeric: tabular-nums; }
.row.playing .dur { color: var(--orange); }
.row.sel .eq i { background: #fff; }
.row.sel.playing .dur { color: #fff; }

/* ---------- left pane: collections ---------- */
.col { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
       cursor: pointer; font-size: 13.5px; margin-bottom: 2px; }
.col:hover { background: var(--panel); }
.col.on { background: var(--raised); font-weight: 700; }
.col .cnt { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--dim); }
.col.pending .cnt { font-style: italic; }
.col.dim > span:first-child { color: var(--dim); }
.col .cnt .act { cursor: pointer; }
.col .cnt .act:hover { color: var(--ink); }
.col.drop, aside.right.drop .pbody { outline: 2px dashed var(--sel-hi); outline-offset: -3px; border-radius: 10px; }
.col.drop { background: rgba(106,169,244,.12); }

/* ---------- right pane: buy / vinyl ---------- */
.card { background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.card b { font-size: 13px; }
.card .sub { color: var(--dim); font-size: 10.5px; margin-top: 3px; font-family: var(--mono); }
.card .acts { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
.card .acts button { padding: 4px 9px; font-size: 9.5px; margin-left: auto; }
p.note { color: var(--dim); font-size: 13px; margin: 8px 8px 12px; line-height: 1.5; }

/* ---------- settings overlay, where Data lives now ---------- */
/* The data panel is the sync panel at a larger size: the same hairline edge,
   the same title strip with its one action at the top right, the same section
   labels. Two panels, one shape. */
/* A sheet belongs to a pane, so it appears AS that pane: same column, same
   width, sliding over only it. The rest of the page stays lit and usable --
   nothing is centred and nothing is dimmed. New collection comes from the
   left, where collections live; Data comes from the right. */
.sheet { position: absolute; top: 0; bottom: 0; z-index: 8; background: var(--ground);
         display: flex; flex-direction: column; min-width: 0;
         transition: transform .18s ease; will-change: transform; }
#lsheet { left: 0; width: var(--lw); border-right: 1px solid var(--faint);
          box-shadow: 14px 0 28px rgba(0,0,0,.35); transform: translateX(-105%); }
#rsheet { right: 0; width: max(var(--rw), 460px); border-left: 1px solid var(--faint);
          box-shadow: -14px 0 28px rgba(0,0,0,.35); transform: translateX(105%); }
/* id + class, because the off-canvas transform above is on an id and would
   otherwise outrank a class alone */
#lsheet.on, #rsheet.on { transform: none; }
.sheet .pbody { padding: 6px 14px 24px; }
#rsheet .pbody { padding: 14px 16px 24px; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
.box { padding: 0; margin: 0 0 20px; }
.box:last-child { margin-bottom: 0; }
.brow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
pre { background: var(--panel); border-radius: 8px; padding: 12px; font: 11px/1.5 var(--mono);
      overflow: auto; max-height: 280px; margin: 10px 0 0; color: var(--ink); }

/* the status line at the foot, like the room page's */
footer { position: relative; background: var(--ground);
         padding: 10px 24px calc(10px + env(safe-area-inset-bottom, 0px));
         font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--dim);
         display: flex; gap: 18px; align-items: center; }
#keys { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; flex: 1 1 auto; min-width: 0; }
/* What the machine can reach: one slot per dependency, always present, always
   in this order, changing state rather than appearing. Lit is reachable,
   hollow is not here, orange is here and misbehaving. "Ejected" is hollow on
   purpose: after a good sync the iPod is gone, and that is not a fault. */
.st { display: flex; align-items: center; gap: 14px; flex: none;
      font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; }
.st i { font-style: normal; color: var(--dim); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.st i:before { content: ""; width: 5px; height: 5px; border-radius: 99px; background: var(--faint); flex: none; }
.st i.ok { color: var(--ink); } .st i.ok:before { background: var(--ink); }
.st i.warn { color: var(--orange); } .st i.warn:before { background: var(--orange); }
.st i.off:before { background: transparent; box-shadow: inset 0 0 0 1px var(--faint); }
.st .w { color: var(--dim); text-transform: none; letter-spacing: .02em; }
/* the inline new-collection field, in the pane it belongs to */
.ninl { padding: 4px 8px 8px; }
#newin { width: 100%; background: transparent; border: 1px solid var(--faint); border-radius: 8px;
         color: var(--ink); padding: 8px 11px; font: 12px var(--mono); }
#newin:focus { outline: none; border-color: var(--ink); }
.col[data-seed]:hover { background: linear-gradient(var(--sel-hi), var(--sel-lo)); }
.col[data-seed]:hover > span, .col[data-seed]:hover .cnt { color: #fff; }
footer:before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--faint); }
kbd { font: 11px var(--mono); color: var(--ink); border: 1px solid var(--faint); padding: 0 5px; margin-right: 2px; }
/* Built like a screen on the device rather than a window: a hairline edge, a
   title strip, and a list underneath whose rows take the same selection blue
   the library uses. Nothing here is heavier than the panes behind it. */
#dlg { position: fixed; inset: 0; background: rgba(7,12,19,.72); display: none;
       align-items: center; justify-content: center; z-index: 30; }
#dlg.on { display: flex; }
#dlgbox { background: var(--ground); border: 1px solid var(--faint); border-radius: 10px;
          width: min(420px, 92vw); max-height: 78vh; display: flex; flex-direction: column;
          overflow: hidden; }
/* The panel's own header carries its title on the left and the one thing it
   does on the right -- the same place the page header keeps Sync. */
#dlgh { margin: 0; padding: 8px 10px 8px 16px; display: flex; align-items: center; gap: 12px;
        min-height: 40px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em;
        text-transform: uppercase; color: var(--dim); font-weight: 500;
        border-bottom: 1px solid var(--faint); background: var(--panel); }
#dlgt { flex: 1 1 auto; }
#dlgbtn:empty { display: none; }
#dlgbody { padding: 14px 16px 16px; overflow: auto; }
#dlgp { margin: 0 0 12px; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
#dlgin { width: 100%; background: transparent; border: 1px solid var(--faint);
         border-radius: 8px; color: var(--ink); padding: 9px 12px; font: inherit; }
#dlgin:focus { outline: none; border-color: var(--ink); }

.dsec { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
        color: var(--dim); margin: 16px 0 6px; }
/* the list, in the device's idiom: a row, a count, and the blue on the one under the cursor */
.drow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
        cursor: pointer; font-size: 13.5px; }
.drow:hover { background: linear-gradient(var(--sel-hi), var(--sel-lo)); }
.drow:hover .dc { color: rgba(255,255,255,.8); }
.drow .dn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .dc { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--dim); }
.drow.tick .dn:after { content: " ✓"; color: var(--dim); }
#dlglist { max-height: 34vh; overflow: auto; margin-top: 2px; }
#toast { position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--ground);
         padding: 8px 14px; font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase;
         opacity: 0; transition: opacity .18s; pointer-events: none; z-index: 40; }
#toast.on { opacity: 1; }
.warn { color: var(--dim); }

@media (max-width: 1000px) { :root { --lw: 200px; --rw: 260px; } }
</style></head><body>

<header>
  <div class="brandline">
    <h1>saltpod</h1>
    <input type="search" id="q" placeholder="search everything   /">
    <div class="hright">
      <button id="dosync" title="write the collections to the iPod">Sync</button>
      <button id="gear" title="settings and data jobs">&#9881;</button>
    </div>
  </div>
  <div class="deck">
    <div class="dl"><span class="fold" id="foldL" title="fold this pane away">[&lt;]</span>
      <span id="ltabs"><span class="pill on" data-s="ipod">iPod</span><span class="pill" data-s="am">Apple Music</span></span>
    </div>
    <div class="counts" id="counts"></div>
    <div class="dr">
      <span id="rtabs"><span class="pill on" data-r="buy">Buy</span><span class="pill" data-r="vinyl">Vinyl</span></span>
      <span class="fold" id="foldR" title="fold the buy and vinyl lists away">[&gt;]</span>
    </div>
  </div>
</header>

<div id="work">
  <aside class="left" id="left">
    <div class="plabel"><span class="name" id="lhead">Collections</span><span class="sp"></span><span class="act" id="newcol">+ new</span></div>
    <div class="pbody" id="colbody"></div>
  </aside>

  <section class="mid" id="mid">
    <div class="plabel"><span class="name" id="midh">Library</span>
      <span id="midacts" style="display:flex;gap:12px"></span>
      <span class="act" id="fltoggle">filter</span><span class="pstat" id="midstat"></span></div>
    <div class="filters" id="ctl"></div>
    <div class="pbody" id="list"></div>
  </section>

  <aside class="right" id="right">
    <div class="plabel"><span class="pstat" id="rstat"></span></div>
    <div class="pbody" id="rbody"></div>
  </aside>

  <div class="sheet" id="lsheet">
    <div class="plabel"><span class="name">New collection</span><span class="sp"></span><span class="act" id="lsheetesc">esc</span></div>
    <div class="pbody">
      <div class="ninl"><input type="text" id="newin" placeholder="name it, or pick below"></div>
      <div class="month">from Apple Music</div><div id="seedrows"></div>
    </div>
  </div>
  <div class="sheet" id="rsheet">
    <div class="plabel"><span class="name">Data</span><span class="sp"></span><span class="act" id="rsheetesc">esc</span></div>
    <div class="pbody" id="rsheetbody"></div>
  </div>
</div>

<footer id="foot"><span id="keys"></span><span id="hstrip" class="st"></span></footer>
<audio id="au"></audio><div id="toast"></div>

<div id="dlg"><div id="dlgbox">
  <div id="dlgh"><span id="dlgt">Collection</span><span id="dlgbtn"></span></div>
  <div id="dlgbody">
    <p id="dlgp"></p>
    <input id="dlgin" placeholder="Late Night">
    <div id="dlgex"></div>
    <div id="dlgsec" class="dsec" hidden>or from an Apple Music playlist</div>
    <div id="dlglist"></div>
  </div>
</div></div>


<script>
const MONTH = s => s.replace(/^(\d{4})-/,'$1 ').replace(/\b\w/g,c=>c.toUpperCase());
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => s?`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`:'';
const $=s=>document.querySelector(s), au=$('#au');

let ALL=[], COLS=[], ORDER={}, SLUGS=[], view=[], sel=0, filter='all', q='', job=null;
let colPick=null;          // null = the whole library; a name = that collection, in its order
let rtab='buy';
// A collection made with "+ new" does not exist on the server until its first
// track lands. Until then it lives here, so it does not vanish on the next load.
let PENDING=new Set();
let newMode=false, newQ='';           // the inline new-collection field, open or not
let HEALTH=null;
// The Discogs exports, and two maps from a match key to a release. A track
// meets a release on artist + album; see discogs.py for what the key strips.
let DISCOGS={wantlist:[],collection:[],files:{},dir:'data/discogs'}, OWN=new Map(), WANT=new Map();
const norm=s=>(s||'').toLowerCase().replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/^(the|a)\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();
const vkey=t=>{const a=norm(t.artist), b=norm(t.album||t.dev_album||''); return a&&b ? a+'|'+b : null;};
const owned=t=>{const k=vkey(t); return k?OWN.get(k):undefined;}, wanted=t=>{const k=vkey(t); return k?WANT.get(k):undefined;};
let VG={add:true,want:true,own:false};     // which vinyl groups are open
// Apple Music: its playlists, and whether the left pane's section is open.
// A collection is where a track is GOING and is the only thing edited; an
// Apple Music playlist is where it CAME from and is only ever looked at.
let AMP=[], AMREAD=null, AMLIB=0;
// The left pane is one panel with two libraries behind a switcher. iPod is the
// working surface -- collections are the only thing edited, and they are what
// sync writes. Apple Music is for looking at: everything in it is browsable,
// but a track earns a record in state only when a decision is made about it.
let side='ipod';
try{ side=localStorage['saltpod.side']||'ipod'; }catch(e){}
let SYNCED=[], BYKEY=new Map();
let LIB=[], libLoaded=false, amPick=null, PEEK=null, peeking=false;
const CAP=400;                       // rows drawn at once; search narrows the rest

/* ---------------- folding the side panes ---------------- */
function setFold(side,off){
  document.body.classList.toggle(side==='L'?'nl':'nr',off);
  $('#fold'+side).textContent = side==='L' ? (off?'[>]':'[<]') : (off?'[<]':'[>]');
  try{ localStorage['saltpod.fold'+side]=off?'1':'0'; }catch(e){}
}
function fold(side){ setFold(side,!document.body.classList.contains(side==='L'?'nl':'nr')); }
(function(){
  let l=null,r=null;
  try{ l=localStorage['saltpod.foldL']; r=localStorage['saltpod.foldR']; }catch(e){}
  // no stored preference on a narrow window: start with the sides away
  const narrow=window.innerWidth<860;
  setFold('L', l==null ? narrow : l==='1');
  setFold('R', r==null ? narrow : r==='1');
})();
$('#foldL').onclick=()=>fold('L'); $('#foldR').onclick=()=>fold('R');
document.querySelectorAll('#ltabs .pill').forEach(p=>p.onclick=async()=>{
  leaveNew(); side=p.dataset.s; sel=0;
  try{ localStorage['saltpod.side']=side; }catch(e){}
  if(side==='am'&&amPick==='__all__')await ensureLib();
  draw();
});

/* the filter section: open or shut, remembered; its toggle names the active filter */
const MID=$('#mid');
try{ if(localStorage['saltpod.filters']==='1')MID.classList.add('fx'); }catch(e){}
function paintFilterToggle(){
  const open=MID.classList.contains('fx');
  $('#fltoggle').textContent=(filter==='all'?'filter':'filter · '+filter)+(open?' \u25B4':' \u25BE');
}
$('#fltoggle').onclick=()=>{
  MID.classList.toggle('fx');
  try{ localStorage['saltpod.filters']=MID.classList.contains('fx')?'1':'0'; }catch(e){}
  paintFilterToggle();
};

/* ---------------- loading, counting, filtering ---------------- */
async function load(){
  const [r,d,a]=await Promise.all([
    fetch('/api/tracks').then(r=>r.json()),
    fetch('/api/discogs').then(r=>r.json()).catch(()=>null),
    fetch('/api/playlists').then(r=>r.json()).catch(()=>null)]);
  if(d){DISCOGS=d; OWN=new Map((d.collection||[]).map(x=>[x.key,x])); WANT=new Map((d.wantlist||[]).map(x=>[x.key,x]));}
  if(a){AMP=a.playlists||[]; AMREAD=a.read_at; AMLIB=a.library||0;
        if(amPick&&amPick!=='__all__'&&!AMP.some(p=>p.slug===amPick))amPick=null;}
  SYNCED=r.synced||[];
  ALL=r.tracks; COLS=r.collections; ORDER=r.order||{}; SLUGS=r.slugs;
  BYKEY=new Map(ALL.map(t=>[t.key,t]));
  COLS.forEach(c=>PENDING.delete(c));                    // it exists now
  if(colPick&&!COLS.includes(colPick)&&!PENDING.has(colPick))colPick=null;   // renamed or deleted under us
  draw();
}
function counts(){
  const c={seen:0,shortlisted:0,maybe:0,skipped:0,vinyl:0,bought:0};
  ALL.forEach(t=>{c[t.tier]++; if(t.vinyl)c.vinyl++; if(t.bought)c.bought++;});
  const todo=ALL.filter(t=>t.tier==='shortlisted'&&!t.bought);
  const eur=todo.reduce((a,t)=>a+(t.price||0),0);
  $('#counts').innerHTML=`<span><s>${ALL.length}</s> tracks</span>
    <span><s>${todo.length}</s> to buy</span>
    <span><s>&euro;${eur.toFixed(2)}</s> final</span>
    <span><s>${c.seen}</s> undecided</span>`;
}
function pass(t){
  if(q){const h=(t.artist+' '+t.title+' '+(t.album||'')).toLowerCase(); if(!h.includes(q))return false;}
  if(filter==='undecided')return t.tier==='seen';
  if(filter==='vinyl')return t.vinyl;
  if(filter==='on vinyl')return !!owned(t);
  if(filter==='on T7')return t.t7;
  // in Apple Music and nowhere you own: the work still to do
  if(filter==='rented only')return t.am&&!t.t7&&!owned(t);
  if(filter==='on iPod')return t.device;
  if(filter==='remove')return t.device&&t.tier==='skipped';
  if(filter==='all')return true;
  return t.tier===filter;
}
const filtered=()=>!!q||filter!=='all';
// what a click would actually play, named rather than left to be guessed
function heard(t){
  if(t.play_from==='t7')   return '<span style="color:var(--ink)">plays from the T7</span>';
  if(t.play_from==='ipod') return '<span style="color:var(--ink)">plays from the iPod</span>';
  if(t.preview)            return 'a 30s preview';
  return '<span class="warn">nothing to play</span>';
}
// every place that holds it, in a fixed order -- never a claim about which came first
function srcStrip(t){
  const g=[];
  if(t.am)      g.push(t.am_status ? `<span class="gone" title="in Apple Music, ${esc(t.am_status)}">AM</span>`
                                   : (t.am_owned?'<b title="owned in Apple Music">AM</b>':'<span title="in Apple Music, rented">AM</span>'));
  if(t.t7)      g.push(`<b title="stored on the T7${t.lossless?', lossless':''}">T7</b>`);
  if(t.device)  g.push('<b title="stored on the iPod">POD</b>');
  if(owned(t))  g.push('<b title="you own the record">LP</b>');
  else if(wanted(t)) g.push('<span title="on the Discogs wantlist">lp</span>');
  return g.join('');
}
function tagsFor(t){
  const g=[];
  if(t.tier==='shortlisted')g.push('<span class="tag buy">buy</span>');
  if(t.tier==='maybe')g.push('<span class="tag maybe">maybe</span>');
  if(t.tier==='skipped')g.push('<span class="tag skip">skip</span>');
  if(t.bought)g.push('<span class="tag ok">owned</span>');
  if(t.vinyl)g.push('<span class="tag vinyl">vinyl</span>');
  if(!colPick)t.collections.forEach(c=>g.push(`<span class="tag">${esc(c)}</span>`));
  if(t.bc_verdict==='confirmed')g.push('<span class="tag">FLAC</span>');
  return g.join('');
}
// A row for something seen only in Apple Music. It renders like any other so
// the eye does not have to switch modes; the moment you decide on it, `adopt`
// gives it a record and it becomes one.
const AM_OWNED=['purchased','matched','uploaded'];
function libRow(r){
  const hit=BYKEY.get(r.key); if(hit)return hit;
  return {key:r.key, artist:r.artist, title:r.title, album:r.album, seconds:r.secs,
          tier:'', vinyl:false, bought:false, collections:[], playlists:[],
          device:false, t7:false, am:true, am_owned:AM_OWNED.includes(r.cloud),
          am_status:(r.cloud==='subscription'||AM_OWNED.includes(r.cloud))?null:r.cloud,
          play_from:null, audio:false, preview:null, art:null, lean:true};
}
function rowHTML(t,i,pos){
  const dur=mmss(t.seconds||t.dev_seconds);
  return `<div class="row ${t.tier==='skipped'?'skip':''} ${t.device?'':'pending'}" draggable="true" data-i="${i}" data-k="${esc(t.key)}"
      ${pos!=null?'style="grid-template-columns:24px 44px minmax(0,1fr) auto auto"':''}>
    ${pos!=null?`<span class="pos">${pos}</span>`:''}
    ${t.art?`<img class="art" src="${t.art}" loading="lazy" draggable="false">`:'<div class="art"></div>'}
    <div class="t"><div class="n">${esc(t.artist)} — ${esc(t.title)}</div>
      <div class="s">${[esc(t.album||t.dev_album||''), dur?'<span class="dur" data-full="'+dur+'">'+dur+'</span>':'', t.price?'€'+t.price.toFixed(2):'',
        heard(t)].filter(Boolean).join(' · ')}</div></div>
    <div class="src">${srcStrip(t)}</div>
    <div class="tags">${tagsFor(t)}<span class="ch">&rsaquo;</span><span class="eq"><i></i><i></i><i></i></span>${pos!=null?'<span class="grab">⋮⋮</span>':''}</div></div>`;
}

/* ---------------- drawing ---------------- */
function draw(){ counts(); drawCols(); drawMid(); drawRight(); drawFoot(); paintPlaying(); }

function drawFoot(){
  const inCol=side==='ipod'&&!!colPick, canSeq=inCol&&!filtered();
  $('#keys').innerHTML=`<span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>space</kbd> play</span>
    <span><kbd>b</kbd> buy</span><span><kbd>m</kbd> maybe</span>
    <span><kbd>x</kbd> ${inCol?'take out of collection':'skip'}</span>
    <span><kbd>u</kbd> undecide</span><span><kbd>v</kbd> vinyl</span><span><kbd>c</kbd> collection</span>
    ${canSeq?'<span><kbd>J</kbd><kbd>K</kbd> re-sequence</span>':''}
    <span><kbd>f</kbd> filter</span><span><kbd>/</kbd> search</span><span><kbd>[</kbd><kbd>]</kbd> panes</span>
    ${inCol?'<span><kbd>esc</kbd> back to library</span>':''}
    <span id="saved" style="margin-left:auto"></span>`;
}

function drawMid(){
  if(side==='am')return drawMidAM();
  $('#ctl').innerHTML=['all','undecided','shortlisted','maybe','rented only','on T7','on vinyl','on iPod','remove']
    .map(f=>`<span class="pill ${f===filter?'on':''}" data-f="${f}">${f}</span>`).join('');
  $('#ctl').querySelectorAll('.pill').forEach(p=>p.onclick=()=>{filter=p.dataset.f;sel=0;draw();});
  paintFilterToggle();

  const acts=$('#midacts');
  let h='';
  if(colPick){
    // A collection is a sequence: drawn in its own order, never sorted. A filter
    // or a search narrows what is SHOWN, and while one is on, re-sequencing is
    // off -- moving a row past neighbours you cannot see would be a lie.
    const all=(ORDER[colPick]||[]).map(k=>ALL.find(t=>t.key===k)).filter(Boolean);
    view=all.filter(pass);
    const mins=Math.round(all.reduce((a,t)=>a+(t.seconds||t.dev_seconds||0),0)/60);
    $('#midh').textContent=colPick;
    $('#midstat').innerHTML = filtered()
      ? `<s>${view.length}</s> of ${all.length} shown · clear the filter to re-sequence`
      : `<s>${all.length}</s> tracks · ${mins} min`;
    const nShort=ALL.filter(t=>t.tier==='shortlisted'&&!t.collections.includes(colPick)).length;
    acts.innerHTML=`<span class="act" id="addshort" title="every shortlisted track not yet in here">+ shortlisted (${nShort})</span>
      <span class="act" id="renamecol">rename</span><span class="act" id="delcol">delete</span>`;
    $('#addshort').onclick=async()=>{
      const ks=ALL.filter(t=>t.tier==='shortlisted'&&!t.collections.includes(colPick)).map(t=>t.key);
      if(!ks.length)return toast('nothing new to add');
      await decide({collection:colPick,mode:'add'},ks); toast(`added ${ks.length}`);};
    $('#renamecol').onclick=()=>openDlg('__rename__');
    $('#delcol').onclick=()=>openDlg('__delete__');
    h = view.length ? view.map((t,i)=>rowHTML(t,i,all.indexOf(t)+1)).join('')
      : all.length ? '<p class="note">Nothing in here matches.</p>'
      : '<p class="note">Empty. Drag tracks in from the library, or press <kbd>c</kbd> on a track.</p>';
  } else {
    view=ALL.filter(pass);
    $('#midh').textContent='Library';
    $('#midstat').innerHTML=filtered()?`<s>${view.length}</s> of ${ALL.length}`:`<s>${ALL.length}</s> tracks`;
    acts.innerHTML='';
    let last='';
    view.forEach((t,i)=>{
      const m=t.playlists[0]||(t.device?'__device':'__other');
      if(m!==last){h+=`<div class="month">${m==='__device'?'Already on the iPod':m==='__other'?'Other':MONTH(m)}</div>`;last=m;}
      h+=rowHTML(t,i);
    });
    if(!view.length)h='<p class="note">Nothing matches.</p>';
  }
  $('#list').innerHTML=h;
  wireRows();
  if(sel>=view.length)sel=Math.max(0,view.length-1);
  mark();
}
function drawMidAM(){
  $('#ctl').innerHTML='';
  const acts=$('#midacts');
  const pl=amPick&&amPick!=='__all__'&&AMP.find(p=>p.slug===amPick);
  const src = amPick==='__all__' ? LIB : (PEEK ? PEEK.tracks : []);
  const rows = src.map(libRow).filter(t=>{
    if(!q)return true;
    return (t.artist+' '+t.title+' '+(t.album||'')).toLowerCase().includes(q);
  });
  view=rows.slice(0,CAP);
  $('#midh').textContent = pl ? pl.name : (amPick==='__all__' ? 'All of Apple Music' : 'Apple Music');
  acts.innerHTML = pl&&!pl.imported ? `<span class="act" id="impnow">import into curation</span>` : '';
  if(pl&&!pl.imported)$('#impnow').onclick=()=>startJob({action:'export',names:[pl.name]});
  const known=rows.filter(t=>!t.lean).length;
  $('#midstat').innerHTML = !amPick ? ''
    : peeking ? 'reading Music.app…'
    : `<s>${rows.length}</s>${rows.length>CAP?' · '+CAP+' shown':''} · ${known} already in curation`
      + (pl?` · created ${(pl.created||'?').slice(0,10)}`:'');
  let h='';
  if(!amPick) h=`<p class="note">Pick a playlist on the left, or All of Apple Music.
      Nothing here is edited — this is the library to take from. Decide on a track
      (<kbd>b</kbd>, <kbd>v</kbd>, <kbd>c</kbd>, or drag it) and it joins your curation.</p>`;
  else if(peeking) h=`<p class="note">Reading Music.app…</p>`;
  else if(!view.length) h=`<p class="note">Nothing here${q?' matches':''}.</p>`;
  else h=view.map((t,i)=>rowHTML(t,i)).join('')
       + (rows.length>CAP?`<p class="note">${rows.length-CAP} more — search to narrow.</p>`:'');
  $('#list').innerHTML=h;
  wireRows();
  if(sel>=view.length)sel=Math.max(0,view.length-1);
  mark();
}
function wireRows(){
  const canSeq=side==='ipod'&&!!colPick&&!filtered();
  [...$('#list').querySelectorAll('.row')].forEach(r=>{
    r.onclick=()=>{sel=+r.dataset.i;mark();};
    r.ondblclick=()=>{sel=+r.dataset.i;mark();play();};
    r.ondragstart=e=>{
      e.dataTransfer.setData('text/plain',r.dataset.k);
      e.dataTransfer.effectAllowed='copyMove';
      r.classList.add('dragging');
      sel=+r.dataset.i; mark();
    };
    r.ondragend=()=>{r.classList.remove('dragging');
      document.querySelectorAll('.over,.drop').forEach(x=>x.classList.remove('over','drop'));};
    if(canSeq){
      r.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';r.classList.add('over');};
      r.ondragleave=()=>r.classList.remove('over');
      r.ondrop=async e=>{
        e.preventDefault(); e.stopPropagation(); r.classList.remove('over');
        const key=e.dataTransfer.getData('text/plain'); if(!key)return;
        const keys=(ORDER[colPick]||[]).slice();
        const from=keys.indexOf(key), to=+r.dataset.i;
        if(from<0){ await decide({collection:colPick,mode:'add'},[key]); return; }   // came from outside
        if(from===to)return;
        keys.splice(from,1); keys.splice(to,0,key);
        await saveOrder(colPick,keys,to);
      };
    }
  });
}
function mark(){
  document.querySelectorAll('#list .row').forEach(r=>r.classList.remove('sel'));
  const r=document.querySelector(`#list .row[data-i="${sel}"]`);
  if(r){r.classList.add('sel');r.scrollIntoView({block:'nearest'});}
}
async function saveOrder(col,keys,to){
  ORDER[col]=keys; sel=to;
  const r=await post('/api/decide',{reorder:{collection:col,keys}});
  if(!r.ok)toast('NOT SAVED'); else saved();
  draw();
}
// J / K move the selected row one place in the FULL order, so they are only
// offered when the full order is what is on screen.
function nudge(dir){
  if(!colPick||filtered())return;
  const keys=(ORDER[colPick]||[]).slice(), t=view[sel]; if(!t)return;
  const from=keys.indexOf(t.key), to=from+dir;
  if(from<0||to<0||to>=keys.length)return;
  keys.splice(from,1); keys.splice(to,0,t.key);
  saveOrder(colPick,keys,to);
}

/* ---------------- left: collections, each a drop target ---------------- */
function drawCols(){
  document.querySelectorAll('#ltabs .pill').forEach(p=>p.classList.toggle('on',p.dataset.s===side));
  $('#lhead').textContent = side==='am' ? 'Apple Music' : 'Collections';
  const nc=$('#newcol'); nc.style.display = side==='am' ? 'none' : ''; nc.textContent='+ new';
  if(side==='am')return drawAM();
  const n={}; ALL.forEach(t=>t.collections.forEach(c=>n[c]=(n[c]||0)+1));
  const names=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
  let h=`<div class="col ${colPick===null?'on':''}" data-all="1">All tracks<span class="cnt">${ALL.length}</span></div>`;
  h+=names.map(c=>{
      // what sync would still have to do: tracks in it that are not on the device,
      // plus the playlist itself if it has never been written
      const off=(ORDER[c]||[]).filter(k=>!(BYKEY.get(k)||{}).device);
      const ready=off.filter(k=>(BYKEY.get(k)||{}).local).length, waiting=off.length-ready;
      const never=!SYNCED.includes(c)&&!PENDING.has(c);
      const mark=PENDING.has(c)?'new':(off.length?`+${off.length}`:(never?'unsynced':(n[c]||0)));
      return `<div class="col ${c===colPick?'on':''} ${(off.length||never||PENDING.has(c))?'pend':''}" data-c="${esc(c)}"
        title="${esc(c)} — ${n[c]||0} tracks${off.length?`, ${ready} ready to sync, ${waiting} not owned yet`:', all on the iPod'}">
      <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c)}</span>
      <span class="cnt">${mark}</span></div>`;}).join('');
  if(!names.length)h+=`<p class="note">None yet. Press <b style="color:var(--ink)">+ new</b>, then drag tracks onto it.</p>`;

  $('#colbody').innerHTML=h;
  const body=$('#colbody');
  body.querySelector('[data-all]').onclick=()=>{colPick=null;sel=0;draw();};
  body.querySelectorAll('[data-c]').forEach(el=>{
    const name=el.dataset.c;
    el.onclick=()=>{colPick=name;sel=0;draw();};
    el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';el.classList.add('drop');};
    el.ondragleave=()=>el.classList.remove('drop');
    el.ondrop=async e=>{
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
      const key=e.dataTransfer.getData('text/plain'); if(!key)return;
      const t=ALL.find(x=>x.key===key);
      if(t&&t.collections.includes(name)){toast('already in '+name);return;}
      await decide({collection:name,mode:'add'},[key]);
      toast('added to '+name);
    };
  });
  $('#newcol').onclick=enterNew;
}

/* A new collection is made in the pane it will live in: a field at the top of
   the list, and the Apple Music playlists underneath as rows in the same
   shape. Nothing floats, nothing dims, nothing is covered. The field is also
   the filter -- type to narrow the playlists, or press enter to name one. */
function enterNew(){
  if(document.body.classList.contains('nl'))setFold('L',false);   // a sheet over a folded pane is no sheet
  side='ipod'; newMode=true; newQ='';
  const inp=$('#newin'); inp.value='';
  paintSeeds(); $('#lsheet').classList.add('on'); inp.focus();
}
function leaveNew(){ newMode=false; newQ=''; $('#lsheet').classList.remove('on'); }
(function(){
  const inp=$('#newin');
  inp.oninput=e=>{newQ=e.target.value;paintSeeds();};
  inp.onkeydown=e=>{e.stopPropagation();
    if(e.key==='Escape'){leaveNew();return;}
    if(e.key==='Enter'){const v=newQ.trim(); if(!v)return;
      if(!COLS.includes(v))PENDING.add(v);
      leaveNew(); colPick=v; sel=0; draw();}};
  $('#lsheetesc').onclick=leaveNew;
  $('#rsheetesc').onclick=()=>closeSettings();
})();
function paintSeeds(){
  const el=$('#seedrows'); if(!el)return;
  const q=newQ.trim().toLowerCase();
  const rows=AMP.filter(p=>!q||p.name.toLowerCase().includes(q));
  el.innerHTML = !AMP.length
    ? `<p class="note">Not read yet — the gear has <b style="color:var(--ink)">Read Apple Music</b>.</p>`
    : rows.length
      ? rows.map(p=>`<div class="col dim" data-seed="${esc(p.name)}" title="${esc(p.name)} — ${p.tracks} tracks, created ${(p.created||'?').slice(0,10)}">
          <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><span class="cnt">${p.tracks}</span></div>`).join('')
      : `<p class="note">No playlist called that. <kbd>enter</kbd> makes “${esc(newQ.trim())}” as a new one.</p>`;
  el.querySelectorAll('[data-seed]').forEach(x=>x.onclick=()=>seedFrom(x.dataset.seed));
}

/* the other library: everything in Apple Music, for looking at */

async function peek(name){

/* ---------------- saving ---------------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1400);}
function saved(){const s=$('#saved'); if(s)s.textContent='saved '+new Date().toLocaleTimeString();}
async function post(url,body){
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)}).then(r=>r.json()).catch(()=>({ok:false}));
}
async function decide(patch,keys,advance){
  const ks = keys || (view[sel]?[view[sel].key]:[]);
  if(!ks.length)return;
  // anything decided on that has no record yet gets one, named from the row
  const newborn=ks.filter(k=>!BYKEY.has(k))
    .map(k=>{const t=view.find(x=>x.key===k); return t?{key:k,artist:t.artist,title:t.title}:null;})
    .filter(Boolean);
  const r=await post('/api/decide',{keys:ks,...(newborn.length?{adopt:newborn}:{}),...patch});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  saved();
  // On an unfiltered list the row stays put, so step on; on a filtered list the
  // row leaves and `sel` already points at the next one. Getting this wrong means
  // every decision needs a following keypress, which ruins the rhythm.
  if(advance&&!filtered())sel=Math.min(sel+1,Math.max(0,view.length-1));
  await load();
}

/* ---------------- playing ---------------- */
function srcFor(t){
  // A real file beats a 30s preview every time. Tracks already on the device
  // have no iTunes match at all, so this is the only way to hear them.
  if(t.audio) return {url:'/api/audio?key='+encodeURIComponent(t.key), full:true};
  if(t.preview) return {url:t.preview, full:false};
  return null;
}
let playRow=null;
// A full pass is cheap but not free on a list this long, so it runs only when
// something actually changes; the clock itself touches one element.
function paintPlaying(){
  document.querySelectorAll('.row.playing').forEach(r=>{
    r.classList.remove('playing');
    const d=r.querySelector('.dur'); if(d&&d.dataset.full)d.textContent=d.dataset.full;
  });
  playRow=null;
  const k=au.dataset.key; if(!k||au.paused)return;
  playRow=[...document.querySelectorAll('#list .row')].find(r=>r.dataset.k===k)||null;
  if(playRow){playRow.classList.add('playing');tickProgress();}
}
function tickProgress(){
  if(!playRow)return;
  const d=playRow.querySelector('.dur'); if(!d)return;
  const full=d.dataset.full;
  d.textContent = full ? `${mmss(au.currentTime)} / ${full}` : mmss(au.currentTime);
}
au.ontimeupdate=tickProgress; au.onplay=paintPlaying; au.onpause=paintPlaying; au.onended=paintPlaying;
function play(){
  const t=view[sel]; if(!t)return;
  const s=srcFor(t);
  if(!s){toast('nothing to play for this one');return;}
  if(au.dataset.key===t.key&&!au.paused){au.pause();return;}
  au.dataset.key=t.key; au.src=s.url;
  au.play().catch(()=>toast(s.full?'could not play the file':'preview failed'));
  if(s.full)toast('playing the full track');
}

// A job keeps being polled whether or not the overlay is open; the overlay, when
// it is open, just shows the latest. Closing the panel used to stop the poll,

let lastJob=null;
function paintJob(r){
  const box=$('#jobbox'); if(!box||!r)return;
  box.style.display='';

  $('#jobstate').textContent=` — ${r.state}${r.seconds?` · ${r.seconds}s`:''}`;

async function startJob(body){
  const r=await post('/api/action',body);
  if(!r.ok)return toast(r.error||'failed');
  if(r.job){job=r.job;$('#gear').classList.add('busy');pollJob();}else{await load();toast('done');}
}
async function pollJob(){
  if(!job)return;
  const r=await fetch('/api/job?id='+job).then(r=>r.json()).catch(()=>null);
  if(!r){setTimeout(pollJob,2000);return;}
  lastJob=r; paintJob(r);
  if(r.state==='running'){setTimeout(pollJob,1200);return;}
  job=null; $('#gear').classList.remove('busy');
  await load(); toast(r.state==='done'?'finished':'job failed — see the log');
}

// Make a collection out of an Apple Music playlist, in its order. Tracks with
// no record yet get one; tracks you do not own yet come along anyway and sync
// leaves them until there is a file.
async function seedFrom(name){
  const exists=[...COLS,...PENDING].includes(name);
  toast('reading '+name+'…');
  const r=await fetch('/api/peek?name='+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  if(!r||r.error||!r.tracks||!r.tracks.length){toast('could not read that playlist');return;}
  const seen=new Set(), rows=[];
  for(const t of r.tracks){ if(t.key&&!seen.has(t.key)){seen.add(t.key);rows.push(t);} }
  const keys=rows.map(t=>t.key);
  const res=await post('/api/decide',{keys, adopt:rows.map(t=>({key:t.key,artist:t.artist,title:t.title})),
                                      collection:name, mode:'add'});
  if(!res.ok){toast('NOT SAVED — check the terminal');return;}
  await post('/api/decide',{reorder:{collection:name, keys}});
  closeDlg(); leaveNew(); side='ipod'; colPick=name; sel=0;
  try{ localStorage['saltpod.side']='ipod'; }catch(e){}
  await load();
  const waiting=keys.filter(k=>!(BYKEY.get(k)||{}).local).length;
  toast(`${keys.length} in ${name}${exists?' (added to the existing one)':''}${waiting?` · ${waiting} not owned yet`:''}`);
}
async function submitDlg(){
  const val=dlgin.value.trim();
  if(dlgMode==='__delete__'){
    const name=colPick;
    await post('/api/decide',{rename_collection:name,to:''});
    PENDING.delete(name); colPick=null; closeDlg(); await load(); toast('deleted '+name); return;
  }
  if(dlgMode==='__rename__'){
    if(!val||val===colPick)return closeDlg();
    await post('/api/decide',{rename_collection:colPick,to:val});
    if(PENDING.has(colPick)){PENDING.delete(colPick);PENDING.add(val);}
    colPick=val; closeDlg(); await load(); return;
  }
  if(!val)return;
  if(dlgMode==='__new__'){
    if(!COLS.includes(val))PENDING.add(val);
    colPick=val; sel=0; closeDlg(); draw(); return;
  }
  await decide({collection:val}); closeDlg();
}
dlgin.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Escape')closeDlg(); else if(e.key==='Enter')submitDlg(); };
dlg.onclick=e=>{if(e.target===dlg)closeDlg();};

/* ---------------- keys ---------------- */
const FILTERS=['all','undecided','shortlisted','maybe','rented only','on T7','on vinyl','on iPod','remove'];
const qi=$('#q');
qi.oninput=e=>{q=e.target.value.toLowerCase().trim();sel=0;drawMid();drawFoot();paintPlaying();};
qi.onkeydown=e=>{e.stopPropagation(); if(e.key==='Escape'){q='';qi.value='';qi.blur();draw();} if(e.key==='Enter')qi.blur();};
document.addEventListener('keydown',e=>{
  if(dlg.classList.contains('on'))return;
  if($('#rsheet').classList.contains('on')){ if(e.key==='Escape')closeSettings(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const k=e.key;
  if(k==='/'){e.preventDefault();qi.focus();return;}
  if(k==='['){e.preventDefault();fold('L');return;}
  if(k===']'){e.preventDefault();fold('R');return;}
  if(k==='Escape'){ if(newMode){leaveNew();} else if(q){q='';qi.value='';draw();} else if(colPick){colPick=null;sel=0;draw();} return; }
  if(k==='J'||(k==='ArrowDown'&&e.shiftKey)){e.preventDefault();nudge(+1);return;}
  if(k==='K'||(k==='ArrowUp'&&e.shiftKey)){e.preventDefault();nudge(-1);return;}
  if(k==='j'||k==='ArrowDown'){e.preventDefault();sel=Math.min(view.length-1,sel+1);mark();}
  else if(k==='k'||k==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);mark();}
  else if(k===' '){e.preventDefault();play();}
  else if(k==='b'){decide({tier:'shortlisted'},null,true);}
  else if(k==='m'){decide({tier:'maybe'},null,true);}
  else if(k==='x'){
    // inside a collection, x takes the track out of it; it is not a verdict on the track
    if(colPick){const t=view[sel]; if(t)decide({collection:colPick,mode:'remove'},[t.key]);}
    else decide({tier:'skipped'},null,true);}
  else if(k==='u'){decide({tier:'seen'});}
  else if(k==='v'){const t=view[sel];if(t)decide({vinyl:!t.vinyl});}
  else if(k==='c'){e.preventDefault();openDlg(null);}
  else if(k==='f'){filter=FILTERS[(FILTERS.indexOf(filter)+1)%FILTERS.length];sel=0;draw();}
});
/* ---------------- what the machine can reach ---------------- */
function paintHealth(){
  const el=$('#hstrip'), h=HEALTH; if(!el)return;
  if(!h){el.innerHTML='';return;}
  const dot=(cls,label,word)=>`<i class="${cls}" title="${esc(label)}${word?' — '+esc(word):''}">${esc(label)}${word?` <span class="w">${esc(word)}</span>`:''}</i>`;
  const g=[];
  const ip={ready:['ok','iPod',''],waking:['warn','iPod','waking'],
            ejected:['off','iPod','ejected'+(h.ejected_at?' '+h.ejected_at:'')],absent:['off','iPod','']}[h.ipod]||['off','iPod',''];
  g.push(dot(...ip));
  const mu={ok:['ok','Music',''],closed:['off','Music','closed'],wedged:['warn','Music','not answering']}[h.music]||['off','Music',''];
  g.push(dot(...mu));
  (h.sources||[]).forEach(s=>g.push(dot(s.online?'ok':'off',s.name,s.online?'':'offline')));
  if(h.tools&&!(h.tools.ffmpeg&&h.tools.ffprobe))g.push(dot('warn','ffmpeg','missing'));
  if(h.config)g.push(dot('warn','config','missing'));
  el.innerHTML=g.join('');
}
async function pollHealth(){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),3000);
    HEALTH=await fetch('/api/health',{signal:c.signal}).then(r=>r.json());
    clearTimeout(t);
  }catch(e){ HEALTH={ipod:'absent',music:'closed',sources:[],tools:{ffmpeg:true,ffprobe:true}}; }
  paintHealth();
}
pollHealth(); setInterval(pollHealth,4000);
load();
</script></body></html>
