/* ONE LIST VIEW, whatever is feeding it.
   The centre used to be three renderers -- iPod, Apple Music, drive -- and
   they had drifted: filters existed on one and were silently dropped on the
   other two, so `filter` stayed set to "on iPod" and simply stopped applying
   when you switched source, then resumed when you switched back. The list
   meant different things in different panes without saying so.
   Now one renderer. `currentList()` answers the only question that really
   differs -- which rows, and what is this called -- and everything after it
   is identical: same filters, same search, same cap, same numbering rule. */
function currentList(){
  if(albPick){
    const pane = active==='ipod' ? 'ipod' : 'src';
    const a=(pane==='ipod'?PODALBUMS:SRCALBUMS).find(x=>x.key===albPick);
    if(a) return {rows:a.tracks, lib:pane==='ipod'?'on the iPod':(stab==='t7'?'library':'apple music'),
      ordered:true, readonly:pane!=='ipod', foreign:pane!=='ipod', picked:true,
      title:a.album||'—', note:esc(a.artist||''), album:a,
      blank:'Empty album.'};
  }
  if(active==='am'){
    const pl=amPick&&amPick!=='__all__'&&AMP.find(p=>p.slug===amPick);
    const src=amPick==='__all__'?LIB:(PEEK&&PEEK.name===(pl||{}).name?PEEK.tracks:[]);
    return {rows:src.map(libRow), lib:pl?'apple music':'', ordered:!!pl, readonly:true, foreign:true,
      title: pl?pl.name:(amPick==='__all__'?'All in Apple Music':'Apple Music'),
      note: pl?`created ${(pl.created||'?').slice(0,10)}`:'',
      loading: peeking, picked: !!amPick,
      pour: pl?()=>pourPlaylist(pl.name,null):null,
      blank:`Pick a playlist on the left, or All of Apple Music. Nothing here is
        edited — this is the library to take from.`};
  }
  if(active==='t7'){
    const f=t7Pick&&t7Pick!=='__all__'&&T7.folders.find(x=>x.name===t7Pick);
    const src=(T7TRACKS&&T7TRACKS.name===t7Pick)?T7TRACKS.tracks:[];
    return {rows:src.map(t7Row), lib:f?esc(T7.root||'Library'):'', ordered:!!f, readonly:true, foreign:true,
      title: t7Pick==='__all__'?'All in Library':(t7Pick||'Library'),
      note: f&&f.lossless?`${f.lossless} lossless`:'',
      loading: t7Loading, picked: !!t7Pick, pour: f?()=>pourFolder(f.name,null):null,
      blank:`Pick a folder on the left. This is the music you already own,
        indexed ${esc(T7.built||'never')}, grouped the way the drive groups it.`};
  }
  const dp=devPick&&DEV.playlists.find(p=>p.name===devPick);
  if(dp) return {rows:dp.keys.map(k=>BYKEY.get(k)).filter(Boolean), lib:'on the iPod',
    ordered:true, readonly:true, title:dp.name, picked:true,
    note: dp.smart?'a smart playlist, never written':'not a collection yet',
    takeover: dp.smart?null:dp, blank:'Empty on the device.'};
  if(colPick) return {rows:(ORDER[colPick]||[]).map(k=>ALL.find(t=>t.key===k)).filter(Boolean),
    lib:'collection', ordered:true, readonly:false, title:colPick, picked:true, note:'',
    blank:'Empty. Drag tracks in from the library, or press <kbd>c</kbd> on a track.'};
  // The left pane is the iPod and nothing else, so its "All tracks" is the
  // device's own Songs menu: everything actually on it, ordered the way the
  // Classic orders it. This used to be the whole curation state -- a leftover
  // from when the pane was a library switcher -- which put 565 rented tracks
  // that are not on the device under a heading that says they are.
  const on=ALL.filter(t=>t.device).sort((a,b)=>
    (a.artist||'').localeCompare(b.artist||'')||(a.title||'').localeCompare(b.title||''));
  return {rows:on, lib:'', ordered:false, readonly:true, title:'All on iPod',
    picked:true, note:'', blank:'Nothing on the device yet.'};
}

function drawMid(){
  // the filters belong to the LIST, not to one source: always drawn, always applied
  // `on iPod` says nothing inside the iPod pane, and `rented only` cannot be
  // true of anything on the device. Offering a filter that can only ever
  // return everything or nothing is a dead control.
  const inPod = active==='ipod';
  const fs = FILTERS.filter(f=>!(inPod&&(f==='on iPod'||f==='rented only')));
  if(!fs.includes(filter))filter='all';
  $('#ctl').innerHTML=fs.map(f=>`<span class="pill ${f===filter?'on':''}" data-f="${f}">${f}</span>`).join('');
  $('#ctl').querySelectorAll('.pill').forEach(p=>p.onclick=()=>{captureScroll();clearMark();filter=p.dataset.f;sel=recallSel();draw();});
  const sc=$('#selclr'); if(sc)sc.onclick=()=>{clearMark();draw();};
  paintFilterToggle();

  const L=currentList();
  const all=L.rows, shown=all.filter(pass);
  view=shown.slice(0,CAP);

  $('#midh').innerHTML=esc(L.title)+(L.lib?` <span style="color:var(--dim)">· ${L.lib}</span>`:'');

  const acts=$('#midacts'); acts.innerHTML='';
  if(L.takeover) acts.innerHTML=`<span class="act" id="takeover" title="a collection of the same name and order; from then on it is yours to edit and sync">make it a collection</span>`;
  else if(L.pour) acts.innerHTML=`<span class="act" id="pourit" title="a collection of the same name and order">make it a collection</span>`;
  const tk=$('#takeover'); if(tk)tk.onclick=()=>takeOver(L.takeover);
  const po=$('#pourit');   if(po)po.onclick=()=>L.pour();

  const mins=Math.round(all.reduce((a,t)=>a+(t.seconds||t.dev_seconds||0),0)/60);
  const known=all.filter(t=>!t.lean).length;
  // A selection outranks the tally: it is the thing you are about to act on.
  $('#midstat').innerHTML = !L.picked ? ''
    : L.loading ? 'reading…'
    : MARK.size ? `<span class="selcount"><b>${MARK.size}</b> selected</span><span class="selclear" id="selclr">clear</span>`
    : [ filtered()? `<s>${shown.length}</s> of ${all.length}` : `<s>${all.length}</s> tracks`,
        (!filtered()&&mins&&L.picked)?`${mins} min`:'',
        (L.foreign&&known)?`${known} in curation`:'',
        L.note,
        (!L.readonly&&filtered())?'clear the filter to re-sequence':'',
        (shown.length>CAP)?`${CAP} shown`:'' ].filter(Boolean).join(' · ');

  let h='';
  if(!L.picked)        h=`<p class="note">${L.blank}</p>`;
  else if(L.loading)   h=`<p class="note">Reading…</p>`;
  else if(!view.length)h=`<p class="note">${all.length?'Nothing in here matches.':L.blank}</p>`;
  else {
    // A picked list is a sequence, so it is numbered in its own order --
    // whether it came from the iPod, Apple Music or the drive. Only our own
    // collections can be re-sequenced; the rest are numbered but not grabbable.
    // one layout for every list; the handle appears only where a drag would
    // actually change the order -- our own collections, unfiltered
    const seq = L.ordered && !L.readonly && !filtered();
    h=view.map((t,i)=>rowHTML(t,i,seq)).join('');
  }
  if(shown.length>CAP)h+=`<p class="note">${shown.length-CAP} more — search to narrow.</p>`;

  $('#list').innerHTML=h;
  wireRows();
  // A SELECTION BELONGS TO ONE LIST. Leaving the list drops it: marks you
  // cannot see are marks you will act on by accident, and every action in
  // this tool writes to the device eventually.
  if(MARK.size&&MARKLIST!==listKey())clearMark();
  if(view.length&&sel>=view.length)sel=view.length-1;   // never clamp an empty (loading) list
  mark();
}
// An iTunes-made or hand-made playlist becomes a collection of the same name
// and order. Sync then treats it as an update, and from then on it is ours.
async function takeOver(dp){
  if(COLS.includes(dp.name)){toast('already a collection');return;}
  if(!dp.keys.length){toast('nothing in it to take');return;}
  const r=await post('/api/decide',{keys:dp.keys,collection:dp.name,mode:'add'});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  await post('/api/decide',{reorder:{collection:dp.name,keys:dp.keys}});
  devPick=null; colPick=dp.name; sel=0; await load(); toast(`${dp.name} is a collection now`);
}
function wireRows(){
  const canSeq=active==='ipod'&&!!colPick&&!filtered();
  $('#list').classList.toggle('hasmark',MARK.size>0);
  [...$('#list').querySelectorAll('.row')].forEach(r=>{
    // The three conventions every list in every OS uses, and the reason the
    // cursor and the selection are separate: shift needs an anchor to measure
    // a range from, and that anchor is where the cursor already was.
    r.onclick=e=>{
      const i=+r.dataset.i;
      if(e.shiftKey){ e.preventDefault(); markRange(sel,i); sel=i; draw(); return; }
      if(e.metaKey||e.ctrlKey){
        e.preventDefault(); syncMarkList();
        const k=r.dataset.k; MARK.has(k)?MARK.delete(k):MARK.add(k);
        sel=i; draw(); return; }
      // a plain click is a fresh start, which is what makes a selection safe
      const had=clearMark(); sel=i; had?draw():mark();
    };
    const mo=r.querySelector('.more');
    if(mo)mo.onclick=e=>{e.stopPropagation(); const i=+r.dataset.i;
      // the dots on a row OUTSIDE the selection mean that row, not the selection
      if(MARK.size&&!MARK.has(r.dataset.k)){clearMark(); sel=i; draw();} else {sel=i; mark();}
      openMenu(mo,'track',view[sel]);};
    r.ondblclick=()=>{clearMark();sel=+r.dataset.i;mark();play();};
    r.ondragstart=e=>{
      // Dragging a row inside the selection carries the whole selection; the
      // payload is newline-joined so every existing drop target keeps working
      // through dropKeys(). Dragging a row outside it means just that row.
      const many = MARK.size && MARK.has(r.dataset.k);
      e.dataTransfer.setData('text/plain', many ? markedKeys().join('\n') : r.dataset.k);
      e.dataTransfer.effectAllowed='copyMove';
      r.classList.add('dragging');
      if(!many){ clearMark(); sel=+r.dataset.i; mark(); }
    };
    r.ondragend=()=>{r.classList.remove('dragging');
      document.querySelectorAll('.over,.drop').forEach(x=>x.classList.remove('over','drop'));};
    if(canSeq){
      r.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';r.classList.add('over');};
      r.ondragleave=()=>r.classList.remove('over');
      r.ondrop=async e=>{
        e.preventDefault(); e.stopPropagation(); r.classList.remove('over');
        const dk=dropKeys(e); if(!dk.length)return;
        const keys=(ORDER[colPick]||[]).slice(), to=+r.dataset.i;
        const inside=dk.filter(k=>keys.includes(k));
        if(!inside.length){ await decide({collection:colPick,mode:'add'},dk); return; }  // came from outside
        // A BLOCK MOVES AS A BLOCK, and keeps its own internal order -- the
        // sequence you arranged inside the selection is as much the product
        // as the sequence of the list. Aim at the row you want the block to
        // land on, measured after the block is lifted out.
        const block=keys.filter(k=>inside.includes(k));
        const anchor=keys[to];
        const rest=keys.filter(k=>!inside.includes(k));
        let at=rest.indexOf(anchor);
        if(at<0)at=Math.min(to,rest.length);            // dropped onto the block itself
        else if(to>keys.indexOf(block[0]))at+=1;        // moving down: land after the anchor
        rest.splice(at,0,...block);
        if(rest.join('\u0000')===keys.join('\u0000'))return;
        await saveOrder(colPick,rest,at);
      };
    }
  });
}
function mark(){
  if(view.length)SELMEM[listKey()]=sel;   // never record the empty loading state

  document.querySelectorAll('#list .row').forEach(r=>r.classList.remove('sel'));
  const r=document.querySelector(`#list .row[data-i="${sel}"]`);
  // Scrolling the selected row into view is right when YOU moved the
  // selection, and wrong during a redraw -- there it fights the restore and
  // wins, dragging you back to the selected row instead of where you were.
  if(r){r.classList.add('sel'); if(!redrawing())r.scrollIntoView({block:'nearest'});}
}
async function saveOrder(col,keys,to){
  ORDER[col]=keys; sel=to;
  const r=await post('/api/decide',{reorder:{collection:col,keys}});
  if(!r.ok)toast('NOT SAVED'); else saved();
  draw();
}
// J / K move the selected row one place in the FULL order, so they are only
// offered when the full order is what is on screen.
function nudge(dir){
  if(!colPick||filtered())return;
  const keys=(ORDER[colPick]||[]).slice(), t=view[sel]; if(!t)return;
  const from=keys.indexOf(t.key), to=from+dir;
  if(from<0||to<0||to>=keys.length)return;
  keys.splice(from,1); keys.splice(to,0,t.key);
  saveOrder(colPick,keys,to);
}

/* ---------------- left: collections, each a drop target ---------------- */
function drawCols(){
  $('#left').querySelector('.plabel').classList.toggle('off',active!=='ipod');
  paintModes('ipod',$('#lmodes'));
  wireNewCol();
  drawSrc();
  if(MODE.ipod==='album'){
    // Albums on the iPod are what the device itself would show: derived from
    // the tags of the tracks actually on it.
    PODALBUMS=albumsOf(ALL.filter(t=>t.device));
    $('#colbody').innerHTML=albumRows(PODALBUMS,'ipod');
    wireAlbums($('#colbody'),'ipod');
    return;
  }
  const n={}; ALL.forEach(t=>t.collections.forEach(c=>n[c]=(n[c]||0)+1));
  const names=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
  let h=colRow({name:'All on iPod', cnt:ALL.filter(t=>t.device).length,
    cls:(colPick===null&&!devPick&&active==='ipod')?'on':'', attrs:' data-all="1"'});
  h+=names.map(c=>{
      // what sync would still have to do: tracks in it that are not on the device,
      // plus the playlist itself if it has never been written
      const off=(ORDER[c]||[]).filter(k=>!(BYKEY.get(k)||{}).device);
      const ready=off.filter(k=>(BYKEY.get(k)||{}).local).length, waiting=off.length-ready;
      const never=!SYNCED.includes(c)&&!PENDING.has(c);
      const mark=PENDING.has(c)?'new':(off.length?`+${off.length}`:(never?'unsynced':(n[c]||0)));
      return colRow({name:esc(c), cnt:mark, menu:true, attrs:` data-c="${esc(c)}"`,
        cls:`${c===colPick?(active==='ipod'?'on':'was'):''} ${(off.length||never||PENDING.has(c))?'pend':''}`,
        title:`${esc(c)} — ${n[c]||0} tracks${off.length?`, ${ready} ready to sync, ${waiting} not owned yet`:', all on the iPod'}`});
    }).join('');
  if(!names.length)h+=`<p class="note">None yet. Press <b style="color:var(--ink)">+ new</b>, then drag tracks onto it.</p>`;

  // then everything else the iPod carries -- iTunes-made, hand-made, smart
  const others=DEV.playlists.filter(p=>!p.ours);
  if(others.length){
    const allSmart=others.every(p=>p.smart);
    h+=`<div class="month" title="${allSmart?'the firmware\'s own lists: shown, never written':''}${DEV.mounted?'':' — read from '+esc(DEV.source||'the last backup')}">${allSmart?'smart · read-only':'on the iPod'}${DEV.mounted?'':' · last seen'}</div>`;
    h+=others.map(p=>colRow({name:esc(p.name), cnt:p.smart?'smart':p.n,
      cls:`dim ${p.name===devPick?(active==='ipod'?'on':'was'):''}`, attrs:` data-dev="${esc(p.name)}"`,
      title:`${esc(p.name)} — ${p.n} tracks${p.smart?', a smart playlist: shown, never written':', made by iTunes or by hand; not a collection yet'}`
    })).join('');
  }
  $('#colbody').innerHTML=h;
  const body=$('#colbody');
  body.querySelectorAll('[data-dev]').forEach(el=>el.onclick=()=>{activate('ipod');devPick=el.dataset.dev;colPick=null;albPick=null;sel=recallSel();draw();});
  body.querySelector('[data-all]').onclick=()=>{activate('ipod');colPick=null;devPick=null;albPick=null;sel=recallSel();draw();};
  body.querySelectorAll('[data-c]').forEach(el=>{
    const name=el.dataset.c;
    el.onclick=()=>{activate('ipod');colPick=name;devPick=null;albPick=null;sel=recallSel();draw();};
    const mo=el.querySelector('.more');
    if(mo)mo.onclick=e=>{e.stopPropagation(); openMenu(mo,'col',name);};
    el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';el.classList.add('drop');};
    el.ondragleave=()=>el.classList.remove('drop');
    el.ondrop=async e=>{
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
      const dk=dropKeys(e); if(!dk.length)return;
      const key=dk[0];
      if(key.startsWith('alb:')){ const a=SRCALBUMS.find(x=>x.key===key.slice(4));
        if(a)await decide({collection:name,mode:'add'},a.tracks.map(t=>t.key)); return; }
      if(key.startsWith('pl:')){ await pourPlaylist(key.slice(3),name); return; }   // a whole playlist
      if(key.startsWith('t7:')){ await pourFolder(key.slice(3),name); return; }     // a whole folder
      // Already-in is a no-op, not a refusal: dropping ten where three are
      // already there should add the seven, and say so.
      const fresh=dk.filter(k=>{const t=ALL.find(x=>x.key===k); return !(t&&t.collections.includes(name));});
      if(!fresh.length){toast(dk.length>1?`all ${dk.length} already in ${name}`:'already in '+name);return;}
      await decide({collection:name,mode:'add'},fresh);
      const skipped=dk.length-fresh.length;
      toast(`${fresh.length>1?fresh.length+' tracks':'added'} to ${name}`
            + (skipped?` \u00b7 ${skipped} already there`:''));
    };
  });
  // THE WHOLE PANE TAKES A DROP. Aiming at "+ new" to make a collection is
  // a bullseye you should not have to hit: dropping a playlist or a folder
  // anywhere on the iPod means "this belongs on the iPod", and a collection
  // of that name is what that sentence produces. Rows and "+ new" stop
  // propagation, so a precise drop still wins; this only catches the misses.
  const pane=$('#left');
  pane.ondragover=e=>{
    if(!DRAGKIND)return;                       // a bare track needs a target
    e.preventDefault(); e.dataTransfer.dropEffect='copy'; pane.classList.add('drop');
  };
  pane.ondragleave=e=>{ if(!pane.contains(e.relatedTarget))pane.classList.remove('drop'); };
  pane.ondrop=async e=>{
    e.preventDefault(); pane.classList.remove('drop');
    const key=e.dataTransfer.getData('text/plain'); if(!key)return;
    if(key.startsWith('alb:')){ const a=SRCALBUMS.find(x=>x.key===key.slice(4)); if(a)await albumToIpod(a); return; }
    if(key.startsWith('pl:')) return pourPlaylist(key.slice(3),null);
    if(key.startsWith('t7:')) return pourFolder(key.slice(3),null);
  };
  const nc=$('#newcol'); if(!nc)return;
  nc.ondragover=e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; nc.classList.add('drop'); };
  nc.ondragleave=()=>nc.classList.remove('drop');
  nc.ondrop=async e=>{ e.preventDefault(); e.stopPropagation(); nc.classList.remove('drop');
    const key=e.dataTransfer.getData('text/plain'); if(!key)return;
    if(key.startsWith('pl:')){ await pourPlaylist(key.slice(3),null); return; }
    if(key.startsWith('t7:')){ await pourFolder(key.slice(3),null); return; } };
}

/* A new collection is made in the pane it will live in: a field at the top of
   the list, and the Apple Music playlists underneath as rows in the same
   shape. Nothing floats, nothing dims, nothing is covered. The field is also
   the filter -- type to narrow the playlists, or press enter to name one. */
function enterNew(){
  if(document.body.classList.contains('nl'))setFold('L',false);   // a sheet over a folded pane is no sheet
  activate('ipod'); newMode=true; newQ='';
  const inp=$('#newin'); inp.value='';
  paintSeeds(); $('#lsheet').classList.add('on'); inp.focus();
}
function leaveNew(){ newMode=false; newQ=''; $('#lsheet').classList.remove('on'); }
(function(){
  const inp=$('#newin');
  inp.oninput=e=>{newQ=e.target.value;paintSeeds();};
  inp.onkeydown=e=>{e.stopPropagation();
    if(e.key==='Escape'){leaveNew();return;}
    if(e.key==='Enter'){const v=newQ.trim(); if(!v)return;
      if(!COLS.includes(v))PENDING.add(v);
      leaveNew(); colPick=v; sel=0; draw();}};
  $('#lsheetesc').onclick=leaveNew;
  $('#rsheetesc').onclick=()=>closeSettings();
})();
function paintSeeds(){
  const el=$('#seedrows'); if(!el)return;
  const q=newQ.trim().toLowerCase();
  const rows=AMP.filter(p=>!q||p.name.toLowerCase().includes(q));
  el.innerHTML = !AMP.length
    ? `<p class="note">Not read yet — the gear has <b style="color:var(--ink)">Read Apple Music</b>.</p>`
    : rows.length
      ? rows.map(p=>colRow({name:esc(p.name), cnt:p.tracks, cls:'dim',
          attrs:` data-seed="${esc(p.name)}"`,
          title:`${esc(p.name)} — ${p.tracks} tracks, created ${(p.created||'?').slice(0,10)}`})).join('')
      : `<p class="note">No playlist called that. <kbd>enter</kbd> makes “${esc(newQ.trim())}” as a new one.</p>`;
  el.querySelectorAll('[data-seed]').forEach(x=>x.onclick=()=>seedFrom(x.dataset.seed));
}

/* Where music comes from. Two libraries, one pane, the way Buy and Vinyl
   share the one on the right -- you take from one or the other, never both at
   once. Switching the tab is only looking; it does not change what the centre
   shows, which is still the last playlist actually clicked. */
function drawSrc(){
  const pane=$('#src');
  pane.querySelector('.plabel').classList.toggle('off',active==='ipod');
  document.querySelectorAll('#stabs .pill').forEach(p=>p.classList.toggle('on',p.dataset.s===stab));
  paintModes('src',$('#smodes'));
  if(MODE.src==='album'){
    const rows = stab==='t7' ? (SRCTRACKS||[]).map(t7Row) : (LIB||[]).map(libRow);
    SRCALBUMS=albumsOf(rows);
    $('#srcbody').innerHTML = rows.length ? albumRows(SRCALBUMS,'src')
      : `<p class="note">Loading…</p>`;
    wireAlbums($('#srcbody'),'src');
    if(!rows.length)ensureSrcAll();
    return;
  }
  if(stab==='t7')drawT7(); else drawAM();
  document.querySelectorAll('#stabs .pill').forEach(p=>p.onclick=()=>{
    if(stab===p.dataset.s)return;
    setSrc(p.dataset.s); drawCols(); restoreScroll();
  });
}
function drawAM(){
  const st=p=>p.slug===amPick?(active==='am'?'on':'was'):'';
  let h=colRow({name:'All in Apple Music', cnt:AMLIB||'',
    cls:amPick==='__all__'?(active==='am'?'on':'was'):'', attrs:' data-am="__all__"'});
  h+= AMP.length ? AMP.map(p=>colRow({name:esc(p.name), cnt:(p.created||'').slice(0,7)||p.tracks,
        menu:true, cls:`${st(p)} ${p.imported?'':'dim'}`,
        attrs:` data-am="${esc(p.slug)}" draggable="true"`,
        title:`${esc(p.name)} — ${p.tracks} tracks · created ${(p.created||'?').slice(0,10)} · last added ${(p.last||'?').slice(0,10)}${p.imported?' · imported':''} — drag onto a collection, or onto + new`
      })).join('')
    : `<p class="note">Not read yet. Open the gear and press <b style="color:var(--ink)">Read Apple Music</b>.</p>`;
  $('#srcbody').innerHTML=h;
  $('#srcbody').querySelectorAll('[data-am]').forEach(el=>{
    const slug=el.dataset.am, p=AMP.find(x=>x.slug===slug);
    el.onclick=async()=>{
      activate('am'); setSrc('am'); amPick=slug; albPick=null; PEEK=null; sel=recallSel();
      if(amPick==='__all__'){ await ensureLib(); }
      else { await peek(p&&p.name); }
      draw();
    };
    const mo=el.querySelector('.more');

      el.ondragstart=e=>{ DRAGKIND='pl'; e.dataTransfer.setData('text/plain','pl:'+p.name); e.dataTransfer.effectAllowed='copy'; el.classList.add('dragging'); };

    }

}
/* ---------------- albums, derived ----------------
   Grouped on album artist where there is one and the track artist otherwise,
   so a compilation does not shatter into one album per performer. The key is
   normalised because the same record reaches us from three places -- the
   device, the drive index and Apple Music -- spelled three ways. */
// THE ALBUM NAME ALONE. Keying on artist+album looked safer and shattered
// every compilation: only 904 of 4,048 files carry an album_artist tag, so
// the GTA San Andreas radio stations came out as one album per performer --
// 389 "albums" from 466 tracks, nearly all of them holding one. The device
// groups by album too, and shows Various Artists when the performers differ,
// which is what this now does.
function albumKey(t){
  return (t.album||'').toLowerCase().replace(/\s+/g,' ').trim();
}
const ICON_LIST='<svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true">'
 +'<g fill="currentColor"><rect y="0" width="12" height="1.6" rx=".6"/><rect y="4.2" width="12" height="1.6" rx=".6"/>'
 +'<rect y="8.4" width="12" height="1.6" rx=".6"/></g></svg>';
const ICON_PLUS='<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">'
 +'<g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">'
 +'<line x1="6.5" y1="1.4" x2="6.5" y2="11.6"/><line x1="1.4" y1="6.5" x2="11.6" y2="6.5"/></g></svg>';
const ICON_FILTER='<svg width="12" height="11" viewBox="0 0 12 11" aria-hidden="true">'
 +'<path d="M.8 1h10.4L7.2 5.6v4L4.8 10.6V5.6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const ICON_ALBUM='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">'
 +'<g fill="currentColor"><rect width="5" height="5" rx="1"/><rect x="7" width="5" height="5" rx="1"/>'
 +'<rect y="7" width="5" height="5" rx="1"/><rect x="7" y="7" width="5" height="5" rx="1"/></g></svg>';
function wireNewCol(){
  const nc=$('#newcol'); if(!nc)return;
  nc.onclick=enterNew;
  // a whole playlist or folder dropped on the plus becomes a collection
  nc.ondragover=e=>{ if(!DRAGKIND)return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; nc.classList.add('drop'); };
  nc.ondragleave=()=>nc.classList.remove('drop');
  nc.ondrop=async e=>{ e.preventDefault(); e.stopPropagation(); nc.classList.remove('drop');
    const key=e.dataTransfer.getData('text/plain'); if(!key)return;
    if(key.startsWith('alb:')){ const a=SRCALBUMS.find(x=>x.key===key.slice(4)); if(a)await albumToIpod(a); return; }
    if(key.startsWith('pl:')){ await pourPlaylist(key.slice(3),null); return; }
    if(key.startsWith('t7:')){ await pourFolder(key.slice(3),null); return; } };
}
function paintModes(pane,el){
  if(!el)return;
  const m=MODE[pane];
  // The iPod pane carries a plus, and it leads the group rather than
  // trailing it: sitting last, it dragged the two marks sideways every time
  // album view hid it. Hidden here means INVISIBLE, not absent -- the slot
  // stays and the marks never move.
  const plus = pane==='ipod'
    ? `<span class="plus" id="newcol" title="new collection"
             style="visibility:${m==='list'?'visible':'hidden'}">${ICON_PLUS}</span>` : '';
  el.innerHTML=plus
              +`<span class="${m==='list'?'on':''}" data-m="list" title="playlists">${ICON_LIST}</span>`
              +`<span class="${m==='album'?'on':''}" data-m="album" title="albums">${ICON_ALBUM}</span>`;
  el.querySelectorAll('[data-m]').forEach(x=>x.onclick=e=>{e.stopPropagation();
    if(MODE[pane]!==x.dataset.m)setMode(pane,x.dataset.m);});
}
function albumsOf(rows){
  const by=new Map();
  rows.forEach(t=>{
    const k=albumKey(t); if(!k)return;
    let a=by.get(k);
    if(!a)by.set(k,a={key:k, album:t.album, artist:null, who:new Set(), tracks:[], art:null, onPod:0});
    a.tracks.push(t); a.who.add(t.album_artist||t.artist||'');
    if(!a.art&&t.art)a.art=t.art; if(t.device)a.onPod++;
  });
  by.forEach(a=>{ a.artist = a.who.size===1 ? [...a.who][0] : 'Various Artists'; });
  return [...by.values()].sort((x,y)=>
    (x.artist||'').localeCompare(y.artist||'')||(x.album||'').localeCompare(y.album||''));
}
function albumRows(list,pane){
  if(!list.length)return `<p class="note">No albums here — these tracks carry no album tag.</p>`;
  return list.map(a=>colRow({name:esc(a.album||'—'), sub:esc(a.artist||''), art:a.art||'',
    cnt:a.tracks.length, menu:true, cls:albPick===a.key?'on':'',
    attrs:` data-alb="${esc(a.key)}" draggable="${pane!=='ipod'}"`,
    title:`${esc(a.artist||'')} — ${esc(a.album||'')} · ${a.tracks.length} tracks${a.onPod?', '+a.onPod+' on the iPod':''}`
  })).join('');
}

/* THE ONE LIST ROW.

   Nine places used to hand-assemble this and they disagreed about their own
   internals: four carried a menu slot and five did not, six repeated the
   same inline truncation style that `.col .nm` already does, and the album
   row nested two more inline-styled spans on top. The visible cost was a
   count column that stepped 28px sideways between a playlist and the "All"
   row above it.

   One builder, three slots, always in this order: name, count, menu. The
   menu slot is RESERVED when the row has no menu -- an empty column is what
   keeps every count and every set of dots on the same two verticals down
   the whole pane.

   Variants are class and content, never a different shape.               */
function colRow(o){
  const art = o.art === undefined ? ''
    : (o.art ? `<img class="albart" src="${o.art}" loading="lazy" draggable="false">`
             : '<span class="albart"></span>');
  const name = o.sub
    ? `<span class="nm two"><i>${o.name}</i><span class="sub">${o.sub}</span></span>`
    : `<span class="nm">${o.name}</span>`;
  return `<div class="col ${o.cls||''}"${o.attrs||''}${o.title?` title="${o.title}"`:''}>`
    + art + name
    + `<span class="cnt">${o.cnt==null?'':o.cnt}</span>`
    + `<span class="more${o.menu?'':' hold'}" title="more">&#8943;</span></div>`;
}

/* the drive: what is already owned, filed the way the drive files it */
function drawT7(){
  const st=n=>n===t7Pick?(active==='t7'?'on':'was'):'';
  let h = T7.folders.length
    ? colRow({name:'All in Library', cnt:T7.total||'',

      + T7.folders.map(f=>colRow({name:esc(f.name), cnt:f.n, menu:true,
        cls:`${st(f.name)} ${f.lossless?'':'dim'}`,
        attrs:` data-t7="${esc(f.name)}" draggable="true"`,
        title:`${esc(f.name)} — ${f.n} files${f.lossless?`, ${f.lossless} lossless`:', none lossless'} — drag onto a collection, or onto + new`
      })).join('')
    : `<p class="note">Nothing indexed yet. Open the gear and press <b style="color:var(--ink)">Index the drive</b>.</p>`;
  $('#srcbody').innerHTML=h;
  $('#srcbody').querySelectorAll('[data-t7]').forEach(el=>{
    const name=el.dataset.t7;
    el.onclick=async()=>{ activate('t7'); setSrc('t7'); t7Pick=name; albPick=null; T7TRACKS=null; sel=recallSel(); await t7Peek(name); draw(); };
    const mo=el.querySelector('.more');
    if(mo&&name!=='__all__')mo.onclick=e=>{e.stopPropagation(); openMenu(mo,'t7f',T7.folders.find(f=>f.name===name));};

      el.ondragstart=e=>{ DRAGKIND='t7'; e.dataTransfer.setData('text/plain','t7:'+name); e.dataTransfer.effectAllowed='copy'; el.classList.add('dragging'); };
    } else el.draggable=false;
    el.ondragend=()=>{ DRAGKIND=null; el.classList.remove('dragging'); document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop')); };
  });
}
function wireAlbums(root,pane){
  root.querySelectorAll('[data-alb]').forEach(el=>{
    const k=el.dataset.alb;
    el.onclick=()=>{ activate(pane==='ipod'?'ipod':(stab==='t7'?'t7':'am')); albPick=k; sel=recallSel(); draw(); };
    const mo=el.querySelector('.more');
    if(mo)mo.onclick=e=>{e.stopPropagation();
      openMenu(mo,'album',(pane==='ipod'?PODALBUMS:SRCALBUMS).find(a=>a.key===k));};
    if(pane!=='ipod'){
      el.ondragstart=e=>{ DRAGKIND='alb'; e.dataTransfer.setData('text/plain','alb:'+k);
        e.dataTransfer.effectAllowed='copy'; el.classList.add('dragging'); };
      el.ondragend=()=>{ DRAGKIND=null; el.classList.remove('dragging');
        document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop')); };
    }
  });
}
async function t7Peek(name){
  t7Loading=true; drawMid();
  const r=await fetch('/api/local?folder='+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  t7Loading=false;
  T7TRACKS = (r&&r.tracks) ? {name, tracks:r.tracks} : null;
  if(!T7TRACKS)toast('could not read that folder');
}
// A file on the drive is owned by definition: T7 lit, and never "to buy".
function t7Row(r){
  const hit=BYKEY.get(r.key); if(hit)return hit;
  return {key:r.key, artist:r.artist, title:r.title, album:r.album, seconds:r.secs,
          tier:'', vinyl:false, bought:false, collections:[], playlists:[],
          device:false, t7:true, local:true, am:false, am_owned:false, am_status:null,
          lossless:r.lossless, origin_ext:r.ext,
          play_from:'t7', audio:false, preview:null, art:null, lean:true};
}
// Album view needs every track of that source, not one playlist's worth.
let SRCTRACKS=null, srcAllFor=null;
async function ensureSrcAll(){
  if(stab==='am'){ await ensureLib(); drawCols(); return; }
  if(srcAllFor==='t7'&&SRCTRACKS)return;
  const r=await fetch('/api/local?folder=__all__').then(r=>r.json()).catch(()=>null);

}
async function ensureLib(){
  if(libLoaded)return;
  const r=await fetch('/api/library').then(r=>r.json()).catch(()=>null);
  LIB=(r&&r.tracks)||[]; libLoaded=true;
}
async function peek(name){
  if(!name)return;
  peeking=true; drawMid();
  const r=await fetch('/api/peek?name='+encodeURIComponent(name)).then(r=>r.json()).catch(()=>null);
  peeking=false;
  if(!r||r.error){PEEK=null;toast(r&&r.error?'could not read it':'could not read it');return;}
  PEEK=r;
}

/* ---------------- right: buy and vinyl, the whole pane a drop target ---------------- */
function drawRight(){
  document.querySelectorAll('#rtabs .pill').forEach(t=>t.classList.toggle('on',t.dataset.r===rtab));
  const el=$('#rbody');
  if(rtab==='buy'){
    const short=ALL.filter(t=>t.tier==='sync');
    // Three stages, in the direction they move: still to buy; bought -- a file
    // exists on your drive, found by the index -- and waiting for a sync; and
    // already on the iPod. "Bought" is not a button you have to remember; the
    // index finding the file is what bought means.
    const todo=short.filter(t=>!t.bought&&!t.local), ready=short.filter(t=>t.local&&!t.device), done=short.filter(t=>t.device);
    const eur=todo.reduce((a,t)=>a+(t.price||0),0);

    $('#rstat').innerHTML=`<s>${todo.length}</s> to buy · <s>&euro;${eur.toFixed(2)}</s> · <s>${ready.length}</s> ready · <s>${done.length}</s> synced`;
    let h='';
    const dots=t=>`<span class="more" data-card="${esc(t.key)}" title="more">&#8943;</span>`;
    // Identity, price and a lossless source are looked up when a track joins
    // this list -- not for the whole library in advance. This says where that
    // got to, per track, so a blank price reads as "not asked yet" rather than
    // "free".
    const look=t=>{
      if(t.looking) return `<div class="look on">looking up iTunes…</div>`;
      if(t.it_verdict==='not_found') return `<div class="look none">not on iTunes${t.bandcamp?'':' · try Bandcamp'}</div>`;
      if(t.url) return `<div class="look done">iTunes ${t.it_verdict||'matched'}${t.seconds?' · '+mmss(t.seconds):''}`
        + (t.bandcamp ? ` · bandcamp ${t.bc_verdict||'found'}` : ` · <span class="go" data-bc="${esc(t.key)}">bandcamp not checked</span>`) + `</div>`;
      return `<div class="look"><span class="go" data-look="${esc(t.key)}">look it up</span></div>`;
    };
    if(ready.length) h+=`<div class="month vg">bought · ready for the next sync · ${ready.length}</div>`
      + ready.map(t=>`<div class="card">${dots(t)}<b>${esc(t.artist)} — ${esc(t.title)}</b>
        <div class="sub">a file is on your drive${t.lossless?', lossless':''} · goes on with the next sync${t.collections.length?' · in '+esc(t.collections.join(', ')):' · <span style="color:var(--orange)">not in any playlist yet</span>'}</div></div>`).join('')
      + `<div class="month vg">still to buy · ${todo.length} · ${flac} confirmed FLAC</div>`;
    h+= todo.length ? todo.map(t=>`<div class="card">${dots(t)}
        <b>${esc(t.artist)} — ${esc(t.title)}</b>
        <div class="sub">${esc(t.album||'')} · ${mmss(t.seconds)} · ${t.playlists.map(MONTH).join(', ')}</div>
        <div class="acts">
          ${t.bandcamp?`<a href="${t.bandcamp}" target="_blank">Bandcamp${t.bc_verdict==='confirmed'?' FLAC':' (check length)'}</a>`:''}
          ${t.url?`<a href="${t.url}" target="_blank">iTunes €${(t.price||0).toFixed(2)}</a>`
            :(t.looking?'<span class="warn">looking it up…</span>'
              :(t.it_verdict==='not_found'?'<span class="warn">iTunes does not carry it</span>'
                :'<span class="warn">not looked up</span>'))}
          <button data-bought="${esc(t.key)}">bought</button></div>${look(t)}</div>`).join('')
      : (ready.length ? '' : `<p class="note">Nothing to buy. Drag a track here, or press <kbd>s</kbd> on one.</p>`);
    const unknown=todo.filter(t=>!t.url&&!t.it_verdict&&!t.looking).length;
    if(unknown) h+=`<p class="note" style="margin-top:10px"><span class="go" id="lookall" style="color:var(--ink);cursor:pointer;text-decoration:underline">Look up the ${unknown} without a source</span> — one iTunes query each.</p>`;
    if(todo.length||ready.length) h+=`<p class="note" style="margin-top:14px">Buy on Bandcamp or iTunes, download, drop the file in your music folder, then
      <b style="color:var(--ink)">Index the drive</b> in the gear. The index finding it is what bought means; the next sync copies it across.</p>`;
    el.innerHTML=h;
    el.querySelectorAll('[data-bought]').forEach(b=>b.onclick=()=>decide({bought:true},[b.dataset.bought]));

      const r=await post('/api/action',{action:'lookup',all_sync:true});
      toast(`looking up ${r.queued||0}…`); await load(); };
  } else {
    // Vinyl runs in one direction: flagged here -> wanted on Discogs -> owned.
    // The pane shows the three stages, and the first one is the to-do.

    ALL.filter(t=>t.vinyl).forEach(t=>{const k=t.artist+' — '+(t.album||'(unknown release)');
      (by[k]=by[k]||{name:k,key:vkey(t)||('?'+k),tracks:[]}).tracks.push(t);});
    const flagged=Object.values(by).sort((a,b)=>a.name.localeCompare(b.name));
    const fkeys=new Set(flagged.map(f=>f.key));
    const toAdd=flagged.filter(f=>!OWN.has(f.key)&&!WANT.has(f.key));
    const W=(DISCOGS.wantlist||[]).slice().sort((a,b)=>(b.added||'').localeCompare(a.added||''));

/* ---------------- saving ---------------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1400);}
function saved(){const s=$('#saved'); if(s)s.textContent='saved '+new Date().toLocaleTimeString();}
async function post(url,body){
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)}).then(r=>r.json()).catch(()=>({ok:false}));
}
async function decide(patch,keys,advance){
  const ks = keys || targets();
  if(!ks.length)return;
  // anything decided on that has no record yet gets one, named from the row
  const newborn=ks.filter(k=>!BYKEY.has(k))
    .map(k=>{const t=view.find(x=>x.key===k); return t?{key:k,artist:t.artist,title:t.title}:null;})
    .filter(Boolean);
  const r=await post('/api/decide',{keys:ks,...(newborn.length?{adopt:newborn}:{}),...patch});
  if(!r.ok){toast('NOT SAVED — check the terminal');return;}
  saved();
  // On an unfiltered list the row stays put, so step on; on a filtered list the
  // row leaves and `sel` already points at the next one. Getting this wrong means
  // every decision needs a following keypress, which ruins the rhythm.
  if(advance&&!filtered())sel=Math.min(sel+1,Math.max(0,view.length-1));
  await load(); refreshUndo();
}

/* ---------------- playing ---------------- */
function srcFor(t){
  // A real file beats a 30s preview every time. Tracks already on the device
  // have no iTunes match at all, so this is the only way to hear them.
  if(t.audio) return {url:'/api/audio?key='+encodeURIComponent(t.key), full:true};
  if(t.preview) return {url:t.preview, full:false};
  return null;
}
let playRow=null;
// A full pass is cheap but not free on a list this long, so it runs only when
// something actually changes; the clock itself touches one element.
function paintPlaying(){
  document.querySelectorAll('.row.playing').forEach(r=>{
    r.classList.remove('playing');
    const d=r.querySelector('.dur'); if(d&&d.dataset.full)d.textContent=d.dataset.full;
  });
  playRow=null;
  const k=au.dataset.key; if(!k||au.paused)return;
  playRow=[...document.querySelectorAll('#list .row')].find(r=>r.dataset.k===k)||null;
  if(playRow){playRow.classList.add('playing');tickProgress();}
}
function tickProgress(){
  if(!playRow)return;
  const d=playRow.querySelector('.dur'); if(!d)return;
  const full=d.dataset.full;
  d.textContent = full ? `${mmss(au.currentTime)} / ${full}` : mmss(au.currentTime);
}
au.ontimeupdate=tickProgress; au.onplay=paintPlaying; au.onpause=paintPlaying; au.onended=paintPlaying;
function play(){
  const t=view[sel]; if(!t)return;
  const s=srcFor(t);
  if(!s){toast('nothing to play for this one');return;}
  if(au.dataset.key===t.key&&!au.paused){au.pause();return;}
  au.dataset.key=t.key; au.src=s.url;
  au.play().catch(()=>toast(s.full?'could not play the file':'preview failed'));
  if(s.full)toast('playing the full track');
}

// A job keeps being polled whether or not the overlay is open; the overlay, when

function paintJob(r){

async function startJob(body){

async function pollJob(){

}

/* ---------------- THE TRACK PANEL ----------------

   The form, with the cover small and beside the identity rather than above
   it. Leading with a large square was the first draft; it was argued out on
   the grounds that a tended library has covers and a deficiency should not
   shape the UI -- and then argued back in, smaller, because the form is
   what you are here to fill in.

   Everything it edits goes to the FILE. There is no second store, so there
   is no second thing to save. What the device holds catches up on the next
   sync, and the sync panel shows that as an ordinary row.
*/
const TP = { key:null, path:null, data:null, edits:{}, busy:false };

function tpDirty(){ return Object.keys(TP.edits).length > 0; }

async function openTrack(t){
  TP.key = t && t.key || null;
  TP.path = null; TP.data = null; TP.edits = {};
  $('#tp').classList.add('on'); $('#spscrim').classList.add('on');
  $('#tpt').textContent = t ? (t.artist ? t.artist+' — '+t.title : (t.title||'Track')) : 'Track';
  $('#tpbody').innerHTML = '<p class="note">Reading the file…</p>';
  $('#tpbtn').innerHTML = ''; $('#tpnote').textContent = '';
  const q = TP.key ? 'key='+encodeURIComponent(TP.key) : 'path='+encodeURIComponent(TP.path||'');
  const d = await fetch('/api/track?'+q).then(r=>r.json()).catch(()=>null);
  if(!d || !d.ok){
    $('#tpbody').innerHTML = '<div class="month">'+esc((d&&d.error)||'could not read it')+'</div>';
    tpFoot(); return;
  }
  TP.data = d; TP.path = d.path;
  paintTrack();
}
function closeTrack(){
  if(TP.busy) return;
  if(tpDirty() && !confirm('Discard the unsaved changes?')) return;
  $('#tp').classList.remove('on');
  if(!$('#sp').classList.contains('on')) $('#spscrim').classList.remove('on');
  TP.edits = {};
}

const TP_FIELDS = [['title','Title'],['artist','Artist'],['album','Album'],
                   ['album_artist','Album artist'],['genre','Genre'],
                   ['year','Year'],['track','Track']];

function tpValue(f){
  return f in TP.edits ? TP.edits[f] : ((TP.data.fields||{})[f] || '');
}

function paintTrack(){
  const d = TP.data, f = d.file || {};
  const ro = !f.writable;
  let h = '<div class="tpid">'
    + '<div class="tpart" id="tpart" title="'+(ro?'':'drop an image, or click to choose one')+'">'
    + (d.art ? '<img src="'+d.art+'" alt="">' : '')
    + '<span class="ph">'+(d.art?'':'no cover')+'</span></div>'
    + '<div style="flex:1 1 auto;min-width:0">'
    + '<div class="fld" style="padding-left:0"><span class="k" style="width:0;display:none"></span>'
    + '<input class="v" data-f="title" placeholder="Title" value="'+esc(tpValue('title'))+'"'+(ro?' readonly':'')+'></div>'
    + '<div class="fld" style="padding-left:0"><span class="k" style="width:0;display:none"></span>'
    + '<input class="v" data-f="artist" placeholder="Artist" value="'+esc(tpValue('artist'))+'"'+(ro?' readonly':'')+'></div>'
    + '</div></div>';

  // the filename's guess, only when it has something to add
  const g = d.guess;
  if(g && !ro && (!tpValue('artist') || !tpValue('title'))){
    h += '<div class="tpguess"><div class="src">the name on disk suggests</div>'
      + '<div class="pair"><em>artist</em>'+esc(g.artist)+'</div>'
      + '<div class="pair"><em>title</em>'+esc(g.title)+'</div>'
      + '<span class="act2" id="tpuse">Use this</span></div>';
  }

  h += '<div class="month">release</div>';
  for(const [k,label] of TP_FIELDS.slice(2)){
    h += '<div class="fld'+(k in TP.edits?' dirty':'')+(ro?' ro':'')+'"><span class="k">'+label+'</span>'
      + '<input class="v" data-f="'+k+'" value="'+esc(tpValue(k))+'"'+(ro?' readonly':'')+'></div>';
  }

  h += '<div class="month">file</div>'
    + tpRow('Name', f.name || '—', true)
    + tpRow('Format', [f.codec, f.ext && f.ext.slice(1), f.seconds && mmss(f.seconds)]
            .filter(Boolean).join(' · ') || '—', true)
    + tpRow('Folder', f.folder || '—', true);
  if(d.device && d.device.on)
    h += tpRow('On the iPod', 'yes — the next sync brings it into line', true);
  if(ro)
    h += '<p class="note">'+esc(f.why||'not writable')+'</p>';

  $('#tpbody').innerHTML = h;
  wireTrack(ro);
  tpFoot();
}

function tpRow(label, value, ro){
  return '<div class="fld ro"><span class="k">'+esc(label)+'</span>'
    + '<span class="v" style="font-family:var(--mono);font-size:var(--fs-meta)">'
    + esc(value)+'</span></div>';
}

function wireTrack(ro){
  $('#tpbody').querySelectorAll('input.v').forEach(el=>{
    el.oninput = () => {
      const f = el.dataset.f, was = (TP.data.fields||{})[f] || '';
      if(el.value === was) delete TP.edits[f]; else TP.edits[f] = el.value;
      el.closest('.fld').classList.toggle('dirty', f in TP.edits);
      tpFoot();
    };
    // a field commits with the panel, never on blur: this writes a file
    el.onkeydown = e => {
      e.stopPropagation();
      if(e.key === 'Escape'){ closeTrack(); }
      if(e.key === 'Enter' && tpDirty() && !ro){ saveTrack(); }
    };
  });
  const u = $('#tpuse');
  if(u) u.onclick = () => {
    const g = TP.data.guess;
    if(!tpValue('artist')) TP.edits.artist = g.artist;
    if(!tpValue('title'))  TP.edits.title  = g.title;
    paintTrack();
  };
  const a = $('#tpart');
  if(a && !ro) wireArt(a);
}

function tpFoot(){
  const n = Object.keys(TP.edits).length;
  const ro = !(TP.data && TP.data.file && TP.data.file.writable);
  $('#tpnote').textContent = TP.busy ? 'writing the file…'
    : n ? (n===1 ? '1 field changed' : n+' fields changed')
    : (ro ? '' : 'nothing changed');
  // SAVE APPEARS WHEN THERE IS SOMETHING TO SAVE. Finder commits on blur;
  // that is wrong here, because the commit writes a file on your drive.
  $('#tpbtn').innerHTML = n && !ro
    ? '<button class="go" id="tpsave"'+(TP.busy?' disabled':'')+'>Save</button>'
    : '<button id="tpclose">Close</button>';
  const sv = $('#tpsave'); if(sv) sv.onclick = saveTrack;
  const cl = $('#tpclose'); if(cl) cl.onclick = closeTrack;
}

async function saveTrack(){
  if(TP.busy || !tpDirty()) return;
  TP.busy = true; tpFoot();
  const fields = {};
  for(const [k] of TP_FIELDS) fields[k] = tpValue(k);
  const body = TP.key ? {key:TP.key, fields} : {path:TP.path, fields};
  const r = await post('/api/tags', body);
  TP.busy = false;
  if(!r.ok){ toast(r.error || 'not saved'); tpFoot(); return; }
  TP.edits = {};
  toast('written to the file');
  const q = TP.key ? 'key='+encodeURIComponent(TP.key) : 'path='+encodeURIComponent(TP.path);
  TP.data = await fetch('/api/track?'+q).then(x=>x.json());
  paintTrack();
  await load(); refreshUndo();
}

/* Replacing the cover. It lands in saltpod's cache immediately, which is
   what the page reads; embedding it in the file needs the APIC half of the
   ID3 writer, and showing it on the DEVICE needs ArtworkDB -- both surveyed,
   neither built. The control says so rather than implying more. */
function wireArt(el){
  const pick = () => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*';
    i.onchange = () => i.files[0] && sendArt(i.files[0]);
    i.click();
  };
  el.onclick = pick;
  el.ondragover = e => { e.preventDefault(); el.classList.add('drop'); };
  el.ondragleave = () => el.classList.remove('drop');
  el.ondrop = e => {
    e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) sendArt(f);
  };
}
async function sendArt(file){
  if(!/^image\//.test(file.type)) return toast('that is not an image');
  const buf = await file.arrayBuffer();
  const r = await fetch('/api/art?key='+encodeURIComponent(TP.key||'')
                        +'&path='+encodeURIComponent(TP.path||''),
                        {method:'POST', body:buf}).then(x=>x.json()).catch(()=>null);
  if(!r || !r.ok) return toast((r&&r.error) || 'could not save the cover');
  toast('cover saved — in the file on the next writer, on the iPod after ArtworkDB');
  TP.data.art = r.art + '&t=' + Date.now();
  paintTrack();
  await load();
}

/* ---------------- THE SYNC PANEL ----------------

   The gap this closes: the tool has always been stage-then-commit -- decide
   freely, nothing touches the device until you say so -- but the confirm was
   all-or-nothing. You could see the seven removals and you could not drop
   one. That is the affordance the architecture already implied and did not
   have.

   Two ideas carry the whole thing:

   1. ONE LIST, TWICE. The rows you approve are the rows that report
      themselves. No swap to a spinner, no second screen -- the tick box
      becomes the status mark in the same 16px slot, so nothing moves at the
      moment your attention is on what is moving.

   2. EXECUTION ORDER, NOT IMPORTANCE. The list is in the order the sync
      actually runs, so progress goes top to bottom and never jumps. The
      counts that matter lead in the summary instead.

   Exclusions travel as identities -- track keys, playlist names -- never as
   indices: sync re-plans against the live device and the row at position 4
   may not be the same row by then.
*/
const SP = { plan:null, off:new Set(), state:'review', rows:[], log:[] };

const gb = b => b==null ? '?' : b>=1e9 ? (b/1e9).toFixed(1)+' GB' : Math.round(b/1e6)+' MB';

async function openSync(){
  SP.state='loading'; SP.off.clear(); SP.plan=null; SP.rows=[]; SP.log=[];
  $('#sp').classList.add('on'); $('#spscrim').classList.add('on');
  $('#spt').textContent='Review sync';
  $('#spbody').innerHTML='<p class="note">Reading the device…</p>';
  $('#spbtn').innerHTML=''; $('#spnote').textContent='';
  const p=await fetch('/api/plan').then(r=>r.json()).catch(()=>null);
  if(!p||!p.ok){
    SP.state='blocked';
    $('#spbody').innerHTML='<div class="month">'
      + esc((p&&(p.reason||p.error))||'could not read the iPod') + '</div>'
      + '<p class="note">Plug the iPod in and put it in Disk Mode: hold '
      + '<kbd>Select</kbd>+<kbd>Menu</kbd> to reset, then immediately '
      + '<kbd>Select</kbd>+<kbd>Play</kbd> until the screen says Disk Mode.</p>';
    paintSyncFoot(true); return;
  }
  SP.plan=p; SP.state='review'; buildSyncRows(); paintSync();
}
function closeSync(){
  if(SP.state==='running')return;            // never while the device is being written
  $('#sp').classList.remove('on'); $('#spscrim').classList.remove('on');
  SP.state='review';
}

/* The rows, in the order sync performs them. Infrastructure rows are in the
   list from the start: a dated backup is a promise the tool makes, and it
   should not first appear at the moment it is being kept. */
function buildSyncRows(){
  const p=SP.plan, R=[];
  R.push({sec:'first', n:0, ids:[]});
  R.push({id:'backup', infra:true, name:'back up the database'});
  if(p.adds.length){
    R.push({sec:'copy across', n:p.adds.length, ids:p.adds.map(a=>'a:'+a.key)});
    p.adds.forEach(a=>R.push({id:'a:'+a.key, name:a.artist+' — '+a.title,
      meta:(a.convert?'→ ALAC · ':'')+gb(a.bytes), bytes:a.bytes||0}));
  }
  if(p.removes.length){
    R.push({sec:'take off the iPod', n:p.removes.length, ids:p.removes.map(r=>'r:'+r.key)});
    p.removes.forEach(r=>R.push({id:'r:'+r.key, name:r.artist+' — '+r.title}));
  }
  const pls=[...p.delete.map(c=>({c:c,what:'delete'})), ...p.new.map(c=>({c:c,what:'create'})),
             ...p.update.map(c=>({c:c,what:'update'}))];
  if(pls.length){
    R.push({sec:'playlists', n:pls.length, ids:pls.map(x=>'p:'+x.c)});
    pls.forEach(x=>R.push({id:'p:'+x.c, name:x.c,
      meta:x.what==='delete'?'delete':x.what+' · '+(((p.sizes||{})[x.c])||0)}));
  }
  R.push({edge:'committed from here'});
  R.push({id:'write',  infra:true, name:'write the database'});
  R.push({id:'verify', infra:true, name:'verify on the device'});
  R.push({id:'eject',  infra:true, name:'eject'});
  SP.rows=R;
}

const spIncluded = () => SP.rows.filter(r=>r.id&&!r.infra&&!SP.off.has(r.id));
function spCounts(){
  const inc=spIncluded();
  return {adds:inc.filter(r=>r.id[0]==='a').length,
          rems:inc.filter(r=>r.id[0]==='r').length,
          pls: inc.filter(r=>r.id[0]==='p').length,
          bytes:inc.reduce((a,r)=>a+(r.bytes||0),0)};
}

function paintSync(){
  const p=SP.plan; if(!p)return;
  const c=spCounts(), run=SP.state!=='review';
  const free=p.free_bytes, fits=free==null||c.bytes<=free;

  // THE SUMMARY LEADS WITH WHAT IS IRREVERSIBLE. Removals delete files from
  // the device; additions are undone by removing them again.
  const bits=[];
  if(c.rems) bits.push('<s>'+c.rems+'</s> off the iPod');
  if(c.adds) bits.push('<s>'+c.adds+'</s> copied across');
  if(c.pls)  bits.push('<s>'+c.pls+'</s> playlist'+(c.pls>1?'s':''));
  const same=(p.unchanged||[]).length;
  let sum = bits.length ? bits.join(' \u00b7 ') : 'Nothing selected';
  if(!run){
    if(bits.length) sum += '. A dated backup is taken first, and tracks the collections '
      + 'do not mention are left alone.';
    if(same) sum += ' '+same+' playlist'+(same>1?'s':'')+' already match'
      +(same>1?'':'es')+' the device.';
    if(SP.off.size) sum += ' '+SP.off.size+' unticked.';
  }
  let h='<p class="note">'+sum+'</p>';
  if(c.adds&&free!=null){
    const pct=Math.max(0,Math.min(100, 100*Math.min(c.bytes,free)/free));
    h+='<div class="month" style="margin-top:0">'+gb(c.bytes)+' of '+gb(free)+' free'
      +(fits?'':' \u2014 will not fit')+'</div>'
      +'<div class="spgauge"><i class="'+(fits?'':'over')+'" style="width:'+(fits?pct:100)+'%"></i></div>';
  }

  // The section toggle carries its ROW INDEX, not its ids: a key may hold any
  // character, so no separator is safe to pack a list into an attribute with.
  h += SP.rows.map((r,ri)=>{
    if(r.edge) return '<div class="month edge">'+esc(r.edge)+'</div>';
    if(r.sec){
      // The count follows the ticks. A header still reading 7 over five
      // ticked rows is the sort of small lie that makes you re-count.
      if(!r.ids.length) return '<div class="month">'+esc(r.sec)+'</div>';
      const kept=r.ids.filter(i=>!SP.off.has(i)).length;
      const allOn=kept===r.n;
      return '<div class="month">'+esc(r.sec)+' \u00b7 '+(allOn?r.n:kept+' of '+r.n)
        + (run?'':'<span class="all" data-sec="'+ri+'">'+(allOn?'none':'all')+'</span>')
        + '</div>';
    }
    // The state lives in the .cnt slot -- the slot that already holds a
    // count on every other row in the product. One slot, one meaning.
    const st = r.infra ? (r.state||'fixed') : (r.state || (SP.off.has(r.id)?'out':''));
    const mk = {doing:'\u2026', done:'\u2713', err:'!'}[r.state] || '';
    const right = r.err ? esc(r.err) : (mk || (run?'':esc(r.meta||'')));
    return colRow({name:esc(r.name), cnt:right, cls:st, attrs:' data-id="'+esc(r.id)+'"'});
  }).join('');
  if(SP.log.length) h+='<div id="splog">'+esc(SP.log.slice(-8).join('\n'))+'</div>';
  $('#spbody').innerHTML=h;

  if(!run){
    $('#spbody').querySelectorAll('.col:not(.fixed)').forEach(el=>el.onclick=()=>{
      const id=el.dataset.id; SP.off.has(id)?SP.off.delete(id):SP.off.add(id); paintSync();});
    $('#spbody').querySelectorAll('[data-sec]').forEach(el=>el.onclick=e=>{
      e.stopPropagation();
      const ids=(SP.rows[+el.dataset.sec]||{}).ids||[], allOn=ids.every(i=>!SP.off.has(i));
      ids.forEach(i=>allOn?SP.off.add(i):SP.off.delete(i)); paintSync();});
  }
  paintSyncFoot(fits);
}

function paintSyncFoot(fits){
  const note=$('#spnote'), btn=$('#spbtn');
  const close=()=>{btn.innerHTML='<button id="spdone">Close</button>';
    const d=$('#spdone'); if(d)d.onclick=closeSync;};
  if(SP.state==='blocked'){ note.textContent=''; close(); return; }
  const c=spCounts(), n=c.adds+c.rems+c.pls;
  if(SP.state==='review'){
    // The button names the consequence rather than the verb. "Sync" tells you
    // nothing about the seven files it is about to delete.
    const label = !n ? 'Nothing to do'
      : [c.rems?('Remove '+c.rems):'', c.adds?('Copy '+c.adds):'',
         (!c.rems&&!c.adds&&c.pls)?('Write '+c.pls):''].filter(Boolean).join(' \u00b7 ');
    btn.innerHTML='<button class="go" id="spgo"'+((!n||!fits)?' disabled':'')+'>'+esc(label)+'</button>';
    note.textContent = !fits ? 'not enough room'
      : n ? 'nothing has changed on the device yet' : '';
    const g=$('#spgo'); if(g)g.onclick=runSync;
    return;
  }
  if(SP.state==='running'){ btn.innerHTML=''; note.textContent='leave the iPod plugged in'; return; }
  close();
}

/* Running. The server prints `@@ <id> <state>` beside its own prose; the page
   matches those ids to the rows it drew, so progress is reported BY the
   changes rather than about them. */
async function runSync(){
  SP.state='running'; SP.log=[];
  $('#spt').textContent='Syncing';
  paintSync();
  const ex={tracks:[],playlists:[]};
  SP.off.forEach(id=>{ const v=id.slice(2);
    if(id[0]==='p')ex.playlists.push(v); else ex.tracks.push(v); });
  const r=await post('/api/action',{action:'sync',exclude:ex});
  if(!r.ok||!r.job){ SP.state='error'; SP.log=[r.error||'could not start the sync'];
    $('#spt').textContent='Sync stopped'; paintSync(); return; }
  job=r.job; $('#gear').classList.add('busy');
  const id=r.job;
  const tick=async()=>{
    const j=await fetch('/api/job?id='+id).then(x=>x.json()).catch(()=>null);
    if(!j){setTimeout(tick,1500);return;}
    lastJob=j; readSyncLog(j);
    if(j.state==='running'){paintSync();setTimeout(tick,800);return;}
    job=null; $('#gear').classList.remove('busy');
    SP.state = j.state==='done' ? 'done' : 'error';
    $('#spt').textContent = j.state==='done' ? 'Synced' : 'Sync stopped';
    // Anything still waiting when the run ends never happened. Say so rather
    // than leaving a row that looks like it is still going.
    SP.rows.forEach(r2=>{ if(r2.id&&!r2.state&&!SP.off.has(r2.id))
      r2.state = j.state==='done' ? 'done' : 'todo'; });
    paintSync();
    $('#spnote').textContent = j.state==='done'
      ? 'the iPod has been ejected — safe to unplug'
      : 'stopped before finishing — the pre-write backup is intact';
    await load(); pollHealth();
  };
  tick();
}
function readSyncLog(j){
  const byId={}; SP.rows.forEach(r=>{ if(r.id)byId[r.id]=r; });
  const prose=[];
  for(const ln of (j.log||[])){
    const m=ln.match(/^@@ (\S+) (doing|done|error)(?: (.*))?$/);
    if(m){ const r=byId[m[1]]; if(r){ r.state=m[2]; if(m[3])r.err=m[3]; } continue; }
    if(!ln.startsWith('## ')&&ln.trim())prose.push(ln);
  }
  SP.log=prose;
}

/* ---------------- the three-dot menu ----------------
   One menu, two kinds. A track's lists what a keystroke or a drag would do,
   and "Add to playlist" swaps the menu for a picker of the collections, ticks
   for the ones it is in, a field to make a new one. A collection's carries
   rename, add-all-wanted and delete -- the confirms stay as panels. */
const menu=$('#menu');
let MENU=null;
function menuRow(label,key,tick,cls){
  return `<div class="drow ${cls||''}"><span class="dn">${label}</span>${tick?'<span class="dc">&#10003;</span>':''}${key?`<span class="dk">${key}</span>`:''}</div>`;
}
function openMenu(anchor,kind,payload){
  MENU={kind,payload};
  paintMenu();
  menu.classList.add('on');
  const a=anchor.getBoundingClientRect(), m=menu.getBoundingClientRect();
  let x=a.right-m.width, y=a.bottom+4;
  if(x<8)x=8; if(x+m.width>window.innerWidth-8)x=window.innerWidth-8-m.width;
  if(y+m.height>window.innerHeight-8)y=a.top-4-m.height;
  if(y<8)y=8;
  menu.style.left=x+'px'; menu.style.top=y+'px';
}
function closeMenu(){ menu.classList.remove('on'); MENU=null; }
function paintMenu(){
  if(!MENU)return;
  const h=$('#menuh'), b=$('#menub');
  if(MENU.kind==='col'){
    const c=MENU.payload;
    const nShort=ALL.filter(t=>t.tier==='sync'&&!t.collections.includes(c)).length;
    h.innerHTML=esc(c);
    b.innerHTML=menuRow('Rename…','',false,'m-rename')+menuRow(`Add everything marked sync${nShort?' · '+nShort:''}`,'',false,'m-addshort')
      +'<div class="sep"></div>'+menuRow('Delete…','',false,'m-delete');
    b.querySelector('.m-rename').onclick=()=>{closeMenu();colPick=c;openDlg('__rename__');};
    b.querySelector('.m-delete').onclick=()=>{closeMenu();colPick=c;openDlg('__delete__');};
    b.querySelector('.m-addshort').onclick=async()=>{closeMenu();
      const ks=ALL.filter(t=>t.tier==='sync'&&!t.collections.includes(c)).map(t=>t.key);
      if(!ks.length)return toast('nothing new to add');
      await decide({collection:c,mode:'add'},ks); toast(`added ${ks.length} to ${c}`);};
    return;
  }
  // A VINYL RELEASE on the buy-a-record list. Flagging is per track, the
  // list groups by release, so unwanting works the way the list reads.
  if(MENU.kind==='vrel'){
    const f=MENU.payload; if(!f){closeMenu();return;}
    const n=f.tracks.length;
    h.innerHTML=esc(f.name);
    b.innerHTML=menuRow('Unwant vinyl',`${n} track${n>1?'s':''}`,false,'m-vdrop');
    b.querySelector('.m-vdrop').onclick=async()=>{closeMenu();
      await decide({vinyl:false}, f.tracks.map(t=>t.key));
      toast(`${esc(f.name)} off the vinyl list`);};
    return;
  }

  // AN ALBUM. It is not a container this tool owns: the Classic builds its
  // Albums menu from the tracks' tags, so putting one on the device means
  // moving its tracks and nothing else -- no playlist is made, or the record
  // would show up twice in two different menus.
  if(MENU.kind==='album'){
    const a=MENU.payload; if(!a){closeMenu();return;}
    const onPod=a.onPod, n=a.tracks.length;
    h.innerHTML=esc(a.album||'—')+' · '+n;
    b.innerHTML = (onPod<n ? menuRow('Put the album on the iPod',`${n-onPod} track${n-onPod>1?'s':''}`,false,'m-albadd') : '')
      + (onPod ? menuRow('Delete the album from the iPod',`${onPod} track${onPod>1?'s':''}`,false,'m-albdel') : '')
      + '<div class="sep"></div>' + menuRow('Add all to playlist &rsaquo;','',false,'m-albpl');
    const ad=b.querySelector('.m-albadd'); if(ad)ad.onclick=()=>{closeMenu();albumToIpod(a);};
    const dl=b.querySelector('.m-albdel'); if(dl)dl.onclick=()=>{closeMenu();albumOffIpod(a);};
    b.querySelector('.m-albpl').onclick=()=>{MENU.kind='albpick';paintMenu();};
    return;
  }
  if(MENU.kind==='albpick'){
    const a=MENU.payload; if(!a){closeMenu();return;}
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add all to playlist`;
    h.querySelector('.back').onclick=()=>{MENU.kind='album';paintMenu();};
    const cols=[...new Set([...COLS,...PENDING])].sort((x,y)=>x.localeCompare(y));
    b.innerHTML=cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}"><span class="dn">${esc(c)}</span></div>`).join('')
      :'<p class="note">No collections yet.</p>';
    b.querySelectorAll('[data-pc]').forEach(x=>x.onclick=async()=>{const c=x.dataset.pc;closeMenu();
      await decide({collection:c,mode:'add'},a.tracks.map(t=>t.key));
      toast(`${a.tracks.length} into ${c}`);});
    return;
  }
  // a folder on the drive
  if(MENU.kind==='t7f'){
    const f=MENU.payload; if(!f){closeMenu();return;}
    h.innerHTML=esc(f.name)+' · '+f.n;
    b.innerHTML=menuRow('Make a collection','same order',false,'m-make')
      +menuRow('Add all to playlist &rsaquo;','',false,'m-pour');
    b.querySelector('.m-make').onclick=()=>{closeMenu();pourFolder(f.name,null);};
    b.querySelector('.m-pour').onclick=()=>{MENU.kind='t7pick';paintMenu();};
    return;
  }
  if(MENU.kind==='t7pick'){
    const f=MENU.payload; if(!f){closeMenu();return;}
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add all to playlist`;
    h.querySelector('.back').onclick=()=>{MENU.kind='t7f';paintMenu();};
    const cols=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
    b.innerHTML=cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}"><span class="dn">${esc(c)}</span></div>`).join('')
      :'<p class="note">No collections yet.</p>';
    b.querySelectorAll('[data-pc]').forEach(x=>x.onclick=()=>{const c=x.dataset.pc;closeMenu();pourFolder(f.name,c);});
    return;
  }
  // an Apple Music playlist: everything the drag does, by clicking
  if(MENU.kind==='ampl'){
    const p=MENU.payload; if(!p){closeMenu();return;}
    h.innerHTML=esc(p.name)+' · '+p.tracks;
    b.innerHTML=menuRow('Make a collection','same order',false,'m-make')
      +menuRow('Add all to playlist &rsaquo;','',false,'m-pour')
      +'<div class="sep"></div>'
      +(p.imported?`<div class="drow done"><span class="dn">Imported for curation</span></div>`
                  :menuRow('Import for curation','known, not on the iPod',false,'m-imp'));
    b.querySelector('.m-make').onclick=()=>{closeMenu();pourPlaylist(p.name,null);};
    b.querySelector('.m-pour').onclick=()=>{MENU.kind='amplpick';paintMenu();};
    const mi=b.querySelector('.m-imp'); if(mi)mi.onclick=()=>{closeMenu();startJob({action:'export',names:[p.name]});};
    return;
  }
  if(MENU.kind==='amplpick'){
    const p=MENU.payload; if(!p){closeMenu();return;}
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add all to playlist`;
    h.querySelector('.back').onclick=()=>{MENU.kind='ampl';paintMenu();};
    const cols=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
    b.innerHTML=cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}"><span class="dn">${esc(c)}</span></div>`).join('')
      :'<p class="note">No collections yet.</p>';
    b.querySelectorAll('[data-pc]').forEach(x=>x.onclick=()=>{const c=x.dataset.pc;closeMenu();pourPlaylist(p.name,c);});
    return;
  }
  const t=MENU.payload; if(!t){closeMenu();return;}
  if(MENU.kind==='pick'){
    h.innerHTML=`<span class="back" title="back">&lsaquo;</span>Add to playlist`;
    h.querySelector('.back').onclick=()=>{MENU.kind='track';paintMenu();};
    const cols=[...new Set([...COLS,...PENDING])].sort((a,b)=>a.localeCompare(b));
    b.innerHTML=(cols.length?cols.map(c=>`<div class="drow" data-pc="${esc(c)}"><span class="dn">${esc(c)}</span>${t.collections.includes(c)?'<span class="dc">&#10003;</span>':''}</div>`).join(''):'')
      +'<div class="sep"></div>'+`<input id="menunew" placeholder="new playlist…">`;
    b.querySelectorAll('[data-pc]').forEach(x=>x.onclick=async()=>{
      const c=x.dataset.pc, sel2=(MARK.size>1&&MARK.has(t.key))?markedKeys():[t.key];
      if(sel2.length>1){ const fresh=sel2.filter(k=>!((BYKEY.get(k)||{}).collections||[]).includes(c));
        closeMenu();
        if(!fresh.length)return toast(`all ${sel2.length} already in ${c}`);
        await decide({collection:c,mode:'add'},fresh);
        return toast(`${fresh.length} added to ${c}`); }
      const had=t.collections.includes(c);
      await decide({collection:c},[t.key]); toast(had?`out of ${c}`:`added to ${c}`);
      const nt=BYKEY.get(t.key); if(nt){MENU.payload=nt;paintMenu();} else closeMenu();
    });
    const inp=b.querySelector('#menunew');
    inp.onkeydown=async e=>{e.stopPropagation();
      if(e.key==='Escape'){closeMenu();return;}
      if(e.key==='Enter'){const v=inp.value.trim(); if(!v)return;
        if(!COLS.includes(v))PENDING.add(v);
        const sel2=(MARK.size>1&&MARK.has(t.key))?markedKeys():[t.key];
        closeMenu(); await decide({collection:v,mode:'add'},sel2);
        toast(`${sel2.length>1?sel2.length+' added':'added'} to ${v}`);}};
    setTimeout(()=>inp.focus({preventScroll:true}),0);
    return;
  }
  // a track -- or the whole selection, when the dots were clicked inside one
  const many = MARK.size>1 && MARK.has(t.key), N = many?MARK.size:1;
  h.innerHTML = many ? `<b>${N}</b> tracks selected` : esc(t.artist+' — '+t.title);
  const inCol=active==='ipod'&&!!colPick;
  // Inside a collection, x takes the track out of it; X takes it off the iPod
  // altogether -- out of every playlist, gone from the device on the next
  // sync. That is what "delete from library" means when the library is the
  // iPod. For a track not on the device, the same choice is Never sync this.
  //
  // EVERY OPTION HERE UNDOES ITSELF. `undecided` is the null answer and it
  // has to exist in the model -- 1,004 of 1,211 tracks are unjudged, not
  // rejected, and two states would have to call them one or the other. But
  // it was never something to CHOOSE. It is where you land when you press
  // the same button again, the way a strike-through comes off and a folded
  // pane unfolds with the control that folded it. So there is no third row:
  // each option flips its own label. "Want vinyl" becomes "Unwant vinyl".
  //
  // The flipped label is the whole state indicator, so these carry no tick
  // -- "Unwant vinyl" already tells you it is wanted, and a tick beside it
  // would be saying the same thing twice in the opposite direction.
  //
  // Three pairs, one grammar: Buy / Don't buy, Sync to iPod / Don't sync,
  // Want vinyl / Unwant vinyl. Remove keeps its own pair because "don't
  // sync" and "remove" are not the same outcome: sync leaves a track it was
  // never told about exactly where it is, so taking something OFF the
  // device needs its own word.
  const everyIs = v => !many ? t.tier===v : markedKeys().every(k=>(BYKEY.get(k)||{}).tier===v);
  const onPod = everyIs('sync'), offPod = everyIs('remove');
  // Being in a playlist IS the decision, so a track in one cannot be undecided:
  // the server would put it straight back to `sync` and the row would look
  // broken. Take it out of the playlist first; that is the row above.
  const anyCol = many ? markedKeys().some(k=>((BYKEY.get(k)||{}).collections||[]).length>0)
                      : (t.collections||[]).length > 0;
  // Marking a track you do not own is not "sync" in any sense you can act on
  // today -- it is a purchase decision, and the buy list is where it lands.
  // Say so, rather than making you infer it from the absence of a file.
  const held  = many ? markedKeys().every(k=>{const r=BYKEY.get(k)||{}; return r.local||r.device;})
                     : !!(t.local || t.device);
  const onDev = many ? markedKeys().some(k=>(BYKEY.get(k)||{}).device) : !!t.device;
  const vinylOn = many ? markedKeys().every(k=>(BYKEY.get(k)||{}).vinyl) : !!t.vinyl;
  // OWNING THE RECORD ENDS THE QUESTION. There is nothing to want and
  // nothing to unwant, so the row stops being a control and becomes what it
  // now is -- a fact. It keeps its slot so the menu does not resize under
  // the cursor, and it dims so you can see at a glance it will not respond.
  const lpOwned = many ? markedKeys().every(k=>{const r=BYKEY.get(k); return r&&owned(r);})
                       : !!owned(t);

  // ONE DECISION ROW, and which one depends on where the track actually is.
  // You cannot sync a track that is already on the device and you cannot
  // remove one that was never there -- offering both is offering a no-op,
  // and "Don't sync" on a track nobody has synced is a control for undoing
  // something that has not happened.
  //
  //   on the iPod        Remove from iPod  /  Don't remove
  //   owned, not on it   Sync to iPod      /  Don't sync
  //   not owned          Buy               /  Don't buy
  //
  // Verb / don't-verb, and the undo drops the object because the row it is
  // undoing already said it: "Sync to iPod" becomes "Don't sync".
  const yesKey   = onDev ? 'x' : 's';
  const yesCls   = onDev ? 'm-skip' : 'm-want';
  const yesLabel = onDev ? (offPod ? "Don't remove" : 'Remove from iPod')
                 : held  ? (onPod  ? "Don't sync"   : 'Sync to iPod')
                         : (onPod  ? "Don't buy"    : 'Buy');

  // The digital half of the same idea: once a file exists on your own drive
  // there is nothing to buy, and the row that would have said Buy says what
  // is true instead.
  const digitalOnly = !onDev && held;
  b.innerHTML=menuRow(yesLabel,yesKey,false,yesCls)
    +(digitalOnly?menuRow('Owned digitally','',false,'inert'):'')
    +'<div class="sep"></div>'
    +menuRow(many?'Add all to playlist &rsaquo;':'Add to playlist &rsaquo;','c',false,'m-add')
    +(inCol?menuRow((many?`Take all ${N} out of `:'Take out of ')+esc(colPick),'',false,'m-out'):'')
    +'<div class="sep"></div>'
    +(lpOwned ? menuRow('Owned on vinyl','',false,'inert')
              : menuRow(vinylOn?'Unwant vinyl':'Want vinyl','v',false,'m-vinyl'))
    +(many?'':menuRow('Play','space',false,'m-play'))
    +(many?'':menuRow('Get info','i',false,'m-info'));
  const on=(cls,fn)=>{const x=b.querySelector('.'+cls); if(x)x.onclick=fn;};
  on('m-add',()=>{MENU.kind='pick';paintMenu();});
  const KS = many ? markedKeys() : [t.key];
  on('m-out',()=>{closeMenu();decide({collection:colPick,mode:'remove'},KS);});
  on('m-want',()=>{closeMenu();decide({tier:onPod&&!anyCol?'undecided':'sync'},KS);});
  on('m-skip',()=>{closeMenu(); offPod?decide({tier:'undecided'},KS):deleteFromIpod(t,KS);});
  // A mixed selection turns vinyl ON -- the majority intent when you picked
  // a set and reached for a flag. Everything already flagged stays flagged.
  on('m-vinyl',()=>{closeMenu();decide({vinyl:!vinylOn},KS);});
  on('m-play',()=>{closeMenu();play();});
  on('m-info',()=>{closeMenu();openTrack(t);});
}
// Off the iPod: skipped, which sync
// reads as "take this track off the device". Nothing happens on the device
// until the next sync, and the row says so by being struck through.
// Taking a track off the device no longer strips it from the playlists it
// belongs to. It used to have to: plan() would see it in a collection, not
// on the device, and add it straight back. `remove` is authoritative in
// plan() now, so the membership survives -- and setting it back to sync puts
// the track exactly where it was, which it never could before.
async function deleteFromIpod(t,keys){
  // A one-off decision about what is on the device right now. Nothing here
  // marks a track as never-sync -- that standing rule does not exist.
  const all = keys && keys.length ? keys : [t.key];
  const ks = all.filter(k=>(BYKEY.get(k)||{}).device);
  if(!ks.length){toast('not on the iPod');return;}
  await decide({tier:'remove'},ks);
  if(ks.length>1){
    const held=ks.filter(k=>((BYKEY.get(k)||{}).collections||[]).length).length;
    toast(`${ks.length} off the iPod on the next sync`
          + (held?` \u00b7 ${held} still in playlists`:'')
          + (all.length>ks.length?` \u00b7 ${all.length-ks.length} were not on it`:''));
    return;
  }
  const inCols=((BYKEY.get(ks[0])||{}).collections||[]).length;
  toast('off the iPod on the next sync'
        + (inCols?` \u00b7 still in ${inCols} playlist${inCols>1?'s':''}`:''));
}
document.addEventListener('click',e=>{ if(MENU&&!menu.contains(e.target)&&!e.target.classList.contains('more'))closeMenu(); });
// a scroll of the page closes the menu; a scroll inside the menu is the menu working
document.addEventListener('scroll',e=>{ if(MENU&&!(e.target instanceof Node&&menu.contains(e.target)))closeMenu(); },true);

/* ---------------- the collection dialog ---------------- */
const dlg=$('#dlg'), dlgin=$('#dlgin');
let dlgMode=null;
function openDlg(mode,why,plan){
  dlgMode=mode;
  const t=view[sel];
  const cfg={
    null:        {h:'Collection', p:t?`Put “${t.artist} — ${t.title}” in a collection. Type a new name, or pick one; picking one it is already in takes it out.`:'Select a track first.', input:true, list:true},
    __new__:     {h:'New collection', p:'Name it, or take one whole from Apple Music. A collection may hold tracks you have not bought — sync writes the ones it finds a file for and leaves the rest.', input:true, list:false},
    __rename__:  {h:'Rename collection', p:`Rename “${colPick}”. Its order is kept.`, input:true, list:false},
    __delete__:  {h:'Delete collection', p:`Remove “${colPick}” from every track and take it off the iPod on the next sync. The tracks themselves stay.`, input:false, list:false},
  }[mode];
  $('#dlgt').textContent=cfg.h; $('#dlgp').textContent=cfg.p;
